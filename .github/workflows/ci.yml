name: Checks on every change
# Every pull request into main runs the whole test set on invented data (data/fixture-seed.json), so nothing reaches
# the live app untested (structural review M6). Read-only: no secrets, no deploy, the real data is never used.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The live app (site/) was rebuilt from this source
        run: node tools/check-site.js
      - name: Engine and server tests (CLAUDE.md)
        run: node --test test/engine.test.js test/server.test.js
      - name: Every unit test
        run: node --test test/*.test.js
      - name: Install browser
        run: npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Build the live app and the preview from invented data
        run: |
          cp data/fixture-seed.json data/seed.json
          node build.js
          rm data/seed.json
          NCGS_FIXTURE=1 node build.js
      - name: Start the preview and a local copy of the server
        run: |
          python3 -m http.server 8765 -d dist > /dev/null 2>&1 &
          cp data/fixture-seed.json data/seed.json
          node tools/devserver.js 8766 > /tmp/devserver.log 2>&1 &
          sleep 2
          rm data/seed.json
      - name: Layout at 360, 390 and 135% text, with the screen suites it chains
        run: MIN_TARGET=44 node test/layout.run.js
      - name: Several phones against the real server code
        run: |
          node test/phones.run.js
          node test/scramble-phones.run.js
          node test/draw-phones.run.js
      - name: A whole day, two rounds, an outage and finalise
        run: node test/fullday.run.js
      - name: Finishing a round, organiser, testing mode, start hole
        run: |
          node test/finish.run.js
          node test/organiser.run.js
          node test/testing.run.js
          node test/starthole.run.js
          node test/ui.run.js
          node test/courses.run.js
          node test/screen-journeys.run.js
          node test/who.run.js
          node test/scorer.run.js
          node test/checklist-draw.run.js
          node test/fault-log.run.js
          node test/pots.run.js
      - name: The app opens quickly on a weak signal
        run: if [ -f test/sw-open.run.js ]; then node test/sw-open.run.js; else echo "sw-open.run.js arrives with fix 1"; fi
  crawl:
    # Taps every visible control on every reachable screen, from ordinary and awkward starting points (reviewer's stress
    # test, 1 November). Fails on a dead end, a dead button, a script error or "undefined"/"NaN" on screen.
    # Split into parallel jobs, as all of it takes about 40 minutes on one machine.
    # Report-only for now: on main it still flags taps the reviewer judged harmless by hand (an already-open tab, a
    # second tap on a confirmed Save) and the contest card that only "Let's play" closes (stress test item 4). It runs
    # on every change and keeps its findings; it becomes a required check once those are cleared.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        scenarios:
          - player,known
          - organiser,deep
          - nogroups,nogroups-org,pots1,pots1-org
          - outsider,allfinal,nocard
          - nocard-org,newseason,newseason-org
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Build the preview from invented data
        run: NCGS_FIXTURE=1 node build.js
      - name: Tap every button (${{ matrix.scenarios }})
        run: |
          python3 -m http.server 8765 -d dist > /dev/null 2>&1 &
          sleep 2
          CRAWL_OUT=crawl-findings.json node test/crawl.run.js "${{ matrix.scenarios }}"
      - name: Keep the findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-${{ strategy.job-index }}
          path: crawl-findings.json
          if-no-files-found: ignore
