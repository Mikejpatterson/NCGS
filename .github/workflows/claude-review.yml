name: Claude review on request
# Codex (or the owner) comments "/claude-review" on a pull request -> Claude reviews that exact commit and posts
# a verdict there. Codex is asked the other way with "@codex review", which Codex already supports natively.
# Only comments from the owner's account start it (Codex posts through the owner's GitHub connection); comments
# from bots never do, so the agents cannot set each other off in a loop. Read-only: nothing is pushed, merged or
# deployed. Limits: one completed review per commit, at most 5 attempts per pull request, one at a time per PR.
# Three jobs on separate machines: the pull request's own code only ever runs in "test", which has no secrets
# and cannot touch the trusted review script or the review job.
on:
  issue_comment:
    types: [created]
  push:   # self-test before this file is on main
    branches: [automation/claude-review]
    paths: [.github/claude-review-selftest.md]

permissions: {}

concurrency:
  group: claude-review-${{ github.event.issue.number || 'selftest' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'push' || (
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/claude-review') &&
        github.event.comment.author_association == 'OWNER' &&
        github.event.comment.user.type == 'User')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      run: ${{ steps.check.outputs.run }}
      pr: ${{ steps.check.outputs.pr }}
      head: ${{ steps.check.outputs.head }}
      base: ${{ steps.check.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact commit, and whether a review is due (no pull request code involved)
        id: check
        env:
          EVENT: ${{ github.event_name }}
          NUM: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = push ]; then n=$(grep -oE '[0-9]+' .github/claude-review-selftest.md | head -1); else n="$NUM"; fi
          PR_NUMBER="$n" python3 tools/agent/review_pr.py check

  test:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      results: ${{ steps.t.outputs.results }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests on that exact commit (no secrets on this machine)
        id: t
        env:
          HEAD: ${{ needs.prepare.outputs.head }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD"
          {
            echo "commit: $HEAD"
            node --test test/engine.test.js test/server.test.js 2>&1 | grep -E '^# (pass|fail)' | sed 's/^/engine+server: /'
            if [ -f test/agent_cycle_test.py ]; then python3 test/agent_cycle_test.py 2>&1 | tail -1 | sed 's/^/agent controller: /'; fi
            if [ -f test/claude_review_test.py ]; then python3 test/claude_review_test.py 2>&1 | tail -1 | sed 's/^/claude review: /'; fi
          } > results.txt 2>&1 || true
          { echo 'results<<NCGS_EOF'; head -c 6000 results.txt; echo; echo 'NCGS_EOF'; } >> "$GITHUB_OUTPUT"

  review:
    needs: [prepare, test]
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Control files (trusted)
        uses: actions/checkout@v4
        with:
          path: ctl
          persist-credentials: false
      - name: The pull request's code at the exact commit (read, never run)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head }}
          path: work
          fetch-depth: 0
          persist-credentials: false
      - name: Claude (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Review and post the verdict
        env:
          WORK: work
          PR_NUMBER: ${{ needs.prepare.outputs.pr }}
          HEAD: ${{ needs.prepare.outputs.head }}
          BASE: ${{ needs.prepare.outputs.base }}
          TEST_RESULTS_TEXT: ${{ needs.test.outputs.results }}
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 ctl/tools/agent/review_pr.py review
