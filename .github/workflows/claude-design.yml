name: NCGS Claude Design Task

# Explicit manual dispatch only. Workflow stays on the design branch,
# avoiding comment-driven triggers or unreviewed production writes.
# (No push trigger: editing this file or the design notes must not start an unattended run.)
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  design:
    if: github.ref_name == 'design/crest-editorial-prototype'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout design branch
        uses: actions/checkout@v4
        with:
          ref: design/crest-editorial-prototype
          fetch-depth: 0

      - name: Claude Code implementation
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            AUTOMATION INTEGRATION TEST ONLY. Read CLAUDE.md and docs/AI-COLLABORATION.md.
            Work solely in design/crest-editorial-prototype; never touch main or deploy.
            Create only docs/AGENT-AUTOMATION-CHECK.md as a small factual report of
            repository guardrails, with the test timestamp in UTC and what was inspected.
            Do NOT edit application code, workflows, production assets, private data, or secrets.
            Run node --test test/engine.test.js test/server.test.js and report results.
            Commit ONLY docs/AGENT-AUTOMATION-CHECK.md on this design branch.
            Post the commit hash and tests to GitHub Issue #1 if possible.
            Stop after this single commit. Do not start Stage 1 or further work.
          claude_args: |
            --max-turns 18
