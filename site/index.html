  let html = `<header class="hero s">${navBack(roundName(r))}<div class="head"><h1 class="title">Change a player</h1></div><p class="sub names">${sel ? esc(D.nameOf(sel)) : 'Tap the player who is changing'}</p></header>`;
  const inRound = new Set((r.groups || []).flatMap(g => g.teams.flat()));
  if (rosterLocked(r)) return { html: html + sec('', cardOf(`<div class="row tall"><span class="sub">The teams have started scoring, so players can't be swapped or taken out of this scramble: a team's holes are saved under whoever drove. Correct a hole on the team's screen instead.</span></div>`)) };
  if (!sel) {
    html += (r.groups || []).map((g, gi) => sec(label(`Group ${gi + 1}`), cardOf(g.teams.flat().map(pid => `<button class="row" data-act="late-pick" data-rid="${r.id}" data-pid="${pid}"><span>${esc(D.nameOf(pid))}</span>${scoresFor(r.id, pid) ? `<span class="sub">${plural(scoresFor(r.id, pid), 'score')}</span>` : chev}</button>`).join('')), gi === 0)).join('');
    return { html };
  }
  const n = scoresFor(r.id, sel);
  if (n) return { html: html + sec('', cardOf(`<div class="row tall"><span class="sub">${esc(D.nameOf(sel))} already has ${plural(n, 'score')} in this round, so they cannot be swapped or removed. Correct their scores on the group screen instead.</span></div>`), true) + `<button class="btn quiet" data-act="late-cancel">Back</button>` };
  const free = D.active().filter(m => !inRound.has(m.id));
  html += sec(label('Swap in'), cardOf(free.length ? free.map(m => `<button class="row" data-act="late-replace" data-rid="${r.id}" data-pid="${sel}" data-new="${m.id}"><span>${esc(m.name)}${isGuest(m) ? ' <span class="pill n">Guest</span>' : ''}</span><span class="sub">${fmtIndex(m.index)}</span></button>`).join('') : '<div class="row"><span class="sub">Everyone is already playing</span></div>') + `<button class="row" data-act="org-go" data-v="guest" data-rid="${r.id}"><span class="c-g" style="display:inline-flex;align-items:center;gap:8px">${sized(ICON.plus, 20)}Add a guest</span></button>`, true);
  html += sec('', cardOf(`<button class="row" data-act="late-drop" data-rid="${r.id}" data-pid="${sel}"><span class="c-b">${UI.confirm === 'drop-' + sel ? 'Tap again to take them out' : 'Takes no further part'}</span></button>`));
  html += `<button class="btn quiet" data-act="late-cancel">Cancel</button>`;
  return { html };
};
/* The round with one player swapped for another (or removed). KBs and handicap fixes follow the swap. */
function withPlayerChanged(r, pid, newPid) {
  const groups = r.groups.map(g => Object.assign({}, g, { teams: g.teams.map(t => t.map(x => x === pid ? newPid : x).filter(Boolean)).filter(t => t.length) })).filter(g => g.teams.length);
  const kb = r.kb ? r.kb.map(pr => pr.map(x => x === pid ? newPid : x)).filter(pr => pr.length === 2 && pr.every(Boolean)) : r.kb;
  const ph = r.ph ? Object.fromEntries(Object.entries(r.ph).filter(([k]) => k !== pid)) : r.ph;
  return Object.assign({}, r, { groups, kb: kb && kb.length ? kb : null, ph: ph && Object.keys(ph).length ? ph : null });
}

/* ----- Preview only: finish the other groups ----- */
function demoFill() {
  const rid = liveRid();
  if (!rid) return;
  const comp = computeR(rid);
  if (!comp) { toast('Demo scores are for individual rounds only'); return; }
  const mine = myGroup(rid);
  let seed = 7 + view().log.length;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const filled = [];
  comp.groups.forEach(gc => {
    if (mine && gc.id === mine.id) return;
    let any = false;
    gc.order.forEach(n => {
      const scores = {};
      gc.teams.flat().forEach(pid => {
        if (comp.players[pid].holes[n].gross !== null) return;
        const h = holeOf(rid, n);
        const x = rnd();
        const dlt = x < 0.18 ? -1 : x < 0.62 ? 0 : x < 0.9 ? 1 : 2;
        scores[pid] = { v: Math.max(1, h.par + comp.players[pid].holes[n].shots + dlt), base: null };
      });
      if (Object.keys(scores).length) { any = true; send({ op: 'saveHole', round: rid, grp: gc.id, hole: n, scores, by: 'Demo' }); }
    });
    if (any) filled.push(gc.n);
  });
  toast(filled.length ? `Group${filled.length > 1 ? 's' : ''} ${filled.join(' and ')} finished` : 'Other groups are already finished');
}

/* ---- 42-draw.js ---- */
/* ----- Breakfast draw (owner brief §7; design agreed with Codex on issue #1, 26 October) -----
   The committee sets four pots; at breakfast one device draws one name from each pot per team, without replacement.
   The drawn team is the playing group. Rules and checks live in src/draw.js (window.Draw); storage is the settings table:
     pots:<rid>  drawdev:<rid>  drawepoch:<rid>  draw:<rid>:<epoch>:<team>:<pot>:<device>  drawshort:<rid>:<epoch>  drawpace:<rid>
   The draw is finished when the round's own groups carry the draw's mark (group.draw = epoch): the groups and "finished"
   are one row written in one request, so no phone can ever see one without the other (Codex review of #45, 26 October).
   Guarantees:
   - One device runs the draw. Becoming that device needs the server to confirm it (online); once confirmed it may carry
     on offline (each pick waits in the outbox, stored on the device). The server has no compare-and-set, so two phones
     claiming at the same moment can both briefly be confirmed: online, each pick first checks the server again, which
     narrows that to a moment, and if both still draw, their picks are a visible clash that blocks the groups.
   - Each pick is saved before its wheel turns, so a reload replays the result and never redraws.
   - Each pick's key includes the device, so nothing is overwritten: a clash shows and blocks the groups.
   - No undo: a mistake means a logged restart, only before the groups are made and before any score.
   - The groups wait until every pick is confirmed by the server, and the committee has agreed how any short team plays. */
const DR = window.Draw;
const SPIN_MS = 2600, SPIN_GAP = 350;

const drawDev = () => {
  if (!DB.prefs.dev) { DB.prefs.dev = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); savePrefs(); }
  return DB.prefs.dev;
};
const jsonSetting = (k, d) => { try { const v = JSON.parse(D.setting(k, '')); return v && typeof v === 'object' ? v : d; } catch (e) { return d; } };
const serverSetting = k => { const s = (DB.server.tables.settings || []).find(x => x.key === k); return s ? s.value : null; };
/* Settings keys this device has written that the server has not yet confirmed in a sync. */
function pendingSettingKeys() {
  const ks = new Set();
  [...DB.outbox, ...(DB.sent || [])].forEach(i => { const q = i.req; if (q && q.op === 'put' && q.table === 'settings') (q.rows || []).forEach(r => ks.add(r.key)); });
  return ks;
}
const drawMade = r => !!r && (r.groups || []).some(g => g && g.draw);
const hasScores = rid => Object.values(D.scores(rid) || {}).some(h => Object.values(h || {}).some(E.isEntered));
const potsOf = rid => { const v = jsonSetting('pots:' + rid, null); const ps = v && Array.isArray(v.pots) ? v.pots : []; return { pots: [0, 1, 2, 3].map(i => (Array.isArray(ps[i]) ? ps[i] : [])), show: !!(v && v.show) }; };
const hasPots = rid => potsOf(rid).pots.some(x => x.length);

function drawOf(rid) {
  const { pots, show } = potsOf(rid);
  const ep = Number(D.setting('drawepoch:' + rid, 1)) || 1;
  const holder = jsonSetting('drawdev:' + rid, null);
  const keep = holder && holder.keep && Number(holder.keep.ep) === ep ? holder.keep.slots || [] : [];
  const st = DR.state(pots, DR.picksFrom(view().settings, rid, ep), { holder: holder && holder.dev, keep });
  const pend = pendingSettingKeys();
  const pending = [...pend].some(k => k.indexOf(`draw:${rid}:`) === 0 || k === 'drawdev:' + rid || k === 'drawepoch:' + rid);
  let onServer = null; try { onServer = JSON.parse(serverSetting('drawdev:' + rid) || 'null'); } catch (e) { /* not set */ }
  // This device may draw only once the server has confirmed it as the draw device.
  const mine = !!holder && holder.dev === drawDev() && !!onServer && onServer.dev === drawDev() && !pend.has('drawdev:' + rid);
  const shortOk = (jsonSetting(`drawshort:${rid}:${ep}`, { teams: [] }).teams || []).map(Number);
  return { rid, pots, show, ep, holder, mine, st, pending, shortOk,
    made: drawMade(D.round(rid)), pace: D.setting('drawpace:' + rid, 'one') === 'all' ? 'all' : 'one' };
}
/* A draw in progress: phones check for news more often so people further away can follow it. */
const drawLive = () => D.rounds().some(r => r.status !== 'final' && hasPots(r.id) && (() => { const d = drawOf(r.id); return d.st.started && !d.made; })());

/* The wheel turning for the picks just saved. Kept in prefs, so a reload mid-spin finishes the same spin. */
const spinOf = rid => { const s = DB.prefs.drawSpin; return s && s.rid === rid && Date.now() - s.at < spinTotal(s) ? s : null; };
const spinTotal = s => SPIN_MS + (s.slots.length - 1) * SPIN_GAP;
/* Ask the server again shortly, so "saved" turns into "confirmed" without waiting for the next minute's check. */
let drawCheck = null;
function drawConfirmSoon() {
  if (drawCheck) return;
  drawCheck = setTimeout(() => { drawCheck = null; if (DB.outbox.length) { flush(); drawConfirmSoon(); return; } sync().then(render); }, 700);
}
const shortName = pid => { const m = D.member(pid); return (m && m.name) || pid; };

function wheelSvg(names, pick, spin, i) {
  const n = Math.max(1, names.length), seg = 360 / n, R = 100;
  const shades = ['#0B3D2E', '#14523F', '#0F4636', '#1B5E49'];
  const at = a => [R + R * Math.sin(a * Math.PI / 180), R - R * Math.cos(a * Math.PI / 180)];
  const parts = names.map((pid, k) => {
    const a0 = k * seg, a1 = (k + 1) * seg, [x0, y0] = at(a0), [x1, y1] = at(a1), mid = a0 + seg / 2;
    const path = n === 1 ? `<circle cx="${R}" cy="${R}" r="${R}" fill="${shades[0]}"/>` : `<path d="M${R},${R} L${x0.toFixed(2)},${y0.toFixed(2)} A${R},${R} 0 ${seg > 180 ? 1 : 0} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${shades[k % (n % 2 && n > 1 ? 3 : 4)]}" stroke="#FAF8F3" stroke-width="1.5"/>`;
    const nm = shortName(pid), fs = Math.max(9, Math.min(17, 150 / Math.max(6, nm.length)));
    const flip = mid > 90 && mid < 270;
    return `${path}<text transform="rotate(${mid.toFixed(2)} ${R} ${R})${flip ? ` rotate(180 ${R} ${R - 58})` : ''}" x="${R}" y="${R - 58}" text-anchor="middle" dominant-baseline="middle" font-size="${fs.toFixed(1)}" fill="#FAF8F3" font-weight="650" font-family="-apple-system,system-ui,sans-serif">${esc(nm)}</text>`;
  }).join('');
  let style = '';
  if (spin && pick) {
    const k = names.indexOf(pick), to = 360 * 5 - (k + 0.5) * seg;
    const dur = SPIN_MS + i * SPIN_GAP, gone = Math.min(dur, Date.now() - spin.at);
    style = ` style="--to:${to.toFixed(2)}deg;animation:drw-spin ${dur}ms cubic-bezier(.12,.62,.1,1) ${-gone}ms forwards"`;
  }
  return `<div class="drw-wheel" aria-hidden="true"><i class="drw-ptr"></i><svg viewBox="-4 -4 208 208"><g class="drw-rot"${style}>${parts}</g><circle cx="${R}" cy="${R}" r="14" fill="#FAF8F3"/></svg></div>`;
}

/* One pot's place in the team on the stage: a name, a turning wheel, a still wheel, or nobody left. */
function stageCell(d, team, p, spin) {
  const s = team.slots[p], spinning = spin && spin.slots.findIndex(x => x.t === team.n - 1 && x.p === p);
  const head = `<span class="drw-pot">Pot ${DR.potName(p)}</span>`;
  if (s.conflict) return `<div class="drw-cell warn">${head}<b class="drw-none">Two devices drew here</b></div>`;
  if (s.pid && spin && spinning > -1) {
    const pool = d.pots[p].filter(pid => pid === s.pid || d.st.left[p].includes(pid));
    return `<div class="drw-cell spin" data-act="draw-skip">${head}${wheelSvg(pool, s.pid, spin, spinning)}</div>`;
  }
  if (s.pid) return `<div class="drw-cell got">${head}<b class="drw-name" style="--len:${Math.max(6, shortName(s.pid).length)}">${esc(shortName(s.pid))}</b></div>`;
  if (!d.st.left[p].length) return `<div class="drw-cell">${head}<b class="drw-none">No one left in pot ${DR.potName(p)}</b></div>`;
  return `<div class="drw-cell wait">${head}${wheelSvg(d.st.left[p], null, null, 0)}</div>`;
}

const drawBanner = d => [
  d.st.conflicts.length ? `<div class="banner warn">Two devices drew the same place, so this draw can't make the groups. Restart it from the draw page.</div>` : '',
  d.st.dup.length || d.st.stray.length ? '<div class="banner warn">Someone was drawn twice or from the wrong pot. Restart the draw.</div>' : ''
].join('');

/* The organiser's page for the draw: pots, who can see them, pacing, and the way in. */
ORG.drawhome = p => {
  const r = D.round(p.rid), d = drawOf(p.rid);
  const counts = d.pots.map((x, i) => `${DR.potName(i)} ${x.length}`).join(' · ');
  const uneven = new Set(d.pots.filter(x => x.length).map(x => x.length)).size > 1;
  if (d.made) return { html: `<header class="hero s">${navBack(roundName(r))}<div class="head"><h1 class="title">Breakfast draw</h1></div><p class="sub">Done. The teams are the groups.</p></header>
    <button class="btn" data-act="org-go" data-v="drawlineup" data-rid="${r.id}">Line-up</button>` };
  const elsewhere = d.holder && d.holder.dev !== drawDev();
  let html = `<header class="hero s">${navBack(roundName(r))}<div class="head"><h1 class="title">Breakfast draw</h1></div><p class="sub">${esc(counts)}${uneven ? ' · pots are uneven' : ''}</p></header>${drawBanner(d)}`;
  html += sec('', cardOf(`
    <button class="row tall" data-act="org-go" data-v="pots" data-rid="${r.id}"><span class="two"><span>Pots</span><span class="sub">${d.st.started ? 'Fixed now the draw has started' : 'Put each player in pot A, B, C or D'}</span></span>${chev}</button>
    <button class="row tall" data-act="draw-show" data-rid="${r.id}"><span class="two"><span>Members can see the pots</span><span class="sub">On the round page, names only</span></span><span class="pill ${d.show ? 'g' : 'n'}">${d.show ? 'On' : 'Off'}</span></button>
    <div class="row tall"><span class="two"><span>Pace</span><span class="sub">${d.pace === 'all' ? 'All four pots together' : 'One pot at a time'}</span></span><span class="seg sm drw-pace"><button class="${d.pace === 'one' ? 'on' : ''}" data-act="draw-pace" data-rid="${r.id}" data-v="one" aria-pressed="${d.pace === 'one'}">One</button><button class="${d.pace === 'all' ? 'on' : ''}" data-act="draw-pace" data-rid="${r.id}" data-v="all" aria-pressed="${d.pace === 'all'}">All four</button></span></div>${elsewhere ? '\n    <div class="row tall"><span class="sub">Another device is running the draw</span></div>' : ''}`), true);
  html += `<button class="btn" data-act="org-go" data-v="draw" data-rid="${r.id}">${d.st.started ? 'Back to the draw' : 'Open the draw'}</button>`;
  if (d.st.started) html += `<button class="btn quiet" data-act="org-go" data-v="drawlineup" data-rid="${r.id}">Line-up</button>`;
  if (d.st.started && !d.made && !hasScores(r.id)) html += `<div class="foot"><button class="link c-b" data-act="draw-restart" data-rid="${r.id}">${UI.confirm === 'drestart-' + r.id ? 'Tap again to restart: everyone goes back in their pots' : 'Restart the draw'}</button></div>`;
  return { html };
};

/* Pots: tap A, B, C or D beside each name. Fixed once the first name is drawn. */
ORG.pots = p => {
  const r = D.round(p.rid), d = drawOf(p.rid), at = {};
  d.pots.forEach((x, i) => x.forEach(pid => { at[pid] = i; }));
  const probs = d.pots.some(x => x.length) ? DR.potProblems(d.pots.filter(x => x.length)) : [];
  const people = D.members().filter(m => m.active !== false || at[m.id] !== undefined);
  const rows = people.map(m => `<div class="row drw-prow"><span class="drw-pn">${esc(m.name)}</span><span class="drw-pb" role="group" aria-label="Pot for ${esc(m.name)}">${[0, 1, 2, 3].map(i => `<button class="${at[m.id] === i ? 'on' : ''}" data-act="draw-pot" data-rid="${r.id}" data-pid="${m.id}" data-p="${i}" aria-pressed="${at[m.id] === i}"${d.st.started ? ' disabled' : ''}>${DR.potName(i)}</button>`).join('')}</span></div>`).join('');
  return { html: `<header class="hero s">${navBack('Breakfast draw')}<div class="head"><h1 class="title">Pots</h1></div></header>
    <div class="drw-counts" aria-live="polite">${d.pots.map((x, i) => `<span><b>${DR.potName(i)}</b> <span class="num">${x.length}</span></span>`).join('')}<span class="drw-saved">${DB.outbox.length ? 'Saving…' : 'Saved'}</span></div>
    ${d.st.started ? '<div class="banner note">The draw has started, so the pots are fixed.</div>' : ''}${probs.map(w => `<div class="banner warn">${esc(w)}</div>`).join('')}
    ${sec('', cardOf(rows), true)}` };
};

/* The stage: only the team being drawn, its four pots as big wheels, then the name. */
ORG.draw = p => {
  const r = D.round(p.rid), d = drawOf(p.rid), spin = spinOf(p.rid);
  const T = d.st.teams.length;
  const hold = UI.drawHold && UI.drawHold.rid === p.rid ? UI.drawHold.t : -1;
  const ti = spin ? spin.slots[0].t : hold > -1 ? hold : d.st.current;
  const top = `<header class="hero s drw-top">${navBack('Breakfast draw', 'back')}</header>`;
  if (!T) return { html: top + cardOf('<div class="row"><span class="sub">Set the pots first.</span></div>') };
  if (ti < 0) {
    if (d.pending) drawConfirmSoon();
    else if (d.mine && !d.made && !(r.groups && r.groups.length) && !DR.blockers(d.st, { shortOk: d.shortOk }).length) drawAutoSoon(r.id);
    return { html: `${top}<div class="drw-stage done"><p class="drw-kicker">Breakfast draw</p><h1 class="drw-team">${d.made ? 'These are the groups' : `All ${T} teams drawn`}</h1>${drawBanner(d)}${T > 1 && d.st.teams[T - 1].slots.some(x => x.auto) ? `<p class="drw-watch">Team ${T} is the players left in each pot.</p>` : ''}
      <button class="btn" data-act="org-go" data-v="drawlineup" data-rid="${r.id}">See the line-up</button></div>` };
  }
  const team = d.st.teams[ti];
  const cells = team.slots.map((_, i) => stageCell(d, team, i, spin)).join('');
  const teamOpen = d.st.next.length && d.st.current === ti;
  let act = '';
  if (d.pending) drawConfirmSoon();
  if (!d.mine && d.holder && d.holder.dev === drawDev()) act = '<p class="drw-watch">Waiting for the server to confirm this device…</p>';
  else if (!d.mine) {
    const online = DB.online && !DB.outbox.length;
    act = `${d.holder ? '<p class="drw-watch">The draw is running on another device.</p>' : ''}
      ${online ? (d.holder ? `<button class="btn quiet" data-act="draw-claim" data-rid="${r.id}">${UI.confirm === 'dclaim-' + r.id ? 'Tap again to take over the draw here' : 'Take over the draw here'}</button>` : `<button class="btn drw-go" data-act="draw-claim" data-rid="${r.id}">Start the draw</button>`) : '<p class="drw-watch">Connect to the internet to run the draw here.</p>'}`;
  } else if (spin) act = `<p class="drw-watch">${spin.slots.length === 1 ? `Tap pot ${DR.potName(spin.slots[0].p)} to stop it` : 'Tap a wheel to stop it'}</p>`;
  else if (DB.prefs.drawBusy && DB.prefs.drawBusy.rid === r.id && Date.now() - DB.prefs.drawBusy.at < 8000) act = '<button class="btn drw-go" disabled>Checking…</button>';
  else if (teamOpen) act = `<button class="btn drw-go" data-act="draw-go" data-rid="${r.id}">${d.pace === 'all' ? `Draw team ${ti + 1}` : `Draw pot ${DR.potName(d.st.next[0].p)}`}</button>`;
  else if (d.st.current > -1) act = `<button class="btn drw-go" data-act="draw-next" data-rid="${r.id}">Next team</button>`;
  else act = `${T > 1 && d.st.teams[T - 1].slots.some(x => x.auto) ? `<p class="drw-watch drw-left">Team ${T} is the players left in each pot.</p>` : ''}<button class="btn drw-go" data-act="draw-next" data-rid="${r.id}">See the line-up</button>`;
  return { html: `${top}<div class="drw-stage"><p class="drw-kicker">Breakfast draw · ${T} teams</p><h1 class="drw-team">Team ${ti + 1}</h1>${drawBanner(d)}
    <div class="drw-cells">${cells}</div><div class="drw-act">${act}</div>${d.pending ? '<p class="drw-sync">Saving to the server…</p>' : ''}</div>` };
};

/* After the draw: everyone, names first, team numbers as quiet labels. Then the groups. */
/* The line-up: a pine card, names first. Once the groups are made it shows the saved groups (with tee times), so a later
   tee-time swap shows here too; before that, the drawn teams. */
function drawLineup(d, r, upTo) {
  // A place not drawn yet says so; "No one from pot X" only when that pot has really run out (UX review F10).
  const gap = s => `<span class="drw-gap">${s.conflict ? 'Two devices drew here' : d.st.left[s.p].length ? 'Not drawn yet' : `No one from pot ${DR.potName(s.p)}`}</span>`;
  const teams = r && drawMade(r)
    ? r.groups.map(g => ({ label: `${g.teeTime ? esc(g.teeTime) + ' · ' : ''}Team ${g.n}`, names: g.teams.flat().map(pid => esc(shortName(pid))) }))
    : d.st.teams.filter((tm, i) => upTo === undefined || upTo < 0 || i <= upTo).map(tm => ({ label: `Team ${tm.n}`, names: tm.slots.map(s => s.pid ? esc(shortName(s.pid)) : gap(s)) }));
  return `<div class="drw-lineup">${teams.map(t => `<section class="drw-lt"><span class="drw-ln">${t.label}</span><ul>${t.names.map(n => `<li>${n}</li>`).join('')}</ul></section>`).join('')}</div>`;
}
ORG.drawlineup = p => {
  const r = D.round(p.rid), d = drawOf(p.rid);
  const why = DR.blockers(d.st, { pending: d.pending, shortOk: d.shortOk });
  const scored = hasScores(r.id);
  let html = `<header class="hero s">${navBack('Breakfast draw')}<div class="head"><h1 class="title">${d.made ? 'The groups' : 'Line-up'}</h1></div><p class="sub">${esc(roundName(r))}</p></header>${drawBanner(d)}${drawLineup(d, r)}`;
  if (d.st.short.length) html += sec(label('Short teams'), cardOf(d.st.short.map(n => `<button class="row tall" data-act="draw-short" data-rid="${r.id}" data-n="${n}"><span class="two"><span>Team ${n} plays short</span><span class="sub">Tick once the committee has agreed how</span></span><span class="pill ${d.shortOk.includes(n) ? 'g' : 'n'}">${d.shortOk.includes(n) ? 'Agreed' : 'Not yet'}</span></button>`).join('')), true);
  if (d.made) { /* the title says it */ }
  else if (scored) html += '<div class="banner note">Scores are in, so the groups can\'t change now.</div>';
  else if (why.length) html += why.filter(w => !/not saved to the server/.test(w) || !d.mine).map(w => `<p class="cap note">${esc(w)}</p>`).join('') + (d.pending ? '<p class="cap note">Saving to the server…</p>' : '');
  else if (!d.mine) html += '<p class="cap note">The device running the draw saves these as the groups.</p>';
  else if (r.groups && r.groups.length) html += `<button class="btn" data-act="draw-make" data-rid="${r.id}">${UI.confirm === 'dmake-' + r.id ? 'Tap again: these replace the current groups' : 'Make these the groups'}</button>`;
  else drawAutoSoon(r.id);
  if (d.pending) drawConfirmSoon();
  return { html };
};

/* Members: the pots before the draw, then the teams as they are drawn (names first). */
function drawMemberView(r) {
  const d = drawOf(r.id);
  // While drawing: the teams done so far and the one being drawn; later teams appear as they're drawn (UX review F10).
  if (d.st.started) return `<p class="cap" style="margin:4px 4px 10px">${d.made ? 'The draw is done.' : d.st.current > -1 ? `Drawing team ${d.st.current + 1} of ${d.st.teams.length}…` : 'All teams drawn.'}</p>${drawLineup(d, r, d.st.current)}`;
  return `<div class="drw-potlist">${d.pots.map((x, i) => x.length ? `<section class="card drw-mpot"><div class="drw-mh">Pot ${DR.potName(i)}</div>${x.map(pid => `<div class="row"><span>${esc(D.nameOf(pid))}</span></div>`).join('')}</section>` : '').join('')}</div>`;
}
/* Once the draw has made the groups, members just see Groups (owner, 26 October). */
const drawTabOn = r => !!r && r.status !== 'final' && hasPots(r.id) && !drawMade(r) && (potsOf(r.id).show || drawOf(r.id).st.started);

/* ----- Actions ----- */
/* Online, a pick first checks the server (is this still the draw device? has anything changed?); offline it goes ahead.
   The check is marked in prefs, so a double tap while it runs draws nothing. */
function drawPick(rid) {
  const busy = DB.prefs.drawBusy;
  if (busy && busy.rid === rid && Date.now() - busy.at < 8000) return;
  const d0 = drawOf(rid);
  if (!d0.mine || spinOf(rid)) return;
  if (!DB.online || DB.outbox.length) { drawPickNow(rid); return; }
  DB.prefs.drawBusy = { rid, at: Date.now() }; savePrefs(); render();
  sync().catch(() => {}).then(() => { DB.prefs.drawBusy = null; savePrefs(); drawPickNow(rid); });
}
function drawPickNow(rid) {
  const d = drawOf(rid);
  if (!d.mine || spinOf(rid) || !d.st.next.length || d.made || hasScores(rid) || d.st.conflicts.length) { render(); return; }
  const slots = d.pace === 'all' ? d.st.next : d.st.next.slice(0, 1);
  const rand = () => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0]; };
  const picks = DR.draw(d.st, slots, rand), dev = drawDev(), at = new Date().toISOString();
  // Saved (queued on this device) before the wheel turns: a reload replays these names, it never draws again.
  DB.prefs.drawSpin = { rid, slots: picks, at: Date.now() }; savePrefs();
  put('settings', picks.map(x => ({ key: `draw:${rid}:${d.ep}:${x.t}:${x.p}:${dev}`, value: JSON.stringify({ pid: x.pid, at }) })),
    { action: 'Breakfast draw', detail: picks.map(x => `Team ${x.t + 1} pot ${DR.potName(x.p)}: ${D.nameOf(x.pid)}`).join(' · ') });
  UI.drawHold = { rid, t: picks[0].t };
  render();
  drawConfirmSoon();
  setTimeout(render, spinTotal(DB.prefs.drawSpin) + 30);
}
const DRAW_ACT = {
  'draw-pot': el => {
    const rid = el.dataset.rid, pid = el.dataset.pid, p = Number(el.dataset.p), d = drawOf(rid);
    if (d.st.started) { toast('The draw has started, so the pots are fixed.'); return; }
    const pots = d.pots.map(x => x.filter(id => id !== pid));
    if (!(d.pots[p] || []).includes(pid)) pots[p].push(pid);
    put('settings', [{ key: 'pots:' + rid, value: JSON.stringify({ pots, show: d.show }) }]);
    render();
  },
  'draw-show': el => {
    const rid = el.dataset.rid, d = drawOf(rid);
    put('settings', [{ key: 'pots:' + rid, value: JSON.stringify({ pots: d.pots, show: !d.show }) }], { action: 'Breakfast draw', detail: d.show ? 'Pots hidden from members' : 'Pots shown to members' });
    render();
  },
  'draw-pace': el => { put('settings', [{ key: 'drawpace:' + el.dataset.rid, value: el.dataset.v === 'all' ? 'all' : 'one' }]); render(); },
  'draw-claim': el => {
    const rid = el.dataset.rid, d = drawOf(rid);
    if (!DB.online || DB.outbox.length) { toast('Connect to the internet first.'); return; }
    if (d.made || hasScores(rid)) { toast('The groups are made, so the draw is closed.'); return; }
    // Starting the draw is one tap; taking it over from another device is two.
    if (d.holder && UI.confirm !== 'dclaim-' + rid) { UI.confirm = 'dclaim-' + rid; render(); return; }
    UI.confirm = null;
    // Check with the server first: a device that has been asleep must not take over a draw that is already finished.
    sync().then(() => {
      const d2 = drawOf(rid);
      if (!DB.online || DB.outbox.length) { toast('Connect to the internet first.'); render(); return; }
      if (d2.made || hasScores(rid)) { toast('The groups are made, so the draw is closed.'); render(); return; }
      // Keep the picks the server already has; anything the old device draws after this point shows as a clash.
      const kept = Object.keys(DR.picksFrom(DB.server.tables.settings, rid, d2.ep));
      put('settings', [{ key: 'drawdev:' + rid, value: JSON.stringify({ dev: drawDev(), at: new Date().toISOString(), keep: { ep: d2.ep, slots: kept } }) }],
        { action: 'Breakfast draw', detail: d2.holder ? 'Draw taken over by another device' : 'Draw device chosen' });
      drawConfirmSoon();
      render();
    });
    render();
  },
  'draw-go': el => drawPick(el.dataset.rid),
  'draw-skip': el => { const s = DB.prefs.drawSpin; if (s) { s.at = 0; savePrefs(); } render(); },
  'draw-next': el => { UI.drawHold = null; const d = drawOf(el.dataset.rid); if (d.st.current < 0) go('drawlineup', { rid: el.dataset.rid }); else render(); },
  'draw-restart': el => {
    const rid = el.dataset.rid, d = drawOf(rid);
    if (d.made || hasScores(rid)) { toast('The groups are made, so the draw can\'t restart.'); return; }
    if (d.holder && !d.mine) { toast('Only the device running the draw can restart it.'); return; }
    if (UI.confirm !== 'drestart-' + rid) { UI.confirm = 'drestart-' + rid; render(); return; }
    UI.confirm = null; UI.drawHold = null;
    if (!DB.online) { toast('Connect to the internet to restart the draw.'); render(); return; }
    // Check with the server first, so a device that missed the groups being made can't reopen the draw.
    sync().then(() => {
      const d2 = drawOf(rid);
      if (d2.made || hasScores(rid) || (d2.holder && !d2.mine)) { toast('The draw can\'t restart now.'); render(); return; }
      const ep = d2.ep + 1;
      put('settings', [{ key: 'drawepoch:' + rid, value: String(ep) }].concat(d2.holder ? [{ key: 'drawdev:' + rid, value: JSON.stringify({ dev: d2.holder.dev, at: new Date().toISOString(), keep: { ep, slots: [] } }) }] : []),
        { action: 'Breakfast draw', detail: 'Draw restarted' });
      toast('Everyone is back in their pots');
      drawConfirmSoon();
      render();
    });
    render();
  },
  'draw-short': el => {
    const rid = el.dataset.rid, n = Number(el.dataset.n), d = drawOf(rid);
    if (d.made) return;
    const teams = d.shortOk.includes(n) ? d.shortOk.filter(x => x !== n) : d.shortOk.concat([n]);
    put('settings', [{ key: `drawshort:${rid}:${d.ep}`, value: JSON.stringify({ teams }) }], { action: 'Breakfast draw', detail: `Team ${n} plays short: ${teams.includes(n) ? 'agreed by the committee' : 'not agreed'}` });
    render();
  },
  // Only needed when the round already had groups made another way: replacing them takes two taps.
  'draw-make': el => {
    const rid = el.dataset.rid;
    if (UI.confirm !== 'dmake-' + rid) { UI.confirm = 'dmake-' + rid; render(); return; }
    UI.confirm = null;
    drawMakeGroups(rid, true);
  }
};
/* The drawn teams are the groups (owner, 26 October): as soon as the draw is finished and every pick is confirmed by the
   server, the draw device saves them. One request: the groups and the draw's "finished" mark travel in the same round row. */
function drawMakeGroups(rid, replace) {
  const r = D.round(rid), d = drawOf(rid);
  if (!r || !d.mine || d.made || hasScores(rid)) return false;
  if (DR.blockers(d.st, { pending: d.pending, shortOk: d.shortOk }).length) return false;
  if (r.groups && r.groups.length && !replace) return false;   // groups made by hand: the organiser chooses
  const groups = DR.groupsFrom(d.st, r.first_tee || '', r.interval || 10, E.addMinutes);
  put('rounds', [Object.assign({}, r, { groups: groups.map(g => Object.assign(g, { draw: d.ep })), kb: null })], { action: 'Groups saved', detail: `${roundName(r)}: ${plural(groups.length, 'team')} from the breakfast draw` });
  toast('The teams are the groups');
  render();
  return true;
}
let drawAutoT = null;
const drawAutoSoon = rid => { if (drawAutoT) return; drawAutoT = setTimeout(() => { drawAutoT = null; drawMakeGroups(rid, false); }, 0); };

/* ---- 44-groups.js ---- */
/* ----- Groups: one screen for every round, any day (owner, 26 October) -----
   Only the organiser. Before play starts, anything goes: move, swap, add, replace or take out a player, and change a
   group's tee time. Buggy pairs, KB pairs and tee times follow automatically (rules in src/groups.js). Each change is
   saved at once as one round row and logged. Once play starts, the only change is a withdrawal: from that hole on the
   player's scores are pick-ups (scratch), entered through the group's normal save. Nobody with scores is moved. */
const GR = window.Groups;
const grStarted = r => !!r && r.status !== 'upcoming';
const wdOf = (rid, pid) => { const v = Number(D.setting(`wd:${rid}:${pid}`, 0)); return v > 0 ? v : 0; };
const grSel = rid => (UI.gsel && UI.gsel.rid === rid ? UI.gsel : null);

/* Apply one change, tidy, repair KBs, save the round in one write, and say what happened. */
function grChange(rid, op, said) {
  const r = D.round(rid);
  if (!r || grStarted(r)) { toast('Play has started: the only change now is a withdrawal.'); return false; }
  const touched = [op.pid, op.with].filter(Boolean).filter(pid => scoresFor(rid, pid));
  if (touched.length) { toast(`${D.nameOf(touched[0])} already has scores, so they stay where they are.`); return false; }
  let groups;
  try {
    const ids = (r.groups || []).map(g => g.id);
    const newId = 'g' + (ids.reduce((m, id) => Math.max(m, Number(String(id).replace(/\D/g, '')) || 0), 0) + 1);
    groups = GR.tidy(GR.apply(r.groups || [], op, newId), r.first_tee || '', r.interval || 8, E.addMinutes);
  } catch (e) { toast(e.message); return false; }
  const out = new Set((r.groups || []).flatMap(g => g.teams.flat()));
  groups.forEach(g => g.teams.flat().forEach(pid => out.delete(pid)));
  let kb = r.kb, kbNote = '';
  if (!isScramble(r) && !E.kbOff(Object.assign({}, r, { groups }))) {
    const kg = groups.filter(g => !g.noKb);
    if (kg.length > 1) {
      const res = GR.repairKb(kg, r.kb, priorKbPairs(rid), E.shuffle, (Date.now() % 100000) + 3);
      kb = res.kb && res.kb.length ? res.kb : null;
      if (res.changed && res.changed.length) kbNote = ` New KB pairs: ${res.changed.map(p => p.map(D.nameOf).join(' & ')).join(', ')}.`;
    } else kb = null;
  } else if (isScramble(r)) kb = null;
  const ph = r.ph ? Object.fromEntries(Object.entries(r.ph).filter(([k]) => !out.has(k))) : r.ph;
  put('rounds', [Object.assign({}, r, { groups, kb, ph: ph && Object.keys(ph).length ? ph : null })], { action: 'Groups changed', detail: `${roundName(r)}: ${said}.${kbNote}` });
  UI.gsel = null; UI.confirm = null;
  toast(said + (kbNote ? ' KB pairs updated.' : ''));
  render();
  return true;
}

ORG.groups = p => {
  const r = D.round(p.rid);
  if (!r) return ORG.home();
  if (!r.groups || !r.groups.length) return ORG.playing(p);   // nobody drawn yet: pick players, then draw
  const scr = isScramble(r), live = grStarted(r), sel = grSel(r.id);
  const n = r.groups.reduce((s, g) => s + g.teams.flat().length, 0);
  // A scramble in play: teams are fixed and there's nothing to tap (UX review F18).
  const fixed = live && scr;
  const sub = fixed ? 'Play has started: the teams are fixed' : live ? 'Play has started: tap a player to withdraw them' : `${plural(n, 'player')} · tap a name or a group to change it`;
  let html = `<header class="hero s">${navBack(roundName(r))}<div class="head"><h1 class="title">Groups</h1></div><p class="sub">${esc(sub)}</p></header>`;
  if (sel && sel.mode === 'swap') html += `<div class="grp-swapbar"><span>${sel.only !== undefined ? `${esc(grName(r, sel.only))} is full. Tap who ${esc(D.nameOf(sel.pid))} swaps with.` : `Tap who ${esc(D.nameOf(sel.pid))} swaps with.`}</span><button class="link" data-act="grp-cancel">Cancel</button></div>`;
  r.groups.forEach((g, gi) => {
    const gOpen = sel && sel.gi === gi && !sel.pid;
    const head = `<button class="row tall grp-head${gOpen ? ' picked' : ''}" data-act="grp-group" data-rid="${r.id}" data-gi="${gi}" aria-expanded="${gOpen}"${live ? ' disabled' : ''}><span class="two"><b class="num">${esc(g.teeTime || '')}</b><span class="sub">${scr ? 'Team' : 'Group'} ${g.n}${g.teams.flat().length !== GR.MAX ? ` · ${plural(g.teams.flat().length, 'player')}` : ''}${g.startHole && g.startHole !== 1 ? ` · starts hole ${g.startHole}` : ''}</span></span></button>`;
    const rows = g.teams.map((t, i) => t.map(pid => {
      const on = sel && sel.pid === pid, wd = wdOf(r.id, pid), sc = scoresFor(r.id, pid);
      const note = wd ? `<span class="pill n">Withdrawn · hole ${wd}</span>` : sc && !live ? '<span class="sub">Has scores</span>' : !scr && g.teams.length > 1 ? `<span class="cap">Buggy ${i + 1}</span>` : '';
      const inner = `<span style="display:flex;align-items:center;gap:8px">${!scr && g.teams.length > 1 ? dot(i) : ''}${esc(D.nameOf(pid))}</span>${note}`;
      const row = fixed ? `<div class="row">${inner}</div>` : `<button class="row${on ? ' picked' : ''}" data-act="grp-pick" data-rid="${r.id}" data-pid="${pid}" aria-expanded="${!!on}">${inner}</button>`;
      return row + (on && sel.mode !== 'swap' ? grPlayerPanel(r, pid, gi) : '');
    }).join('')).join('');
    html += `<section class="sec near grp${sel && sel.only !== undefined && sel.only !== gi ? ' grp-dim' : ''}" id="grp-${gi}"><div class="card">${head}${gOpen ? grGroupPanel(r, gi) : ''}${rows}</div></section>`;
  });
  // A trip: say if anyone shares a buggy again with someone from an earlier day.
  const repeats = live || scr ? [] : E.repeatedPartners([...priorTripGroups(r), { rid: r.id, groups: r.groups }]).filter(x => x.rounds.includes(r.id));
  if (repeats.length) html = html.replace('</header>', `</header><div class="banner note">${repeats.map(x => `${esc(x.pair.map(D.nameOf).join(' & '))} shared a buggy before`).join('<br>')}</div>`);
  const anyScores = r.groups.some(g => g.teams.flat().some(pid => scoresFor(r.id, pid)));
  if (!live && !drawMade(r) && !anyScores) html += `<div class="foot"><button class="link" data-act="org-draw" data-kind="again">${UI.confirm === 'redraw-' + r.id ? 'Tap again: new groups from the same players' : `Draw ${scr ? 'teams' : 'groups'} again`}</button></div>`;
  return { html };
};

const grName = (r, gi) => { const g = r.groups[gi]; return `${isScramble(r) ? 'Team' : 'Group'} ${g.n}${g.teeTime ? ' (' + g.teeTime + ')' : ''}`; };
/* What can happen to a player: before play, move / swap / replace / take out; once play has started, withdraw. */
function grPlayerPanel(r, pid, gi) {
  const name = esc(D.nameOf(pid));
  if (grStarted(r)) {
    if (isScramble(r)) return `<div class="grp-panel"><p class="cap">A scramble team plays on as a team: no one needs withdrawing.</p></div>`;
    const wd = wdOf(r.id, pid);
    if (wd) return `<div class="grp-panel"><p class="cap">${name} picks up on every hole from ${wd}.</p><button class="btn quiet" data-act="grp-unwithdraw" data-rid="${r.id}" data-pid="${pid}">${UI.confirm === 'unwd-' + pid ? 'Tap again: back in' : 'Undo the withdrawal'}</button></div>`;
    const from = grNextHole(r, pid);
    return `<div class="grp-panel"><p class="cap">${name} picks up (scratch) on every hole from ${from}.</p><button class="btn" data-act="grp-withdraw" data-rid="${r.id}" data-pid="${pid}" data-from="${from}">${UI.confirm === 'wd-' + pid ? `Tap again to withdraw ${name}` : `Withdraw ${name} from hole ${from}`}</button></div>`;
  }
  if (scoresFor(r.id, pid)) return `<div class="grp-panel"><p class="cap">${name} already has scores in this round, so they stay where they are.</p></div>`;
  // A full group still takes them: tapping it asks who in that group they swap with.
  const moves = r.groups.map((g, j) => j === gi ? '' : `<button class="chipb" data-act="grp-move" data-rid="${r.id}" data-pid="${pid}" data-to="${j}">${esc(g.teeTime || (isScramble(r) ? 'Team ' : 'Group ') + g.n)}</button>`).join('');
  if (UI.gsel && UI.gsel.mode === 'replace') return `<div class="grp-panel"><p class="cap b">Who plays instead of ${name}?</p>${grPeople(r, 'grp-replace-with', `data-pid="${pid}"`)}<button class="btn quiet" data-act="grp-replace" data-rid="${r.id}" data-pid="${pid}">Cancel</button></div>`;
  return `<div class="grp-panel">
    <p class="cap">Move ${name} to</p><div class="chips">${moves}<button class="chipb" data-act="grp-move" data-rid="${r.id}" data-pid="${pid}" data-to="${r.groups.length}">New group</button></div>
    <div class="grp-acts"><button class="btn quiet" data-act="grp-swap" data-rid="${r.id}" data-pid="${pid}">Swap with…</button><button class="btn quiet" data-act="grp-replace" data-rid="${r.id}" data-pid="${pid}">Replace with…</button></div>
    <div class="grp-outzone"><button class="link c-b grp-out" data-act="grp-remove" data-rid="${r.id}" data-pid="${pid}">${UI.confirm === 'out-' + pid ? `Tap again to take ${name} out` : `Take ${name} out of the round`}</button></div></div>`;
}
/* What can happen to a group: add a player, go out earlier or later. */
function grGroupPanel(r, gi) {
  const g = r.groups[gi], full = g.teams.flat().length >= GR.MAX, last = r.groups.length - 1;
  return `<div class="grp-panel">
    <div class="grp-acts">${gi > 0 ? `<button class="btn quiet" data-act="grp-order" data-rid="${r.id}" data-gi="${gi}" data-to="${gi - 1}">Earlier</button>` : ''}${gi < last ? `<button class="btn quiet" data-act="grp-order" data-rid="${r.id}" data-gi="${gi}" data-to="${gi + 1}">Later</button>` : ''}${gi < last - 1 ? `<button class="btn quiet" data-act="grp-order" data-rid="${r.id}" data-gi="${gi}" data-to="${last}">Out last</button>` : ''}${gi > 1 ? `<button class="btn quiet" data-act="grp-order" data-rid="${r.id}" data-gi="${gi}" data-to="0">Out first</button>` : ''}</div>
    ${full ? `<p class="cap">This ${isScramble(r) ? 'team' : 'group'} has ${GR.MAX}.</p>` : `<p class="cap">Add a player</p>${grPeople(r, 'grp-add', `data-to="${gi}"`)}`}
    ${grStartRow(r, gi)}</div>`;
}
/* Starting hole lives in the group's options: shotgun starts are rare (journeys 2/13). */
function grStartRow(r, gi) {
  const sh = r.groups[gi].startHole || 1, n = (holesOf(r) || []).length || 18;
  return `<div class="grp-start"><label class="cap" for="sh-${gi}">Starts on hole</label><select id="sh-${gi}" class="field short" data-change="grp-start" data-rid="${r.id}" data-gi="${gi}">${Array.from({ length: n }, (_, k) => `<option value="${k + 1}"${sh === k + 1 ? ' selected' : ''}>${k + 1}</option>`).join('')}</select></div>`;
}
function grStart(rid, gi, hole) {
  const r = D.round(rid);
  if (!r || grStarted(r) || !r.groups[gi]) return;
  const groups = r.groups.map((g, i) => i === gi ? Object.assign({}, g, { startHole: hole }) : g);
  put('rounds', [Object.assign({}, r, { groups })], { action: 'Groups changed', detail: `${roundName(r)}: ${r.groups[gi].teeTime || 'Group ' + r.groups[gi].n} starts on hole ${hole}` });
  toast(`${r.groups[gi].teeTime || 'Group ' + r.groups[gi].n} starts on hole ${hole}`);
  render();
}
/* Members not playing (and guests), plus a way to add a new guest. */
function grPeople(r, act, extra) {
  const playing = new Set(r.groups.flatMap(g => g.teams.flat()));
  const free = D.active().filter(m => !playing.has(m.id));
  return `<div class="card grp-people">${free.map(m => `<button class="row" data-act="${act}" data-rid="${r.id}" ${extra} data-new="${m.id}"><span>${esc(m.name)}${isGuest(m) ? ' <span class="pill n">Guest</span>' : ''}</span><span class="sub num">${fmtIndex(m.index)}</span></button>`).join('') || '<div class="row"><span class="sub">Everyone is already playing</span></div>'}
    <button class="row" data-act="org-go" data-v="guest" data-rid="${r.id}"><span class="c-g" style="display:inline-flex;align-items:center;gap:8px">${sized(ICON.plus, 20)}New guest</span></button></div>`;
}
/* The first hole this player's group hasn't saved yet: a withdrawal starts there. */
function grNextHole(r, pid) {
  const gc = progressOf(r.id).groups.find(g => g.teams.flat().includes(pid));
  return (gc && gc.nextHole) || 1;
}

const GROUP_ACT = {

    UI.gsel = null; UI.confirm = null; toast(`${D.nameOf(pid)} withdrawn: pick-ups from hole ${from}`); render();

  }
};

/* ================= Render ================= */
const app = document.getElementById('app');
const tabs = document.getElementById('tabs');

let renderGuard = 0;
function render() {
  if (!DB.loaded && !view().members.length) {
    app.innerHTML = `<div class="loading"><span class="badge crest loading-crest">${CREST_SVG}</span><span class="vh">NCGS</span><p class="sub">${DB.online ? 'Loading' : 'No signal. The app will load when there is.'}</p></div>`;
    tabs.hidden = true;
    return;
  }
  const e = cur();
  let out;
  try {
    out = UI.org ? (UI.orgUnlocked || e.v === 'lock' ? (ORG[e.v] || ORG.home)(e.p || {}) : ORG.lock()) : (VIEWS[e.v] || VIEWS.home)(e.p || {});
  } catch (err) {
    // A screen that cannot be drawn (its round was deleted, the player was moved) steps back one level instead of breaking the app.
    console.warn(err);
    DB.renderFaults = (DB.renderFaults || 0) + 1;
    (DB.faultLog = DB.faultLog || []).push((UI.org ? 'org:' : '') + e.v + ' ' + JSON.stringify(e.p || {}).slice(0, 40) + ' ' + String(err && err.message).slice(0, 80));
    const st = stackOf();
    if (st.length > 1) st.pop(); else { UI.stack = [{ v: 'home', p: {} }]; UI.org = false; }
    UI.confirm = null; UI.holeSheet = false;
    if ((renderGuard || 0) < 4) {
      renderGuard = (renderGuard || 0) + 1;
      try { toast('That screen is not available any more'); render(); } finally { renderGuard -= 1; }
      return;
    }
    UI.stack = [{ v: 'home', p: {} }]; UI.org = false;
    out = VIEWS.home({});
  }
  let overlay = '';
  if (UI.testSheet) {
    const list = Object.entries(FIX.cards).filter(([, c]) => c.nine === UI.testSheet);
    overlay += `<div class="scrim" data-act="sheet-close"><div class="sheet" role="dialog" aria-label="Test cards">
      <div class="nav"><span class="b">Test cards</span><button class="link" data-act="sheet-close">Cancel</button></div>
      ${cardOf(list.map(([k, c]) => `<button class="row" data-act="test-card-pick" data-seg="${UI.testSheet}" data-key="${k}"><span>${esc(c.label)}</span>${chev}</button>`).join(''))}</div></div>`;
  }
  if (UI.fix) overlay += fixSheet();
  if (UI.photoFull) overlay += `<div class="full" data-act="photo-close" role="dialog" aria-label="Card photo"><img src="${UI.photoFull}" alt="Card photo"><button class="link full-close" data-act="photo-close">Close</button></div>`;
  if (UI.shareImg) overlay += `<div class="full" role="dialog" aria-label="Results image"><img src="${UI.shareImg}" alt="Results"><a class="btn dl" href="${UI.shareImg}" download="results.png">Save image</a><button class="link full-close" data-act="share-close">Close</button></div>`;
  const active = document.activeElement;
  const keepFocus = active && active.id && app.contains(active) && /INPUT|TEXTAREA|SELECT/.test(active.tagName) ? active.id : null;
  /* Keep the reader's place when a screen redraws in place (a + or - on the hole screen). Some phones (iOS Safari, and
     the app shown inside another page) can jump to the top when the whole screen's content is swapped, so the scroll
     position is put back unless this redraw asked to go to the top or to the current hole. */
  if (document.activeElement && document.activeElement.tagName === 'BUTTON' && app.contains(document.activeElement)) document.activeElement.blur();   // a focused button that disappears can make iOS scroll
  const sc = scroller(), keepY = !UI.scrollTop && !UI.scrollCur ? sc.scrollTop : null, keepDocY = window.scrollY;
  app.innerHTML = out.html + overlay;
  if (keepY !== null) {
    if (sc.scrollTop !== keepY) sc.scrollTop = keepY;
    if (window.scrollY !== keepDocY) window.scrollTo(0, keepDocY);
    /* iOS can also jump a moment later, when the button that was tapped has gone from the page, so check again
       on the next frame and shortly after. Only if nothing has scrolled since. */
    const back = () => { if (Math.abs(sc.scrollTop - keepY) > 1 && !UI.userScrolled) sc.scrollTop = keepY; };
    UI.userScrolled = false;
    requestAnimationFrame(back); setTimeout(back, 60); setTimeout(back, 250);
  }
  if (keepFocus) { const el = document.getElementById(keepFocus); if (el) el.focus(); }
  /* The tab bar only shows while a round is in play (live, or booked for today). The rest of the time Home is the hub. */
  const inPlay = D.rounds().some(r => r.status === 'live' || (r.status === 'upcoming' && r.date && daysFromToday(r.date) === 0));
  const showTabs = !UI.org && !!out.tabs && inPlay;
  app.classList.toggle('no-tabs', !showTabs);
  tabs.hidden = !showTabs;
  tabs.classList.toggle('under', !!app.querySelector('.scrim, .full'));
  if (showTabs) document.documentElement.style.setProperty('--tabh', (tabs.offsetHeight + parseFloat(getComputedStyle(tabs).bottom || 0) || tabs.offsetHeight) + 'px');
  sizeAsk();
  fitNames();
  /* The Hole tab names the hole this player's group is on: "Hole 3", or "Card" once all 18 are in. */
  if (showTabs) {
    let lbl = 'Hole';
    try {
      const rid = playRid() || liveRid(), mine = rid && myGroup(rid), comp = mine && progressOf(rid);
      const gc = comp && comp.groups.find(g => g.id === mine.id);

  syncHistory();
}

/* The phone's own Back (swipe from the left edge on iPhone, the back button on Android) steps back one screen, like the Back buttons do.
   The browser history is kept the same depth as the screens we have open. */
let histDepth = 0, histBusy = false;
const navDepth = () => (UI.stack.length - 1) + (UI.org ? UI.orgStack.length : 0);
function syncHistory() {
  try {
    const d = navDepth();
    if (d > histDepth) { while (histDepth < d) { histDepth++; history.pushState({ d: histDepth }, ''); } }
    else if (d < histDepth) { const n = histDepth - d; histDepth = d; histBusy = true; setTimeout(() => { histBusy = false; }, 500); history.go(-n); }

    else if (UI.stack.length > 1) UI.stack.pop();

});
try { history.replaceState({ d: 0 }, ''); } catch (e) { /* ignore */ }

}

tabs.innerHTML = [['home', 'Home'], ['hole', 'Hole'], ['board', 'Results'], ['rules', 'Ruling']]
  .map(([k, l]) => `<button class="tab" data-act="tab" data-tab="${k}">${TABICON[k]}<span>${l}</span></button>`).join('');

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');

function placeAskBar() {

});

/* Fresh data every 15 seconds while a round is live, every minute otherwise. */
setInterval(() => {

/* Pull down to refresh. A phone's home-screen app has no built-in pull-to-refresh, so this one fetches the latest scores,
   sends anything waiting to go, and reloads if a newer version of the app has been published.
   The page slides down to show "Pull to refresh" in the gap, the way a native list does. */
(function pullToRefresh() {
  const standalone = window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.NCGS_FORCE_PTR;
  if (!standalone) return;   // in the browser the browser does it
  const ind = document.createElement('div');
  ind.id = 'ptr'; ind.setAttribute('aria-hidden', 'true');
  ind.innerHTML = '<span class="ptr-ring"></span><span class="ptr-txt">Pull to refresh</span>';
  document.body.appendChild(ind);
  const ring = ind.firstChild, txt = ind.lastChild, page = document.getElementById('app');
  const GO = 70, HOLD = 64;
  let y0 = null, p = 0, busy = false;
  const blocked = t => UI.fix || UI.contestSheet || UI.testSheet || UI.photoFull || UI.shareImg || (t && t.closest && t.closest('input,textarea,select'));
  const lay = (dist, animate) => {
    page.style.transition = animate ? 'transform .25s ease-out' : 'none';
    page.style.transform = dist > 0 ? `translateY(${dist}px)` : '';
    ind.style.display = dist > 0 || busy ? 'flex' : 'none';
    ind.style.opacity = String(Math.min(1, dist / 36));
    if (!busy) { ring.style.transform = `rotate(${dist * 6}deg)`; txt.textContent = dist >= GO ? 'Release to refresh' : 'Pull to refresh'; }
  };
  document.addEventListener('touchstart', e => {
    if (busy || e.touches.length !== 1 || scroller().scrollTop > 0 || blocked(e.target)) { y0 = null; return; }
    y0 = e.touches[0].clientY; p = 0;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (y0 === null) return;
    const dy = e.touches[0].clientY - y0;
    if (scroller().scrollTop > 0 || dy <= 0) { if (p) { p = 0; lay(0, false); } if (dy <= 0) y0 = e.touches[0].clientY; return; }
    p = Math.min(110, dy * 0.55);
    if (e.cancelable) e.preventDefault();   // no native bounce while we show the gap
    lay(p, false);
  }, { passive: false });
  const done = () => { busy = false; ind.classList.remove('spin'); lay(0, true); setTimeout(() => { if (!busy) ind.style.display = 'none'; }, 260); };
  const end = () => {
    if (y0 === null) return;
    y0 = null;
    if (p < GO) { p = 0; lay(0, true); return; }
    p = 0; busy = true; ind.classList.add('spin'); txt.textContent = 'Refreshing'; ring.style.transform = '';
    lay(HOLD, true);
    const minimum = new Promise(r => setTimeout(r, 800));
    Promise.all([flush().then(() => sync()).catch(() => {}), minimum]).then(async () => {
      let newer = false;
      if (BOOT.mode === 'live' && BOOT.version) {
        try { const t = await (await fetch('sw.js?' + Date.now(), { cache: 'no-store' })).text(); const m = /ncgs-(\d+)/.exec(t); newer = !!(m && m[1] !== BOOT.version); } catch (x) { /* offline */ }
      }
      if (newer) { location.reload(); return; }
      done();
      toast(DB.online ? 'Up to date' : 'No signal. Showing the last scores this phone saw.');
    });
  };
  document.addEventListener('touchend', end, { passive: true });
  document.addEventListener('touchcancel', () => { if (!busy) { y0 = null; p = 0; lay(0, true); } }, { passive: true });
})();

(function start() {
