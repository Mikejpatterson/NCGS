<style>:root{color-scheme:light}[hidden]{display:none!important}</style><title>NCGS</title><style>/* Layout: one calm column on iOS system grey.
   Type: title 28, lead 20, body 17, secondary 15, caption 13; display sizes only for hero numbers. Weights: 400 text, 600 labels and buttons, 700 headings, 800 big numbers.
   Spacing: 4 / 8 / 16 / 24. One left edge: the 16px page gutter; text inside cards sits 16px in.
   One pill style. Light only, because it is read outdoors. */
:root {
  --bg: #E5ECE6;
  --card: #FFFFFF;
  --text: #0F1A14;
  --sub: #55625A;
  --faint: #9AA79F;
  --line: #E0E8E2;
  --fill: #EAF0EB;
  --press: #D9E3DB;
  --ink: #0F1A14;
  --pine: #0B3D2E;
  --pine-2: #14573F;
  --green: #167A41;
  --green-soft: #DDF1E4;
  --flag: #F6C515;
  --blue: #0B5FD0;
  --red: #CF2A2A;
  --amber-soft: #FFEFC2;
  --amber: #7A4300;
  --t-title: 1.647rem;
  --t-lead: 1.18rem;
  --t-head: 2.1rem;
  --t-num: 2.5rem;
  --t-body: 1rem;
  --t-sub: .882rem;
  --t-cap: .765rem;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --lift: 0 1px 2px rgba(11, 61, 46, .08), 0 8px 20px rgba(11, 61, 46, .08);
  color-scheme: light;
}
html { font-size: 17px; font: -apple-system-body; font-family: var(--font); background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: var(--t-body); line-height: 1.3; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; touch-action: manipulation; }
h1, h2, p { margin: 0; }
:focus-visible { outline: 3px solid #5B9CF0; outline-offset: 2px; border-radius: 8px; }

#app { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 8px calc(72px + env(safe-area-inset-bottom, 0px)); }
#app.no-tabs { padding-block-end: 16px; }

/* Type */
.title { font-size: var(--t-title); font-weight: 700; letter-spacing: -.01em; line-height: 1.15; text-wrap: balance; }
.body { font-size: var(--t-body); }
.sub { font-size: var(--t-sub); color: var(--sub); }
.cap { font-size: var(--t-cap); color: var(--sub); }
.b { font-weight: 600; }
.tab-num, .num { font-variant-numeric: tabular-nums; }
.c-a { color: var(--blue); }
.c-b { color: var(--red); }
.c-g { color: var(--green); }

/* Header */
.nav { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.head .title { flex: 1; min-width: 0; }
.head-sub { margin-top: 4px; }
.link { color: var(--green); font-size: var(--t-body); min-height: 44px; display: inline-flex; align-items: center; gap: 2px; }
.back-icon { color: var(--green); min-width: 32px; min-height: 44px; display: inline-flex; align-items: center; margin-left: -6px; }
.link svg, .back-icon svg { width: 22px; height: 22px; }

/* Sections and cards */
.sec { margin-top: 24px; }
.sec.near { margin-top: 16px; }
.sec-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 24px; margin-bottom: 8px; }
.card { background: var(--card); border-radius: 12px; overflow: hidden; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 10px 16px; width: 100%; }
.row + .row, .card > * + .row { border-top: .5px solid var(--line); }
button.row:active, button.mrow:active, button.lrow:active { background: var(--fill); }
.chev { color: #A5B3AA; display: inline-flex; }
.chev svg { width: 16px; height: 16px; }
.right { display: inline-flex; align-items: center; gap: 8px; text-align: right; }
.note { margin-top: 8px; }

/* The one pill */
.pill { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 12px; font-size: var(--t-cap); font-weight: 600; line-height: 1; white-space: nowrap; }
.pill.a { background: var(--blue); color: #fff; }
.pill.b { background: var(--red); color: #fff; }
.pill.n { background: var(--fill); color: var(--text); }
.pill.w { background: var(--amber-soft); color: var(--amber); }
.pill.g { background: var(--green-soft); color: #155C2D; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.a { background: var(--blue); }
.dot.b { background: var(--red); }

/* Shot dots: counted, not colour-coded */
.dots { display: inline-flex; gap: 5px; align-items: center; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--text); display: block; }
.dots.s { display: flex; gap: 4px; margin-top: 4px; min-height: 8px; }
.dots.s i { width: 8px; height: 8px; }
.dots.give i { background: transparent; border: 2px solid var(--text); }

/* Buttons */
.btn { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: 52px; border-radius: 14px; background: var(--green); color: #fff; font-size: var(--t-body); font-weight: 600; line-height: 1.2; text-align: center; margin-top: 24px; padding: 4px 16px; }
.btn small { font-size: var(--t-cap); font-weight: 400; color: #D3E8DA; margin-top: 2px; }
.btn.quiet { background: var(--press); color: var(--text); }
.btn:active { filter: brightness(.94); }
.savebar { position: sticky; bottom: 0; margin-top: 12px; padding: 0 0 calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--bg); box-shadow: 0 -8px 8px var(--bg); }
.savebar .btn { margin-top: 0; }

/* Score entry */
.entry-head { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px; min-height: 44px; }
.entry .sec { margin-top: 12px; }
.entry .sec-label { margin-bottom: 6px; }
.pr { padding: 6px 16px 8px; }
.pr + .pr { border-top: .5px solid var(--line); }
.pr-top { display: flex; justify-content: space-between; align-items: flex-start; min-height: 30px; margin-bottom: 4px; line-height: 1.2; }
.pr-score { display: flex; align-items: baseline; gap: 8px; }
.pr-score .s { font-size: var(--t-body); font-weight: 600; font-variant-numeric: tabular-nums; }
.pr-score sup { font-size: var(--t-cap); font-weight: 600; margin-left: 1px; }
.picker { display: flex; gap: 4px; }
.picker button { flex: 1 1 0; min-width: 0; height: 44px; border-radius: 10px; background: var(--fill); font-size: var(--t-body); text-align: center; font-variant-numeric: tabular-nums; }
.picker button:active { background: var(--press); }
.picker .pu { flex: 0 0 72px; font-size: var(--t-sub); }
.picker button.on { background: var(--ink); color: #fff; font-weight: 600; }
.pr.flash { animation: flash .6s ease-in-out 2; }
@keyframes flash { 50% { background: var(--amber-soft); } }

/* Bottom sheet (contest) */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .3); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 480px; background: var(--bg); border-radius: 14px 14px 0 0; padding: 8px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }

/* After the hole */
.result { font-size: var(--t-title); font-weight: 700; letter-spacing: -.01em; line-height: 1.15; text-wrap: balance; }
.chg .stat { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.chg .stat .right { flex-direction: row; }
.chg s { font-size: var(--t-cap); color: var(--sub); }
.row.tall { min-height: 60px; }
@media (prefers-reduced-motion: no-preference) {
  .new { animation: rise .45s ease-out both; animation-delay: .15s; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}

/* Segmented control */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--press); border-radius: 9px; padding: 2px; margin-top: 16px; }
.seg button { min-height: 32px; border-radius: 7px; font-size: var(--t-sub); text-align: center; }
.seg button.on { background: #fff; font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }

/* Groups and handicaps */
.hrow { display: grid; grid-template-columns: minmax(0, 1fr) 56px 56px 16px; align-items: center; gap: 4px; min-height: 48px; padding: 0 16px; width: 100%; text-align: left; font-variant-numeric: tabular-nums; }
.hrow + .hrow { border-top: .5px solid var(--line); }
.hrow .nm { display: flex; align-items: center; gap: 8px; }
.hrow .r { text-align: right; }
.hrow.cols { min-height: 32px; }
.grow { display: grid; grid-template-columns: 56px minmax(0, 1fr) 16px; align-items: center; gap: 4px; min-height: 60px; padding: 8px 16px; width: 100%; text-align: left; }
.grow + .grow, .grow + .hrow, .hrow + .grow { border-top: .5px solid var(--line); }
.grow .teams { display: flex; flex-direction: column; gap: 2px; }
.grow .teams span { display: flex; align-items: center; gap: 8px; }
.bignum { font-size: var(--t-title); font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }

/* Match board: one row per hole, team best scores */
.mrow { display: grid; grid-template-columns: 40px 1fr 1fr 92px; align-items: center; min-height: 48px; padding: 0 16px; width: 100%; text-align: left; font-variant-numeric: tabular-nums; }
.mrow + .mrow { border-top: .5px solid var(--line); }
.mrow .p { text-align: center; }
.mrow .m { justify-self: end; }
.mrow.cols { min-height: 40px; }
.mrow.now { background: var(--green-soft); }
.mrow.later { color: var(--faint); }
.ppts { display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 28px; border-radius: 14px; }
.ppts.a { background: var(--blue); color: #fff; font-weight: 600; }
.ppts.b { background: var(--red); color: #fff; font-weight: 600; }
.ppts.lose { color: var(--sub); }

/* Leaderboard */
.lrow { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; font-variant-numeric: tabular-nums; }
.lrow + .lrow { border-top: .5px solid var(--line); }
.lrow.trip { grid-template-columns: 36px minmax(0, 1fr) 32px 32px 32px 40px; }
.lrow .r { text-align: right; }

/* Results card (shareable image) */
.rcard { background: #fff; border-radius: 16px; overflow: hidden; }
.rcard .top { background: var(--ink); color: #fff; padding: 16px; }
.rcard .top .cap { color: #C7C7CC; }
.rcard .top .title { margin-top: 4px; }
.rcard .blk { padding: 12px 16px; border-top: .5px solid var(--line); }
.rcard .ln { display: flex; justify-content: space-between; gap: 8px; min-height: 26px; align-items: center; font-variant-numeric: tabular-nums; }

/* Organiser */
.field { width: 100%; min-height: 52px; border-radius: 12px; border: 1px solid #D1D1D6; background: #fff; font: inherit; font-size: var(--t-body); padding: 0 16px; }
.err { color: var(--red); font-size: var(--t-sub); margin-top: 8px; }
.ic { width: 28px; height: 28px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; color: #fff; flex: none; }
.ic svg { width: 17px; height: 17px; }
.bar { height: 4px; border-radius: 2px; background: var(--press); overflow: hidden; width: 64px; display: inline-block; }
.bar i { display: block; height: 100%; background: var(--green); }
.orow { display: grid; grid-template-columns: 40px repeat(4, minmax(0, 1fr)); align-items: center; min-height: 44px; padding: 0 16px; width: 100%; text-align: center; font-variant-numeric: tabular-nums; }
.orow + .orow { border-top: .5px solid var(--line); }
.orow > :first-child { text-align: left; }
.orow sup { font-size: var(--t-cap); }
.logrow { padding: 12px 16px; }
.logrow + .logrow { border-top: .5px solid var(--line); }
textarea.export { width: 100%; height: 140px; border-radius: 12px; border: 1px solid #D1D1D6; padding: 12px; font: 12px/1.4 ui-monospace, Menlo, monospace; resize: vertical; background: #fff; color: var(--text); }
.banner { background: var(--amber-soft); color: var(--amber); border-radius: 12px; padding: 12px 16px; font-size: var(--t-sub); }

/* Tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(249, 249, 249, .94); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-top: .5px solid #C6C6C8; padding: 4px 0 calc(4px + env(safe-area-inset-bottom, 0px)); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: .66rem; color: #8A8A8E; }
.tab svg { width: 24px; height: 24px; }
.tab.on { color: var(--green); font-weight: 600; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; border-radius: 12px; padding: 12px 16px; font-size: var(--t-sub); z-index: 40; max-width: calc(100% - 32px); }

/* Scorecard photo check */
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); }
label.btn { cursor: pointer; flex-direction: row; }
.thumb { display: block; width: 100%; height: 160px; border-radius: 12px; overflow: hidden; margin-top: 16px; background: var(--press); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.choice { min-height: 48px; border-radius: 12px; background: var(--card); border: 1.5px solid var(--line); font-size: var(--t-body); text-align: center; font-variant-numeric: tabular-nums; }
.choice.on { border-color: var(--green); background: var(--green-soft); color: #155C2D; font-weight: 600; }
.full { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .92); display: flex; align-items: center; justify-content: center; overflow: auto; }
.full img { max-width: 100%; max-height: 100%; }
.full-close { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); right: 16px; color: #fff; }
.pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: 1px; }
@media (prefers-reduced-motion: no-preference) { .pulse { animation: pulse 1.1s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .2; } } }

/* ---------- Society ---------- */
.brand { display: flex; align-items: center; gap: 12px; padding-top: 16px; }
.badge { width: 48px; height: 48px; border-radius: 12px; background: var(--green); color: #fff; font-size: var(--t-cap); font-weight: 600; letter-spacing: .02em; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.two { display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: left; }
.foot { display: flex; justify-content: center; gap: 24px; margin-top: 16px; }
.prose { background: var(--card); border-radius: 12px; padding: 12px 16px; line-height: 1.4; }
.lrow.goy { grid-template-columns: 36px minmax(0, 1fr) auto 40px; width: 100%; text-align: left; }
button.lrow { width: 100%; text-align: left; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.tile { background: var(--card); border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hours { display: grid; grid-template-columns: repeat(5, 1fr); border-top: .5px solid var(--line); padding: 8px 16px; text-align: center; }
.hours > span { display: flex; flex-direction: column; gap: 2px; font-variant-numeric: tabular-nums; }
/* Weather card: colour follows the weather, white text, big and clear in sunlight */
.wx { border-radius: 18px; padding: 16px; color: #fff; background: linear-gradient(160deg, #3C5A82, #5E7FA6); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.wx-sun { background: linear-gradient(160deg, #1566C8, #2E8BE6); }
.wx-part { background: linear-gradient(160deg, #2A68B5, #4F93D8); }
.wx-cloud { background: linear-gradient(160deg, #4B5F7A, #6E8399); }
.wx-fog { background: linear-gradient(160deg, #5C6B7A, #8394A3); }
.wx-drizzle { background: linear-gradient(160deg, #35557F, #5479A6); }
.wx-rain { background: linear-gradient(160deg, #1F3A68, #3D669F); }
.wx-snow { background: linear-gradient(160deg, #3F6590, #6F95BE); }
.wx-storm { background: linear-gradient(160deg, #2A2A4A, #4A4F7A); }
.wx-top { display: flex; align-items: center; gap: 12px; }
.wxi { flex: none; display: block; }
.wx-main { min-width: 0; }
.wx-name { font-size: var(--t-lead); font-weight: 700; letter-spacing: -.01em; }
.wx-temp { font-size: var(--t-num); font-weight: 800; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.wx-temp span { font-size: var(--t-lead); font-weight: 600; opacity: .8; letter-spacing: 0; }
.wx-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.wx-chip { background: rgba(255,255,255,.2); border-radius: 999px; padding: 6px 12px; font-size: var(--t-sub); }
.wx-chip b { font-weight: 800; }
.wx-line { margin: 12px 0 0; font-size: var(--t-body); font-weight: 600; }
.wx-skel { background: linear-gradient(160deg, #4B5F7A, #6E8399); min-height: 168px; }
.sk { display: block; background: rgba(255,255,255,.28); border-radius: 10px; animation: skpulse 1.3s ease-in-out infinite; }
.sk-ic { width: 72px; height: 72px; border-radius: 50%; flex: none; }
.sk-a { width: 120px; height: 20px; margin-bottom: 10px; }
.sk-b { width: 90px; height: 36px; }
@keyframes skpulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } }
.wx-fail { display: flex; flex-direction: column; gap: 4px; width: 100%; text-align: left; background: linear-gradient(160deg, #4B5F7A, #6E8399); min-height: 96px; justify-content: center; }
.wx-hours { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: 14px; padding: 10px 4px; background: rgba(255,255,255,.16); border-radius: 12px; text-align: center; }
.wx-hours > span { display: flex; flex-direction: column; align-items: center; gap: 2px; font-variant-numeric: tabular-nums; }
.wx-t { font-size: var(--t-cap); opacity: .9; }
.wx-d { font-weight: 800; }
.wx-r { font-size: var(--t-cap); opacity: .9; min-height: 1em; }

.link.inline { min-height: 0; display: inline; font-size: inherit; }
.link.sm { font-size: var(--t-sub); }
.loading { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }

/* Scorecard: golf marks, read like a paper card */
.sc-wrap { margin-top: 16px; padding: 8px 8px 4px; }
table.sc { border-collapse: collapse; width: 100%; font-size: var(--t-body); text-align: center; font-variant-numeric: tabular-nums; }
.sc th { font-size: var(--t-cap); font-weight: 600; color: var(--sub); padding: 4px 0; }
.sc td { height: 36px; padding: 0; }
.sc .hn { text-align: left; padding-left: 4px; font-size: var(--t-sub); color: var(--sub); white-space: nowrap; }
.sc .sd { font-size: 7px; letter-spacing: -1px; color: var(--text); vertical-align: 2px; }
.sc .par { color: var(--sub); font-size: var(--t-sub); }
.sc .pts { font-weight: 600; }
.sc .gap { width: 8px; }
.sc tr.tot td { border-top: 1px solid var(--text); font-weight: 600; height: 40px; }
.sc tr.tot .hn { color: var(--text); }
.mk { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; box-sizing: border-box; }
.mk.birdie { border: 1.5px solid var(--text); border-radius: 50%; }
.mk.eagle { border: 1.5px solid var(--text); border-radius: 50%; outline: 1.5px solid var(--text); outline-offset: 2px; }
.mk.bogey { border: 1.5px solid var(--text); }
.mk.double { border: 1.5px solid var(--text); outline: 1.5px solid var(--text); outline-offset: 2px; }
.mk.pu { color: var(--sub); }

/* Organiser forms */
.fld { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; min-width: 0; }
.fld label:empty { display: none; }
select.field { appearance: none; -webkit-appearance: none; background: #fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%236B6B70" stroke-width="2"><path d="M7 10l5 5 5-5"/></svg>') no-repeat right 12px center / 18px; padding-right: 36px; }
.field.area { min-height: 88px; padding: 12px 16px; line-height: 1.4; resize: vertical; }
.field.sm { min-height: 40px; padding: 0 8px; border-radius: 8px; text-align: center; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; }
.three-col { display: grid; grid-template-columns: 1fr 72px 72px; gap: 8px; align-items: end; }
.hole-row { display: grid; grid-template-columns: 32px 1fr 1fr 1fr; gap: 8px; align-items: center; margin-bottom: 6px; }
.hole-row.cols { margin-bottom: 4px; }
.row.picked { background: var(--green-soft); }

/* ---------- Look: pine hero bands, flag-yellow accent, lifted cards ---------- */
#app { padding-block-start: 0; }
.hero { margin: 0 -16px; padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 24px; background: linear-gradient(165deg, var(--pine-2), var(--pine) 70%); color: #fff; border-radius: 0 0 28px 28px; }

.card { border-radius: 16px; box-shadow: var(--lift); }

.row, .lrow, .hrow, .grow, .mrow { min-height: 52px; }

.pr { padding-block: 8px 10px; }
.btn { background: var(--green); min-height: 56px; border-radius: 16px; box-shadow: 0 6px 16px rgba(22, 122, 65, .28); font-size: var(--t-body); }
.btn.quiet { background: #fff; color: var(--pine); box-shadow: var(--lift); }
.btn small { color: #D6EEDD; }
.savebar { background: linear-gradient(to top, var(--bg) 70%, rgba(229,236,230,0)); box-shadow: none; padding-top: 12px; }
.picker { gap: 5px; }

.picker button.on { background: var(--pine); color: #fff; font-weight: 700; box-shadow: 0 3px 8px rgba(11, 61, 46, .3); }

.facts { display: flex; gap: 8px; margin-top: 12px; }
.fact { background: rgba(255,255,255,.14); border-radius: 12px; padding: 6px 12px; font-size: var(--t-sub); font-weight: 600; }
.fact b { color: var(--flag); font-weight: 700; margin-left: 4px; }
.pill { height: 26px; padding: 0 11px; }
.seg { background: var(--press); }
.seg button.on { color: var(--pine); }
.chip.on { background: var(--pine); }

.hero.c { padding-block: calc(env(safe-area-inset-top, 0px) + 4px) 14px; border-radius: 0 0 22px 22px; }
.hrow2 { display: flex; align-items: center; gap: 10px; min-height: 52px; }
.hrow2 .big { flex: 1; margin: 0; font-size: var(--t-num); font-weight: 800; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; color: #fff; }

.pill.flag { background: var(--flag); color: var(--pine); }

.pr-top { min-height: 28px; margin-bottom: 6px; align-items: center; }

.pr-top .nm .dots.s { margin: 0; }

.hrow2 .big { display: flex; align-items: baseline; gap: 8px; }
.hrow2 .big small { margin: 0; }
.pills2 { align-items: center; margin-top: 0; padding-bottom: 2px; }
.pill.w2 { background: transparent; color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.5); }
.picker button { border-radius: 10px; }
.hrow2 { min-height: 44px; }
.hero.c { padding-bottom: 12px; }
.pills2 { padding-bottom: 0; }
.hero.c + .sec { margin-top: 12px; }
.row, .lrow, .hrow, .grow, .mrow { min-height: 50px; }

/* Front page */
.hero.home { padding-bottom: 20px; }
.who-chip { margin-left: auto; align-self: flex-start; height: 44px; padding: 0 16px; border-radius: 22px; background: rgba(255,255,255,.16); color: #fff; font-size: var(--t-sub); font-weight: 600; white-space: nowrap; }
.brand .two { flex: 1; min-width: 0; }
.now { margin-top: 20px; }
.now-main { display: flex; flex-direction: column; gap: 4px; width: 100%; text-align: left; }
.now-top { display: flex; align-items: center; gap: 8px; min-height: 26px; }
.now-kind { font-size: var(--t-sub); font-weight: 600; color: var(--flag); }
.now-name { font-size: var(--t-head); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; margin-top: 2px; text-wrap: balance; }
.now-line { font-size: var(--t-body); color: #CFE2D6; }
.now-acts { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; margin-top: 20px; }
.go { min-height: 54px; border-radius: 14px; background: var(--flag); color: var(--pine); font-weight: 700; font-size: var(--t-body); text-align: center; }
.go.alt { background: rgba(255,255,255,.16); color: #fff; font-weight: 600; }
.go:active { filter: brightness(.92); }
.links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.lnk { display: flex; flex-direction: column; gap: 2px; background: #fff; border-radius: 16px; box-shadow: var(--lift); padding: 14px 16px; text-align: left; min-height: 72px; min-width: 0; }
.lnk-t { font-weight: 700; color: var(--pine); }
.lnk-s { font-size: var(--t-sub); color: var(--sub); }

/* Score stepper: minus, the number, plus. First tap lands on par. */
.stepper { display: grid; grid-template-columns: 64px minmax(0, 1fr) 64px 84px; gap: 8px; align-items: center; }
.st { height: 56px; border-radius: 14px; background: var(--fill); color: var(--pine); font-size: 2rem; font-weight: 500; line-height: 1; text-align: center; display: flex; align-items: center; justify-content: center; }
.st:active { background: var(--press); }
.st:disabled { opacity: .35; }
.stv { text-align: center; font-size: 2.6rem; font-weight: 800; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; color: var(--pine); }
.stv.none { color: var(--faint); font-weight: 600; font-size: var(--t-body); letter-spacing: 0; }
.stepper .pu { height: 56px; border-radius: 14px; background: var(--fill); font-size: var(--t-sub); text-align: center; }
.stepper .pu.on { background: var(--pine); color: #fff; font-weight: 700; }

/* Front page tiles: big, with an icon */
.links { gap: 12px; margin-top: 20px; }
.lnk { min-height: 112px; padding: 16px; gap: 2px; justify-content: flex-end; }
.lnk-ic { width: 44px; height: 44px; border-radius: 12px; background: var(--green-soft); color: var(--green); display: inline-flex; align-items: center; justify-content: center; margin-bottom: auto; }
.lnk-t { font-size: var(--t-lead); }

/* Leaderboard: tap a name to drop down their card */
.lrow.drop { width: 100%; text-align: left; grid-template-columns: 36px minmax(0, 1fr) auto; }
.lrow.drop .r { display: inline-flex; align-items: center; gap: 8px; }
.lrow .chev.dn { transition: transform .2s; }
.lrow.drop.open .chev.dn { transform: rotate(90deg); }
.dropcard { padding: 4px 8px 8px; background: var(--fill); border-top: .5px solid var(--line); }
.dropcard .sc { font-size: var(--t-sub); }
.dropcard .sc td { height: 32px; }
.lrow.drop .chev.dn { transform: rotate(90deg); }
.lrow.drop.open .chev.dn { transform: rotate(-90deg); }
.row.drop { text-align: left; }
.row.drop .chev.dn { transform: rotate(90deg); transition: transform .2s; }
.row.drop.open .chev.dn { transform: rotate(-90deg); }
.card > .dropcard + .row, .card > .dropcard + .lrow { border-top: .5px solid var(--line); }
button.nm.drop { display: flex; align-items: center; gap: 10px; min-height: 36px; text-align: left; }
button.nm.drop .chev.dn { transform: rotate(90deg); transition: transform .2s; }
button.nm.drop.open .chev.dn { transform: rotate(-90deg); }
.dropcard.in { margin: 0 -16px 8px; }

/* Scorecard v2: pine header band, soft row stripes, coloured marks and points */
.sc-wrap { padding: 0 0 8px; overflow: hidden; }
.dropcard { padding: 0 0 8px; background: var(--card); }
table.sc { border-collapse: separate; border-spacing: 0; }
.sc thead th { background: var(--pine); color: #fff; font-size: var(--t-cap); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 8px 0; }
.sc thead th.gap { background: var(--pine); }
.sc thead th.hn { color: #BFD6C8; }
.sc tbody tr:nth-child(even) td:not(.gap) { background: #F3F7F4; }
.sc td { height: 40px; }
.sc .hn { padding-left: 12px; color: var(--pine); font-weight: 700; }
.sc .sd { font-size: 8px; letter-spacing: 3px; margin-left: 4px; color: var(--green); vertical-align: 2px; }
.sc .par { color: var(--faint); }
.sc .gap { width: 6px; background: var(--card); }
.sc tr.tot td { border-top: 0; background: var(--green-soft) !important; color: var(--pine); font-weight: 800; height: 44px; }
.sc tr.tot .hn { color: var(--pine); }
.pp { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; border-radius: 14px; font-weight: 700; background: var(--fill); color: var(--sub); }
.pp.p0 { background: #FBE3E3; color: #A31F1F; }
.pp.p1 { background: #FFF1CC; color: #7A4300; }
.pp.p2 { background: var(--fill); color: var(--pine); }
.pp.p3 { background: var(--green-soft); color: #0F6A38; }
.pp.p4 { background: var(--green); color: #fff; }
.mk { width: 30px; height: 30px; font-weight: 600; }
.mk.birdie { background: var(--green); border: 0; color: #fff; border-radius: 50%; }
.mk.eagle { background: var(--flag); color: var(--pine); border: 0; border-radius: 50%; outline: 2px solid var(--flag); outline-offset: 2px; font-weight: 800; }
.mk.bogey { background: #FBE3E3; border: 1.5px solid #E7A3A3; color: #8F1D1D; border-radius: 8px; }
.mk.double { background: var(--red); border: 0; color: #fff; border-radius: 8px; outline: 0; font-weight: 700; }
.sc-note { padding: 4px 12px 0; }
.sc thead th { letter-spacing: 0; font-size: .66rem; }
.sc td:last-child, .sc th:last-child { padding-right: 10px; }
.sc td:first-child, .sc th:first-child { padding-left: 12px; }
.sc thead th.hn { font-size: .66rem; }

/* Scorecard v3: plain golf marks, no colour coding. Only the striping, header band and totals row carry colour. */
.pp, .pp.p0, .pp.p1, .pp.p2, .pp.p3, .pp.p4 { background: none; color: var(--text); min-width: 0; height: auto; border-radius: 0; font-weight: 600; }
.mk { color: var(--text); background: none; font-weight: 500; }
.mk.birdie { background: none; border: 1.5px solid var(--pine); border-radius: 50%; color: var(--text); }
.mk.eagle { background: none; border: 1.5px solid var(--pine); border-radius: 50%; outline: 1.5px solid var(--pine); outline-offset: 2px; color: var(--text); font-weight: 500; }
.mk.bogey { background: none; border: 1.5px solid var(--pine); border-radius: 0; color: var(--text); }
.mk.double { background: none; border: 1.5px solid var(--pine); border-radius: 0; outline: 1.5px solid var(--pine); outline-offset: 2px; color: var(--text); font-weight: 500; }
.sc .sd { color: var(--text); }
.mk.pu { color: var(--sub); } .mk.pu sup { font-size: .6rem; margin-left: 1px; }
.sc .mk.par { color: var(--text); font-weight: 500; }
.sc thead th { font-size: .6rem; padding-inline: 2px; }
.sc thead th.hn { font-size: .6rem; padding-left: 12px; }
.sc th:nth-child(3), .sc th:nth-child(7) { padding-inline: 6px; }
.fixcell { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 40px; border-radius: 10px; }
.fixcell:active { background: var(--press); }
.dropcard .sc-note { padding: 8px 12px 0; text-align: center; }

/* Change-a-score sheet */
.scrim { animation: fade .18s ease-out; }
.sheet.fixs { border-radius: 24px 24px 0 0; padding: 8px 20px calc(20px + env(safe-area-inset-bottom, 0px)); text-align: center; background: var(--card); box-shadow: 0 -10px 40px rgba(0, 0, 0, .25); animation: slideup .22s ease-out; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: #CFD8D2; margin: 4px auto 14px; }
.fx-head { display: flex; flex-direction: column; gap: 2px; }
.fx-head .b { font-size: var(--t-lead); }
.fx-step { display: grid; grid-template-columns: 76px 1fr 76px; align-items: center; gap: 8px; margin: 18px 0 6px; }
.st.round { width: 76px; height: 76px; border-radius: 50%; font-size: 2.4rem; background: var(--fill); }
.st.round:active { background: var(--press); }
.fx-val { font-size: 5.2rem; font-weight: 800; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; color: var(--pine); }
.fx-val.pu { color: var(--sub); }
.fx-val sup { font-size: 1.4rem; font-weight: 600; margin-left: 2px; }
.fx-line { color: var(--sub); margin-bottom: 14px; }
.fx-line .b { color: var(--text); }
.fx-pu { min-height: 44px; padding: 0 20px; border-radius: 22px; background: var(--fill); font-size: var(--t-sub); font-weight: 600; margin-bottom: 4px; }
.fx-pu.on { background: var(--pine); color: #fff; }
.sheet.fixs .btn { margin-top: 12px; }
.sheet.fixs .btn:disabled { opacity: .4; box-shadow: none; }
.fx-cancel { display: flex; margin: 6px auto 0; justify-content: center; }
@keyframes slideup { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .scrim, .sheet.fixs { animation: none; } }
.fx-step .st.round, .fx-pu { transition: none; -webkit-user-select: none; user-select: none; }
.scrim.still, .sheet.fixs.still { animation: none; }

/* iOS 26 fades the top of the screen under the status bar (the "glass" edge). Start heroes a little lower so the first line is never hazy. */
.hero { padding-top: calc(env(safe-area-inset-top, 0px) + 20px); }
.hero.c { padding-top: calc(env(safe-area-inset-top, 0px) + 18px); }

/* Pull to refresh: the page slides down and this sits in the gap */
#ptr { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 14px); z-index: 1; display: none; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; color: #fff; font-size: var(--t-sub); font-weight: 600; }
.ptr-ring { width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; display: block; }
#ptr.spin .ptr-ring { animation: ptrspin .8s linear infinite; transform: none !important; }
@keyframes ptrspin { to { transform: rotate(360deg); } }

/* Home-screen app: a solid black status bar (no iOS glass), and the page background matches the tab bar so any spare strip below it is invisible. */
/* The strip behind the clock takes the colour of the body, so the body is the header green and the app sits on top of it in the light page colour. */
html, body { background: var(--pine); }
#app { background: var(--bg); min-height: 100vh; }
.tabs { background: #fff; -webkit-backdrop-filter: none; backdrop-filter: none; }
.stv.out { color: var(--faint); }

/* Strokes with points beside them, the word under (Scratch = 0 points, the same as a pick-up) */
.stv { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.stv b { font-size: var(--t-num); font-weight: 800; line-height: 1; letter-spacing: -.03em; }
.stv b sup { font-size: var(--t-lead); font-weight: 700; margin-left: 2px; letter-spacing: 0; }
.stv small { font-size: var(--t-cap); font-weight: 600; letter-spacing: 0; color: var(--sub); line-height: 1; }
.stv.out b { color: var(--faint); }
.stepper .pu.on { background: var(--green); color: #fff; }
.stepper .st:disabled { opacity: .35; }
.seg.pills { margin: 12px 0 4px; } .seg.pills button { min-height: 40px; font-weight: 600; }
.crow { padding-top: 12px; padding-bottom: 12px; min-height: 60px; }
.ct-l { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ct-r { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; white-space: nowrap; }
body { min-height: 100vh; }
.pill.a.soft { background: rgba(11, 95, 208, .13); color: var(--blue); }
.pill.b.soft { background: rgba(207, 42, 42, .13); color: var(--red); }
.row .right { display: flex; align-items: center; gap: 6px; }
.tee .sec { margin-top: 12px; } .tee .sec-label { min-height: 22px; margin-bottom: 4px; } .tee .row, .tee .drop { min-height: 42px; }

/* The strokes cell is always the same height, so the row does not jump when a score goes in. Tapping a score clears it. */
.stv { height: 70px; justify-content: center; }
button.stv { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: var(--pine); width: 100%; border-radius: 14px; -webkit-user-select: none; user-select: none; }
button.stv:active { background: var(--press); }
/* The header starts in exactly the body green, so it joins the strip behind the clock with no visible seam. */
.hero { background: linear-gradient(180deg, var(--pine), var(--pine-2)); }

/* Rules checker */
.thread { padding: 16px 0 calc(var(--tabh, 64px) + var(--askh, 76px) + 16px); display: flex; flex-direction: column; gap: 10px; min-height: 40vh; }
.ask-intro { margin: 8px 2px 4px; } .ask-intro .b { font-size: var(--t-title); font-weight: 700; line-height: 1.2; margin: 0 0 6px; } .ask-intro .sub { margin: 0; }
.ask-ideas { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.idea { text-align: left; min-height: 48px; padding: 10px 16px; border-radius: 14px; background: #fff; box-shadow: var(--shadow, 0 1px 2px rgba(0,0,0,.06)); font-size: var(--t-body); color: var(--pine); font-weight: 600; }
.idea:active { background: var(--press); }
.msg { display: flex; } .msg.me { justify-content: flex-end; }
.bub { max-width: 88%; padding: 12px 16px; border-radius: 20px; font-size: var(--t-body); line-height: 1.38; overflow-wrap: anywhere; }
.msg.me .bub { background: var(--pine); color: #fff; border-bottom-right-radius: 6px; }
.msg.ai .bub { background: #fff; border-bottom-left-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.bub .ap { margin: 0 0 8px; } .bub .ap:last-child { margin-bottom: 0; }
.bub .ab { position: relative; padding-left: 16px; margin: 4px 0; } .bub .ab::before { content: ""; position: absolute; left: 3px; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.bub.err { color: var(--sub); }
.bub.wait { display: inline-flex; gap: 5px; padding: 16px 18px; } .bub.wait i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); animation: askdot 1.2s infinite ease-in-out; } .bub.wait i:nth-child(2) { animation-delay: .15s; } .bub.wait i:nth-child(3) { animation-delay: .3s; }
@keyframes askdot { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
.ask-note { text-align: center; margin: 12px 8px 0; }
.askbar { position: fixed; left: 0; right: 0; bottom: var(--tabh, 64px); z-index: 9; padding: 8px 12px 10px; background: var(--bg); }
.askbar .card { background: #fff; border: 1px solid var(--line); border-radius: 28px; box-shadow: 0 1px 3px rgba(0,0,0,.05); padding: 6px 8px 8px; }
.askbar textarea { display: block; width: 100%; min-height: 34px; max-height: 168px; resize: none; border: 0; background: transparent; padding: 10px 12px 6px; font: inherit; font-size: var(--t-body); line-height: 1.3; color: var(--text); outline: none; }
.askbar .arow { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.askbar .arow button { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.askbar .send { background: var(--green); color: #fff; }
.askbar .send svg { width: 24px; height: 24px; }
.askbar .mic { background: var(--fill); color: var(--pine); }
.askbar .mic svg { width: 24px; height: 24px; }
.askbar .x { background: var(--fill); color: var(--text); }
.askbar .x svg { width: 22px; height: 22px; }
.askbar .stop { background: var(--fill); }
.askbar .stop i { width: 16px; height: 16px; border-radius: 3px; background: var(--text); display: block; }
.askbar .arow .x, .askbar .arow .stop, .askbar .arow .eq { display: none; }
body.hearing .askbar .arow .x, body.hearing .askbar .arow .stop { display: grid; }
body.hearing .askbar .arow .eq { display: flex; }
body.hearing .askbar .arow .mic { display: none; }
.eq { flex: 1; min-width: 0; height: 48px; align-items: center; justify-content: space-between; overflow: hidden; padding: 0 4px; }
.eq i { flex: none; width: 3px; height: 4px; border-radius: 2px; background: var(--text); transition: height 70ms linear; }
body.typing .tabs, body.hearing .tabs { display: none; }
body.typing .askbar, body.hearing .askbar { bottom: var(--kb, 0px); }
body.hearing:not(.typing) .askbar { padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
@media (prefers-reduced-motion: reduce) { .bub.wait i { animation: none; } }

/* Ruling: verdict big enough to read out, rule chips, microphone */
.verdict { font-size: var(--t-lead); font-weight: 700; line-height: 1.25; letter-spacing: -.01em; color: var(--pine); margin-bottom: 10px; }
.rest { color: var(--text); }
.rules { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.rulechip { display: inline-flex; align-items: center; height: 26px; padding: 0 11px; border-radius: 13px; background: var(--flag); color: var(--pine); font-size: var(--t-cap); font-weight: 700; }
/* Rules checker: where the answer came from */
.srcs { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(0,0,0,.1); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.srcl { font-size: var(--t-cap); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted, #5b6b64); }
.src { font-size: var(--t-sub); font-weight: 600; color: var(--pine); text-decoration: underline; text-underline-offset: 2px; min-height: 32px; display: inline-flex; align-items: center; }

/* Ruling: lighter and smoother, closer to a chat app than a form */
.ask-intro .b { font-size: var(--t-title); }
.ask-intro .sub { font-size: var(--t-sub); }
.idea { min-height: 44px; padding: 10px 16px; border-radius: 16px; font-size: 1rem; font-weight: 600; box-shadow: 0 0 0 .5px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04); transition: background-color .15s, transform .15s; }
.idea:active { transform: scale(.985); }
.bub { font-size: var(--t-body); line-height: 1.42; padding: 11px 16px; border-radius: 20px; }
.msg { animation: msgin .22s ease-out both; }
@keyframes msgin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.verdict { font-size: var(--t-lead); }
.askbar { padding: 6px 12px 8px; }
.askbar .card { border-radius: 26px; border: .5px solid rgba(0,0,0,.12); box-shadow: 0 2px 10px rgba(0,0,0,.06); padding: 4px 6px 6px; }
.askbar textarea { font-size: var(--t-body); line-height: 1.35; min-height: 28px; padding: 9px 12px 4px; }
.askbar .arow { gap: 6px; }
.askbar .arow button { width: 38px; height: 38px; transition: background-color .18s, transform .12s, opacity .18s; }
.askbar .arow button:active { transform: scale(.9); }
.askbar .send svg, .askbar .mic svg { width: 20px; height: 20px; }
.askbar .x svg { width: 18px; height: 18px; }
.askbar .stop i { width: 13px; height: 13px; border-radius: 3px; }
.askbar .send { transition: background-color .2s, opacity .2s, transform .12s; }
.askbar.empty .send { background: #c9d3ce; }
.eq { height: 38px; padding: 0 6px; }
.eq i { width: 3px; border-radius: 1.5px; transition: height 90ms ease-out; }
body.hearing .askbar .arow .x, body.hearing .askbar .arow .stop, body.hearing .askbar .arow .eq { animation: lfade .2s ease-out both; }
@keyframes lfade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .msg, body.hearing .askbar .arow .x, body.hearing .askbar .arow .stop, body.hearing .askbar .arow .eq { animation: none; } }

/* Ruling: the pill grows and the words glide */
.askbar .card { position: relative; }
.askbar textarea { transition: height .2s cubic-bezier(.2, .8, .2, 1); scroll-behavior: smooth; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.askbar textarea.over { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 26px); mask-image: linear-gradient(to bottom, transparent 0, #000 26px); }
.askbar .mirror { position: absolute; left: 6px; right: 6px; top: 0; width: auto; height: 0; min-height: 0; max-height: none; visibility: hidden; pointer-events: none; overflow: hidden; border: 0; resize: none; transition: none; background: none; }
@media (prefers-reduced-motion: reduce) { .askbar textarea { transition: none; scroll-behavior: auto; } }

/* Go to hole */
.holebtn { display: inline-flex; align-items: baseline; gap: 8px; min-height: 44px; padding: 0 6px; margin: 0 -6px; background: none; border: 0; color: inherit; font: inherit; letter-spacing: inherit; border-radius: 12px; -webkit-tap-highlight-color: transparent; }
.holebtn:active { background: rgba(255, 255, 255, .12); }
.holebtn .hdown { align-self: center; display: inline-flex; color: var(--flag); }
.holebtn .hdown svg { width: 20px; height: 20px; }
.hs-sheet { padding-top: 12px; }
.hs-lab { margin: 14px 2px 8px; font-size: var(--t-cap); font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: .04em; }
.hs-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.hs { display: grid; place-items: center; text-align: center; padding: 0; min-height: 52px; border-radius: 14px; background: #fff; color: var(--pine); font-size: var(--t-lead); font-weight: 700; font-variant-numeric: tabular-nums; box-shadow: 0 0 0 .5px rgba(0,0,0,.08); transition: transform .12s, background-color .15s; }
.hs:active { transform: scale(.94); }
.hs.done { background: var(--green); color: #fff; box-shadow: none; }
.hs.nxt { box-shadow: inset 0 0 0 3px var(--flag); }
.hs.here { outline: 3px solid var(--pine); outline-offset: 2px; }
.hs-key { margin: 14px 2px 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
.hs-ki { display: inline-flex; align-items: center; gap: 8px; }
.hs-tip { flex-basis: 100%; }
.hs-k { width: 14px; height: 14px; border-radius: 5px; background: #fff; box-shadow: 0 0 0 .5px rgba(0,0,0,.2); display: inline-block; }
.hs-k.done { background: var(--green); box-shadow: none; } .hs-k.nxt { box-shadow: inset 0 0 0 3px var(--flag); }

/* Polish pass */
.mrow.now { margin-top: 0; }                         /* the Buggy Wars "Now" row was picking up the front-page .now margin */
.hero + .res { margin-top: 24px; }
.sec-label .pill { min-width: 88px; justify-content: center; }   /* Buggy 1 and Buggy 2 pills line up */
.res { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; }
.res-t { font-size: var(--t-lead); font-weight: 700; letter-spacing: -.01em; }
.res-sub { margin-top: 6px; }
.row .pill { font-size: var(--t-cap); }

/* Front page: your standing under the name, a quiet Organiser link, year picker in the header band */
button.hsub { display: inline-flex; align-items: center; gap: 2px; min-height: 28px; padding: 0; color: #BFD6C8; font-size: var(--t-sub); text-align: left; }
button.hsub svg { width: 14px; height: 14px; opacity: .8; }
.foot { margin: 24px 0 8px; text-align: center; }
.foot .link { color: var(--sub); font-size: var(--t-sub); justify-content: center; }
.hero .seg.year { margin-top: 12px; background: rgba(255, 255, 255, .14); }
.hero .seg.year button { color: #fff; }
.hero .seg.year button.on { background: #fff; color: var(--pine); }

/* Switch */
.switch { width: 52px; height: 32px; border-radius: 16px; background: #C9D3CE; position: relative; flex: none; transition: background-color .2s; }
.switch i { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.switch.on { background: var(--green); }
.switch.on i { transform: translateX(20px); }
@media (prefers-reduced-motion: reduce) { .switch, .switch i { transition: none; } }
.field.short { width: 84px; flex: none; min-height: 44px; }
.stat { padding-block: 12px; } .stat .cap { text-transform: uppercase; letter-spacing: .04em; } .stat .b { font-size: var(--t-lead); }
.seg.pills button { white-space: nowrap; padding-inline: 6px; font-size: .9rem; }
.lrow.low { background: var(--flag-soft, #FFF3B8); font-weight: 700; box-shadow: inset 4px 0 0 var(--flag); }
.chartcard { padding: 12px 12px 4px; }
.chart { width: 100%; height: auto; display: block; }
.chart .cbar { fill: var(--green); }
.chart .cbar.top { fill: var(--flag); }
.chart .g { stroke: var(--line); stroke-width: .5; }
.chart .avg { stroke: var(--pine); stroke-width: 1.5; stroke-dasharray: 4 3; }
.chart text { font: 600 10px -apple-system, system-ui, sans-serif; fill: var(--sub); }
.chart text.v { fill: var(--ink, #111); font-size: 11px; }
/* Four result pills sit in two rows of two so none runs off the edge */
.seg.pills.four { grid-auto-flow: row; grid-template-columns: 1fr 1fr; gap: 2px; }
.seg.pills.four button { font-size: var(--t-body); padding-inline: 8px; }
/* Stats tiles */
.stiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stile { --tone: var(--green); --soft: var(--green-soft); background: var(--card); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 3px; min-width: 0; box-shadow: var(--lift); }
.stile.tf { --tone: #8A6A00; --soft: #FFF1B8; }
.stile.tb { --tone: #0A60C9; --soft: #E3EEFB; }
.stile.tr { --tone: #B3261E; --soft: #FBE7E5; }
.stile .sic { width: 44px; height: 44px; border-radius: 14px; background: var(--soft); color: var(--tone); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 6px; }
.stile .cap { color: var(--tone); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.stile .who { font-size: var(--t-lead); font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
.stile .nt { font-size: var(--t-sub); color: var(--sub); line-height: 1.3; }
button.banner { display: block; width: 100%; text-align: left; margin: 12px 0 0; font: inherit; font-size: var(--t-sub); line-height: 1.35; min-height: 52px; }
.banner.warn { background: #FBE7E5; color: #B3261E; }
textarea.export + .btn, #restorejson + .btn { margin-top: 8px; }
.chk { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line, #C7C7CC); display: inline-flex; align-items: center; justify-content: center; flex: none; color: #fff; }
.chk.on { background: var(--green); border-color: var(--green); }
.seg.pills.four { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.seg.pills button, .seg.pills.four button { white-space: normal; line-height: 1.15; padding-block: 6px; overflow-wrap: anywhere; }

/* Ruling cards: one quick question with big tap answers, then the ruling */
.msg.ai.card { display: block; animation: msgin .22s ease-out both; }
.qtext { font-size: var(--t-title); font-weight: 700; line-height: 1.22; letter-spacing: -.01em; margin: 6px 2px 12px; }
.qopts { display: flex; flex-direction: column; gap: 8px; }
.qopt { display: flex; align-items: center; gap: 12px; text-align: left; min-height: 56px; padding: 12px 16px; border-radius: 18px; background: #fff; font-size: 1.05rem; box-shadow: 0 0 0 .5px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.05); transition: background-color .15s, transform .15s; }
.qopt:active:not(:disabled) { background: var(--press); transform: scale(.985); }
.qopt:disabled { opacity: .55; }
.qopt.dim { color: var(--sub); }
.qtag { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 14px; font-size: .9rem; font-weight: 700; color: #fff; background: #c62828; flex: none; }
.qopt.t-yellow .qtag { background: #f0b400; color: #1b1b1b; }
.rtop { font-size: var(--t-sub); color: var(--sub); font-weight: 600; margin: 6px 2px 4px; }
.rverdict { font-size: 2rem; font-weight: 800; line-height: 1.1; letter-spacing: -.02em; margin: 0 2px 6px; color: var(--text); }
.rintro { font-size: var(--t-body); color: var(--sub); margin: 0 2px 10px; }
.rsteps { list-style: none; margin: 0 0 10px; padding: 0; background: #fff; border-radius: 18px; box-shadow: 0 0 0 .5px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.05); }
.rsteps li { display: flex; gap: 12px; align-items: flex-start; padding: 13px 16px; font-size: 1.05rem; line-height: 1.32; }
.rsteps li + li { border-top: .5px solid rgba(0,0,0,.12); }
.rn { flex: none; width: 30px; height: 30px; border-radius: 50%; background: #ececf0; display: inline-flex; align-items: center; justify-content: center; font-size: .9rem; font-weight: 700; margin-top: 1px; }
.rnote { font-size: var(--t-sub); color: var(--sub); margin: 0 2px 12px; line-height: 1.35; }
.ract { display: flex; gap: 10px; margin-top: 4px; }
.rbtn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; border-radius: 18px; background: #e4e4ea; font-size: 1.05rem; font-weight: 700; transition: background-color .15s, transform .15s; }
.rbtn:active { background: #d6d6dd; transform: scale(.985); }
.rbtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ================= 2026 look: warm white, rounded pine cards, floating pill tab bar ================= */
:root {
  --bg: #FAF8F3;
  --press: #EEEBE3;
  --fill: #EEF0EA;
  --ring: 0 0 0 1px rgba(20, 35, 27, .07);
  --lift: 0 0 0 1px rgba(20, 35, 27, .07);
}
html, body { background: var(--bg); }
#app { padding-block-end: calc(120px + env(safe-area-inset-bottom, 0px)); }
#app.no-tabs { padding-block-end: 24px; }
.card, .tile, .lnk, .rcard { border-radius: 24px; box-shadow: var(--ring); }
.btn.quiet { box-shadow: var(--ring); }
.btn { border-radius: 28px; min-height: 56px; box-shadow: none; }
.row, .lrow, .hrow, .grow, .mrow { min-height: 54px; }
.title { color: var(--text); }

/* Page headers (every screen except Home and the hole) are plain big titles on the page, like the mock-ups */
.hero.s, .hero.c:not(.pine) { background: none; color: var(--text); border-radius: 0; margin: 0; padding: calc(env(safe-area-inset-top, 0px) + 12px) 4px 4px; }
.hero.s .title { color: var(--text); font-size: 2.1rem; font-weight: 900; letter-spacing: -.03em; }
.hero.s .link, .hero.s .back-icon, .hero.s .link.inline { color: var(--pine); }
.hero.s .sub, .hero.s .cap, .hero.s .hsub { color: var(--sub); }
.hero.s .pill.w { background: var(--flag); color: var(--pine); }
.hero.s .pill.g { background: var(--green-soft); color: #155C2D; }
.hero.s + .sec, .hero.s + .btn { margin-top: 16px; }

/* Cards that stay pine: the hole, the front-page round */
.hero.pine, .hero.home .now { background: var(--pine); color: #fff; border-radius: 28px; position: relative; overflow: hidden; }
.hero.pine { margin: 8px 0 0; padding: 16px 18px 14px; }
.hero.pine::after, .hero.home .now::after { content: ""; position: absolute; right: -60px; top: -60px; width: 190px; height: 190px; border-radius: 50%; background: rgba(247, 197, 22, .14); pointer-events: none; }

/* Front page */
.hero.home { background: none; color: var(--text); border-radius: 0; margin: 0; padding: calc(env(safe-area-inset-top, 0px) + 12px) 4px 0; }
.hero.home .wordmark { color: var(--text); font-weight: 800; }
.hero.home .hsub { color: var(--pine); }
.hero.home .badge { background: var(--flag); color: var(--pine); }
.who-chip { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 6px 0 14px; border-radius: 22px; background: #fff; color: var(--text); box-shadow: var(--ring); font-weight: 600; }
.who-av { width: 32px; height: 32px; border-radius: 50%; background: var(--pine); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: .72rem; font-weight: 700; }
.greet { margin: 14px 0 0; font-size: var(--t-sub); color: var(--sub); font-weight: 500; }
.headline { margin: 4px 0 0; font-size: 1.85rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; color: var(--text); text-wrap: balance; }
.hero.home .now { margin-top: 14px; padding: 18px; }
.hero.home .now > * { position: relative; z-index: 1; }
.hero.home .now-name { font-size: 1.8rem; letter-spacing: -.02em; }
.mini { margin-top: 14px; border-radius: 18px; background: rgba(255, 255, 255, .1); padding: 2px 14px; }
.mr { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.mr + .mr { border-top: 1px solid rgba(255, 255, 255, .14); }
.mr .mp { width: 20px; font-weight: 800; }
.mr .mn { flex: 1; font-weight: 700; }
.mr .mn small { font-size: .65rem; letter-spacing: .1em; color: var(--flag); font-weight: 800; }
.mr .mt { font-size: 1.4rem; font-weight: 800; letter-spacing: -.02em; }
.go { border-radius: 28px; min-height: 56px; }
.links { grid-template-columns: 1fr 1fr; }
.lnk { border-radius: 22px; }

/* Floating pill tab bar */
.tabs { left: 50%; right: auto; width: min(calc(100% - 32px), 448px); transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); height: 68px; border-radius: 34px; padding: 0 8px; gap: 2px; grid-template-columns: repeat(4, 1fr); align-items: center; background: rgba(255, 255, 255, .94); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border: 0; box-shadow: 0 8px 28px rgba(20, 35, 27, .16), 0 0 0 1px rgba(20, 35, 27, .08); }
.tab { height: 52px; min-height: 52px; border-radius: 26px; font-size: .68rem; font-weight: 600; color: var(--sub); }
.tab svg { width: 22px; height: 22px; }
.tab.on { background: #FBEFB8; color: var(--pine); font-weight: 700; }
.tab.on svg { color: var(--pine); }
.askbar { bottom: calc(var(--tabh, 90px) + 4px); }
.thread { padding-bottom: calc(var(--tabh, 90px) + var(--askh, 76px) + 16px); }
.toast { bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }

/* Initials badges and the same plain titles on every page header */
.hero.c:not(.pine) .title { color: var(--text); font-size: 2.1rem; font-weight: 900; letter-spacing: -.03em; }
.hero.c:not(.pine) .link, .hero.c:not(.pine) .back-icon { color: var(--pine); }
.hero.c:not(.pine) .sub, .hero.c:not(.pine) .cap { color: var(--sub); }
.lname { display: flex; align-items: center; gap: 12px; min-width: 0; }
.lname > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.av { flex: none; width: 40px; height: 40px; border-radius: 50%; background: #E3EAE0; color: var(--pine); display: inline-flex; align-items: center; justify-content: center; font-style: normal; font-size: .72rem; font-weight: 800; letter-spacing: 0; }
.av.is-me { background: var(--pine); color: #fff; }
.lrow { min-height: 64px; }
.lrow.goy { grid-template-columns: 36px minmax(0, 1fr) auto 40px; }
.hero.c:not(.pine) .hrow2 .big { color: var(--text); font-size: min(2.1rem, 9.5vw) !important; font-weight: 900; letter-spacing: -.03em; }
.hero.c:not(.pine) .fact { background: #fff; box-shadow: var(--ring); color: var(--text); }
.hero.c:not(.pine) .fact b { color: var(--pine); }
.hero.c:not(.pine) .pill.w2 { color: var(--text); box-shadow: inset 0 0 0 1.5px rgba(20,35,27,.25); }
.hero.pine { padding-top: calc(env(safe-area-inset-top, 0px) + 14px); }
.hero.c:not(.pine) .hrow2 .big small { color: var(--sub); }
.hero.c:not(.pine) { padding-top: calc(env(safe-area-inset-top, 0px) + 6px); padding-bottom: 2px; }
#app { padding-block-end: calc(96px + env(safe-area-inset-bottom, 0px)); }

/* ===== Scoring a hole, like the mock-up: name and dots on the left, round minus / big score / plus on the right ===== */
.hero.pine .hrow2 .big { font-size: 4.2rem; letter-spacing: -.05em; }
.hero.pine .hrow2 .big small { color: var(--flag); font-weight: 800; letter-spacing: .1em; font-size: .72rem; text-transform: uppercase; }
.prog { display: flex; gap: 3px; margin-top: 12px; position: relative; z-index: 1; }
.prog i { flex: 1; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .25); }
.prog i.done { background: #fff; }
.prog i.now { background: var(--flag); }

/* ===== Leaderboard, like the mock-up ===== */

.entry .pr { grid-template-columns: auto minmax(0, 1fr) 48px 76px 48px; grid-template-areas: "nm nm dn sc up" "dt pu dn sc up" "dc dc dc dc dc"; min-height: 84px; padding-block: 8px; }
.entry .pr-top { grid-area: nm; }

/* ===== Liquid glass tab bar: clear, blurred, bright edge; the chosen tab is a lens of yellow glass ===== */
.tabs { background: rgba(255, 255, 255, .68); -webkit-backdrop-filter: blur(30px) saturate(190%) brightness(1.05); backdrop-filter: blur(30px) saturate(190%) brightness(1.05); box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .95), inset 0 -1px 0 rgba(255, 255, 255, .4), inset 0 0 0 1px rgba(255, 255, 255, .55), 0 12px 32px rgba(20, 35, 27, .2), 0 0 0 .5px rgba(20, 35, 27, .12); }
.tabs::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 55%); pointer-events: none; z-index: -1; }
.tab { color: #36413B; }
.tab.on { background: linear-gradient(180deg, rgba(255, 248, 214, .95), rgba(250, 232, 160, .7)); box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .95), inset 0 0 0 1px rgba(255, 255, 255, .6), 0 3px 10px rgba(122, 90, 0, .18); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .tabs { background: rgba(255, 255, 255, .96); } }

/* ===== More glass: clearer, stronger blur and colour lift, bright rim light all the way round, a curved highlight across the top ===== */
.tabs { background: linear-gradient(135deg, rgba(255, 255, 255, .46), rgba(255, 255, 255, .14) 42%, rgba(255, 255, 255, .32)); -webkit-backdrop-filter: blur(14px) saturate(230%) contrast(1.06) brightness(1.1); backdrop-filter: blur(14px) saturate(230%) contrast(1.06) brightness(1.1); box-shadow: inset 0 2px 1px -1px rgba(255, 255, 255, 1), inset 0 -2px 2px -1px rgba(255, 255, 255, .7), inset 2px 0 3px -2px rgba(255, 255, 255, .9), inset -2px 0 3px -2px rgba(255, 255, 255, .9), inset 0 0 24px rgba(255, 255, 255, .3), 0 16px 38px rgba(20, 35, 27, .24), 0 0 0 .5px rgba(20, 35, 27, .14); }
.tabs::before { background: radial-gradient(130% 100% at 50% -35%, rgba(255, 255, 255, .8), rgba(255, 255, 255, 0) 62%); }
.tab { text-shadow: 0 0 8px rgba(255, 255, 255, .95), 0 0 2px rgba(255, 255, 255, .8); }
.tab svg { filter: drop-shadow(0 0 4px rgba(255, 255, 255, .9)); }
.tab.on { background: linear-gradient(180deg, rgba(255, 255, 255, .7), rgba(247, 197, 22, .34)); -webkit-backdrop-filter: blur(6px) saturate(180%) brightness(1.08); backdrop-filter: blur(6px) saturate(180%) brightness(1.08); box-shadow: inset 0 2px 1px -1px #fff, inset 0 -2px 2px -1px rgba(255, 255, 255, .8), inset 0 0 0 1px rgba(255, 255, 255, .65), inset 0 0 14px rgba(255, 255, 255, .4), 0 5px 14px rgba(122, 90, 0, .22); }

/* Selected tab: a stronger yellow glass lens, darker bolder icon and label */
.tab.on { background: linear-gradient(180deg, rgba(255, 255, 255, .85), rgba(247, 197, 22, .62)); box-shadow: inset 0 2px 1px -1px #fff, inset 0 -2px 3px -1px rgba(255, 255, 255, .9), inset 0 0 0 1.5px rgba(255, 255, 255, .85), inset 0 0 16px rgba(255, 255, 255, .5), 0 0 0 1px rgba(214, 160, 0, .45), 0 6px 16px rgba(160, 110, 0, .32); color: #0B3D2C; font-weight: 800; text-shadow: none; }
.tab.on svg { stroke-width: 2.5; color: #0B3D2C; filter: none; }

/* Golfer of the Year: the leader in a pine card, each counting score as a green chip */
.leadcard { position: relative; overflow: hidden; margin-top: 14px; border-radius: 28px; background: var(--pine); color: #fff; padding: 18px; display: flex; flex-direction: column; gap: 4px; }
.leadcard::after { content: ""; position: absolute; right: -50px; top: -50px; width: 170px; height: 170px; border-radius: 50%; background: rgba(247, 197, 22, .14); }
.leadcard > * { position: relative; z-index: 1; }
.lc-k { font-size: .75rem; font-weight: 800; letter-spacing: .1em; color: var(--flag); }
.lc-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.lc-n { font-size: 2.3rem; font-weight: 900; letter-spacing: -.03em; line-height: 1; }
.lc-p { font-size: .95rem; font-weight: 700; color: rgba(255, 255, 255, .85); font-variant-numeric: tabular-nums; }
.lc-p b { font-size: 3.2rem; font-weight: 900; letter-spacing: -.05em; line-height: .9; color: #fff; }
.lc-s { margin-top: 8px; font-size: var(--t-sub); color: rgba(255, 255, 255, .85); }
.chips { display: inline-flex; gap: 6px; }
.chipn { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 30px; padding: 0 4px; border-radius: 15px; background: #E3EFE6; color: var(--pine); font-style: normal; font-size: .85rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.lrow.goy { grid-template-columns: 24px minmax(0, 1fr) auto 52px; gap: 6px; }
.lrow.goy .lname { gap: 8px; }
.lrow.goy .av { width: 34px; height: 34px; font-size: .62rem; }
@media (max-width: 360px) { .lrow.goy .av { display: none; } }
.lrow.goy:first-of-type { background: #FFF3C4; }
.lrow.goy .b.r { text-align: right; }

/* Anything scrolled or tabbed into view lands above the floating tab bar, not under it */
html { scroll-padding-bottom: calc(var(--tabh, 90px) + 16px); }

/* Pull to refresh: the page behind is warm white now, so the ring and words are pine, not white */
#ptr { color: var(--pine); }
.ptr-ring { width: 30px; height: 30px; border: 3.5px solid rgba(11, 61, 46, .18); border-top-color: var(--pine); }

/* ===== Round 3: calmer selector pills, a solid strip behind the clock, glassier tab bar ===== */
/* The pills: one row when they fit, wrapping to a second row only when text is large. Words never break mid-word. */
.seg.pills, .seg.pills.four { display: flex; flex-wrap: wrap; gap: 2px; padding: 4px; border-radius: 22px; }
.seg.pills button, .seg.pills.four button { flex: 1 1 auto; white-space: nowrap; overflow-wrap: normal; padding: 0 6px; min-height: 42px; font-size: .92rem; font-weight: 600; border-radius: 18px; text-align: center; line-height: 1.2; }
.seg.pills button.on { background: #fff; box-shadow: 0 1px 3px rgba(20, 35, 27, .16); color: var(--pine); font-weight: 800; }

/* iPhone iOS 26 smudges anything that scrolls under the clock. A solid strip in the page colour sits there, so the top looks like the mock-ups. */
body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 60; pointer-events: none; }

/* Glassier bar: far more see-through, stronger blur and colour lift, a bright edge */
.tabs { background: linear-gradient(135deg, rgba(255, 255, 255, .36), rgba(255, 255, 255, .06) 45%, rgba(255, 255, 255, .24)); -webkit-backdrop-filter: blur(22px) saturate(260%) contrast(1.04) brightness(1.12); backdrop-filter: blur(22px) saturate(260%) contrast(1.04) brightness(1.12); box-shadow: inset 0 2px 1px -1px #fff, inset 0 -2px 2px -1px rgba(255, 255, 255, .8), inset 2px 0 3px -2px #fff, inset -2px 0 3px -2px #fff, inset 0 0 28px rgba(255, 255, 255, .35), 0 0 0 1px rgba(255, 255, 255, .35), 0 18px 40px rgba(20, 35, 27, .26), 0 0 0 .5px rgba(20, 35, 27, .16); }
.tab { text-shadow: 0 0 10px rgba(255, 255, 255, 1), 0 0 3px rgba(255, 255, 255, .9); }
.tab.on { background: linear-gradient(180deg, rgba(255, 255, 255, .6), rgba(247, 197, 22, .5)); }

/* ===== Richer pages: Home tiles, Past rounds, Players, Stats ===== */
.av.sm { width: 28px; height: 28px; font-size: .5rem; }
.av.lg { width: 46px; height: 46px; font-size: .8rem; }

/* Home: the Golfer of the Year feature card and four tiles that each look different */
.feat { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 6px; width: 100%; margin-top: 16px; padding: 18px; border-radius: 28px; text-align: left; color: #fff; background: linear-gradient(150deg, #14573F, #0B3D2E 70%); }
.feat::after { content: ""; position: absolute; right: -50px; top: -60px; width: 190px; height: 190px; border-radius: 50%; background: rgba(247, 197, 22, .16); pointer-events: none; }
.feat > * { position: relative; z-index: 1; }
.ft-k { display: inline-flex; align-items: center; gap: 6px; font-size: .72rem; font-weight: 800; letter-spacing: .1em; color: var(--flag); }
.ft-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.ft-n { font-size: 2.1rem; font-weight: 900; letter-spacing: -.03em; line-height: 1; }
.ft-p { font-size: .95rem; font-weight: 700; color: rgba(255, 255, 255, .85); font-variant-numeric: tabular-nums; }

/* Past rounds */
.prow { gap: 12px; }
.prow .two { flex: 1; min-width: 0; }
.dchip { flex: none; width: 48px; height: 54px; border-radius: 14px; background: #E8F1EA; color: var(--pine); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }

.posp { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--fill); color: var(--sub); font-size: var(--t-cap); font-weight: 800; }

.st-a { background: var(--pine); color: #fff; }
.st-a .cap { color: #BFD6C8; }
.st-b { background: linear-gradient(160deg, #FFF3C4, #FADF7A); color: #4A3300; }
.st-b .cap { color: #7A5200; }
.st-c { background: linear-gradient(160deg, #E8F3EA, #CFE5D5); color: var(--pine); }
.st-c .cap { color: #3E6B57; }
.shd { display: inline-flex; align-items: center; gap: 10px; }
.shi { width: 30px; height: 30px; border-radius: 10px; background: #E3EFE6; color: var(--pine); display: inline-flex; align-items: center; justify-content: center; }
.sht { font-size: 1.12rem; font-weight: 800; letter-spacing: -.01em; color: var(--text); }

.srow.top { background: #FFF9DC; }

.rk { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 900; color: var(--sub); font-variant-numeric: tabular-nums; }
.rk.r1 { background: var(--flag); color: #14231B; }
.rk.r2 { background: #DDE1DE; color: #14231B; }
.rk.r3 { background: #EBCFAE; color: #4A2F10; }
.sn { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sn .n { font-weight: 700; font-size: 1.02rem; }
.bar { display: block; height: 6px; border-radius: 3px; background: #EEF0EA; width: 100%; overflow: hidden; }

.sv { font-size: 1.4rem; font-weight: 900; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }

.lnk { min-height: 148px; }
.av.sm { width: 30px; height: 30px; font-size: .55rem; }
.stack .av + .av { margin-left: -6px; }
.dchip.none { color: var(--faint); }
.idx { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.05; font-size: .95rem; font-weight: 800; font-variant-numeric: tabular-nums; margin-right: 4px; }

/* Scoring header like the mock-up */
