<style>:root{color-scheme:light}[hidden]{display:none!important}</style><title>NCGS</title><style>/* Layout: one calm column on iOS system grey.
   Type: four sizes (title 28, body 17, secondary 15, caption 13), two weights (400, 600).
   Spacing: 4 / 8 / 16 / 24. One left edge: the 16px page gutter; text inside cards sits 16px in.
   One pill style. Light only, because it is read outdoors. */
:root {
  --bg: #E5ECE6;
  --card: #FFFFFF;
  --text: #0F1A14;
  --sub: #55625A;
  --faint: #9AA79F;
  --line: #E0E8E2;
  --fill: #EAF0EB;
  --press: #D9E3DB;
  --ink: #0F1A14;
  --pine: #0B3D2E;
  --pine-2: #14573F;
  --green: #167A41;
  --green-soft: #DDF1E4;
  --flag: #F6C515;
  --blue: #0B5FD0;
  --red: #CF2A2A;
  --amber-soft: #FFEFC2;
  --amber: #7A4300;
  --t-title: 1.647rem;
  --t-body: 1rem;
  --t-sub: .882rem;
  --t-cap: .765rem;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --lift: 0 1px 2px rgba(11, 61, 46, .08), 0 8px 20px rgba(11, 61, 46, .08);
  color-scheme: light;
}
html { font-size: 17px; font: -apple-system-body; font-family: var(--font); background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: var(--t-body); line-height: 1.3; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; touch-action: manipulation; }
h1, h2, p { margin: 0; }
:focus-visible { outline: 3px solid #5B9CF0; outline-offset: 2px; border-radius: 8px; }

#app { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 8px calc(72px + env(safe-area-inset-bottom, 0px)); }
#app.no-tabs { padding-block-end: 16px; }

/* Type */
.title { font-size: var(--t-title); font-weight: 700; letter-spacing: -.01em; line-height: 1.15; text-wrap: balance; }
.body { font-size: var(--t-body); }
.sub { font-size: var(--t-sub); color: var(--sub); }
.cap { font-size: var(--t-cap); color: var(--sub); }
.b { font-weight: 600; }
.tab-num, .num { font-variant-numeric: tabular-nums; }
.c-a { color: var(--blue); }
.c-b { color: var(--red); }
.c-g { color: var(--green); }

/* Header */
.nav { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.head .title { flex: 1; min-width: 0; }
.head-sub { margin-top: 4px; }
.link { color: var(--green); font-size: var(--t-body); min-height: 44px; display: inline-flex; align-items: center; gap: 2px; }
.back-icon { color: var(--green); min-width: 32px; min-height: 44px; display: inline-flex; align-items: center; margin-left: -6px; }
.link svg, .back-icon svg { width: 22px; height: 22px; }

/* Sections and cards */
.sec { margin-top: 24px; }
.sec.near { margin-top: 16px; }
.sec-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 24px; margin-bottom: 8px; }
.card { background: var(--card); border-radius: 12px; overflow: hidden; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 0 16px; width: 100%; }
.row + .row, .card > * + .row { border-top: .5px solid var(--line); }
button.row:active, button.mrow:active, button.lrow:active { background: var(--fill); }
.chev { color: #A5B3AA; display: inline-flex; }
.chev svg { width: 16px; height: 16px; }
.right { display: inline-flex; align-items: center; gap: 8px; text-align: right; }
.note { margin-top: 8px; }

/* The one pill */
.pill { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 12px; font-size: var(--t-cap); font-weight: 600; line-height: 1; white-space: nowrap; }
.pill.a { background: var(--blue); color: #fff; }
.pill.b { background: var(--red); color: #fff; }
.pill.n { background: var(--fill); color: var(--text); }
.pill.w { background: var(--amber-soft); color: var(--amber); }
.pill.g { background: var(--green-soft); color: #155C2D; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.a { background: var(--blue); }
.dot.b { background: var(--red); }

/* Shot dots: counted, not colour-coded */
.dots { display: inline-flex; gap: 5px; align-items: center; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--text); display: block; }
.dots.s { display: flex; gap: 4px; margin-top: 4px; min-height: 8px; }
.dots.s i { width: 8px; height: 8px; }
.dots.give i { background: transparent; border: 2px solid var(--text); }

/* Buttons */
.btn { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: 52px; border-radius: 14px; background: var(--green); color: #fff; font-size: var(--t-body); font-weight: 600; line-height: 1.2; text-align: center; margin-top: 24px; padding: 4px 16px; }
.btn small { font-size: var(--t-cap); font-weight: 400; color: #D3E8DA; margin-top: 2px; }
.btn.quiet { background: var(--press); color: var(--text); }
.btn:active { filter: brightness(.94); }
.savebar { position: sticky; bottom: 0; margin-top: 12px; padding: 0 0 calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--bg); box-shadow: 0 -8px 8px var(--bg); }
.savebar .btn { margin-top: 0; }

/* Score entry */
.entry-head { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px; min-height: 44px; }
.entry .sec { margin-top: 12px; }
.entry .sec-label { margin-bottom: 6px; }
.pr { padding: 6px 16px 8px; }
.pr + .pr { border-top: .5px solid var(--line); }
.pr-top { display: flex; justify-content: space-between; align-items: flex-start; min-height: 30px; margin-bottom: 4px; line-height: 1.2; }
.pr-score { display: flex; align-items: baseline; gap: 8px; }
.pr-score .s { font-size: var(--t-body); font-weight: 600; font-variant-numeric: tabular-nums; }
.pr-score sup { font-size: var(--t-cap); font-weight: 600; margin-left: 1px; }
.picker { display: flex; gap: 4px; }
.picker button { flex: 1 1 0; min-width: 0; height: 44px; border-radius: 10px; background: var(--fill); font-size: var(--t-body); text-align: center; font-variant-numeric: tabular-nums; }
.picker button:active { background: var(--press); }
.picker .pu { flex: 0 0 72px; font-size: var(--t-sub); }
.picker button.on { background: var(--ink); color: #fff; font-weight: 600; }
.pr.flash { animation: flash .6s ease-in-out 2; }
@keyframes flash { 50% { background: var(--amber-soft); } }

/* Bottom sheet (contest) */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .3); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 480px; background: var(--bg); border-radius: 14px 14px 0 0; padding: 8px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }

/* After the hole */
.result { font-size: var(--t-title); font-weight: 700; letter-spacing: -.01em; line-height: 1.15; text-wrap: balance; }
.chg .right { flex-direction: column; align-items: flex-end; gap: 0; }
.chg s { font-size: var(--t-cap); color: var(--sub); }
.row.tall { min-height: 60px; }
@media (prefers-reduced-motion: no-preference) {
  .new { animation: rise .45s ease-out both; animation-delay: .15s; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}

/* Segmented control */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--press); border-radius: 9px; padding: 2px; margin-top: 16px; }
.seg button { min-height: 32px; border-radius: 7px; font-size: var(--t-sub); text-align: center; }
.seg button.on { background: #fff; font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }

/* Groups and handicaps */
.hrow { display: grid; grid-template-columns: minmax(0, 1fr) 56px 56px 16px; align-items: center; gap: 4px; min-height: 48px; padding: 0 16px; width: 100%; text-align: left; font-variant-numeric: tabular-nums; }
.hrow + .hrow { border-top: .5px solid var(--line); }
.hrow .nm { display: flex; align-items: center; gap: 8px; }
.hrow .r { text-align: right; }
.hrow.cols { min-height: 32px; }
.grow { display: grid; grid-template-columns: 56px minmax(0, 1fr) 16px; align-items: center; gap: 4px; min-height: 60px; padding: 8px 16px; width: 100%; text-align: left; }
.grow + .grow, .grow + .hrow, .hrow + .grow { border-top: .5px solid var(--line); }
.grow .teams { display: flex; flex-direction: column; gap: 2px; }
.grow .teams span { display: flex; align-items: center; gap: 8px; }
.bignum { font-size: var(--t-title); font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }

/* Match board: one row per hole, team best scores */
.mrow { display: grid; grid-template-columns: 40px 1fr 1fr 92px; align-items: center; min-height: 48px; padding: 0 16px; width: 100%; text-align: left; font-variant-numeric: tabular-nums; }
.mrow + .mrow { border-top: .5px solid var(--line); }
.mrow .p { text-align: center; }
.mrow .m { justify-self: end; }
.mrow.cols { min-height: 40px; }
.mrow.now { background: var(--green-soft); }
.mrow.later { color: var(--faint); }
.ppts { display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 28px; border-radius: 14px; }
.ppts.a { background: var(--blue); color: #fff; font-weight: 600; }
.ppts.b { background: var(--red); color: #fff; font-weight: 600; }
.ppts.lose { color: var(--sub); }

/* Leaderboard */
.lrow { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; font-variant-numeric: tabular-nums; }
.lrow + .lrow { border-top: .5px solid var(--line); }
.lrow.trip { grid-template-columns: 36px minmax(0, 1fr) 32px 32px 32px 40px; }
.lrow .r { text-align: right; }

/* Results card (shareable image) */
.rcard { background: #fff; border-radius: 16px; overflow: hidden; }
.rcard .top { background: var(--ink); color: #fff; padding: 16px; }
.rcard .top .cap { color: #C7C7CC; }
.rcard .top .title { margin-top: 4px; }
.rcard .blk { padding: 12px 16px; border-top: .5px solid var(--line); }
.rcard .ln { display: flex; justify-content: space-between; gap: 8px; min-height: 26px; align-items: center; font-variant-numeric: tabular-nums; }
.rcard .blk.drinks { background: var(--amber-soft); }
.rcard .blk.drinks .cap { color: var(--amber); }

/* Organiser */
.field { width: 100%; min-height: 52px; border-radius: 12px; border: 1px solid #D1D1D6; background: #fff; font: inherit; font-size: var(--t-body); padding: 0 16px; }
.err { color: var(--red); font-size: var(--t-sub); margin-top: 8px; }
.ic { width: 28px; height: 28px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; color: #fff; flex: none; }
.ic svg { width: 17px; height: 17px; }
.bar { height: 4px; border-radius: 2px; background: var(--press); overflow: hidden; width: 64px; display: inline-block; }
.bar i { display: block; height: 100%; background: var(--green); }
.orow { display: grid; grid-template-columns: 40px repeat(4, minmax(0, 1fr)); align-items: center; min-height: 44px; padding: 0 16px; width: 100%; text-align: center; font-variant-numeric: tabular-nums; }
.orow + .orow { border-top: .5px solid var(--line); }
.orow > :first-child { text-align: left; }
.orow sup { font-size: var(--t-cap); }
.logrow { padding: 12px 16px; }
.logrow + .logrow { border-top: .5px solid var(--line); }
textarea.export { width: 100%; height: 140px; border-radius: 12px; border: 1px solid #D1D1D6; padding: 12px; font: 12px/1.4 ui-monospace, Menlo, monospace; resize: vertical; background: #fff; color: var(--text); }
.banner { background: var(--amber-soft); color: var(--amber); border-radius: 12px; padding: 12px 16px; font-size: var(--t-sub); }

/* Tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(249, 249, 249, .94); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-top: .5px solid #C6C6C8; padding: 4px 0 calc(4px + env(safe-area-inset-bottom, 0px)); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; font-size: .59rem; color: #8A8A8E; }
.tab svg { width: 24px; height: 24px; }
.tab.on { color: var(--green); font-weight: 600; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; border-radius: 12px; padding: 12px 16px; font-size: var(--t-sub); z-index: 40; max-width: calc(100% - 32px); }

/* Scorecard photo check */
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); }
label.btn { cursor: pointer; flex-direction: row; }
.thumb { display: block; width: 100%; height: 160px; border-radius: 12px; overflow: hidden; margin-top: 16px; background: var(--press); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.choice { min-height: 48px; border-radius: 12px; background: var(--card); border: 1.5px solid var(--line); font-size: var(--t-body); text-align: center; font-variant-numeric: tabular-nums; }
.choice.on { border-color: var(--green); background: var(--green-soft); color: #155C2D; font-weight: 600; }
.full { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .92); display: flex; align-items: center; justify-content: center; overflow: auto; }
.full img { max-width: 100%; max-height: 100%; }
.full-close { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); right: 16px; color: #fff; }
.pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: 1px; }
@media (prefers-reduced-motion: no-preference) { .pulse { animation: pulse 1.1s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .2; } } }

/* ---------- Society ---------- */
.brand { display: flex; align-items: center; gap: 12px; padding-top: 16px; }
.badge { width: 48px; height: 48px; border-radius: 12px; background: var(--green); color: #fff; font-size: var(--t-cap); font-weight: 600; letter-spacing: .02em; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.two { display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: left; }
.foot { display: flex; justify-content: center; gap: 24px; margin-top: 16px; }
.prose { background: var(--card); border-radius: 12px; padding: 12px 16px; line-height: 1.4; }
.lrow.goy { grid-template-columns: 36px minmax(0, 1fr) auto 40px; width: 100%; text-align: left; }
button.lrow { width: 100%; text-align: left; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.tile { background: var(--card); border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hours { display: grid; grid-template-columns: repeat(5, 1fr); border-top: .5px solid var(--line); padding: 8px 16px; text-align: center; }
.hours > span { display: flex; flex-direction: column; gap: 2px; font-variant-numeric: tabular-nums; }
.link.inline { min-height: 0; display: inline; font-size: inherit; }
.link.sm { font-size: var(--t-sub); }
.loading { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }

/* Scorecard: golf marks, read like a paper card */
.sc-wrap { margin-top: 16px; padding: 8px 8px 4px; }
table.sc { border-collapse: collapse; width: 100%; font-size: var(--t-body); text-align: center; font-variant-numeric: tabular-nums; }
.sc th { font-size: var(--t-cap); font-weight: 600; color: var(--sub); padding: 4px 0; }
.sc td { height: 36px; padding: 0; }
.sc .hn { text-align: left; padding-left: 4px; font-size: var(--t-sub); color: var(--sub); white-space: nowrap; }
.sc .sd { font-size: 7px; letter-spacing: -1px; color: var(--text); vertical-align: 2px; }
.sc .par { color: var(--sub); font-size: var(--t-sub); }
.sc .pts { font-weight: 600; }
.sc .gap { width: 8px; }
.sc tr.tot td { border-top: 1px solid var(--text); font-weight: 600; height: 40px; }
.sc tr.tot .hn { color: var(--text); }
.mk { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; box-sizing: border-box; }
.mk.birdie { border: 1.5px solid var(--text); border-radius: 50%; }
.mk.eagle { border: 1.5px solid var(--text); border-radius: 50%; outline: 1.5px solid var(--text); outline-offset: 2px; }
.mk.bogey { border: 1.5px solid var(--text); }
.mk.double { border: 1.5px solid var(--text); outline: 1.5px solid var(--text); outline-offset: 2px; }
.mk.pu { color: var(--sub); }

/* Organiser forms */
.fld { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; min-width: 0; }
.fld label:empty { display: none; }
select.field { appearance: none; -webkit-appearance: none; background: #fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%236B6B70" stroke-width="2"><path d="M7 10l5 5 5-5"/></svg>') no-repeat right 12px center / 18px; padding-right: 36px; }
.field.area { min-height: 88px; padding: 12px 16px; line-height: 1.4; resize: vertical; }
.field.sm { min-height: 40px; padding: 0 8px; border-radius: 8px; text-align: center; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; }
.three-col { display: grid; grid-template-columns: 1fr 72px 72px; gap: 8px; align-items: end; }
.hole-row { display: grid; grid-template-columns: 32px 1fr 1fr 1fr; gap: 8px; align-items: center; margin-bottom: 6px; }
.hole-row.cols { margin-bottom: 4px; }
.row.picked { background: var(--green-soft); }
.chip { min-height: 36px; padding: 0 12px; border-radius: 18px; background: var(--fill); }
.chip.on { background: var(--green); color: #fff; }
.btn.dl { position: absolute; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 16px; right: 16px; width: auto; text-decoration: none; }
label.btn span, .btn > span { display: inline-block; }
.btn > svg + span { margin-left: 8px; }
button.btn:has(> svg) { flex-direction: row; }

.note.pills { display: flex; gap: 8px; flex-wrap: wrap; }


/* ---------- Look: pine hero bands, flag-yellow accent, lifted cards ---------- */
#app { padding-block-start: 0; }
.hero { margin: 0 -16px; padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 24px; background: linear-gradient(165deg, var(--pine-2), var(--pine) 70%); color: #fff; border-radius: 0 0 28px 28px; }
.hero .link, .hero .back-icon { color: #fff; }
.hero .title { color: #fff; font-size: 2.1rem; letter-spacing: -.02em; }
.hero .sub, .hero .cap, .hero .hsub { color: #BFD6C8; }
.hero .head-sub, .hero .sub { margin-top: 4px; display: block; }
.hero .pill.w { background: var(--flag); color: var(--pine); }
.hero .pill.g { background: rgba(255,255,255,.18); color: #fff; }
.hero.s { padding-bottom: 20px; }
.hero + .sec, .hero + .btn { margin-top: 20px; }
.hero .tiles { margin-top: 16px; }
.hero .tile { background: rgba(255,255,255,.12); color: #fff; }
.hero .tile .cap { color: #BFD6C8; }
.hero .bignum { color: #fff; }
.hero .tile.flag { background: var(--flag); color: var(--pine); }
.hero .tile.flag .cap, .hero .tile.flag .bignum { color: var(--pine); }
.brand { padding-top: 12px; }
.badge { width: 44px; height: 44px; border-radius: 12px; background: var(--flag); color: var(--pine); }
.badge svg { width: 26px; height: 26px; }
.wordmark { font-size: 1.35rem; font-weight: 700; letter-spacing: .01em; line-height: 1.1; }
.hsub { font-size: var(--t-sub); }
.lead { display: flex; flex-direction: column; gap: 2px; width: 100%; margin-top: 24px; text-align: left; }
.lead-name { font-size: 2.1rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.lead-pts { font-size: 4.4rem; font-weight: 800; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; color: var(--flag); margin-top: 4px; }
.lead-pts small { font-size: var(--t-sub); font-weight: 600; letter-spacing: 0; color: #BFD6C8; margin-left: 8px; }
.card { border-radius: 16px; box-shadow: var(--lift); }
.rcard { box-shadow: var(--lift); }
.sec-label { color: var(--pine); }
.sec-label .sub { color: var(--pine); font-weight: 700; font-size: var(--t-sub); }
.row, .lrow, .hrow, .grow, .mrow { min-height: 52px; }
.row.tall { min-height: 64px; }

  /** Nearest whole number, .5 rounded away from zero. */
  function roundHandicap(x) {
    const e = 1e-9;
    return x >= 0 ? Math.floor(x + 0.5 + e) : -Math.floor(-x + 0.5 + e);
  }

  /** Every step of the playing-handicap sum, so players can check it.
   *  WHS since April 2024: course handicap is kept unrounded, the allowance
   *  is applied, and the result is rounded once. */
  function handicapWorking(index, tee, allowance) {
    const slopePart = index * tee.slope / 113;
    const ratingPart = tee.rating - tee.par;
    const courseHandicap = slopePart + ratingPart;
    const beforeRounding = courseHandicap * allowance;
    return {
      index, slope: tee.slope, rating: tee.rating, par: tee.par, allowance,
      slopePart, ratingPart, courseHandicap, beforeRounding,
      playing: roundHandicap(beforeRounding)
    };
  }

  function playingHandicap(index, tee, allowance) {
    return handicapWorking(index, tee, allowance).playing;
  }

  function shotsOnHole(ph, si) {
    if (ph >= 0) return Math.floor(ph / 18) + (si <= ph % 18 ? 1 : 0);
    const plus = -ph;
    const back = Math.floor(plus / 18) + (si > 18 - (plus % 18) ? 1 : 0);
    return back === 0 ? 0 : -back;
  }

  /** A hole score is a whole number of strokes, or 'P' for picked up. */
  function isEntered(v) {

  }

  function stablefordPoints(gross, par, shots) {
    if (!isEntered(gross)) return null;
    if (gross === 'P') return 0;
    return Math.max(0, par + shots - gross + 2);
  }

  /** The strokes that make a pick-up worth nothing: the first score that earns 0 points. Display only; a pick-up still scores 0. */
  function pickupStrokes(par, shots) { return par + shots + 2; }

  /** What golfers call the gross score: Par, Bogey, Double... */
  function scoreName(gross, par) {
    if (gross === 'P') return 'Picked up';
    if (!isEntered(gross)) return '';
    if (gross === 1) return 'Hole in one';
    const d = gross - par;
    const names = { '-3': 'Albatross', '-2': 'Eagle', '-1': 'Birdie', '0': 'Par', '1': 'Bogey', '2': 'Double', '3': 'Triple' };

      const better = sorted.filter(o => sign * (o[key] - r[key]) < 0).length;
      const same = sorted.filter(o => o[key] === r[key]).length;
      return Object.assign({}, r, { pos: better + 1, posLabel: (same > 1 ? 'T' : '') + (better + 1), tied: same > 1 });
    });
  }

  /* ---------- A whole round ---------- */

  /**
   * input: {
   *   groups: [{ id, n, teeTime, startHole, teams: [[pid, pid], [pid, pid]] }],
   *   holes: [{ n, par, si }], tee: { slope, rating, par }, allowance,
   *   players: { pid: { name, index } }, scores: { pid: { hole: strokes | 'P' } },
   *   phOverride: { pid: playingHandicap }   // handicaps frozen when a round is finalised
   * }
   */
  function computeRound(input) {
    const { groups, holes, tee, allowance, players, scores, phOverride } = input;
    const holeBy = {};
    holes.forEach(h => { holeBy[h.n] = h; });
    const nameOf = id => (players[id] ? players[id].name : id);
    const byPlayer = {};

    groups.forEach(grp => grp.teams.flat().forEach(pid => {
      const p = players[pid];
      const ph = phOverride && phOverride[pid] !== undefined ? phOverride[pid] : playingHandicap(p.index, tee, allowance);
      const card = (scores && scores[pid]) || {};
      const rows = {};
      let total = 0, thru = 0, gross = 0;
      const pickups = [];
      ALL.forEach(n => {
        const h = holeBy[n];
        const shots = shotsOnHole(ph, h.si);
        const g = card[n];
        const points = stablefordPoints(g, h.par, shots);
        rows[n] = { gross: isEntered(g) ? g : null, shots, points };
        if (points !== null) {
          total += points; thru += 1;
          if (g === 'P') pickups.push(n); else gross += g;
        }
      });
      byPlayer[pid] = { id: pid, name: nameOf(pid), ph, holes: rows, total, thru, gross, pickups, groupId: grp.id };
    }));

    const groupOut = groups.map(grp => {
      const labels = grp.teams.map(t => teamLabels(t, nameOf));
      const order = playOrder(grp.startHole);
      const hs = {};
      order.forEach(n => {
        const pts = grp.teams.map(t => t.map(pid => byPlayer[pid].holes[n].points));
        const complete = pts.flat().every(v => v !== null);
        const entry = { n, complete, pts, best: null, counting: null, result: null, segLead: null, overallLead: null };
        if (complete) {
          entry.best = pts.map(a => Math.max(...a));
          entry.counting = grp.teams.map((t, i) => t.filter((pid, j) => pts[i][j] === entry.best[i]));
          entry.result = entry.best[0] > entry.best[1] ? 'A' : entry.best[1] > entry.best[0] ? 'B' : 'H';
        }
        hs[n] = entry;
      });
      const matches = {};
      Object.keys(SEGMENTS).forEach(seg => {
        const segOrder = order.filter(n => SEGMENTS[seg].includes(n));
        const prog = matchProgress(segOrder.map(n => hs[n].result));
        segOrder.forEach((n, i) => {
          if (seg === 'overall') hs[n].overallLead = prog.after[i];
          else hs[n].segLead = prog.after[i];
        });
        matches[seg] = Object.assign(prog, {
          order: segOrder,
          status: describeMatch(prog, labels, false),
          short: describeMatch(prog, labels, true),
          winner: matchWinner(prog)
        });
      });
      const done = order.filter(n => hs[n].complete).length;
      return {
        id: grp.id, n: grp.n, teeTime: grp.teeTime, startHole: grp.startHole || 1,
        teams: grp.teams, labels, order, holes: hs, matches,
        nextHole: order.find(n => !hs[n].complete) || null,
        holesDone: done, complete: done === 18
      };
    });

    const leaderboard = rankRows(Object.values(byPlayer).map(p => ({ id: p.id, name: p.name, total: p.total, thru: p.thru })), 'total', 'desc');

    const pairs = [];
    groupOut.forEach(go => go.teams.forEach((t, i) => pairs.push({
      groupId: go.id, team: t, label: go.labels[i].long,
      total: t.reduce((s, pid) => s + byPlayer[pid].total, 0),
      thru: Math.min(...t.map(pid => byPlayer[pid].thru))
    })));
    const ranked = rankRows(pairs, 'total', 'desc');
    const lowest = Math.min(...pairs.map(p => p.total));
    ranked.forEach(p => { p.lowest = p.total === lowest; });

    return { players: byPlayer, groups: groupOut, leaderboard, pairs: ranked };
  }

  /** Trip totals across rounds. All rounds count. */
  function tripStandings(roundResults, playerList) {
    const rows = playerList.map(p => {
      const per = roundResults.map(rr => (rr && rr.players[p.id] ? rr.players[p.id].total : null));
      const thru = roundResults.reduce((s, rr) => s + (rr && rr.players[p.id] ? rr.players[p.id].thru : 0), 0);
      return { id: p.id, name: p.name, per, thru, total: per.reduce((s, v) => s + (v || 0), 0) };
    });
    return rankRows(rows, 'total', 'desc');
  }

  /* ---------- Pairings and the draw ---------- */

  const pairKey = (a, b) => [a, b].sort().join('+');

  /** roundsGroups: [{ rid, groups }]. Returns { 'pat+dermot': ['r1', 'r2'] }. */
  function partnerHistory(roundsGroups) {
    const map = {};
    roundsGroups.forEach(({ rid, groups }) => (groups || []).forEach(g => g.teams.forEach(t => {
      if (t.length !== 2) return;
      const k = pairKey(t[0], t[1]);
      (map[k] = map[k] || []).push(rid);
    })));
    return map;
  }

  function repeatedPartners(roundsGroups) {
    const map = partnerHistory(roundsGroups);
    return Object.keys(map).filter(k => map[k].length > 1).map(k => ({ pair: k.split('+'), rounds: map[k] }));
  }

  /* ---------- Scorecard photo check ---------- */

  const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z]/g, '');

  /** Normalise one cell of a card reading: strokes, 'P' for a pick-up, or null if unreadable. */
  function cardValue(cell) {
    const v = cell && typeof cell === 'object' ? cell.value : cell;
    if (v === null || v === undefined || v === '') return null;
    if (typeof v === 'string') {
      const t = v.trim().toUpperCase();
      if (['P', 'X', '-', '–', '/', 'NR', 'NS'].includes(t)) return 'P';
      const n = Number(t);
      return Number.isInteger(n) && n >= 1 ? n : null;
    }
    return Number.isInteger(v) && v >= 1 ? v : null;
  }

  /**
   * Work out which card row (A, B, C, D) belongs to which player.
   * First by the names written in the key (accents and short forms allowed: "Derm" is Dermot),
   * then by whichever assignment agrees with the most scores already in the app.
   * cardPlayers: [{ letter, name, scores: { hole: cell } }]; players: [{ id, name }]; app: { pid: { hole: v } }.
   */
  function matchCardRows(cardPlayers, players, app) {
    const map = {};
    const used = new Set();
    cardPlayers.forEach(cp => {
      const n = fold(cp.name);
      if (n.length < 2) return;
      const hits = players.filter(p => !used.has(p.id) && (fold(p.name).startsWith(n) || n.startsWith(fold(p.name))));
      if (hits.length === 1) { map[cp.letter] = hits[0].id; used.add(hits[0].id); }
    });
    const rest = cardPlayers.filter(cp => !map[cp.letter]);
    const free = players.filter(p => !used.has(p.id));
    if (rest.length && free.length) {
      const agree = (cp, pid) => Object.keys(cp.scores || {}).filter(h => {
        const c = cardValue(cp.scores[h]);
        return c !== null && app[pid] && app[pid][h] === c;
      }).length;
      let best = null;
      const permute = (i, chosen, score) => {
        if (i === rest.length) { if (!best || score > best.score) best = { score, chosen: chosen.slice() }; return; }
        free.forEach(p => {
          if (chosen.includes(p.id)) return;
          chosen.push(p.id);
          permute(i + 1, chosen, score + agree(rest[i], p.id));
          chosen.pop();
        });
        if (rest.length > free.length) permute(i + 1, chosen.concat([null]), score);
      };
      permute(0, [], 0);
      if (best) rest.forEach((cp, i) => { if (best.chosen[i]) map[cp.letter] = best.chosen[i]; });
    }
    return map;
  }

  /**
   * Compare a card reading with the app for one nine.
   * Only differences need a person: the app never changes a score on its own.
   * A reading counts as unclear when the reader said so, or when it would be an
   * implausible score for the hole (more than par + 4), so a misread 4-as-9 is
   * shown as "please check", never as a confident difference.
   * Returns { checked, matched, issues: [{ hole, pid, card, app, kind: 'differs'|'unclear'|'unreadable', note }], unmatchedRows }.
   */
  function compareCard(reading, players, app, holes, segHoles) {
    const parOf = {};
    holes.forEach(h => { parOf[h.n] = h.par; });
    const map = matchCardRows(reading.players || [], players, app);
    const issues = [];
    let checked = 0, matched = 0;
    (reading.players || []).forEach(cp => {
      const pid = map[cp.letter];
      if (!pid) return;
      segHoles.forEach(h => {
        const appV = app[pid] ? app[pid][h] : undefined;
        if (appV === undefined || appV === null) return;
        checked += 1;
        const cell = (cp.scores || {})[h];
        const c = cardValue(cell);
        const low = cell && typeof cell === 'object' && cell.confidence === 'low';
        const note = cell && typeof cell === 'object' ? (cell.note || '') : '';
        if (c === null) { issues.push({ hole: h, pid, card: null, app: appV, kind: 'unreadable', note }); return; }
        if (c === appV) { matched += 1; return; }
        const implausible = Number.isInteger(c) && c > parOf[h] + 4;
        issues.push({ hole: h, pid, card: c, app: appV, kind: low || implausible ? 'unclear' : 'differs', note });
      });
    });
    issues.sort((a, b) => a.hole - b.hole);
    const unmatchedRows = (reading.players || []).filter(cp => !map[cp.letter]).map(cp => cp.letter);
    return { checked, matched, issues, map, unmatchedRows };
  }

  /** Split four players into two buggies. Prefers 1st & 4th v 2nd & 3rd,
   *  but avoids pairs who already shared a buggy when another split can. */
  function bestSplit(ids, history) {
    if (ids.length === 4) {
      const splits = [[[0, 3], [1, 2]], [[0, 2], [1, 3]], [[0, 1], [2, 3]]]
        .map(s => s.map(t => t.map(i => ids[i])));
      const repeats = s => s.filter(t => history[pairKey(t[0], t[1])]).length;
      return splits.reduce((best, s) => (repeats(s) < repeats(best) ? s : best), splits[0]);
    }
    return teamsFor(ids);
  }

  /** Buggies for a group of any size: 4 is two pairs, 3 is a pair and a single. */
  function teamsFor(ids) {
    if (ids.length >= 4) return [ids.slice(0, 2), ids.slice(2, 4)];
    if (ids.length === 3) return [ids.slice(0, 2), ids.slice(2)];
    if (ids.length === 2) return [[ids[0]], [ids[1]]];
    return [ids.slice()];
  }

  /** Group sizes for n players: fours, with threes where it does not divide. */
  function groupSizes(n) {
    if (n <= 0) return [];
    if (n <= 4) return [n];
    const g = Math.ceil(n / 4);
    const sizes = Array(g).fill(Math.floor(n / g));
    for (let i = 0; i < n % g; i++) sizes[i] += 1;
    return sizes.sort((a, b) => b - a);
  }

  /** "10:00" plus minutes, as "10:08". */
  function addMinutes(hhmm, mins) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || ''));
    if (!m) return '';
    const t = Number(m[1]) * 60 + Number(m[2]) + mins;
    return `${String(Math.floor(t / 60) % 24).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
  }

  function teeTimesFrom(first, interval, count) {
    return Array.from({ length: count }, (_, i) => addMinutes(first, i * (interval || 8)));
  }

  function makeGroups(orderedIds, teeTimes, history) {
    const sizes = groupSizes(orderedIds.length);
    const groups = [];
    let k = 0;
    sizes.forEach((size, i) => {
      const ids = orderedIds.slice(k, k + size);
      k += size;
      groups.push({ id: 'g' + (i + 1), n: i + 1, teeTime: (teeTimes || [])[i] || '', startHole: 1, teams: history ? bestSplit(ids, history) : teamsFor(ids) });
    });
    return groups;
  }

  function flagRepeats(groups, priorRoundsGroups) {
    const history = partnerHistory(priorRoundsGroups);
    const repeats = [];
    groups.forEach(g => g.teams.forEach(t => {
      if (t.length === 2 && history[pairKey(t[0], t[1])]) repeats.push({ pair: t, rounds: history[pairKey(t[0], t[1])] });
    }));
    return repeats;
  }

  /** Reverse-standings draw: lowest scores off first, leaders last.
   *  Within a group, buggies avoid repeated partners where possible. Repeats left are flagged, not hidden. */
  function proposeDraw(standings, priorRoundsGroups, teeTimes) {
    const history = partnerHistory(priorRoundsGroups);
    const worstFirst = standings.slice().reverse().map(r => r.id);
    const sizes = groupSizes(worstFirst.length);
    const groups = [];
    let k = 0;
    sizes.forEach((size, i) => {
      const bestFirst = worstFirst.slice(k, k + size).reverse();
      k += size;
      groups.push({ id: 'g' + (i + 1), n: i + 1, teeTime: (teeTimes || [])[i] || '', startHole: 1, teams: bestSplit(bestFirst, history) });
    });
    return { groups, repeats: flagRepeats(groups, priorRoundsGroups) };
  }

  /** A seeded shuffle, so a draw can be repeated in tests. */
  function shuffle(list, seed) {
    const a = list.slice();
    let s = (seed >>> 0) || 1;
    const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  function randomDraw(ids, teeTimes, seed, priorRoundsGroups) {
    const history = partnerHistory(priorRoundsGroups || []);
    const groups = makeGroups(shuffle(ids, seed), teeTimes, history);
    return { groups, repeats: flagRepeats(groups, priorRoundsGroups || []) };
  }

  /** KB pairs: partners always in different groups. */
  function kbPairsFor(groups, seed) {
    const groupOf = {};
    groups.forEach(g => g.teams.flat().forEach(pid => { groupOf[pid] = g.id; }));
    const ids = Object.keys(groupOf);
    for (let attempt = 0; attempt < 200; attempt++) {
      const pool = shuffle(ids, (seed || 1) + attempt * 7919);
      const pairs = [];
      let ok = true;
      while (pool.length > 1 && ok) {
        const a = pool.shift();
        const j = pool.findIndex(b => groupOf[b] !== groupOf[a]);
        if (j < 0) { ok = false; break; }
        pairs.push([a, pool.splice(j, 1)[0]]);
      }
      if (ok) return { pairs, spare: pool };
    }
    return { pairs: [], spare: ids };
  }

  /* ---------- Countback and season tables ---------- */

  /** Countback as the society uses it: back 9, back 6, back 3, then the 18th, 17th and backwards.
   *  points: { hole: points | null } on physical hole numbers. */
  function countbackKey(points) {
    const p = n => (points && points[n]) || 0;
    const sum = (a, b) => { let s = 0; for (let n = a; n <= b; n++) s += p(n); return s; };
    const key = [sum(10, 18), sum(13, 18), sum(16, 18)];
    for (let n = 18; n >= 1; n--) key.push(p(n));
    return key;
  }

  function compareKeys(a, b) {
    for (let i = 0; i < Math.max(a.length, b.length); i++) {
      const x = a[i] === undefined ? -1 : a[i];
      const y = b[i] === undefined ? -1 : b[i];
      if (x !== y) return y - x;
    }
    return 0;
  }

  /** Rank by total, then by key (best first). Only identical keys share a position. */
  function rankByKey(rows) {
    const sorted = rows.slice().sort((a, b) => (b.total - a.total) || compareKeys(a.key, b.key) || String(a.name || '').localeCompare(String(b.name || '')));
    return sorted.map((r, i) => {
      const same = sorted.filter(o => o.total === r.total && compareKeys(o.key, r.key) === 0);
      const pos = sorted.findIndex(o => o.total === r.total && compareKeys(o.key, r.key) === 0) + 1;
      const level = sorted.filter(o => o.total === r.total).length > 1;
      return Object.assign({}, r, { pos, posLabel: (same.length > 1 ? 'T' : '') + pos, tied: same.length > 1, countback: level && same.length === 1 });
    });
  }

  /** Final order for a round scored in the app: points, then countback. */
  function finalOrder(comp) {
    return rankByKey(Object.values(comp.players).map(p => ({
      id: p.id, name: p.name, total: p.total,
      key: countbackKey(Object.fromEntries(Object.entries(p.holes).map(([n, h]) => [n, h.points])))
    })));
  }

  /** KB pairs for a round scored in the app: both players' points added, then pair countback. */
  function kbStandings(comp, kbPairs) {
    const rows = (kbPairs || []).filter(pr => pr.every(pid => comp.players[pid])).map(pr => {
      const pts = {};
      for (let n = 1; n <= 18; n++) pts[n] = pr.reduce((s, pid) => s + (comp.players[pid].holes[n].points || 0), 0);
      return {
        pair: pr, name: pr.map(pid => comp.players[pid].name).join(' & '),
        total: pr.reduce((s, pid) => s + comp.players[pid].total, 0),
        thru: Math.min(...pr.map(pid => comp.players[pid].thru)),
        key: countbackKey(pts)
      };
    });
    return rankByKey(rows);
  }

  /** Golfer of the Year: best N scores count. Ties compare the counting scores best to worst,
   *  then the next best scores in turn. Only identical full records stay tied.
   *  results: [{ rid, scores: { pid: points } }]. */
  function goyStandings(members, results, bestN) {
    const n = bestN || 3;
    const rows = [];
    members.forEach(m => {
      const played = [];
      results.forEach(r => { if (r.scores[m.id] !== undefined && r.scores[m.id] !== null) played.push({ rid: r.rid, pts: r.scores[m.id] }); });
      if (!played.length) return;
      const sorted = played.slice().sort((a, b) => b.pts - a.pts);
      const counting = sorted.slice(0, n);
      rows.push({
        id: m.id, name: m.name, played: played.length,
        counting, countingRids: counting.map(c => c.rid),
        total: counting.reduce((s, c) => s + c.pts, 0),
        toBeat: counting.length < n ? 0 : counting[n - 1].pts,
        key: sorted.map(c => c.pts)
      });
    });
    return rankByKey(rows).map(r => Object.assign(r, { countback: false }));
  }

  /** How a gross score is marked on a card. */
  function scoreMark(gross, par) {
    if (gross === 'P') return 'pu';
    if (!isEntered(gross)) return '';
    const d = gross - par;
    if (d <= -2) return 'eagle';
    if (d === -1) return 'birdie';
    if (d === 0) return 'par';
    if (d === 1) return 'bogey';
    return 'double';
  }

  return {
    SEGMENTS, roundHandicap, handicapWorking, playingHandicap, shotsOnHole,
    isEntered, stablefordPoints, scoreName, metresToYards, playOrder, teamLabels,
    matchProgress, matchWinner, describeMatch, rankRows, computeRound, tripStandings,
    partnerHistory, repeatedPartners, proposeDraw, cardValue, matchCardRows, compareCard,
    teamsFor, groupSizes, addMinutes, teeTimesFrom, makeGroups, randomDraw, shuffle, kbPairsFor,
    countbackKey, compareKeys, rankByKey, finalOrder, kbStandings, goyStandings, scoreMark, pickupStrokes
  };
});
</script>
<script>/* NCGS data service.
 * One set of rules for every copy of the data: the Google Sheet behind the live app,
 * the in-browser copy used by the preview, and the in-memory copy used by the tests.
 * Every row carries a version number, so phones only fetch what changed since they last looked. */
var NCGS = (function () {
  'use strict';

  /* ---------- What is stored ---------- */
  var SCHEMA = {
    members: { key: ['id'], cols: { id: 's', name: 's', full: 's', index: 'n', active: 'b' } },
    courses: { key: ['id'], cols: { id: 's', name: 's', area: 's', about: 's', lat: 'n', lon: 'n', tees: 'j', holes: 'j' } },
    rounds: {
      key: ['id'],
      cols: {
        id: 's', season: 'n', seq: 'n', date: 's', name: 's', course: 's', tee: 's', first_tee: 's', interval: 'n',
        trip: 's', trip_day: 'n', status: 's', source: 's', groups: 'j', kb: 'j', contests: 'j', ph: 'j',
        allowance: 'n', results: 'j', note: 's'
      }
    },
    scores: { key: ['round', 'player', 'hole'], cols: { round: 's', player: 's', hole: 'n', strokes: 'v', by: 's', at: 's' } },
    claims: { key: ['round', 'hole', 'grp'], cols: { round: 's', hole: 'n', grp: 's', player: 's', at: 's' } },
    winners: { key: ['round', 'hole'], cols: { round: 's', hole: 'n', player: 's' } },
    checks: { key: ['round', 'grp', 'nine'], cols: { round: 's', grp: 's', nine: 's', data: 'j', photo: 's' } },
    cards: { key: ['round', 'grp'], cols: { round: 's', grp: 's', at: 's', by: 's', note: 's' } },
    log: { key: ['id'], cols: { id: 's', at: 's', by: 's', action: 's', detail: 's' } },
    settings: { key: ['key'], cols: { key: 's', value: 's' } },
    deleted: { key: ['tbl', 'k'], cols: { tbl: 's', k: 's' } }
  };
  var TABLES = Object.keys(SCHEMA);
  var PLAYER_TABLES = { checks: 1, cards: 1, log: 1 };
  var DEFAULT_PIN = '1234';

  function keyOf(table, row) {
    return SCHEMA[table].key.map(function (k) { return String(row[k]); }).join('|');
  }

  /* Cell text <-> value. Everything is kept as plain text in the sheet so Sheets never
     turns a tee time into a date or "P" into something else. */
  function toCell(type, v) {
    if (v === null || v === undefined) return '';
    if (type === 'j') return JSON.stringify(v);
    if (type === 'b') return v ? 'yes' : 'no';
    return String(v);
  }
  function fromCell(type, c) {
    if (c === '' || c === null || c === undefined) return type === 'b' ? false : null;
    if (Object.prototype.toString.call(c) === '[object Date]') c = Utilities.formatDate(c, 'Europe/Dublin', 'yyyy-MM-dd');
    var s = String(c);
    if (type === 'n') { var n = Number(s); return isFinite(n) ? n : null; }
    if (type === 'b') return /^(yes|true|1|y)$/i.test(s);
    if (type === 'j') { try { return JSON.parse(s); } catch (e) { return null; } }
    if (type === 'v') { if (/^p$/i.test(s)) return 'P'; var m = Number(s); return isFinite(m) && s.trim() !== '' ? m : s; }
    return s;
  }
  function clean(table, row) {
    var out = {};
    var cols = SCHEMA[table].cols;
    Object.keys(cols).forEach(function (c) { out[c] = row[c] === undefined ? null : row[c]; });
    out.ver = row.ver || 0;
    return out;
  }

  /* ---------- Storage: in memory (preview, tests) ---------- */
  function memoryStore(initial, onChange) {
    var data = initial && initial.tables ? JSON.parse(JSON.stringify(initial)) : { tables: {}, ver: 0, pin: DEFAULT_PIN, photos: {} };
    TABLES.forEach(function (t) { data.tables[t] = data.tables[t] || []; });
    data.photos = data.photos || {};
    function save() { if (onChange) onChange(data); }
    return {
      kind: 'memory',
      read: function (t) { return data.tables[t].map(function (r) { return JSON.parse(JSON.stringify(r)); }); },
      upsert: function (t, rows) {
        var idx = {};
        data.tables[t].forEach(function (r, i) { idx[keyOf(t, r)] = i; });
        rows.forEach(function (r) {
          var k = keyOf(t, r);
          var row = JSON.parse(JSON.stringify(r));
          if (idx[k] !== undefined) data.tables[t][idx[k]] = row;
          else { idx[k] = data.tables[t].length; data.tables[t].push(row); }
        });
        save();
      },
      remove: function (t, keys) {
        var drop = {};
        keys.forEach(function (k) { drop[k] = 1; });
        data.tables[t] = data.tables[t].filter(function (r) { return !drop[keyOf(t, r)]; });
        save();
      },
      getVer: function () { return data.ver; },
      setVer: function (v) { data.ver = v; save(); },
      getPin: function () { return data.pin || DEFAULT_PIN; },
      setPin: function (p) { data.pin = p; save(); },
      putPhoto: function (dataUrl) { var id = 'ph' + (Object.keys(data.photos).length + 1) + '-' + Date.now(); data.photos[id] = dataUrl; save(); return id; },
      getPhoto: function (id) { return data.photos[id] || null; },
      lock: function (fn) { return fn(); },
      cacheGet: function () { return null; },
      cachePut: function () {},
      fetchJson: null,
      dump: function () { return data; }
    };
  }

  /* ---------- Storage: Google Sheet (the live app) ---------- */
  function sheetStore(ss, props, cache, lockSvc, folder) {
    var sheets = {};
    function sheet(t) {
      if (sheets[t]) return sheets[t];
      var sh = ss.getSheetByName(t);
      var head = Object.keys(SCHEMA[t].cols).concat(['ver']);
      if (!sh) {
        sh = ss.insertSheet(t);
        sh.getRange(1, 1, 1, head.length).setValues([head]).setFontWeight('bold');
        sh.setFrozenRows(1);
        sh.getRange(1, 1, sh.getMaxRows(), head.length).setNumberFormat('@');
      }
      sheets[t] = sh;
      return sh;
    }
    function head(t) { return Object.keys(SCHEMA[t].cols).concat(['ver']); }
    function readRaw(t) {
      var sh = sheet(t);
      var last = sh.getLastRow();
      if (last < 2) return [];
      return sh.getRange(2, 1, last - 1, head(t).length).getValues();
    }
    function toRow(t, vals) {
      var cols = SCHEMA[t].cols;
      var o = {};
      head(t).forEach(function (c, i) { o[c] = c === 'ver' ? (Number(vals[i]) || 0) : fromCell(cols[c], vals[i]); });
      return o;
    }
    function toVals(t, row) {
      var cols = SCHEMA[t].cols;
      return head(t).map(function (c) { return c === 'ver' ? String(row.ver || 0) : toCell(cols[c], row[c]); });
    }
    return {
      kind: 'sheet',
      read: function (t) {
        return readRaw(t).filter(function (v) { return v.join('') !== ''; }).map(function (v) { return toRow(t, v); });
      },
      upsert: function (t, rows) {
        if (!rows.length) return;
        var sh = sheet(t);
        var raw = readRaw(t);
        var idx = {};
        raw.forEach(function (v, i) { idx[keyOf(t, toRow(t, v))] = i; });
        var fresh = [];
        rows.forEach(function (r) {
          var k = keyOf(t, r);
          if (idx[k] !== undefined) sh.getRange(idx[k] + 2, 1, 1, head(t).length).setNumberFormat('@').setValues([toVals(t, r)]);
          else { idx[k] = raw.length + fresh.length; fresh.push(toVals(t, r)); }
        });
        if (fresh.length) {
          var start = Math.max(sh.getLastRow(), 1) + 1;
          var need = start + fresh.length - 1 - sh.getMaxRows();
          if (need > 0) sh.insertRowsAfter(sh.getMaxRows(), need + 200);
          sh.getRange(start, 1, fresh.length, head(t).length).setNumberFormat('@').setValues(fresh);
        }
      },
      remove: function (t, keys) {
        var sh = sheet(t);
        var raw = readRaw(t);
        var drop = {};
        keys.forEach(function (k) { drop[k] = 1; });
        for (var i = raw.length - 1; i >= 0; i--) if (drop[keyOf(t, toRow(t, raw[i]))]) sh.deleteRow(i + 2);
      },
      getVer: function () { return Number(props.getProperty('VER') || 0); },
      setVer: function (v) { props.setProperty('VER', String(v)); cache.put('VER', String(v), 21600); },
      getPin: function () { return props.getProperty('PIN') || DEFAULT_PIN; },
      setPin: function (p) { props.setProperty('PIN', String(p)); },
      putPhoto: function (dataUrl) {
        var m = /^data:([^;]+);base64,(.*)$/.exec(dataUrl);
        var blob = Utilities.newBlob(Utilities.base64Decode(m[2]), m[1], 'card-' + Date.now() + '.jpg');
        return folder().createFile(blob).getId();
      },
      getPhoto: function (id) {
        var b = DriveApp.getFileById(id).getBlob();
        return 'data:' + b.getContentType() + ';base64,' + Utilities.base64Encode(b.getBytes());
      },
      lock: function (fn) {
        var l = lockSvc.getScriptLock();
        l.waitLock(20000);
        try { return fn(); } finally { l.releaseLock(); }
      },
      cacheGet: function (k) { return cache.get(k); },
      cachePut: function (k, v, s) { try { cache.put(k, v, s || 600); } catch (e) { /* too big to cache */ } },
      fetchJson: function (url) { return JSON.parse(UrlFetchApp.fetch(url, { muteHttpExceptions: true }).getContentText()); }
    };
  }

  /* ---------- The service ---------- */
  function createServer(store, opts) {
    opts = opts || {};
    var now = opts.now || function () { return new Date().toISOString(); };

    function err(code, message) { var e = new Error(message || code); e.code = code; return e; }
    // The new version is only published (commit) after its rows are written, so a poll never skips them.
    function bump() { return store.getVer() + 1; }
    function commit(v) { store.setVer(v); return v; }
    function pinOk(pin) { return pin !== undefined && pin !== null && String(pin) === String(store.getPin()); }
    function stamp(t, rows, v) { return rows.map(function (r) { var c = clean(t, r); c.ver = v; return c; }); }
    function logRow(v, by, action, detail) {
      return { id: 'L' + v + '-' + Math.random().toString(36).slice(2, 7), at: now(), by: by || '', action: action, detail: detail || '' };
    }
    function find(t, pred) { var rows = store.read(t); for (var i = 0; i < rows.length; i++) if (pred(rows[i])) return rows[i]; return null; }

    var ops = {};

    ops.load = function () {
      var tables = {};
      TABLES.forEach(function (t) { tables[t] = store.read(t); });
      return { ver: store.getVer(), tables: tables };
    };

    ops.since = function (req) {
      var v = Number(req.v || 0);
      var cached = store.cacheGet('VER');
      var cur = cached !== null && cached !== undefined ? Number(cached) : store.getVer();
      if (v >= cur) return { ver: cur, same: true };
      var tables = {};
      TABLES.forEach(function (t) {
        var rows = store.read(t).filter(function (r) { return (r.ver || 0) > v; });
        if (rows.length) tables[t] = rows;
      });
      return { ver: cur, tables: tables };
    };

    ops.checkPin = function (req) { return { ok: pinOk(req.pin) }; };

    ops.setPin = function (req) {
      if (!pinOk(req.pin)) throw err('pin', 'That PIN did not match.');
      if (!/^\d{4,8}$/.test(String(req.newPin || ''))) throw err('bad', 'Use 4 to 8 digits.');
      return store.lock(function () {
        store.setPin(String(req.newPin));
        var v = bump();
        store.upsert('log', stamp('log', [logRow(v, 'Organiser', 'Organiser PIN changed', '')], v));
        commit(v);
        return { ok: true, ver: v };
      });
    };

    /* One hole for one group. A score that another phone changed since this phone last saw it
       is not overwritten: it comes back as a conflict for a person to decide. */
    ops.saveHole = function (req) {
      return store.lock(function () {
        var round = find('rounds', function (r) { return r.id === req.round; });
        if (!round) throw err('missing', 'That round no longer exists.');
        var org = pinOk(req.pin);
        if (round.status === 'final') throw err('final', 'This round is final.');
        var starting = round.status === 'upcoming' && round.groups && round.groups.length;
        if (round.status !== 'live' && !starting) throw err('notlive', 'This round has not started.');
        var hole = Number(req.hole);
        var existing = {};
        store.read('scores').forEach(function (s) { if (s.round === req.round && s.hole === hole) existing[s.player] = s.strokes; });
        var conflicts = [];
        var rows = [];
        var clears = [];
        var changes = [];
        Object.keys(req.scores || {}).forEach(function (pid) {
          var want = req.scores[pid].v;
          var base = req.scores[pid].base;
          var cur = existing[pid] === undefined ? null : existing[pid];
          if (cur === want) return;
          if (base !== undefined && cur !== (base === undefined ? null : base) && !req.force) {
            conflicts.push({ player: pid, server: cur, mine: want });
            return;
          }
          if (cur !== null) changes.push({ player: pid, from: cur, to: want === null ? 'cleared' : want });
          if (want === null) clears.push(keyOf('scores', { round: req.round, player: pid, hole: hole }));
          else rows.push({ round: req.round, player: pid, hole: hole, strokes: want, by: req.by || '', at: now() });
        });
        var claimRows = [];
        var claimRemove = [];
        if (req.claim !== undefined) {
          var curClaim = find('claims', function (c) { return c.round === req.round && c.hole === hole && c.grp === req.grp; });
          var wantClaim = req.claim || null;
          if ((curClaim ? curClaim.player : null) !== wantClaim) {
            if (wantClaim) claimRows.push({ round: req.round, hole: hole, grp: req.grp, player: wantClaim, at: now() });
            else if (curClaim) claimRemove.push(keyOf('claims', curClaim));
          }
        }
        if (!rows.length && !clears.length && !claimRows.length && !claimRemove.length) {
          return { ok: true, ver: store.getVer(), conflicts: conflicts, changed: 0 };
        }
        var v = bump();
        if (starting) {
          round.status = 'live';
          store.upsert('rounds', stamp('rounds', [round], v));
          store.upsert('log', stamp('log', [logRow(v, req.by, 'Round started', 'First score saved')], v));
        }
        store.upsert('scores', stamp('scores', rows, v));
        if (clears.length) {
          store.remove('scores', clears);
          store.upsert('deleted', stamp('deleted', clears.map(function (k) { return { tbl: 'scores', k: k }; }), v));
        }
        if (claimRows.length) store.upsert('claims', stamp('claims', claimRows, v));
        if (claimRemove.length) {
          store.remove('claims', claimRemove);
          store.upsert('deleted', stamp('deleted', claimRemove.map(function (k) { return { tbl: 'claims', k: k }; }), v));
        }
        if (changes.length) {
          var names = req.names || {};
          var detail = (req.label || ('Hole ' + hole)) + ': ' + changes.map(function (c) {
            return (names[c.player] || c.player) + ' ' + (c.from === 'P' ? 'picked up' : c.from) + ' → ' + (c.to === 'P' ? 'picked up' : c.to);
          }).join(', ');
          store.upsert('log', stamp('log', [logRow(v, req.by, org ? 'Score corrected' : 'Score changed', detail)], v));
        }
        commit(v);
        return { ok: true, ver: v, conflicts: conflicts, changed: rows.length + clears.length };
      });
    };

    /* Organiser changes (and the few things players may write: card checks, submitted cards, log). */
    ops.put = function (req) {
      var t = req.table;
      if (!SCHEMA[t] || t === 'deleted') throw err('bad', 'Unknown table');
      if (!PLAYER_TABLES[t] && !pinOk(req.pin)) throw err('pin', 'Organiser PIN needed.');
      return store.lock(function () {
        var v = bump();
        store.upsert(t, stamp(t, req.rows || [], v));
        if (req.log) store.upsert('log', stamp('log', [logRow(v, req.log.by || 'Organiser', req.log.action, req.log.detail)], v));
        commit(v);
        return { ok: true, ver: v };
      });
    };

    ops.remove = function (req) {
      var t = req.table;
      if (!SCHEMA[t] || t === 'deleted' || t === 'log') throw err('bad', 'Unknown table');
      if (!pinOk(req.pin)) throw err('pin', 'Organiser PIN needed.');
      return store.lock(function () {
        var v = bump();
        var keys = (req.rows || []).map(function (r) { return keyOf(t, r); });
        store.remove(t, keys);
        store.upsert('deleted', stamp('deleted', keys.map(function (k) { return { tbl: t, k: k }; }), v));
        if (t === 'rounds') {
          // a deleted round takes its scores, claims, winners, checks and cards with it
          ['scores', 'claims', 'winners', 'checks', 'cards'].forEach(function (dt) {
            var gone = store.read(dt).filter(function (r) { return keys.indexOf(String(r.round)) >= 0; }).map(function (r) { return keyOf(dt, r); });
            if (gone.length) {
              store.remove(dt, gone);
              store.upsert('deleted', stamp('deleted', gone.map(function (k) { return { tbl: dt, k: k }; }), v));
            }
          });
        }
        if (req.log) store.upsert('log', stamp('log', [logRow(v, req.log.by || 'Organiser', req.log.action, req.log.detail)], v));
        commit(v);
        return { ok: true, ver: v };
      });
    };

    ops.photoPut = function (req) {
      if (!/^data:image\/(jpeg|png);base64,/.test(String(req.dataUrl || ''))) throw err('bad', 'Not a photo');
      if (String(req.dataUrl).length > 3000000) throw err('bad', 'Photo too large');
      return { id: store.putPhoto(req.dataUrl) };
    };
    ops.photoGet = function (req) { return { dataUrl: store.getPhoto(String(req.id)) }; };

    /* Forecast for a course on a day, from Open-Meteo (free, no key). Cached for an hour. */
    ops.weather = function (req) {
      if (!store.fetchJson) return { days: null };
      var lat = Number(req.lat), lon = Number(req.lon);
      if (!isFinite(lat) || !isFinite(lon)) return { days: null };
      var ck = 'wx:' + lat.toFixed(3) + ',' + lon.toFixed(3);
      var hit = store.cacheGet(ck);
      if (hit) return JSON.parse(hit);
      var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
        '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max' +
        '&hourly=temperature_2m,weather_code,precipitation_probability,wind_speed_10m&wind_speed_unit=kmh&timezone=auto&forecast_days=10';
      var j = store.fetchJson(url);
      var out = { days: j && j.daily ? j.daily : null, hours: j && j.hourly ? j.hourly : null, at: now() };
      store.cachePut(ck, JSON.stringify(out), 3600);
      return out;
    };

    /* Fill an empty store with the society's starting data. */
    ops.seed = function (req) {
      return store.lock(function () {
        var empty = store.read('members').length === 0 && store.read('rounds').length === 0;
        if (!empty && !req.force) return { ok: false, reason: 'not empty' };
        var v = bump();
        TABLES.forEach(function (t) {
          var rows = (req.data && req.data[t]) || [];
          if (rows.length) store.upsert(t, stamp(t, rows, v));
        });
        store.upsert('log', stamp('log', [logRow(v, 'Setup', 'Data loaded', req.note || 'Starting data')], v));
        commit(v);
        return { ok: true, ver: v };
      });
    };

    function api(req) {
      var fn = ops[req && req.op];
      if (!fn) return { error: 'bad', message: 'Unknown request' };
      try { return fn(req); } catch (e) { return { error: e.code || 'server', message: String(e.message || e) }; }
    }
    return { api: api, ops: ops };
  }

  /* ---------- Google Apps Script entry ---------- */
  function appsScript(seed) {
    var props = PropertiesService.getScriptProperties();
    function folder() {
      var id = props.getProperty('PHOTOS');
      if (id) { try { return DriveApp.getFolderById(id); } catch (e) { /* recreate below */ } }
      var f = DriveApp.createFolder('NCGS card photos');
      props.setProperty('PHOTOS', f.getId());
      return f;
    }
    function spreadsheet() {
      var id = props.getProperty('SHEET');
      if (id) return SpreadsheetApp.openById(id);
      var ss = SpreadsheetApp.create('NCGS data');
      props.setProperty('SHEET', ss.getId());
      return ss;
    }
    function server() {
      var ss = spreadsheet();
      return createServer(sheetStore(ss, props, CacheService.getScriptCache(), LockService, folder));
    }
    function json(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
    function ensureReady() {
      if (!seed || props.getProperty('READY')) return;
      var lock = LockService.getScriptLock();
      lock.waitLock(30000);
      try {
        if (!props.getProperty('READY')) { api.setup(); props.setProperty('READY', '1'); }
      } finally { lock.releaseLock(); }
    }
    var api = {
      http: function (e) {
        ensureReady();
        var req = {};
        try {
          if (e && e.postData && e.postData.contents) req = JSON.parse(e.postData.contents);
          else if (e && e.parameter && e.parameter.q) req = JSON.parse(e.parameter.q);
        } catch (x) { return json({ error: 'bad', message: 'Unreadable request' }); }
        if (!req.op) return json({ ok: true, app: 'NCGS', ver: Number(props.getProperty('VER') || 0) });
        return json(server().api(req));
      },
      setup: function () {
        var ss = spreadsheet();
        var s = server();
        TABLES.forEach(function (t) { sheetStore(ss, props, CacheService.getScriptCache(), LockService, folder).read(t); });
        var first = ss.getSheetByName('Sheet1');
        if (first && ss.getSheets().length > 1) ss.deleteSheet(first);
        var r = seed ? s.api({ op: 'seed', data: seed, note: 'NCGS 2026 season from Marbella_2026_Final_Workbook.xlsx' }) : { ok: true };
        return { sheet: ss.getUrl(), seeded: r };
      }
    };
    return api;
  }

  var api = { SCHEMA: SCHEMA, TABLES: TABLES, keyOf: keyOf, memoryStore: memoryStore, sheetStore: sheetStore, createServer: createServer, appsScript: appsScript, toCell: toCell, fromCell: fromCell };
  if (typeof module === 'object' && module.exports) module.exports = api;
  return api;
})();

const chev = `<span class="chev">${ICON.chev}</span>`;

const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

/* ---- 10-data.js ---- */
/* ---------- Data: one shared copy, kept on every phone ----------
   The phone keeps the last copy it saw, so the app opens instantly and works without signal.
   Changes are applied on the phone at once and queued; the queue is sent when there is signal,
   and never dropped until the server has it. Other phones' changes arrive every few seconds. */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
};
const NS = BOOT.mode === 'live' ? 'ncgs' : 'ncgs-preview';
const KEY = { cache: NS + '-cache-v1', outbox: NS + '-outbox-v1', prefs: NS + '-prefs-v1', local: NS + '-server-v1' };
const TABLES = NCGS.TABLES;

const DB = {
  server: LS.get(KEY.cache, null) || { ver: 0, tables: {} },
  outbox: LS.get(KEY.outbox, []),
  prefs: Object.assign({ me: null, drafts: {} }, LS.get(KEY.prefs, {})),
  conflicts: [],
  online: true,
  loaded: false,
  lastSync: 0,
  saveOk: true,
  _view: null,
  _memo: {}
};
TABLES.forEach(t => { DB.server.tables[t] = DB.server.tables[t] || []; });
DB.loaded = DB.server.ver > 0;

const FAILED = {};
function persist(k, v) { const ok = LS.set(KEY[k], v); if (ok) delete FAILED[k]; else FAILED[k] = 1; DB.saveOk = !Object.keys(FAILED).length; return ok; }
function savePrefs() { persist('prefs', DB.prefs); }
function saveOutbox() { persist('outbox', DB.outbox); }
function saveCache() { LS.set(KEY.cache, DB.server); }

/* ----- Talking to the server ----- */
function localServer() {
  let data = LS.get(KEY.local, null);
  const store = NCGS.memoryStore(data, d => LS.set(KEY.local, d));
  const srv = NCGS.createServer(store);
  if (!data) {
    srv.api({ op: 'seed', data: window.NCGS_SEED, note: 'NCGS 2026 season from Marbella_2026_Final_Workbook.xlsx' });
    if (window.NCGS_DEMO) srv.api({ op: 'put', table: 'rounds', rows: window.NCGS_DEMO.rounds, pin: store.getPin(), log: { action: 'Demo round added', detail: 'Preview only' } });
    if (window.NCGS_DEMO) srv.api({ op: 'put', table: 'claims', rows: window.NCGS_DEMO.claims, pin: store.getPin() });
    if (window.NCGS_DEMO) window.NCGS_DEMO.holes.forEach(h => srv.api(h));
  }
  return srv;
}
function call(req) {
  if (BOOT.mode === 'live') {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 25000);
    return fetch(BOOT.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req), redirect: 'follow', cache: 'no-store', signal: ctl.signal })
      .then(r => { if (!r.ok) throw Object.assign(new Error('http ' + r.status), { net: true }); return r.json(); })
      .catch(e => { if (e && e.net === undefined) e.net = true; throw e; })
      .finally(() => clearTimeout(timer));
  }
  return new Promise(res => setTimeout(() => res(clone(localServer().api(clone(req)))), 60));
}

/* ----- The phone's view: the server copy plus anything still waiting to be sent ----- */
function rowKey(t, r) { return NCGS.keyOf(t, r); }
function upsertRows(tables, t, rows) {
  const list = tables[t];
  const idx = {};
  list.forEach((r, i) => { idx[rowKey(t, r)] = i; });
  rows.forEach(r => { const k = rowKey(t, r); if (idx[k] !== undefined) list[idx[k]] = Object.assign({}, list[idx[k]], r); else { idx[k] = list.length; list.push(r); } });
}
function removeKeys(tables, t, keys) {
  const drop = new Set(keys);
  tables[t] = tables[t].filter(r => !drop.has(rowKey(t, r)));
}
function applyLocal(tables, req) {
  if (req.op === 'saveHole') {
    const pids = Object.keys(req.scores || {});
    const rows = pids.filter(pid => req.scores[pid].v !== null).map(pid => ({ round: req.round, player: pid, hole: Number(req.hole), strokes: req.scores[pid].v, by: req.by, at: '' }));
    removeKeys(tables, 'scores', pids.filter(pid => req.scores[pid].v === null).map(pid => rowKey('scores', { round: req.round, player: pid, hole: Number(req.hole) })));
    upsertRows(tables, 'scores', rows);
    if (req.claim !== undefined) {
      const k = rowKey('claims', { round: req.round, hole: Number(req.hole), grp: req.grp });
      removeKeys(tables, 'claims', [k]);
      if (req.claim) upsertRows(tables, 'claims', [{ round: req.round, hole: Number(req.hole), grp: req.grp, player: req.claim, at: new Date().toISOString() }]);
    }
    const r = tables.rounds.find(x => x.id === req.round);
    if (r && r.status === 'upcoming') r.status = 'live';
  } else if (req.op === 'put') {
    upsertRows(tables, req.table, req.rows);
  } else if (req.op === 'remove') {
    const keys = req.rows.map(r => rowKey(req.table, r));
    removeKeys(tables, req.table, keys);
    if (req.table === 'rounds') ['scores', 'claims', 'winners', 'checks', 'cards'].forEach(t => { tables[t] = tables[t].filter(r => !keys.includes(String(r.round))); });
  }
}
function view() {
  if (DB._view) return DB._view;
  const t = clone(DB.server.tables);
  DB.outbox.forEach(item => applyLocal(t, item.req));
  DB._view = t;
  DB._memo = {};
  return t;
}
function changed() { DB._view = null; DB._memo = {}; }
function memo(key, fn) { view(); if (!(key in DB._memo)) DB._memo[key] = fn(); return DB._memo[key]; }

function merge(resp, full) {
  if (!resp || resp.same) { if (resp) DB.server.ver = resp.ver; return false; }
  if (full) {
    TABLES.forEach(t => { resp.tables[t] = resp.tables[t] || []; });
    DB.server.tables = resp.tables; DB.server.ver = resp.ver; saveCache(); changed(); return true;
  }
  // Deletions first, and never remove a row that was re-created after the deletion.
  (resp.tables.deleted || []).forEach(d => {
    if (DB.server.tables[d.tbl]) DB.server.tables[d.tbl] = DB.server.tables[d.tbl].filter(r => rowKey(d.tbl, r) !== d.k || (r.ver || 0) > (d.ver || 0));
  });
  Object.keys(resp.tables || {}).forEach(t => {
    if (t === 'deleted') return;
    const fresh = resp.tables[t].filter(r => !(resp.tables.deleted || []).some(d => d.tbl === t && d.k === rowKey(t, r) && (d.ver || 0) > (r.ver || 0)));
    upsertRows(DB.server.tables, t, fresh);
  });
  DB.server.ver = resp.ver;
  saveCache();
  changed();
  return true;
}

let syncing = null;
function sync() {
  if (syncing) return syncing;
  const full = !DB.server.ver;
  const req = full ? { op: 'load' } : { op: 'since', v: DB.server.ver };
  syncing = call(req).then(resp => {
    syncing = null;
    if (resp.error) { DB.online = true; return; }
    DB.online = true;
    DB.lastSync = Date.now();
    const was = DB.loaded;
    DB.loaded = true;
    if (merge(resp, full) || !was) render();
  }).catch(() => { syncing = null; DB.online = false; DB.lastSync = Date.now(); render(); });
  return syncing;
}

let flushing = false;
let retryTimer = null;
/* Errors that mean "try again later" (server busy, lock timeout) keep the change queued.
   Errors that mean "never" (round finalised or deleted, bad PIN) move it to a kept list so it is not lost silently. */
const RETRY_ERRORS = { server: 1 };
function reject(item, resp) {
  DB.prefs.rejected = (DB.prefs.rejected || []).concat([{ req: item.req, error: resp.error, message: resp.message || '', at: new Date().toISOString() }]).slice(-50);
  savePrefs();
}
async function flush() {
  if (flushing || !DB.outbox.length) return;
  flushing = true;
  let sent = 0;
  try {
    while (DB.outbox.length) {
      const item = DB.outbox[0];
      let resp;
      try { resp = await call(item.req); } catch (e) { resp = null; }
      if (!resp || (resp.error && RETRY_ERRORS[resp.error])) {
        DB.online = !!resp;
        item.tries = (item.tries || 0) + 1;
        clearTimeout(retryTimer);
        retryTimer = setTimeout(flush, Math.min(30000, 4000 * (1 + item.tries)));
        break;
      }
      DB.online = true;
      DB.outbox.shift();
      saveOutbox();
      sent += 1;
      if (resp.error) {
        if (resp.error !== 'pin') reject(item, resp);
        toast(resp.error === 'pin' ? 'Organiser PIN needed for that' : resp.error === 'final' ? 'That round is final, so that score was not saved' : resp.message || 'That change was not saved');
      } else if (resp.conflicts && resp.conflicts.length) {
        resp.conflicts.forEach(c => DB.conflicts.push({ round: item.req.round, grp: item.req.grp, hole: Number(item.req.hole), player: c.player, server: c.server, mine: c.mine }));
        tick();
      }
      try { if (item.done) item.done(resp); } catch (e) { /* a screen callback must not stop the queue */ }
    }
  } finally {
    flushing = false;
    changed();
  }
  if (sent) { await sync(); render(); }
}

function send(req, done) {
  DB.outbox.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 6), req, done });
  saveOutbox();
  changed();
  flush();
}
/* Organiser writes carry the PIN typed this session. */
const ORGPIN = { pin: null };
function put(table, rows, log) { send({ op: 'put', table, rows, pin: ORGPIN.pin, log }); }
function removeRows(table, rows, log) { send({ op: 'remove', table, rows, pin: ORGPIN.pin, log }); }

/* ----- Reading the data ----- */
const D = {
  members: () => memo('members', () => view().members.slice().sort((a, b) => a.name.localeCompare(b.name))),
  active: () => D.members().filter(m => m.active !== false),
  member: id => view().members.find(m => m.id === id) || null,
  nameOf: id => (D.member(id) || { name: id || '' }).name,
  courses: () => view().courses.slice().sort((a, b) => a.name.localeCompare(b.name)),
  course: id => view().courses.find(c => c.id === id) || null,
  rounds: () => memo('rounds', () => view().rounds.slice().sort((a, b) => (a.season || 0) - (b.season || 0) || (a.seq || 0) - (b.seq || 0) || String(a.date || '').localeCompare(String(b.date || '')))),
  round: id => view().rounds.find(r => r.id === id) || null,
  setting: (k, d) => { const s = view().settings.find(x => x.key === k); return s && s.value !== null && s.value !== '' ? s.value : d; },
  scores: rid => memo('sc:' + rid, () => {
    const out = {};
    view().scores.forEach(s => { if (s.round === rid) (out[s.player] = out[s.player] || {})[s.hole] = s.strokes; });
    return out;
  }),
  claims: rid => memo('cl:' + rid, () => {
    const out = {};
    view().claims.filter(c => c.round === rid).sort((a, b) => String(a.at).localeCompare(String(b.at)))
      .forEach(c => (out[c.hole] = out[c.hole] || []).push({ pid: c.player, gid: c.grp, at: c.at }));
    return out;
  }),
  winners: rid => memo('wn:' + rid, () => Object.fromEntries(view().winners.filter(w => w.round === rid).map(w => [w.hole, w.player]))),
  check: (rid, gid, nine) => { const c = view().checks.find(x => x.round === rid && x.grp === gid && x.nine === nine); return c ? Object.assign({}, c.data || {}, { photo: c.photo }) : null; },
  card: (rid, gid) => view().cards.find(x => x.round === rid && x.grp === gid) || null,
  log: () => view().log.slice().sort((a, b) => String(b.at).localeCompare(String(a.at))),
  society: () => D.setting('society', 'NCGS'),
  goyBest: () => Number(D.setting('goy_best', 3)) || 3,
  allowance: () => { const a = Number(D.setting('allowance', 1)); return isFinite(a) && a > 0 ? a : 1; }
};

/* ----- Rounds ----- */
const isDemo = r => r && r.source === 'demo';
const courseOf = r => (r ? D.course(r.course) : null);
function teeOf(r) {
  const c = courseOf(r);
  if (!c || !c.tees || !r.tee || !c.tees[r.tee]) return null;
  const t = Object.assign({}, c.tees[r.tee]);
  if (c.holes && c.holes.length === 18) t.par = c.holes.reduce((s, h) => s + h.par, 0);
  return t;
}
function holesOf(r) {
  const c = courseOf(r);
  return c && c.holes && c.holes.length === 18 ? c.holes.map(h => Object.assign({}, h, { yards: h.m ? E.metresToYards(h.m) : null })) : null;
}
const canScore = r => !!(r && holesOf(r) && teeOf(r) && r.groups && r.groups.length);
const allowanceOf = r => (r && r.allowance ? r.allowance : D.allowance());
const roundName = r => r.name || (courseOf(r) || {}).name || 'Round';
function roundWhen(r) {
  const bits = [];
  if (r.date) bits.push(fmtDate(r.date));
  if (r.trip) bits.push(`${r.trip}${r.trip_day ? ' day ' + r.trip_day : ''}`);
  return bits.join(' · ');
}
function roundWhenShort(r) {
  const bits = [];
  if (r.trip) bits.push(r.trip);
  if (r.date) bits.push(fmtDate(r.date, true));
  return bits.join(' · ');
}
function computeR(rid) {
  return memo('comp:' + rid, () => {
    const r = D.round(rid);
    if (!canScore(r)) return null;
    const players = {};
    r.groups.forEach(g => g.teams.flat().forEach(pid => { const m = D.member(pid) || { id: pid, name: pid, index: 0 }; players[pid] = m; }));
    return E.computeRound({ groups: r.groups, holes: holesOf(r), tee: teeOf(r), allowance: allowanceOf(r), players, scores: D.scores(rid), phOverride: r.ph });
  });
}
const hasCards = r => r && r.source !== 'imported' && canScore(r);
const liveRid = () => { const r = D.rounds().find(x => x.status === 'live'); return r ? r.id : null; };
const upcoming = () => D.rounds().filter(r => r.status === 'upcoming').sort((a, b) => String(a.date || '9').localeCompare(String(b.date || '9')));
function myGroup(rid) {
  const r = D.round(rid);
  return r && r.groups ? r.groups.find(g => g.teams.flat().includes(DB.prefs.me)) || null : null;
}
function groupNo(rid, gid) { const r = D.round(rid); const g = r && r.groups ? r.groups.find(x => x.id === gid) : null; return g ? g.n : '?'; }
function contestOn(rid, n) { const r = D.round(rid); return ((r && r.contests) || []).find(c => c.hole === n) || null; }
function claimLeader(rid, n, exceptGid) {
  const list = (D.claims(rid)[n] || []).filter(c => c.gid !== exceptGid);
  return list.length ? list[list.length - 1] : null;
}

/* Results for any finished round. Imported rounds keep the order they came with. */
function resultsOf(rid) {
  return memo('res:' + rid, () => {
    const r = D.round(rid);
    if (!r) return null;
    if (r.source === 'imported' && r.results) {
      const order = r.results.order || [];
      let rows;
      if (r.results.ordered) rows = order.map(([id, total], i) => ({ id, name: D.nameOf(id), total, pos: i + 1, posLabel: String(i + 1) }));
      else rows = E.rankRows(order.map(([id, total]) => ({ id, name: D.nameOf(id), total })), 'total', 'desc');
      const kb = (r.results.kb || []).map(([a, b, total], i) => ({ pair: [a, b], name: `${D.nameOf(a)} & ${D.nameOf(b)}`, total, posLabel: String(i + 1) }));
      const c = r.results.contests || {};
      const contests = [];
      if (c.ntp !== undefined) contests.push({ type: 'ntp', hole: null, winner: c.ntp });
      if (c.ld !== undefined) contests.push({ type: 'ld', hole: null, winner: c.ld });
      return { rows, kb, contests, source: r.results.ordered ? 'recorded' : 'sheet' };
    }
    const comp = computeR(rid);
    if (!comp) return { rows: [], kb: [], contests: [] };
    const final = r.status === 'final';
    const rows = final ? E.finalOrder(comp) : comp.leaderboard;
    const kb = r.kb && r.kb.length ? E.kbStandings(comp, r.kb) : [];
    const wins = D.winners(rid);
    const contests = (r.contests || []).map(c => ({ type: c.type, hole: c.hole, winner: wins[c.hole] || null, lead: wins[c.hole] ? null : claimLeader(rid, c.hole, null) }));
    return { rows, kb, contests, comp, source: 'app' };
