/* ----- A round ----- */
const WX = { 0: 'Clear', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Cloudy', 45: 'Fog', 48: 'Fog', 51: 'Drizzle', 53: 'Drizzle', 55: 'Drizzle', 56: 'Freezing drizzle', 57: 'Freezing drizzle', 61: 'Light rain', 63: 'Rain', 65: 'Heavy rain', 66: 'Freezing rain', 67: 'Freezing rain', 71: 'Light snow', 73: 'Snow', 75: 'Heavy snow', 77: 'Snow', 80: 'Showers', 81: 'Showers', 82: 'Heavy showers', 85: 'Snow showers', 86: 'Snow showers', 95: 'Thunderstorms', 96: 'Thunderstorms', 99: 'Thunderstorms' };
/* Weather: one picture per kind of weather, drawn here so it works offline and always matches the app. */
function wxKind(code) {
  const c = Number(code);
  if (c === 0) return 'sun';
  if (c === 1 || c === 2) return 'part';
  if (c === 3) return 'cloud';
  if (c === 45 || c === 48) return 'fog';
  if (c >= 51 && c <= 57) return 'drizzle';
  if ((c >= 61 && c <= 67) || (c >= 80 && c <= 82)) return 'rain';
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return 'snow';
  if (c >= 95) return 'storm';
  return 'cloud';
}
function wxIcon(kind, size) {
  const sun = (x, y, r, rays) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#FFD23F"/>${rays ? [0, 45, 90, 135, 180, 225, 270, 315].map(a => `<line x1="${x}" y1="${y - r - 3}" x2="${x}" y2="${y - r - 7}" stroke="#FFD23F" stroke-width="3" stroke-linecap="round" transform="rotate(${a} ${x} ${y})"/>`).join('') : ''}`;
  const cloud = (fill, dx, dy) => `<path transform="translate(${dx || 0} ${dy || 0})" d="M14 36h21a8.5 8.5 0 0 0 1-16.9A11 11 0 0 0 15 21.5 7.3 7.3 0 0 0 14 36z" fill="${fill || '#fff'}"/>`;
  const drops = (n, col) => [17, 25, 33].slice(0, n).map(x => `<line x1="${x}" y1="39" x2="${x - 2}" y2="45" stroke="${col || '#8FD0FF'}" stroke-width="3" stroke-linecap="round"/>`).join('');
  let g = '';
  if (kind === 'sun') g = sun(24, 24, 9, true);
  else if (kind === 'part') g = sun(18, 17, 7, true) + cloud('#fff', 2, 2);
  else if (kind === 'cloud') g = cloud('#fff', 0, -2);
  else if (kind === 'fog') g = cloud('#E3EAF2', 0, -4) + [38, 43].map((y, i) => `<line x1="${11 + i * 3}" y1="${y}" x2="${37 - i * 3}" y2="${y}" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`).join('');
  else if (kind === 'drizzle') g = cloud('#EEF3F9', 0, -4) + drops(2, '#B7E1FF');
  else if (kind === 'rain') g = cloud('#DCE6F2', 0, -4) + drops(3);
  else if (kind === 'snow') g = cloud('#F4F8FC', 0, -4) + [[17, 41], [25, 44], [33, 41]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.4" fill="#fff"/>`).join('');
  else if (kind === 'storm') g = cloud('#B9C4D3', 0, -5) + '<path d="M26 28l-7 11h5l-2 9 10-13h-6l3-7z" fill="#FFD23F"/>';
  return `<svg class="wxi" viewBox="0 0 48 48" width="${size}" height="${size}" aria-hidden="true">${g}</svg>`;
}
/* One plain sentence about the day, from the numbers only. */
function wxLine(kind, rain, wind) {
  if (kind === 'storm') return 'Thunder about. Keep an eye on it before you go out.';
  if (kind === 'snow') return 'Snow about. Check the course is open.';
  const wet = rain >= 60 ? 'A wet one: waterproofs.' : rain >= 30 ? 'Showers possible: bring a waterproof.' : 'Looks dry.';
  const wind2 = wind >= 40 ? ' Very windy.' : wind >= 25 ? ' Breezy.' : wind >= 12 ? ' A light breeze.' : ' Hardly any wind.';
  return wet + wind2;
}
/* Fetch the forecast. The first call to the server can be slow, so one quiet retry before giving up. */
function wxFetch(c, attempt) {
  const keep = () => UI.wx[c.id] && UI.wx[c.id].state === 'done' && UI.wx[c.id].data && UI.wx[c.id].data.days;
  const fail = () => {
    if (attempt < 2) { setTimeout(() => wxFetch(c, attempt + 1), 2000); return; }
    if (!keep()) UI.wx[c.id] = { state: 'failed' };
    render();
  };
  call({ op: 'weather', lat: c.lat, lon: c.lon }, 15000).then(res => {
    if (!(res && res.days)) { fail(); return; }
    UI.wx[c.id] = { state: 'done', data: res };
    const m = LS.get('ncgs-wx', {}) || {}; m[c.id] = { at: Date.now(), data: res }; LS.set('ncgs-wx', m);
    render();
  }).catch(fail);
}
function forecast(r) {
  const c = courseOf(r);
  const away = daysFromToday(r.date);
  if (!c || c.lat === null || c.lon === null || c.lat === undefined || away === null || away < 0 || away > 9) return '';
  /* The last forecast is kept on the phone, so it shows at once; a fresh one is fetched in the background when it is getting old. */
  if (!UI.wx[c.id]) {
    const saved = (LS.get('ncgs-wx', {}) || {})[c.id];
    const age = saved ? Date.now() - saved.at : Infinity;
    if (saved && saved.data && saved.data.days && age < 3 * 3600e3) { UI.wx[c.id] = { state: 'done', data: saved.data }; if (age > 30 * 60e3) wxFetch(c, 1); }
    else { UI.wx[c.id] = { state: 'loading' }; wxFetch(c, 1); }
  }
  const st = UI.wx[c.id];
  if (st.state === 'loading') return sec(label('Forecast'), '<div class="wx wx-skel" aria-busy="true"><div class="wx-top"><span class="sk sk-ic"></span><div class="wx-main"><span class="sk sk-a"></span><span class="sk sk-b"></span></div></div><p class="wx-line">Getting the forecast…</p></div>');
  if (st.state === 'failed') return sec(label('Forecast'), `<button class="wx wx-fail" data-act="wx-retry" data-cid="${c.id}"><span class="wx-name">Forecast not available right now</span><span class="wx-line">Tap to try again</span></button>`);
  if (st.state !== 'done' || !st.data || !st.data.days) return '';
  const d = st.data.days;
  const i = d.time.indexOf(r.date);
  if (i < 0) return '';
  const kind = wxKind(d.weather_code[i]);
  const rain = Number(d.precipitation_probability_max[i]) || 0, wind = Math.round(Number(d.wind_speed_10m_max[i]) || 0);
  let hours = '';
  const h = st.data.hours;
  const start = Number(String(r.first_tee || '10:00').split(':')[0]);
  if (h && h.time) {
    const cells = [];
    for (let k = 0; k < 5; k++) {
      const stamp = `${r.date}T${String(start + k).padStart(2, '0')}:00`;
      const j = h.time.indexOf(stamp);
      if (j >= 0) {
        const pr = h.precipitation_probability[j];
        cells.push(`<span><span class="wx-t">${String(start + k).padStart(2, '0')}:00</span>${wxIcon(wxKind(h.weather_code ? h.weather_code[j] : d.weather_code[i]), 30)}<span class="wx-d">${Math.round(h.temperature_2m[j])}°</span><span class="wx-r">${pr !== null && pr !== undefined ? pr + '%' : ''}</span></span>`);
      }
    }
    if (cells.length) hours = `<div class="wx-hours" aria-label="Hour by hour from the first tee time">${cells.join('')}</div>`;
  }
  return sec(label('Forecast'), `<div class="wx wx-${kind}">
    <div class="wx-top">${wxIcon(kind, 72)}<div class="wx-main"><div class="wx-name">${WX[d.weather_code[i]] || 'Mixed'}</div><div class="wx-temp">${Math.round(d.temperature_2m_max[i])}°<span> ${Math.round(d.temperature_2m_min[i])}°</span></div></div></div>
    <div class="wx-chips"><span class="wx-chip"><b>${rain}%</b> chance of rain</span><span class="wx-chip"><b>${wind}</b> km/h wind</span></div>
    <p class="wx-line">${wxLine(kind, rain, wind)}</p>${hours}</div>`);
}

function groupsBlock(r, interactive) {
  if (!r.groups || !r.groups.length) return sec(label('Groups'), cardOf('<div class="row"><span class="sub">To be drawn</span></div>'));
  const comp = computeR(r.id);
  const tee = teeOf(r);
  const phOf = pid => (r.ph && r.ph[pid] !== undefined ? r.ph[pid] : comp ? comp.players[pid].ph : tee && D.member(pid) ? E.playingHandicap(D.member(pid).index, tee, allowanceOf(r)) : null);
  const prow = g => g.teams.map((t, i) => t.map(pid => {
    const ph = phOf(pid);
    const m = D.member(pid);
    const can = interactive && tee && m;
    return `<${can ? 'button' : 'div'} class="hrow"${can ? ` data-act="hcp" data-pid="${pid}" data-rid="${r.id}"` : ''}>
      <span class="nm">${g.teams.length > 1 ? dot(i) : ''}<span class="${pid === DB.prefs.me ? 'b' : ''}">${esc(D.nameOf(pid))}</span></span>
      <span class="r sub">${m && r.status !== 'final' ? fmtIndex(m.index) : ''}</span><span class="r b">${ph === null ? '' : ph}</span>${can ? chev : '<span></span>'}</${can ? 'button' : 'div'}>`;
  }).join('')).join('');
  const cols = `<div class="hrow cols"><span></span><span class="r cap">${r.status !== 'final' ? 'Index' : ''}</span><span class="r cap">Playing</span><span></span></div>`;
  const mine = r.status !== 'final' ? myGroup(r.id) : null;
  let html = '';
  if (mine) {
    html += sec(`<span class="bignum">${esc(mine.teeTime || r.first_tee || '')}</span><span class="sub">Group ${mine.n}</span>`, cardOf(cols + prow(mine)) +
      (tee ? `<p class="cap note">${esc(tee.name)} tees · Slope ${tee.slope} · Rating ${tee.rating} · Par ${tee.par} · ${Math.round(allowanceOf(r) * 100)}%</p>` : ''));
  }
  const others = r.groups.filter(g => !mine || g.id !== mine.id);
  const live = r.status === 'live' ? computeR(r.id) : null;
  html += sec(label(mine ? 'Other groups' : 'Groups'), cardOf(others.map(g => {
    const key = r.id + g.id;
    const open = !!UI.open[key];
    const gc = live ? live.groups.find(x => x.id === g.id) : null;
    const prog = gc ? `<span class="cap">${gc.complete ? 'Finished' : gc.holesDone ? 'Thru ' + gc.holesDone : ''}</span>` : '';
    return `<button class="grow" data-act="toggle" data-key="${key}" aria-expanded="${open}"><span class="b num">${esc(g.teeTime || '')}</span>
      <span class="teams">${g.teams.map((t, i) => `<span>${g.teams.length > 1 ? dot(i) : ''}${esc(t.map(D.nameOf).join(' & '))}</span>`).join('')}${prog}</span>${chev}</button>${open ? cols + prow(g) : ''}`;
  }).join('')));
  return html;
}

/* A leaderboard row that drops the player's card down underneath it when tapped. */
function dropRow(rid, x, inner, cls = 'lrow') {
  const r = D.round(rid), comp = computeR(rid), pl = comp && comp.players[x.id];

  const key = `bd-${rid}-${x.id}`, open = !!UI.open[key];
  const mine = myGroup(rid);

  return `<button class="${cls} drop${open ? ' open' : ''}" data-act="toggle" data-key="${key}" aria-expanded="${open}">${inner}</button>${open ? `<div class="dropcard">${cardParts(r, pl, fix, x.id).table}${fix ? '<p class="cap sc-note">Tap a score to change it</p>' : ''}</div>` : ''}`;
}
const dropChev = `<span class="chev dn">${chev}</span>`;

function resultsBlock(r) {

    return app ? dropRow(r.id, x, inner) : `<button class="lrow" data-act="player" data-pid="${x.id}">${inner}</button>`;

  if (res.kb.length) {

      )).join('<div style="height:8px"></div>'));

VIEWS.round = p => {
  const r = D.round(p.rid);
  if (!r) return { html: `${navBack(D.society())}<div class="head"><h1 class="title">Round not found</h1></div>` };
  const c = courseOf(r);
  const tee = teeOf(r);
  const holes = holesOf(r);
  const inPlay = UI.stack.some(e => ['tee', 'match', 'board', 'rules'].includes(e.v));
  const prev = UI.stack[UI.stack.length - 2];
  let html = '<header class="hero s">' + navBack(prev && prev.v === 'tee' ? `Hole ${UI.hole || ''}`.trim() : prev && prev.v === 'player' ? D.nameOf(prev.p.pid) : prev && prev.v === 'card' ? 'Card' : D.society());
  html += `<div class="head"><h1 class="title">${esc(roundName(r))}</h1>${statusPill(r)}</div>`;
  const when = roundWhen(r);
  if (when) html += `<p class="sub">${esc(when)}</p>`;
  const meta = [];
  if (tee) meta.push(`${tee.name} tees`, `Par ${tee.par}`);
  if (holes && holes.every(h => h.m)) meta.push(`${holes.reduce((s, h) => s + h.m, 0).toLocaleString('en-IE')} m`);
  if (r.status !== 'final' && r.first_tee) meta.push(`First tee ${r.first_tee}`);
  if (meta.length) html += `<p class="sub">${esc(meta.join(' · '))}</p>`;
  html += '</header>';

  if (r.status === 'final') {
    html += resultsBlock(r);
    if (r.groups && r.groups.length) html += groupsBlock(r, false);
    if (r.source !== 'imported' || (resultsOf(r.id) || { rows: [] }).rows.length) html += `<button class="btn quiet" data-act="results" data-rid="${r.id}">Share results</button>`;
    return { html };
  }
  html += forecast(r);
  if (c && c.about) html += sec(label('The course'), `<p class="prose">${esc(c.about)}</p>`);
  html += groupsBlock(r, true);
  if (r.kb && r.kb.length) html += sec(label('KBs'), cardOf(r.kb.map(pr => `<div class="row"><span>${esc(pr.map(D.nameOf).join(' & '))}</span></div>`).join('')));
  const mine = myGroup(r.id);
  const playable = canScore(r) && (r.status === 'live' || (r.status === 'upcoming' && (!r.date || daysFromToday(r.date) <= 0)));
  if (playable) {
    if (!DB.prefs.me || !mine) html += `<button class="btn" data-act="play" data-rid="${r.id}">Play now</button>`;
    else {
      const gc = computeR(r.id).groups.find(g => g.id === mine.id);
      html += `<button class="btn" data-act="play" data-rid="${r.id}">${inPlay || gc.holesDone ? (gc.nextHole ? `Hole ${gc.nextHole}` : 'Group card') : 'Play now'}</button>`;
    }
    if (DB.prefs.me && !mine) html += `<p class="cap" style="text-align:center;margin-top:8px">${esc(D.nameOf(DB.prefs.me))} is not in a group · <button class="link sm" data-act="who">Change</button></p>`;
  }
  if (r.status === 'live') html += `<button class="btn quiet" data-act="leaderboard" data-rid="${r.id}">Leaderboard</button>`;
  return { html };
};

/* ----- Stats: one golfer, and the whole society ----- */
const fmt1 = v => v === null || v === undefined ? '–' : (Math.round(v * 10) / 10).toLocaleString('en-IE', { minimumFractionDigits: Number.isInteger(Math.round(v * 10) / 10) ? 0 : 1 });
function scoreChart(entries, avg) {
  const W = 340, H = 168, padL = 28, padB = 24, padT = 24, n = entries.length;
  const max = Math.max(36, ...entries.map(e => e.total)), step = n > 1 ? (W - padL) / n : W - padL, bw = Math.min(34, step * 0.62);
  const y = v => padT + (H - padT - padB) * (1 - v / max);
  const bars = entries.map((e, i) => {
    const x = padL + step * i + (step - bw) / 2;
    return `<rect class="cbar${e.total === Math.max(...entries.map(z => z.total)) ? ' top' : ''}" x="${x.toFixed(1)}" y="${y(e.total).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H - padB - y(e.total)).toFixed(1)}" rx="4"/><text class="v" x="${(x + bw / 2).toFixed(1)}" y="${(y(e.total) - 4).toFixed(1)}" text-anchor="middle">${e.total}</text><text class="l" x="${(x + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(shortRound(e))}</text>`;
  }).join('');
  const grid = [0, 18, 36].filter(v => v <= max).map(v => `<line class="g" x1="${padL}" x2="${W}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="a" x="${padL - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${v}</text>`).join('');
  const aveLine = avg === null ? '' : `<line class="avg" x1="${padL}" x2="${W}" y1="${y(avg).toFixed(1)}" y2="${y(avg).toFixed(1)}"/>`;

/* ----- A player's card for one round ----- */
function markCell(gross, par, shots) {
  if (gross === null || gross === undefined) return '<span class="mk"></span>';
  // A pick-up shows the strokes that net no points, so the card still adds up.
  if (gross === 'P') return `<span class="mk pu" title="Picked up">${E.pickupStrokes(par, shots || 0)}<sup>p</sup></span>`;
  return `<span class="mk ${E.scoreMark(gross, par)}">${gross}</span>`;
}
function markKey() {
  const k = (c, t, l) => `<span class="ski"><span class="mk ${c}">${t}</span>${l}</span>`;
  return `<div class="sckey" aria-label="Key to the marks">${k('birdie', '3', 'Birdie')}${k('eagle', '2', 'Eagle')}${k('bogey', '5', 'Bogey')}${k('double', '6', 'Double or worse')}<span class="ski"><span class="sd">●</span>You get a shot</span></div>`;
}
function cardParts(r, pl, fix, pid) {
  const holes = holesOf(r);
  const half = hs => {
    // Running total of the strokes entered so far, the same way points run. A pick-up counts as the strokes that net 0 points.
    const g = hs.map(h => { const hp = pl.holes[h.n]; return hp.gross === 'P' ? E.pickupStrokes(h.par, hp.shots || 0) : hp.gross; }).filter(v => typeof v === 'number');
    const grossTot = g.length ? g.reduce((s, v) => s + v, 0) : '–';
    const pts = hs.reduce((s, h) => s + (pl.holes[h.n].points || 0), 0);
    return { grossTot, pts, par: hs.reduce((s, h) => s + h.par, 0) };
  };
  const front = holes.slice(0, 9), backNine = holes.slice(9);
  const F = half(front), B = half(backNine);
  const line = (a, b) => {
    const cell = h => {
      const hp = pl.holes[h.n];
      return `<td class="hn">${h.n}${hp.shots ? ` <span class="sd">${hp.shots > 0 ? '●'.repeat(hp.shots) : '○'.repeat(-hp.shots)}</span>` : ''}</td><td class="par">${h.par}</td><td>${fix && hp.gross !== null && hp.gross !== undefined ? `<button class="fixcell" data-act="fix-hole" data-rid="${r.id}" data-pid="${pid}" data-n="${h.n}" aria-label="Change hole ${h.n}">${markCell(hp.gross, h.par, hp.shots)}</button>` : markCell(hp.gross, h.par, hp.shots)}</td><td class="pts">${hp.points === null ? '' : `<span class="pp p${Math.min(hp.points, 4)}">${hp.points}</span>`}</td>`;
    };
    return `<tr>${cell(a)}<td class="gap"></td>${cell(b)}</tr>`;
  };
  const table = `<table class="sc"><thead><tr><th class="hn">Hole</th><th>Par</th><th>Score</th><th>Pts</th><th class="gap"></th><th class="hn">Hole</th><th>Par</th><th>Score</th><th>Pts</th></tr></thead>
    <tbody>${front.map((h, i) => line(h, backNine[i])).join('')}
    <tr class="tot"><td class="hn">Out</td><td>${F.par}</td><td>${F.grossTot}</td><td>${F.pts}</td><td class="gap"></td><td class="hn">In</td><td>${B.par}</td><td>${B.grossTot}</td><td>${B.pts}</td></tr></tbody></table>`;
  return { F, B, table };
}

/* The Hole tab goes straight to entering the scores for the next hole. Anything that needs attention (a card photo to check,

VIEWS.tee = () => {
  const rid = playRid();

  const t = UI.teeHole, dr = ((DB.prefs.drafts[rid] || {})[g.id] || {})[t];

function needsAttention(rid, gc, gid) {

/* ----- Score entry (also used by the organiser to correct a hole) ----- */
function entryCtx() {
  if (UI.org) { const p = cur().p; return { rid: p.rid, gid: p.gid, n: p.n, mode: 'org', edit: true, dkey: 'org-' + p.gid }; }
  const rid = playRid();
  const g = myGroup(rid);
  return { rid, gid: g.id, n: UI.hole, mode: 'player', edit: UI.edit, dkey: g.id };
}
function draftsFor(ctx) {
  const byRound = DB.prefs.drafts[ctx.rid] || (DB.prefs.drafts[ctx.rid] = {});
  return byRound[ctx.dkey] || (byRound[ctx.dkey] = {});
}
function ensureDraft(ctx) {
  const byGroup = draftsFor(ctx);
  if (!byGroup[ctx.n]) {
    const d = {};
    const gc = computeR(ctx.rid).groups.find(x => x.id === ctx.gid);
    if (ctx.edit) {
      gc.teams.flat().forEach(pid => {
        const v = (D.scores(ctx.rid)[pid] || {})[ctx.n];
        if (E.isEntered(v)) d[pid] = v;
      });
    }
    const mine = (D.claims(ctx.rid)[ctx.n] || []).find(c => c.gid === ctx.gid);
    if (mine) d._claim = mine.pid;
    d._base = Object.fromEntries(gc.teams.flat().map(pid => { const v = (D.scores(ctx.rid)[pid] || {})[ctx.n]; return [pid, v === undefined ? null : v]; }));
    byGroup[ctx.n] = d;
  }
  return byGroup[ctx.n];
}
function clearDraft(ctx) { const byGroup = draftsFor(ctx); delete byGroup[ctx.n]; }

function entryRow(pid, val, shots, par, rid) {
  const name = esc(D.nameOf(pid));
  const dkey = `bd-${rid}-${pid}`, dopen = !!UI.open[dkey];
  const dcomp = computeR(rid), dpl = dcomp && dcomp.players[pid];
  const puN = E.pickupStrokes(par, shots);
  const flash = UI.flash && !E.isEntered(val) ? ' flash' : '';
  const num = Number.isInteger(val);
  const pts = val === 'P' ? 0 : num ? E.stablefordPoints(val, par, shots) : null;
  const scratch = pts === 0;
  const shown = val === 'P' ? puN : val;
  const word = scratch ? 'Scratch' : num ? E.scoreName(val, par) : '';
  // The first tap on either button lands on par, then the buttons move one stroke at a time. Reaching 0 points is a pick-up, and + stops there.
  const base = Number.isInteger(shown) ? shown : null;
  const up = base === null ? par : (base + 1 >= puN ? 'P' : base + 1), down = base === null ? par : Math.max(1, base - 1);
  const atOne = base !== null && base <= 1;
  const mid = base === null
    ? `<div class="stv none" data-pid="${pid}" data-n="" aria-live="polite">Par ${par}</div>`
    : `<button class="stv${scratch ? ' out' : ''}" data-act="clear" data-pid="${pid}" data-n="${base}" aria-label="${name}: ${base} strokes. Tap to clear and start again from par"><b>${base}<sup>${pts}</sup></b><small>${word}</small></button>`;
  return `<div class="pr${flash}">
    <div class="pr-top"><button class="nm drop${dopen ? ' open' : ''}" data-act="toggle" data-key="${dkey}" aria-expanded="${dopen}"><span>${name}</span>${dpl ? dropChev : ''}</button></div>
    <div class="pr-dots" aria-label="${shots} ${shots === 1 ? 'shot' : 'shots'}">${dots(shots, true)}</div>
    ${dopen && dpl ? `<div class="dropcard in">${cardParts(D.round(rid), dpl, D.round(rid).status === 'live' && !!myGroup(rid) && myGroup(rid).teams.flat().includes(pid), pid).table}<p class="cap sc-note">Tap a score to change it</p></div>` : ''}
    <div class="stepper" role="group" aria-label="Strokes for ${name}">
      <button class="st" data-act="set" data-dir="down" data-pid="${pid}" data-v="${down}" aria-label="One fewer stroke for ${name}"${atOne ? ' disabled' : ''}>\u2212</button>
      ${mid}
      <button class="st" data-act="set" data-dir="up" data-pid="${pid}" data-v="${up}" aria-label="One more stroke for ${name}"${scratch ? ' disabled' : ''}>+</button>
      <button class="pu ${scratch ? 'on' : ''}" data-act="set" data-pid="${pid}" data-v="P" aria-pressed="${scratch}">Pick up</button>
    </div></div>`;
}

  if (clash.length) html += `<div class="banner" style="margin-top:12px">Another phone saved ${clash.map(c => `${esc(D.nameOf(c.player))} ${fmtGross(c.server)}`).join(', ')}</div>`;
  html += gc.teams.map((t, i) => sec(buggies ? pill(i) : '', cardOf(t.map(pid => entryRow(pid, d[pid], comp.players[pid].holes[ctx.n].shots, h.par, ctx.rid)).join('')))).join('');
  const contest = contestOn(ctx.rid, ctx.n);
  if (contest) {
    const lead = claimLeader(ctx.rid, ctx.n, ctx.gid);
    const right = d._claim ? `<span class="b">${esc(D.nameOf(d._claim))}</span>` : `<span class="sub">${lead ? `${esc(D.nameOf(lead.pid))} leads` : 'Add'}</span>`;
    html += sec('', `<button class="card row" data-act="contest-open"><span>${CONTEST[contest.type]}</span><span class="right">${right}${chev}</span></button>`);
  }
  if (ctx.mode === 'player' && !ctx.edit) html += needsAttention(ctx.rid, gc, ctx.gid);
  const who = missing.length && missing.length <= 2 ? ' · ' + missing.map(D.nameOf).join(', ') : '';
  const lbl = missing.length ? `${plural(missing.length, 'score')} to go${esc(who)}` : ctx.mode === 'org' ? 'Save correction' : ctx.edit ? 'Save changes' : `Save hole ${ctx.n}`;
  html += `<div class="savebar"><button class="btn ${missing.length ? 'quiet' : ''}" data-act="save">${lbl}</button></div></div>`;
  if (UI.contestSheet && contest) {
    const lead = claimLeader(ctx.rid, ctx.n, ctx.gid);
    const tickMark = `<span class="c-g">${sized(ICON.check, 20)}</span>`;
    html += `<div class="scrim" data-act="contest-scrim"><div class="sheet" role="dialog" aria-label="${CONTEST[contest.type]}">
      <div class="nav"><span class="b">${CONTEST[contest.type]}</span><button class="link" data-act="contest-close">Done</button></div>
      ${lead ? `<p class="sub" style="margin-bottom:8px">${esc(D.nameOf(lead.pid))} (group ${groupNo(ctx.rid, lead.gid)}) leads</p>` : ''}
      ${cardOf(pids.map(pid => `<button class="row" data-act="claim" data-pid="${pid}"><span>${esc(D.nameOf(pid))}</span>${d._claim === pid ? tickMark : ''}</button>`).join('') +
        `<button class="row" data-act="claim" data-pid=""><span>${lead ? 'Nobody closer' : 'Nobody'}</span>${!d._claim ? tickMark : ''}</button>`)}
    </div></div>`;
  }
  if (ctx.mode === 'player') html += holesSheet(ctx.rid, gc, ctx.n);
  return ctx.mode === 'player' ? { html, tabs: 'hole' } : { html };
};

function setScore(pid, v) {
  const ctx = entryCtx();
  if (D.round(ctx.rid).status === 'final') { toast('This round is final. Reopen it to change scores.'); return; }
  const d = ensureDraft(ctx);
  const val = v === 'P' ? 'P' : Number(v);
  if (d[pid] === val) delete d[pid]; else d[pid] = val;
  savePrefs();
  render();
}

// Tap the big number to wipe an entry and go back to "Par n".
function clearScore(pid) {
  const ctx = entryCtx();
  if (D.round(ctx.rid).status === 'final') return;
  delete ensureDraft(ctx)[pid];
  savePrefs();
  render();
}

function saveHole() {
  const ctx = entryCtx();
  const r = D.round(ctx.rid);
  const comp = computeR(ctx.rid);
  const gc = comp.groups.find(x => x.id === ctx.gid);
  const d = ensureDraft(ctx);
  const pids = gc.teams.flat();
  const missing = pids.filter(pid => !E.isEntered(d[pid]));
  if (missing.length) { UI.flash = true; render(); setTimeout(() => { UI.flash = false; }, 1300); return; }
  if (r.status === 'final') { toast('This round is final. Reopen it to change scores.'); return; }
  const before = {};
  ['front', 'back', 'overall'].forEach(s => { before[s] = { text: gc.matches[s].status.text, leader: gc.matches[s].status.leader }; });
  const prev = {};
  const scores = {};
  pids.forEach(pid => {
    const cur = (D.scores(ctx.rid)[pid] || {})[ctx.n];
    prev[pid] = cur === undefined ? null : cur;
    const clash = DB.conflicts.find(c => c.round === ctx.rid && c.grp === ctx.gid && c.hole === ctx.n && c.player === pid);
    const seen = d._base && pid in d._base ? d._base[pid] : prev[pid];
    scores[pid] = { v: d[pid], base: clash ? clash.server : seen };
  });
  const claimsBefore = (D.claims(ctx.rid)[ctx.n] || []).find(c => c.gid === ctx.gid);
  const req = {
    op: 'saveHole', round: ctx.rid, grp: ctx.gid, hole: ctx.n, scores, by: ctx.mode === 'org' ? 'Organiser' : byMe(),
    names: Object.fromEntries(pids.map(pid => [pid, D.nameOf(pid)])), label: `${roundName(r)} · Group ${gc.n} · Hole ${ctx.n}`
  };
  if (ctx.mode === 'org') req.pin = ORGPIN.pin;
  if (contestOn(ctx.rid, ctx.n)) req.claim = d._claim || null;
  DB.conflicts = DB.conflicts.filter(c => !(c.round === ctx.rid && c.grp === ctx.gid && c.hole === ctx.n));
  const draftCopy = clone(d);
  clearDraft(ctx);
  savePrefs();
  send(req);
  tick();
  if (ctx.mode === 'org') { back(); toast(`Hole ${ctx.n} saved`); return; }
  if (ctx.edit) {
    // A past hole was corrected: straight back to the hole being played.
    UI.edit = false; UI.after = null;
    replaceTop('tee', { rid: ctx.rid });
    toast(`Hole ${ctx.n} changed`);
    return;
  }
  UI.after = { rid: ctx.rid, gid: ctx.gid, n: ctx.n, before, prev, claimBefore: claimsBefore ? claimsBefore.pid : null, hadClaim: req.claim !== undefined, draft: draftCopy, wasEdit: ctx.edit };
  UI.edit = false;
  replaceTop('after', { rid: ctx.rid });
}

function undoSave() {
  const a = UI.after;
  if (!a) return;
  const scores = {};
  Object.keys(a.prev).forEach(pid => { scores[pid] = { v: a.prev[pid], base: a.draft[pid] }; });
  const req = { op: 'saveHole', round: a.rid, grp: a.gid, hole: a.n, scores, by: byMe(), names: Object.fromEntries(Object.keys(a.prev).map(pid => [pid, D.nameOf(pid)])), label: `Undo · Hole ${a.n}` };
  if (a.hadClaim) req.claim = a.claimBefore;
  send(req);
  const byRound = DB.prefs.drafts[a.rid] || (DB.prefs.drafts[a.rid] = {});
  (byRound[a.gid] || (byRound[a.gid] = {}))[a.n] = a.draft;
  savePrefs();
  UI.hole = a.n;
  UI.edit = a.wasEdit;
  UI.after = null;
  replaceTop('entry', { rid: a.rid });
}

  let next;

      <div class="rescard"><div class="res">${head}</div>${sub ? `<p class="sub res-sub">${esc(sub)}</p>` : ''}</div>
      ${sec('', cardOf(rows))}
      ${next}${saveWarning()}`
  };
};

/* ----- Scorecard photo check ----- */
const nineName = seg => (seg === 'front' ? 'front nine' : 'back nine');
const showV = v => (v === 'P' ? 'Picked up' : v === null || v === undefined ? '?' : String(v));
function putCheck(rid, gid, seg, data, photo) {
  const cur = view().checks.find(x => x.round === rid && x.grp === gid && x.nine === seg);
  put('checks', [{ round: rid, grp: gid, nine: seg, data, photo: photo !== undefined ? photo : (cur ? cur.photo : null) }]);
}
function nineComplete(gc, seg) { return E.SEGMENTS[seg].every(n => gc.holes[n].complete); }
function openIssues(chk) {
  if (!chk || chk.status !== 'done' || chk.resolved) return 0;
  return chk.result.issues.filter(i => !chk.decisions[`${i.hole}:${i.pid}`]).length;
}
function photoBtn(seg, primary) {
  return `<label class="btn ${primary ? '' : 'quiet'}" for="photo-${seg}">${sized(ICON.camera, 20)}<span style="margin-left:8px">Photo of the ${nineName(seg)}</span></label>
    <input class="vh" type="file" accept="image/*" capture="environment" id="photo-${seg}" data-photo="${seg}">`;
}
function testCardLink(seg) {
  if (BOOT.mode === 'live') return '';
  const any = Object.values(FIX.cards).some(c => c.nine === seg);
  return any ? `<div style="text-align:center"><button class="link sm" data-act="test-card" data-seg="${seg}">Use a test card</button></div>` : '';
}
function checkRow(seg, chk) {
  let right;
  if (!chk) right = '<span class="sub">Add photo</span>';
  else if (chk.status === 'reading') right = '<span class="pill n">Reading</span>';
  else if (chk.status === 'failed') right = '<span class="pill w">Try again</span>';
  else if (chk.status === 'manual' && !chk.resolved) right = '<span class="pill w">Check by eye</span>';
  else if (chk.status === 'done' && !chk.resolved) right = `<span class="pill w">${openIssues(chk) || 'All'} to check</span>`;
  else right = `<span class="c-g" style="display:inline-flex">${sized(ICON.check, 18)}</span>`;
  return `<button class="row" data-act="open-check" data-seg="${seg}"><span>${segName(seg)} card</span><span class="right">${right}${chev}</span></button>`;
}
function photoSrc(chk) {
  if (!chk || !chk.photo) return null;
  if (String(chk.photo).startsWith('data:')) return chk.photo;
  if (UI.photos[chk.photo]) return UI.photos[chk.photo];
  const local = (DB.prefs.photos || {})[chk.photo];
  if (local) return local;
  if (!UI.photos['loading:' + chk.photo]) {
    UI.photos['loading:' + chk.photo] = true;
    call({ op: 'photoGet', id: chk.photo }).then(r => { if (r.dataUrl) { UI.photos[chk.photo] = r.dataUrl; render(); } }).catch(() => { delete UI.photos['loading:' + chk.photo]; });
  }
  return null;
}

async function prepImage(blob) {
  const url = URL.createObjectURL(blob);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const draw = max => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k);
      c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return c;
    };
    const sendBlob = await new Promise(r => draw(1600).toBlob(r, 'image/jpeg', 0.85));
    const small = draw(1200).toDataURL('image/jpeg', 0.72);
    return { send: sendBlob, small };
  } finally { URL.revokeObjectURL(url); }
}
function dataUrlToBlob(d) {
  const [head, b64] = d.split(',');
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: (head.match(/data:([^;]+)/) || [])[1] || 'image/jpeg' });
}

function readerPrompt(rid, gc, seg) {
  const comp = computeR(rid);
  const hs = E.SEGMENTS[seg];
  const who = gc.teams.flat().map(pid => `${D.nameOf(pid)} (handicap index ${fmtIndex((D.member(pid) || {}).index)}, plays off ${comp.players[pid].ph})`).join('; ');
  return [
    'You are reading a photo of a handwritten golf scorecard for a scoring app. Transcribe it exactly. Never guess.',
    `It should show holes ${hs[0]} to ${hs[hs.length - 1]} for one group of four: ${who}.`,
    'Cards are filled in by hand, usually in pencil. Players are named in a key at the top (Player A/B/C/D or Jugador A/B/C/D, with a handicap); the score grid uses only the letters A B C D. Holes may run down the card or across it. Read the printed hole numbers and report scores by physical hole number.',
    '- Report gross STROKES per hole. If strokes have points written small beside or below them (a big 4 with a small 2), report only the big number.',
    '- A pick-up or no score is often written as X, a dash, a slash, P or NR: report "P".',
    '- If a number was rubbed out or crossed out and another written, report the final number and say so in note.',
    "- Ignore printed numbers (metres, yards, par, stroke index) and empty columns such as marker's score or W/L/H.",
    '- If you cannot read a cell confidently (glare, blur, or a digit that could be another, such as 4/9, 1/7, 3/8, 5/6), give your best reading with confidence "low" and say why in note. If you cannot read it at all, use value null.',
    `Reply with only a JSON object: {"holes":[${hs.join(',')}],"players":[{"letter":"A","name":"...","handicap":12,"scores":{"${hs[0]}":{"value":4,"confidence":"high","note":""}}}],"problems":["..."]}`
  ].join('\n');
}

async function startCheck(seg, source) {
  const rid = playRid();
  const g = myGroup(rid);
  if (!g) return;
  UI.testSheet = null;
  let blob = source.file || null;
  try {
    if (source.fixture) blob = await (await fetch('cards/' + source.fixture)).blob();
    const { send: sendBlob, small } = await prepImage(blob);
    const localId = 'local-' + Date.now();
    DB.prefs.photos = DB.prefs.photos || {};
    DB.prefs.photos[localId] = small;
    savePrefs();
    putCheck(rid, g.id, seg, { status: 'reading', fixture: source.fixture || null, at: new Date().toISOString(), decisions: {} }, localId);
    UI.checkSeg = seg;
    go('check', { rid });
    call({ op: 'photoPut', dataUrl: small }).then(res => {
      if (!res.id) return;
      DB.prefs.photos[res.id] = small;
      delete DB.prefs.photos[localId];
      savePrefs();
      const c = view().checks.find(x => x.round === rid && x.grp === g.id && x.nine === seg);
      if (c) putCheck(rid, g.id, seg, c.data, res.id);
    }).catch(() => { /* photo stays on this phone */ });
    runReader(rid, g.id, seg, sendBlob, source.fixture || null);
  } catch (e) {
    toast('That photo could not be opened. Try another.');
  }
}

const PERMANENT = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'images_unavailable'];
async function runReader(rid, gid, seg, sendBlob, fixtureKey) {
  const finish = patch => {
    const c = D.check(rid, gid, seg);
    if (!c) return;
    const data = Object.assign({}, c);
    delete data.photo;
    Object.assign(data, patch);
    putCheck(rid, gid, seg, data);
    const here = !UI.org && cur().v === 'check' && UI.checkSeg === seg;
    if (patch.status === 'done' && patch.resolved) toast(`${segName(seg)} card matches`);
    else if (patch.status === 'done') { tick(); if (!here) toast(`${segName(seg)} card: ${plural(patch.result.issues.length, 'score')} to check`); }
    render();
  };
  let reading = null;
  let src = 'live';
  try {
    if (sampleFn && canReadImages) {
      const gc = computeR(rid).groups.find(x => x.id === gid);
      reading = await sampleFn.json(readerPrompt(rid, gc, seg), { images: [sendBlob], cache: false });
    } else if (fixtureKey) {
      await new Promise(r => setTimeout(r, 900));
      reading = FIX.cards[fixtureKey].reading;
      src = 'recorded';
    } else { finish({ status: 'manual', reason: 'unavailable' }); return; }
  } catch (e) {
    const code = e && e.code;
    if (fixtureKey && PERMANENT.includes(code)) { reading = FIX.cards[fixtureKey].reading; src = 'recorded'; }
    else { finish({ status: PERMANENT.includes(code) ? 'manual' : 'failed', reason: code || 'error' }); return; }
  }
  if (!reading || !Array.isArray(reading.players)) { finish({ status: 'failed', reason: 'invalid' }); return; }
  const gc = computeR(rid).groups.find(x => x.id === gid);
  const pls = gc.teams.flat().map(pid => ({ id: pid, name: D.nameOf(pid) }));
  const r = E.compareCard(reading, pls, D.scores(rid), holesOf(D.round(rid)), E.SEGMENTS[seg]);
  if (!r.checked) { finish({ status: 'failed', reason: 'nomatch' }); return; }
  finish({ status: 'done', source: src, result: { checked: r.checked, matched: r.matched, issues: r.issues, problems: reading.problems || [] }, decisions: {}, resolved: r.issues.length === 0 });
}

VIEWS.check = () => {
  const rid = playRid();
  const g = myGroup(rid);
  const seg = UI.checkSeg || 'front';
  const gc = computeR(rid).groups.find(x => x.id === g.id);
  const chk = D.check(rid, g.id, seg);
  const backLbl = gc.nextHole ? `Hole ${gc.nextHole}` : 'Card';
  let html = `${navBack(backLbl)}<div class="head"><h1 class="title">${segName(seg)} card</h1></div>`;
  if (!chk) return { tabs: 'hole', html: html + photoBtn(seg, true) + testCardLink(seg) };
  const src = photoSrc(chk);
  const thumb = `<button class="thumb" data-act="photo-full" aria-label="See the photo full size">${src ? `<img src="${src}" alt="Photo of the ${nineName(seg)} card">` : ''}</button>
    ${chk.fixture ? `<p class="cap note">Test card${chk.source === 'recorded' ? ' · recorded reading' : ''}</p>` : ''}`;

      <button class="btn" data-act="retry-check" data-seg="${seg}">Try again</button>${photoBtn(seg, false)}
      <div style="text-align:center"><button class="link sm" data-act="manual-check" data-seg="${seg}">Check it by eye</button></div>`;
  } else if (chk.status === 'manual') {
    const comp = computeR(rid);
    const pids = gc.teams.flat();
    const rows = E.SEGMENTS[seg].map(n => `<button class="orow" data-act="edit-hole" data-n="${n}" aria-label="Change hole ${n}"><span class="b">${n}</span>${pids.map(pid => { const v = comp.players[pid].holes[n].gross; return `<span>${v === null ? '–' : v === 'P' ? 'P' : v}</span>`; }).join('')}</button>`).join('');
    html += `<p class="sub head-sub">Compare the app with the photo</p>${thumb}
      ${sec('', cardOf(`<div class="orow"><span class="cap">Hole</span>${pids.map((pid, i) => `<span class="cap b ${i < 2 ? 'c-a' : 'c-b'}">${esc(D.nameOf(pid))}</span>`).join('')}</div>${rows}`), true)}
      ${chk.resolved ? `<p class="sub c-g" style="text-align:center;margin-top:24px">Checked</p>` : `<button class="btn" data-act="manual-ok" data-seg="${seg}">All correct</button>`}`;
  } else {
    const r = chk.result;
    const issues = r.issues;
    if (!issues.length) {
      html += `<p class="sub head-sub">${r.matched} of ${r.checked} scores match</p>${thumb}
        ${sec('', cardOf(`<div class="row tall"><span class="b c-g" style="display:inline-flex;align-items:center;gap:8px">${sized(ICON.check, 22)} The card matches the app</span></div>`))}
        <button class="btn" data-act="back">Done</button>`;
    } else {
      const comp = computeR(rid);
      const live = (pid, n) => comp.players[pid].holes[n].gross;
      let changes = 0;
      const blocks = issues.map(i => {
        const k = `${i.hole}:${i.pid}`;
        const d = chk.decisions[k];
        if (d === 'card' && i.card !== null) changes += 1;
        const appNow = live(i.pid, i.hole);
        const tag = i.kind === 'differs' ? '' : '<span class="pill w">Hard to read</span>';
        const body = i.card === null
          ? `<div class="choices"><button class="choice ${d === 'app' ? 'on' : ''}" data-act="decide" data-k="${k}" data-v="app">App: ${showV(appNow)} is right</button><button class="choice" data-act="edit-hole" data-n="${i.hole}">Change it</button></div>`
          : `<div class="choices"><button class="choice ${d === 'card' ? 'on' : ''}" data-act="decide" data-k="${k}" data-v="card" aria-pressed="${d === 'card'}">Card: ${showV(i.card)}</button><button class="choice ${d === 'app' ? 'on' : ''}" data-act="decide" data-k="${k}" data-v="app" aria-pressed="${d === 'app'}">App: ${showV(appNow)}</button></div>`;
        return sec(`<span class="b">Hole ${i.hole} · ${esc(D.nameOf(i.pid))}</span>${tag}`, body, true);
      }).join('');
      const left = openIssues(chk);
      html += `<p class="sub head-sub">${r.matched} of ${r.checked} scores match</p>${thumb}${blocks}
        ${chk.resolved ? `<p class="sub c-g" style="text-align:center;margin-top:24px">Checked${chk.changes ? ` · ${plural(chk.changes, 'score')} changed` : ''}</p>`
          : `<div class="savebar" style="margin-top:24px"><button class="btn ${left ? 'quiet' : ''}" data-act="check-done" data-seg="${seg}">${left ? `${left} to decide` : changes ? `Done · ${plural(changes, 'score')} changed` : 'Done'}</button></div>`}`;
    }
  }
  return { tabs: 'hole', html };
};

function updateCheck(seg, fn) {
  const rid = playRid();
  const g = myGroup(rid);
  const c = D.check(rid, g.id, seg);
  if (!c) return null;
  const data = Object.assign({}, c);
  delete data.photo;
  fn(data);
  putCheck(rid, g.id, seg, data);
  return data;
}
function applyCheck(seg) {
  const rid = playRid();
  const g = myGroup(rid);
  const chk = D.check(rid, g.id, seg);
  if (!chk || chk.status !== 'done') return;
  if (openIssues(chk)) { toast(`Pick card or app for ${plural(openIssues(chk), 'score')}`); return; }
  if (D.round(rid).status === 'final') { toast('This round is final. Reopen it to change scores.'); return; }
  const changedList = [];
  const byHole = {};
  chk.result.issues.forEach(i => {
    if (chk.decisions[`${i.hole}:${i.pid}`] !== 'card' || i.card === null) return;
    const was = (D.scores(rid)[i.pid] || {})[i.hole];
    (byHole[i.hole] = byHole[i.hole] || {})[i.pid] = { v: i.card, base: was === undefined ? null : was };
    changedList.push(`${D.nameOf(i.pid)} hole ${i.hole} ${fmtGross(was)} → ${fmtGross(i.card)}`);
  });
  Object.keys(byHole).forEach(n => send({ op: 'saveHole', round: rid, grp: g.id, hole: Number(n), scores: byHole[n], by: byMe(), names: Object.fromEntries(Object.keys(byHole[n]).map(pid => [pid, D.nameOf(pid)])), label: `Card check · Hole ${n}` }));
  updateCheck(seg, d => { d.resolved = true; d.changes = changedList.length; });
  logEntry('Card check', `${roundName(D.round(rid))} · group ${g.n} · ${nineName(seg)}: ${changedList.length ? 'changed from the card photo: ' + changedList.join(', ') : 'checked, no changes'}`);
  tick();
  render();
  toast(changedList.length ? `${plural(changedList.length, 'score')} changed. Results updated.` : `${segName(seg)} card checked`);
}

/* ----- End of the round for a group ----- */
VIEWS.finish = () => {
  const rid = playRid();
  const comp = computeR(rid);
  const g = myGroup(rid);
  const gc = comp.groups.find(x => x.id === g.id);
  const submitted = D.card(rid, g.id);
  const buggies = gc.teams.length === 2;
  const players = gc.teams.map((t, i) => t.map(pid => dropRow(rid, { id: pid }, `<span style="display:flex;align-items:center;gap:8px">${buggies ? dot(i) : ''}${esc(D.nameOf(pid))}</span><span class="right"><span class="b num">${comp.players[pid].total}</span>${dropChev}</span>`, 'row')).join('')).join('');
  const bw = buggies ? ['front', 'back', 'overall'].map(s => `<div class="row"><span>${segName(s)}</span>${statusPills(gc.matches[s].status)}</div>`).join('') : '';
  const missing = 18 - gc.holesDone;
  const checks = ['front', 'back'].map(sg => checkRow(sg, D.check(rid, g.id, sg))).join('');
  const pending = ['front', 'back'].find(sg => { const c = D.check(rid, g.id, sg); return !c || !c.resolved; });
  let action;
  if (submitted) action = `<p class="sub c-g" style="margin-top:24px;text-align:center">Card submitted</p><button class="btn quiet" data-act="tab" data-tab="board">Leaderboard</button>`;
  else if (missing) action = `<button class="btn quiet" data-act="tab" data-tab="hole">${plural(missing, 'hole')} to enter</button>`;
  else if (pending) {
    const c = D.check(rid, g.id, pending);
    action = (c ? `<button class="btn" data-act="open-check" data-seg="${pending}">Check the ${nineName(pending)} card</button>` : photoBtn(pending, true) + testCardLink(pending))
      + `<button class="btn quiet" style="margin-top:8px" data-act="submit">Submit without checking</button>`;
  } else action = `<button class="btn" data-act="submit">Submit card</button>`;
  return {
    tabs: 'hole',
    html: `<div class="head"><h1 class="title">Group ${gc.n} card</h1><button class="link" data-act="round" data-rid="${rid}">Groups</button></div>
      <p class="sub">${esc(roundName(D.round(rid)))} · Stableford points</p>
      ${sec('', cardOf(players), true)}
      ${buggies ? sec(label('Buggy Wars'), cardOf(bw)) : ''}
      ${missing ? '' : sec(label('Card check'), cardOf(checks))}
      ${action}${saveWarning()}
      <div class="foot"><button class="link" data-act="home">Back to the front page</button></div>`
  };
};

/* ----- Buggy Wars board ----- */
function buggyView(rid) {
  const r = D.round(rid);
  const comp = computeR(rid);
  if (!comp) return { html: `${sec('', cardOf('<div class="row sub">Groups to be drawn</div>'))}` };
  const groups = comp.groups.filter(g => g.teams.length === 2);
  if (!groups.length) return { html: `${sec('', cardOf('<div class="row sub">No buggy matches today</div>'))}` };
  const mine = myGroup(rid);
  const inMatch = !!(mine && groups.find(g => g.id === mine.id));
  const gid = inMatch ? mine.id : (UI.matchGroup && groups.find(g => g.id === UI.matchGroup) ? UI.matchGroup : groups[0].id);
  const gc = comp.groups.find(g => g.id === gid);
  const L = gc.labels;
  const canEdit = mine && mine.id === gid && r.status === 'live';
  const summary = ['front', 'back', 'overall'].map(s => `<div class="row"><span>${segName(s)}</span>${statusPills(gc.matches[s].status)}</div>`).join('');
  let rows = '';
  gc.order.forEach((n, idx) => {
    const hr = gc.holes[n];
    const isNow = n === gc.nextHole && r.status === 'live';
    let a = '', b = '', m = '';
    if (hr.complete) {
      const [pa, pb] = hr.best;
      a = `<span class="ppts ${hr.result === 'A' ? 'a' : hr.result === 'B' ? 'lose' : ''}">${pa}</span>`;
      b = `<span class="ppts ${hr.result === 'B' ? 'b' : hr.result === 'A' ? 'lose' : ''}">${pb}</span>`;
      const lead = hr.segLead;
      m = lead === 0 ? '<span class="pill n">AS</span>' : `<span class="pill ${lead > 0 ? 'a' : 'b'} soft">${Math.abs(lead)} up</span>`;
    } else if (isNow) m = '<span class="b c-g">Now</span>';
    const tag = canEdit && hr.complete ? 'button' : 'div';
    const attrs = tag === 'button' ? ` data-act="edit-hole" data-n="${n}" aria-label="Change hole ${n}"` : '';
    rows += `<${tag} class="mrow${isNow ? ' now' : ''}${!hr.complete && !isNow ? ' later' : ''}"${isNow ? ' id="cur"' : ''}${attrs}><span class="b">${n}</span><span class="p">${a}</span><span class="p">${b}</span><span class="m">${m}</span></${tag}>`;
    const nextN = gc.order[idx + 1];
    if (nextN !== undefined && (nextN <= 9) !== (n <= 9)) {
      const seg = n <= 9 ? 'front' : 'back';
      rows += `<div class="row" style="background:var(--bg)"><span class="sub">${segName(seg)}</span>${statusPills(gc.matches[seg].status)}</div>`;
    }
  });
  return {
    html: `      ${!inMatch && groups.length > 1 ? `<div class="seg pills grp">${groups.map(g => `<button class="${g.id === gid ? 'on' : ''}" data-act="mgroup" data-gid="${g.id}" aria-pressed="${g.id === gid}">Group ${g.n}</button>`).join('')}</div>` : ''}
      ${sec(`${pill(0)}<span class="sub" style="flex:1">${esc(L[0].long)}</span>`, '', true)}
      <div class="sec-label" style="margin-top:-4px">${pill(1)}<span class="sub" style="flex:1">${esc(L[1].long)}</span></div>
      ${cardOf(summary)}
      ${sec('', cardOf(`<div class="mrow cols"><span class="cap">Hole</span><span class="p">${pill(0)}</span><span class="p">${pill(1)}</span><span></span></div>${rows}`), true)}`
  };
}

/* ----- Leaderboard ----- */
function tripRounds(r) { return r && r.trip ? D.rounds().filter(x => x.trip === r.trip && x.season === r.season && !isDemo(x) === !isDemo(r)).sort((a, b) => (a.trip_day || 0) - (b.trip_day || 0)) : [r]; }

/* ----- Fun facts from the hole-by-hole scores ----- */
function statsOf(rid) {
  return memo('stats:' + rid, () => {
    const r = D.round(rid), res = resultsOf(rid), holes = r && holesOf(r);
    if (!res || !res.comp || !holes) return null;
    const s = E.roundStats(res.comp, holes);
    const any = s.birdies.length || s.scratches.length || s.streak || s.hardest.length || s.bestNine.length || s.comeback.length || s.fade.length || s.steady.length || s.blowup.length;
    return any ? s : null;
  });
}
const STAT_ICON = {
  birdie: svg('<path d="M8 21V4"/><path d="M8 4l9 3.500L8 11"/><circle cx="14" cy="19" r="1.800"/>'),
  streak: svg('<path d="M12 3c1 3.500 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 .3 1.500 1 2 2 2-1-3 0-5 1-8z"/>'),
  nine: svg('<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4"/><path d="M16 6h3a3 3 0 0 1-3 4"/><path d="M12 13v4"/><path d="M8.500 20h7"/>'),
  comeback: svg('<path d="M4 17l6-6 4 4 6-7"/><path d="M15 8h5v5"/>'),
  fade: svg('<path d="M4 7l6 6 4-4 6 7"/><path d="M15 16h5v-5"/>'),
  steady: svg('<path d="M4 9h16"/><path d="M4 15h16"/>'),
  tough: svg('<path d="M3 19l6-11 4 6 2-3 6 8z"/>'),
  easy: svg('<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.600 5.600L7 7M17 17l1.400 1.400M5.600 18.400L7 17M17 7l1.400-1.400"/>'),
  big: svg('<path d="M12 3l2 5 5-2-2 5 5 2-5 2 2 5-5-2-2 5-2-5-5 2 2-5-5-2 5-2-2-5 5 2z"/>'),
  scratch: svg('<circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/>')
};
function statsView(s) {
  const names = a => a.length > 3 ? `${a.length} players tied` : a.map(x => esc(x.name)).join(' and ');
  const holesTxt = a => a.map(h => h.n).join(', ');
  const tile = (tone, icon, title, who, note, wide) => `<div class="stile ${tone}${wide ? ' wide' : ''}"><span class="sic">${sized(STAT_ICON[icon], 26)}</span><span class="cap">${title}</span><span class="who">${who}</span>${note ? `<span class="nt">${note}</span>` : ''}</div>`;
  const t = [];
  if (s.birdies.length) t.push(tile('tg', 'birdie', 'Most birdies', names(s.birdies), `${s.birdies[0].count} ${s.birdies[0].count === 1 ? 'birdie' : 'birdies'} or better`));
  if (s.streak) t.push(tile('tf', 'streak', 'Hot streak', esc(s.streak.name), `${s.streak.len} holes in a row at par or better, ${s.streak.from} to ${s.streak.to}`));
  if (s.bestNine.length) { const b = s.bestNine[0]; t.push(tile('tb', 'nine', 'Best nine', names(s.bestNine), `${b.pts} points on the ${b.seg} nine`)); }
  if (s.comeback.length) { const c = s.comeback[0]; t.push(tile('tg', 'comeback', 'Comeback king', names(s.comeback), `${c.front} on the front, ${c.back} on the back`)); }
  if (s.fade.length) { const c = s.fade[0]; t.push(tile('tr', 'fade', 'Ran out of steam', names(s.fade), `${c.front} on the front, ${c.back} on the back`)); }
  if (s.steady.length) { const c = s.steady[0]; t.push(tile('tb', 'steady', 'Steady Eddie', names(s.steady), c.front === c.back ? `${c.front} points on both nines` : `${c.front} then ${c.back}, hardly a wobble`)); }
  if (s.hardest.length) t.push(tile('tr', 'tough', 'Toughest hole', `Hole ${holesTxt(s.hardest)}`, 'Fewest points in the field'));
  if (s.easiest.length) t.push(tile('tf', 'easy', 'Friendliest hole', `Hole ${holesTxt(s.easiest)}`, 'Most points in the field'));
  if (s.blowup.length) { const w = s.blowup[0]; t.push(tile('tr', 'big', 'Big number', names(s.blowup), `${w.gross} on hole ${w.n}`)); }
  if (s.scratches.length) t.push(tile('tb', 'scratch', 'Most scratches', names(s.scratches), `${s.scratches[0].count} ${s.scratches[0].count === 1 ? 'hole' : 'holes'} picked up`));
  return sec(label('The round in numbers'), `<div class="stiles">${t.join('')}</div>`, true);
}

VIEWS.board = () => {

  const stats = res0 && res0.comp && res0.source === 'app' ? statsOf(sel) : null;

  if (avail.length > 1) {

  }
  if (pillSel === 'bw') return { tabs: 'board', html: html + buggyView(sel).html };

  if (r.status === 'upcoming') {

    return { tabs: 'board', html };
  }
  const res = res0;

      return `<div class="row crow"><span class="ct-l"><span>${CONTEST[c.type]}</span>${c.hole ? `<span class="sub">Hole ${c.hole}</span>` : ''}</span><span class="ct-r">${right}</span></div>`;
    }).join('')));
    return { tabs: 'board', html };
  }

  const pillTxt = r.status === 'final' ? '<span class="pill g">Final</span>' : statusPill(r);
  html += sec(`${label(esc(roundName(r)))}${pillTxt}`, cardOf(res.rows.map(x => {

    return res.source === 'app' ? dropRow(sel, x, inner) : `<button class="lrow" data-act="player" data-pid="${x.id}">${inner}</button>`;
  }).join('')), true);
  if (res.kb.length) { const low = E.kbLowest(res.kb); html += sec(label('KBs'), cardOf(res.kb.map(k => `<div class="lrow${low.includes(k) ? ' low' : ''}"><span class="sub">${k.posLabel}</span><span>${esc(k.name)}</span><span class="b r">${k.total}</span></div>`).join(''))); }
  html += `<button class="btn quiet" data-act="results" data-rid="${sel}">Share results</button>`;
  return { tabs: 'board', html };
};

VIEWS.trip = p => {

  html += tripTable(list);
  html += sec(label('Each day'), cardOf(list.map(x => `<button class="row" data-act="leaderboard" data-rid="${x.id}"><span>Day ${x.trip_day || x.seq}</span><span class="right">${x.status === 'upcoming' ? '<span class="sub">Not played</span>' : ''}${chev}</span></button>`).join('')));

function tripTable(list) {
  const ids = new Set();
  list.forEach(r => (r.groups || []).forEach(g => g.teams.flat().forEach(pid => ids.add(pid))));
  const pts = list.map(r => (r.status === 'upcoming' ? {} : pointsOf(r.id)));
  const rows = E.rankRows([...ids].map(pid => {
    const per = pts.map(p => (p[pid] === undefined ? null : p[pid]));
    return { id: pid, name: D.nameOf(pid), per, total: per.reduce((s, v) => s + (v || 0), 0) };
  }), 'total', 'desc');
  const allFinal = list.every(r => r.status === 'final');
  const cols = `grid-template-columns:minmax(2.6ch,auto) minmax(0,1fr) repeat(${list.length},minmax(30px,auto)) minmax(38px,auto)`;
  return sec(`${label(`All ${list.length} rounds count`)}${allFinal ? '<span class="pill g">Final</span>' : '<span class="pill w">In progress</span>'}`,
    cardOf(`<div class="lrow" style="${cols};min-height:36px"><span></span><span></span>${list.map(r => `<span class="cap r">D${r.trip_day || r.seq}</span>`).join('')}<span class="cap r">Total</span></div>
    ${rows.map(row => `<button class="lrow" style="${cols}" data-act="player" data-pid="${row.id}"><span class="sub">${row.posLabel}</span>${avName(row, null, row.pos === 1)}${row.per.map(v => `<span class="r sub">${v === null ? '–' : v}</span>`).join('')}<span class="r b">${row.total}</span></button>`).join('')}`), true);
}

/* ----- Results card ----- */

  const card = `<div class="rcard" id="rcard">

const EQ_BARS = 48;

    UI.chat.push({ role: 'ai', text: !navigator.onLine ? 'No signal right now. Try again when you have some.' : slow ? 'The rules checker took too long to answer. Tap New question and try again.' : 'The rules checker did not answer just now' + (e && e.message ? ' (' + e.message + ')' : '') + '. Try again in a moment.', error: true });
    refreshThread("answer");
  });
}

const ORG = {};
const orgTop = () => `<header class="hero s"><div class="nav"><span class="sub" style="display:inline-flex;align-items:center;gap:6px;margin:0">${sized(ICON.lock, 16)} PIN protected</span><button class="link" data-act="org-exit">Done</button></div><div class="head"><h1 class="title">Organiser</h1></div></header>`;
const field = (id, lbl, value, attrs = '') => `<div class="fld"><label class="sub" for="${id}">${lbl}</label><input id="${id}" class="field" value="${esc(value === null || value === undefined ? '' : value)}" ${attrs}></div>`;
const formErr = () => (UI.formError ? `<p class="err">${esc(UI.formError)}</p>` : '');
const slug = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'x';
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
const num = id => { const v = val(id).replace(',', '.'); return v === '' ? null : Number(v); };

ORG.lock = () => ({

    <form data-form="pin" autocomplete="off" class="sec near">

function roundSummary(r) {
  const bits = [r.date ? fmtDate(r.date, true) : '', r.first_tee || ''].filter(Boolean).join(' · ');
  const st = isDemo(r) ? '<span class="pill w">Demo</span>' : r.status === 'live' ? '<span class="pill w">Live</span>' : r.status === 'final' ? '' : '<span class="pill n">Not started</span>';
  return `<button class="row tall" data-act="org-go" data-v="round" data-rid="${r.id}"><span class="two"><span>${esc(roundName(r))}</span><span class="sub">${esc(bits || roundWhenShort(r) || ' ')}</span></span><span class="right">${st}${chev}</span></button>`;
}


/* What still needs doing before the next round: each line opens the screen where it is done. */
function nextChecklist(r) {
  if (!r || r.status === 'final' || r.source === 'imported') return '';
  const tee = teeOf(r), c = courseOf(r);
  const items = [
    { ok: !!(c && c.holes && tee), t: 'Course and tees', go: ['details', r.id], need: true },
    { ok: !!(r.groups && r.groups.length), t: 'Players and groups', go: ['playing', r.id], need: true },
    { ok: !!r.first_tee, t: 'First tee time', go: ['details', r.id], need: true },
    { ok: !!(r.contests && r.contests.length), t: 'Contests', go: ['details', r.id], need: false },
    { ok: !!(r.kb && r.kb.length), t: 'KBs', go: ['kb', r.id], need: false }
  ];
  const left = items.filter(i => i.need && !i.ok).length;
  const head = `<span class="two"><span>${esc(roundName(r))}</span><span class="sub">${left ? `${plural(left, 'thing')} to do` : 'Ready to go'}</span></span>`;
  return sec(label('Next up'), cardOf(`<div class="row tall">${head}<span class="pill ${left ? 'w' : 'g'}">${left ? 'To do' : 'Ready'}</span></div>` +
    items.map(i => `<button class="row" data-act="org-go" data-v="${i.go[0]}" data-rid="${i.go[1]}"><span style="display:flex;align-items:center;gap:10px"><span class="chk${i.ok ? ' on' : ''}" aria-hidden="true">${i.ok ? sized(ICON.check, 16) : ''}</span>${i.t}${i.need ? '' : ' <span class="sub">optional</span>'}</span>${chev}</button>`).join('')), true);
}

ORG.home = () => {
  const active = D.rounds().filter(r => r.status !== 'final');
  const past = D.rounds().filter(r => r.status === 'final').reverse();
  const item = (v, icon, color, lbl) => `<button class="row" data-act="org-go" data-v="${v}"><span style="display:flex;align-items:center;gap:12px"><span class="ic" style="background:${color}">${icon}</span>${lbl}</span>${chev}</button>`;

  html += sec(label('Manage'), cardOf(`${item('members', ICON.users, '#0A60C9', 'Members and handicaps')}${item('courses', ICON.course, '#1E7A3D', 'Courses')}${item('settings', ICON.gear, '#8E8E93', 'Settings')}${item('log', ICON.history, '#8E8E93', 'Change log')}${item('export', ICON.download, '#8E8E93', 'Export')}`));

  }
  if (BOOT.mode !== 'live') {
    html += sec(label('Preview'), cardOf(`${liveRid() ? '<button class="row" data-act="demo-fill"><span>Finish other groups with demo scores</span>' + chev + '</button>' : ''}<button class="row" data-act="reset-preview"><span class="c-b">${UI.confirm === 'reset' ? 'Tap again to start the preview again' : 'Start the preview again'}</span></button>`));
  }
  return { html };
};

function finaliseBlockers(r) {
  const comp = computeR(r.id);
  if (!comp) return ['no scores'];
  const open = comp.groups.filter(g => !g.complete).length;
  const claims = D.claims(r.id);
  const wins = D.winners(r.id);
  const toConfirm = (r.contests || []).filter(c => (claims[c.hole] || []).length && !wins[c.hole]).length;
  const reasons = [];
  if (open) reasons.push(`${plural(open, 'card')} open`);
  if (toConfirm) reasons.push(`${plural(toConfirm, 'contest')} to confirm`);
  return reasons;
}

ORG.round = p => {
  const r = D.round(p.rid);
  if (!r) return { html: `${navBack('Organiser')}<p class="sub">Round deleted</p>` };
  const c = courseOf(r);
  const tee = teeOf(r);
  let html = `<header class="hero s">${navBack('Organiser')}<div class="head"><h1 class="title">${esc(roundName(r))}</h1>${statusPill(r)}</div>${roundWhen(r) ? `<p class="sub">${esc(roundWhen(r))}</p>` : ''}</header>`;
  if (r.source === 'imported') {
    html += sec('', cardOf(`<div class="row tall"><span class="sub">${esc(r.note || 'Imported results')}</span></div>`), true);
    return { html };
  }
  const nPlayers = (r.groups || []).reduce((s, g) => s + g.teams.flat().length, 0);
  const details = [c ? c.name : 'No course', tee ? tee.name : '', r.date ? fmtDate(r.date, true) : '', r.first_tee || ''].filter(Boolean).join(' · ');
  const locked = r.status !== 'upcoming';
  html += sec('', cardOf(`
    <button class="row tall" data-act="org-go" data-v="details" data-rid="${r.id}"><span class="two"><span>Details</span><span class="sub">${esc(details)}</span></span>${chev}</button>
    <button class="row tall" data-act="org-go" data-v="${locked ? 'groupsview' : 'playing'}" data-rid="${r.id}"><span class="two"><span>Groups and buggies</span><span class="sub">${r.groups && r.groups.length ? `${plural(nPlayers, 'player')} · ${plural(r.groups.length, 'group')}` : 'Not drawn'}</span></span>${chev}</button>
    ${r.groups && r.groups.length && r.status !== 'final' ? `<button class="row tall" data-act="org-go" data-v="late" data-rid="${r.id}"><span class="two"><span>Change a player</span><span class="sub">Swap someone in, or let someone drop out</span></span>${chev}</button>` : ''}
    <button class="row tall" data-act="org-go" data-v="kb" data-rid="${r.id}"><span class="two"><span>KBs</span><span class="sub">${r.kb && r.kb.length ? plural(r.kb.length, 'pair') : 'None'}</span></span>${chev}</button>`), true);
  if (c && (!c.holes || !tee)) html += `<div class="banner note">${esc(c.name)} needs ${!c.holes ? 'its par and stroke index for each hole' : 'tee details'} before scores can be entered. <button class="link inline" data-act="org-go" data-v="course" data-cid="${c.id}">Add them</button></div>`;
  const comp = computeR(r.id);
  if (comp && r.status !== 'upcoming') {
    html += sec(label('Groups'), cardOf(comp.groups.map(gc => {
      const sub = D.card(r.id, gc.id);
      const prog = gc.complete ? (sub ? 'Submitted' : 'Finished') : gc.holesDone ? `Thru ${gc.holesDone}` : 'Not started';
      return `<button class="row" data-act="org-go" data-v="group" data-rid="${r.id}" data-gid="${gc.id}"><span>Group ${gc.n}</span><span class="right sub"><span class="bar"><i style="width:${Math.round(gc.holesDone / 18 * 100)}%"></i></span>${prog}${chev}</span></button>`;
    }).join('')));
    const contests = r.contests || [];
    if (contests.length) {
      const claims = D.claims(r.id);
      const wins = D.winners(r.id);
      html += sec(label('Contests'), cardOf(contests.map(ct => {
        const cl = claims[ct.hole] || [];
        const win = wins[ct.hole];
        const right = win ? `<span class="b">${esc(D.nameOf(win))}</span>` : cl.length ? '<span class="pill w">Confirm</span>' : '<span class="sub">–</span>';
        return `<button class="row" data-act="org-go" data-v="contest" data-rid="${r.id}" data-n="${ct.hole}"><span>${CONTEST[ct.type]} <span class="sub">${ct.hole}</span></span><span class="right">${right}${chev}</span></button>`;
      }).join('')));
    }
  }
  if (r.status === 'live') {
    const reasons = finaliseBlockers(r);
    html += reasons.length ? `<button class="btn quiet" data-act="finalise" data-rid="${r.id}">Finalise<small style="color:var(--sub)">${esc(reasons.join(' · '))}</small></button>`
      : `<button class="btn" data-act="finalise" data-rid="${r.id}">Finalise</button>`;
  } else if (r.status === 'final') {
    html += `<button class="btn quiet" data-act="reopen" data-rid="${r.id}">Reopen round</button>`;
  } else {
    const why = !canScore(r) ? (r.groups && r.groups.length ? 'Course details needed' : 'Draw the groups first') : liveRid() ? 'Another round is live' : '';
    html += `<button class="btn ${why ? 'quiet' : ''}" data-act="start-round" data-rid="${r.id}">Start round${why ? `<small style="color:var(--sub)">${esc(why)}</small>` : ''}</button>`;
  }
  if (r.status === 'upcoming' || isDemo(r) || D.testing()) {
    const sc = Object.values(D.scores(r.id)).reduce((n, byHole) => n + Object.keys(byHole).length, 0);
    const warn = sc ? ` and its ${plural(sc, 'score')}` : '';
    html += `<div style="text-align:center;margin-top:8px"><button class="link c-b" data-act="delete-round" data-rid="${r.id}">${UI.confirm === 'del-' + r.id ? `Tap again to delete the round${warn}` : 'Delete round'}</button></div>`;
  }
  return { html };
};

/* ----- Round details ----- */
ORG.details = p => {
  const r = p.rid ? D.round(p.rid) : null;
  const st = UI.formState || (UI.formState = { course: r ? r.course : (D.courses().find(c => c.holes) || D.courses()[0] || {}).id });

    html: `<header class="hero s">${navBack(r ? roundName(r) : 'Organiser')}<div class="head"><h1 class="title">${r ? 'Details' : 'New round'}</h1></div></header>
    <form data-form="details" autocomplete="off" class="sec near">
      <div class="fld"><label class="sub" for="f-course">Course</label><select id="f-course" class="field" data-change="details-course">${D.courses().map(x => `<option value="${x.id}"${x.id === st.course ? ' selected' : ''}>${esc(x.name)}${x.holes ? '' : ' (no card yet)'}</option>`).join('')}</select></div>
      <div class="fld"><label class="sub" for="f-tee">Tees</label><select id="f-tee" class="field">${tees.length ? tees.map(([k, t]) => `<option value="${k}"${r && r.tee === k ? ' selected' : ''}>${esc(t.name)} · ${t.slope} / ${t.rating}</option>`).join('') : '<option value="">Add tees to the course first</option>'}</select></div>
      ${field('f-date', 'Date', r ? r.date : '', 'type="date"')}
      <div class="two-col">${field('f-tee-time', 'First tee', r ? r.first_tee : '', 'type="time"')}${field('f-interval', 'Minutes between groups', r && r.interval ? r.interval : 8, 'inputmode="numeric"')}</div>
      <div class="two-col">${field('f-trip', 'Trip', r ? r.trip : '', 'placeholder="None"')}${field('f-day', 'Day', r ? r.trip_day : '', 'inputmode="numeric"')}</div>
      <div class="two-col">${field('f-ntp', 'Nearest the pin holes', ntp, 'inputmode="numeric" placeholder="7, 15"')}${field('f-ld', 'Longest drive holes', ld, 'inputmode="numeric" placeholder="12"')}</div>
      ${formErr()}
      <button class="btn" type="submit">Save</button>
    </form>`
  };
};

/* ----- Who is playing, and the draw ----- */
function draftFor(r) {
  if (!UI.draft || UI.draft.rid !== r.id) {
    UI.draft = { rid: r.id, ids: r.groups ? r.groups.flatMap(g => g.teams.flat()) : [], groups: r.groups ? clone(r.groups) : null, repeats: [], sel: null };
  }
  return UI.draft;
}
function priorTripGroups(r) {
  if (!r.trip) return [];
  return D.rounds().filter(x => x.trip === r.trip && x.season === r.season && x.id !== r.id && x.groups && (x.trip_day || 0) < (r.trip_day || 99)).map(x => ({ rid: x.id, groups: x.groups }));
}
ORG.playing = p => {
  const r = D.round(p.rid);
  const d = draftFor(r);
  let html = `<header class="hero s">${navBack(roundName(r))}<div class="head"><h1 class="title">Groups and buggies</h1></div></header>`;
  if (!d.groups) {
    html += sec(label(`Playing · ${d.ids.length}`), cardOf(D.active().map(m => {
      const on = d.ids.includes(m.id);
      return `<button class="row" data-act="org-toggle-player" data-pid="${m.id}" aria-pressed="${on}"><span>${esc(m.name)}${isGuest(m) ? ' <span class="pill n">Guest</span>' : ''}</span>${on ? `<span class="c-g">${sized(ICON.check, 20)}</span>` : ''}</button>`;
    }).join('') + `<button class="row" data-act="org-go" data-v="guest" data-rid="${r.id}"><span class="c-g" style="display:inline-flex;align-items:center;gap:8px">${sized(ICON.plus, 20)}Add a guest</span></button>`), true);
    const priorFinal = r.trip ? D.rounds().filter(x => x.trip === r.trip && x.season === r.season && x.id !== r.id && x.status === 'final' && (x.trip_day || 0) < (r.trip_day || 99)) : [];
    if (d.ids.length >= 2) {
      html += `<button class="btn" data-act="org-draw" data-kind="random">Draw groups</button>`;
      if (priorFinal.length) html += `<button class="btn quiet" style="margin-top:8px" data-act="org-draw" data-kind="standings">Leaders out last</button>`;
    }
    return { html };
  }
  const sel = d.sel;
  html = html.replace('</header>', `<p class="sub head-sub">${plural(d.ids.length, 'player')} · first tee ${esc(r.first_tee || 'not set')}</p></header>`);
  if (d.repeats.length) html += `<div class="banner note">${d.repeats.map(x => `${esc(x.pair.map(D.nameOf).join(' & '))} shared a buggy before`).join('<br>')}</div>`;
  const times = E.teeTimesFrom(r.first_tee || '', r.interval || 8, d.groups.length);
  const holeCount = (holesOf(r) || []).length || 18;
  d.groups.forEach((g, gi) => {
    const sh = g.startHole || 1;
    const startRow = `<div class="row"><label for="sh-${gi}">Starts on hole</label><select id="sh-${gi}" class="field short" data-change="start-hole" data-gi="${gi}" aria-label="Group ${gi + 1} starts on hole">${Array.from({ length: holeCount }, (_, k) => `<option value="${k + 1}"${sh === k + 1 ? ' selected' : ''}>${k + 1}</option>`).join('')}</select></div>`;
    html += sec(`<span class="b">Group ${gi + 1}</span><span class="sub">${esc(sh !== 1 ? 'Hole ' + sh + ' · ' : '')}${esc(times[gi] || '')}</span>`, cardOf(startRow + g.teams.map((t, i) => t.map(pid =>
      `<button class="row${sel === pid ? ' picked' : ''}" data-act="org-swap" data-pid="${pid}"><span style="display:flex;align-items:center;gap:8px">${g.teams.length > 1 ? dot(i) : ''}${esc(D.nameOf(pid))}</span>${g.teams.length > 1 ? `<span class="cap">Buggy ${i + 1}</span>` : ''}</button>`).join('')).join('')), true);
  });
  html += `<button class="btn" data-act="org-save-groups">Save groups</button>
    <div class="foot"><button class="link" data-act="org-draw" data-kind="again">Draw again</button><button class="link" data-act="org-draw" data-kind="players">Change players</button></div>`;
  return { html };
};
ORG.groupsview = p => {
  const r = D.round(p.rid);
  return { html: `<header class="hero s">${navBack(roundName(r))}<div class="head"><h1 class="title">Groups and buggies</h1></div></header>${groupsBlock(r, false)}` };
};

ORG.kb = p => {
  const r = D.round(p.rid);
  const d = UI.kbDraft && UI.kbDraft.rid === r.id ? UI.kbDraft : (UI.kbDraft = { rid: r.id, pairs: r.kb ? clone(r.kb) : [], sel: null });
  let html = `<header class="hero s">${navBack(roundName(r))}<div class="head"><h1 class="title">KBs</h1></div></header>`;
  if (!r.groups || !r.groups.length) return { html: html + sec('', cardOf('<div class="row sub">Draw the groups first</div>'), true) };
  if (!d.pairs.length) return { html: html + `<button class="btn" data-act="org-kb-make">Make KB pairs</button>` };
  html += sec('', cardOf(d.pairs.map(pr => `<div class="row">${pr.map(pid => `<button class="chip${d.sel === pid ? ' on' : ''}" data-act="org-kb-swap" data-pid="${pid}">${esc(D.nameOf(pid))}</button>`).join('<span class="sub">&</span>')}</div>`).join('')), true);
  html += `<button class="btn" data-act="org-kb-save">Save KBs</button><div class="foot"><button class="link" data-act="org-kb-make">Shuffle</button><button class="link c-b" data-act="org-kb-clear">No KBs</button></div>`;
  return { html };
};

/* ----- Corrections and contests ----- */
ORG.group = p => {
  const comp = computeR(p.rid);
  const gc = comp.groups.find(g => g.id === p.gid);
  const pids = gc.teams.flat();
  const head = `<div class="orow"><span class="cap">Hole</span>${pids.map((pid, i) => `<span class="cap b ${i < 2 ? 'c-a' : 'c-b'}">${esc(D.nameOf(pid))}</span>`).join('')}</div>`;
  const rows = gc.order.map(n => `<button class="orow" data-act="org-go" data-v="correct" data-rid="${p.rid}" data-gid="${p.gid}" data-n="${n}" aria-label="Correct hole ${n}"><span class="b">${n}</span>${pids.map(pid => {
    const hp = comp.players[pid].holes[n];
    return `<span>${hp.gross === null ? '<span class="sub">–</span>' : `${hp.gross === 'P' ? '–' : hp.gross}<sup>${hp.points}</sup>`}</span>`;
  }).join('')}</button>`).join('');
  const checks = ['front', 'back'].map(sg => {
    const c = D.check(p.rid, gc.id, sg);
    const st = !c ? 'Not checked' : c.resolved ? `Checked${c.changes ? ` · ${plural(c.changes, 'change')}` : ''}` : c.status === 'reading' ? 'Reading' : 'Open';
    return `<${c ? 'button' : 'div'} class="row"${c ? ` data-act="photo-full" data-rid="${p.rid}" data-gid="${gc.id}" data-seg="${sg}"` : ''}><span>${segName(sg)}</span><span class="right ${c && c.resolved ? 'c-g' : 'sub'}">${st}${c ? chev : ''}</span></${c ? 'button' : 'div'}>`;
  }).join('');
  return {
    html: `<header class="hero s">${navBack(roundName(D.round(p.rid)))}<div class="head"><h1 class="title">Group ${gc.n}</h1></div><p class="sub">${esc(gc.labels.map(l => l.long).join(' v '))}</p></header>
    ${sec(label('Card check'), cardOf(checks), true)}
    ${sec('', cardOf(head + rows), true)}`
  };
};
ORG.correct = () => VIEWS.entry();
ORG.contest = p => {
  const n = Number(p.n);
  const c = contestOn(p.rid, n);
  const claims = (D.claims(p.rid)[n] || []).slice().reverse();
  const win = D.winners(p.rid)[n];
  const fmtT = iso => { try { return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
  return {
    html: `<header class="hero s">${navBack(roundName(D.round(p.rid)))}<div class="head"><h1 class="title">${CONTEST[c.type]} · ${n}</h1></div><p class="sub">Latest claim first</p></header>
    ${sec('', cardOf(claims.length ? claims.map(cl => `<div class="row"><span>${esc(D.nameOf(cl.pid))} <span class="sub">· group ${groupNo(p.rid, cl.gid)} · ${fmtT(cl.at)}</span></span>
      ${win === cl.pid ? `<button class="link" data-act="org-unwin" data-rid="${p.rid}" data-n="${n}">Winner ${sized(ICON.check, 18)}</button>` : `<button class="link" data-act="org-win" data-rid="${p.rid}" data-n="${n}" data-pid="${cl.pid}">Confirm</button>`}</div>`).join('') : '<div class="row sub">No claims yet</div>'), true)}`
  };

/* The round with one player swapped for another (or removed). KBs and handicap fixes follow the swap. */
function withPlayerChanged(r, pid, newPid) {
  const groups = r.groups.map(g => Object.assign({}, g, { teams: g.teams.map(t => t.map(x => x === pid ? newPid : x).filter(Boolean)).filter(t => t.length) })).filter(g => g.teams.length);
  const kb = r.kb ? r.kb.map(pr => pr.map(x => x === pid ? newPid : x)).filter(pr => pr.length === 2 && pr.every(Boolean)) : r.kb;
  const ph = r.ph ? Object.fromEntries(Object.entries(r.ph).filter(([k]) => k !== pid)) : r.ph;
  return Object.assign({}, r, { groups, kb: kb && kb.length ? kb : null, ph: ph && Object.keys(ph).length ? ph : null });
}

function exportCsv() {

/* ----- Preview only: finish the other groups ----- */
function demoFill() {
  const rid = liveRid();
  if (!rid) return;
  const comp = computeR(rid);
  const mine = myGroup(rid);
  let seed = 7 + view().log.length;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const filled = [];
  comp.groups.forEach(gc => {
    if (mine && gc.id === mine.id) return;
    let any = false;
    gc.order.forEach(n => {
      const scores = {};
      gc.teams.flat().forEach(pid => {
        if (comp.players[pid].holes[n].gross !== null) return;
        const h = holeOf(rid, n);
        const x = rnd();
        const dlt = x < 0.18 ? -1 : x < 0.62 ? 0 : x < 0.9 ? 1 : 2;
        scores[pid] = { v: Math.max(1, h.par + comp.players[pid].holes[n].shots + dlt), base: null };
      });
      if (Object.keys(scores).length) { any = true; send({ op: 'saveHole', round: rid, grp: gc.id, hole: n, scores, by: 'Demo' }); }
    });
    if (any) filled.push(gc.n);
  });
  toast(filled.length ? `Group${filled.length > 1 ? 's' : ''} ${filled.join(' and ')} finished` : 'Other groups are already finished');
}

  'retry-check': el => {

  'photo-full': el => {

  },
  'photo-close': () => { UI.photoFull = null; render(); },
  'test-card': el => { UI.testSheet = el.dataset.seg; render(); },
  'test-card-pick': el => startCheck(el.dataset.seg, { fixture: el.dataset.key }),

  /* organiser */
  org: () => { UI.org = true; UI.orgStack = [{ v: UI.orgUnlocked ? 'home' : 'lock', p: {} }]; UI.pinError = false; UI.scrollTop = true; render(); },
  'org-exit': () => { UI.org = false; UI.confirm = null; UI.scrollTop = true; render(); },
  'org-go': el => {
    const d = el.dataset;

  'org-new-round': () => { UI.formState = null; go('details', {}); },
  'org-toggle-player': el => { const d = UI.draft; const i = d.ids.indexOf(el.dataset.pid); if (i >= 0) d.ids.splice(i, 1); else d.ids.push(el.dataset.pid); render(); },
  'org-draw': el => {

    const kind = el.dataset.kind;
    if (kind === 'players') { d.groups = null; d.sel = null; render(); return; }
    const prior = priorTripGroups(r);
    let res;
    if (kind === 'standings' || (kind === 'again' && d.kind === 'standings')) {
      const done = D.rounds().filter(x => x.trip === r.trip && x.season === r.season && x.status === 'final' && x.id !== r.id && (x.trip_day || 0) < (r.trip_day || 99));
      const pts = done.map(x => pointsOf(x.id));
      const standings = E.rankRows(d.ids.map(pid => ({ id: pid, name: D.nameOf(pid), total: pts.reduce((s, p) => s + (p[pid] || 0), 0) })), 'total', 'desc');
      res = E.proposeDraw(standings, prior, []);
      d.kind = 'standings';
    } else {
      d.seed = (d.seed || Date.now() % 100000) + 17;
      res = E.randomDraw(d.ids, [], d.seed, prior);

    const a = d.sel, b = pid;
    d.groups.forEach(g => g.teams.forEach(t => t.forEach((x, i) => { if (x === a) t[i] = b; else if (x === b) t[i] = a; })));
    d.sel = null;
    d.repeats = E.repeatedPartners([...priorTripGroups(D.round(d.rid)), { rid: d.rid, groups: d.groups }]).filter(x => x.rounds.includes(d.rid));

  },
  'org-save-groups': () => {
    const r = D.round(cur().p.rid);
    const d = draftFor(r);
    const times = E.teeTimesFrom(r.first_tee || '', r.interval || 8, d.groups.length);
    const groups = d.groups.map((g, i) => ({ id: 'g' + (i + 1), n: i + 1, teeTime: times[i] || '', startHole: g.startHole || 1, teams: g.teams }));

    const kb = r.kb && r.kb.every(pr => pr.every(pid => ids.has(pid))) ? r.kb : null;
    put('rounds', [Object.assign({}, r, { groups, kb })], { action: 'Groups saved', detail: `${roundName(r)}: ${groups.map(g => `${g.teeTime} ${g.teams.map(t => t.map(D.nameOf).join(' & ')).join(' v ')}`).join('; ')}` });

    back();

  },
  'org-kb-make': () => { const r = D.round(cur().p.rid); const res = E.kbPairsFor(r.groups, (Date.now() % 100000) + 3); UI.kbDraft = { rid: r.id, pairs: res.pairs, sel: null }; render(); },
  'org-kb-swap': el => {
    const d = UI.kbDraft;
    const pid = el.dataset.pid;
    if (!d.sel || d.sel === pid) { d.sel = d.sel === pid ? null : pid; render(); return; }
    const a = d.sel;
    d.pairs.forEach(pr => pr.forEach((x, i) => { if (x === a) pr[i] = pid; else if (x === pid) pr[i] = a; }));
    d.sel = null;
    render();
  },
  'org-kb-save': () => { const r = D.round(cur().p.rid); put('rounds', [Object.assign({}, r, { kb: UI.kbDraft.pairs })], { action: 'KBs saved', detail: `${roundName(r)}: ${UI.kbDraft.pairs.map(pr => pr.map(D.nameOf).join(' & ')).join('; ')}` }); UI.kbDraft = null; back(); toast('KBs saved'); },
  'org-kb-clear': () => { const r = D.round(cur().p.rid); put('rounds', [Object.assign({}, r, { kb: null })], { action: 'KBs removed', detail: roundName(r) }); UI.kbDraft = null; back(); },
  'org-win': el => {
    const n = Number(el.dataset.n);
    put('winners', [{ round: el.dataset.rid, hole: n, player: el.dataset.pid }], { action: 'Contest winner confirmed', detail: `${roundName(D.round(el.dataset.rid))} · ${CONTEST[contestOn(el.dataset.rid, n).type]} on ${n}: ${D.nameOf(el.dataset.pid)}` });
