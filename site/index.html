.gcpl { display: inline-flex; align-items: center; gap: 8px; min-width: 0; font-weight: 600; font-size: .95rem; }
.gcpl span:last-child { overflow-wrap: anywhere; }
.gcx { margin-top: 10px; border-top: 1px solid var(--line, rgba(0,0,0,.08)); }
.gcx .mgp { color: var(--text); border-top: 0; border-bottom: 1px solid rgba(0,0,0,.06); }
.gcx .mgh small { color: var(--sub); }
.kbs { display: grid; gap: 10px; }
.kbcard { display: flex; align-items: center; gap: 14px; min-height: 68px; padding: 12px 16px; border-radius: 22px; background: #fff; box-shadow: var(--ring); }
.kbn { flex: 1; min-width: 0; font-size: 1.05rem; font-weight: 800; overflow-wrap: anywhere; }
.kbg { flex: none; font-size: .8rem; font-weight: 800; letter-spacing: .04em; color: var(--sub); background: var(--fill); padding: 5px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.kbcard .stack { display: inline-flex; gap: 4px; flex: none; }
.kbcard .stack .av { margin-left: 0; flex: none; }
.mgt { flex-wrap: wrap; gap: 4px 12px; }
.mgk { white-space: nowrap; }

/* ----- Hole screen v3: calm. One white card per buggy with a thin blue or red edge, no pills, one slim row per player. ----- */
.hero.pine.entcard { padding: 12px 16px; }
.entn { font-size: 3.6rem; }
.entcard .prog { margin-top: 8px; }
.entry .bugs { --tc: rgba(20, 35, 27, .14); container-type: inline-size; margin-top: 12px; background: #fff; border: 2px solid var(--tc); border-radius: 22px; overflow: hidden; }
.entry .bugs.b0 { border-width: 1px; }
.entry .bugs.b1 { --tc: var(--team-a); }
.entry .bugs.b2 { --tc: var(--team-b); }
.entry .bugs + .tiles { margin-top: 10px; }
.entry .bugs .pr.ptile { display: grid; grid-template-columns: minmax(0, 1fr) 48px minmax(64px, max-content) 48px; grid-template-areas: "nm dn sc up" "pu dn sc up"; align-items: center; column-gap: 6px; row-gap: 0; min-height: 0; margin: 0; padding: 6px 10px 6px 14px; border: 0; border-radius: 0; background: none; box-shadow: none; }
.entry .bugs .ptile ~ .ptile { border-top: 1px solid rgba(20, 35, 27, .08); }
.entry .bugs .pr-top, .entry .bugs .stepper { display: contents; }
.entry .bugs .pr-top .nm { grid-area: nm; min-width: 0; min-height: 44px; padding: 0; font-size: 1.15rem; font-weight: 800; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; text-align: left; gap: 2px; }
.entry .bugs .nmrow { display: flex; align-items: center; gap: 4px; min-width: 0; line-height: 1.15; white-space: nowrap; }
.entry .bugs .pr-dots { display: flex; justify-content: flex-start; align-items: center; min-height: 10px; margin: 0; padding: 0; }
.entry .bugs .pr-dots .dots { margin: 0; justify-content: flex-start; }
.entry .bugs .pr-top .nm .dots.s { display: flex; margin: 0; }
.entry .bugs .pr-top .pu, .entry .bugs .pr-top .pu.on { grid-area: pu; justify-self: start; width: auto; height: 44px; min-height: 44px; padding: 0 2px; margin: 0; border: 0; border-radius: 22px; background: none; color: var(--sub); font-size: .85rem; font-weight: 700; white-space: nowrap; }
.entry .bugs .pr-top .pu.on { background: var(--green); color: #fff; padding: 0 14px; }
.entry .bugs .stv, .entry .bugs button.stv, .entry .bugs div.stv { grid-area: sc; width: 100%; height: 60px; justify-content: center; gap: 2px; }
.entry .bugs .stv b { font-size: 2.3rem; }
/* Three digits (only from a correction on the organiser's sheet) are a little smaller so they clear - and +; the score column also grows if they still need more room. */
.entry .bugs .stv b.wide { font-size: 1.75rem; }
.entry .bugs .stv b sup { color: var(--pine); font-size: 1.05rem; }
.entry .bugs .stv small { color: var(--sub); font-size: .68rem; }
.entry .bugs .stv.none { font-size: .95rem; }
.entry .bugs .st { width: 48px; height: 48px; border-radius: 50%; font-size: 1.6rem; font-weight: 600; background: var(--fill); color: var(--text); border: 0; }
.entry .bugs .st[data-dir="down"] { grid-area: dn; justify-self: auto; }
.entry .bugs .st[data-dir="up"] { grid-area: up; justify-self: auto; background: var(--pine); color: #fff; }
.entry .bugs .st:disabled { opacity: .3; }
.entry .bugs > .dropcard.in { margin: 0; padding: 0 0 8px; background: #fff; border-top: 1px solid var(--line); border-radius: 0; }
.entry .bugs .dropwho { font-weight: 800; padding: 8px 14px 0; }
/* Room for it all on one line: Pick up sits between the name and the minus. With big text it drops under the name instead. */
@container (min-width: 19.5em) {
  .entry .bugs .pr.ptile { grid-template-columns: minmax(0, 1fr) auto 44px minmax(60px, max-content) 44px; grid-template-areas: "nm pu dn sc up"; }
  .entry .bugs .st { width: 44px; height: 44px; }
  .entry .bugs .pr-top .pu, .entry .bugs .pr-top .pu.on { justify-self: end; padding: 0 8px; }
  .entry .bugs .pr-top .pu.on { padding: 0 12px; }
}

/* Every pill is a true pill, whatever its height (the big Buggy 1 pill had squarer corners than the small ones) */
.pill, .pill.big { border-radius: 999px; }

/* ----- After Save: one quiet card. Result, then one line per match. ----- */
.after .hero.pine.entcard { padding: 10px 16px 12px; }
.after .entn { font-size: 3rem; }
.after .entr { flex-direction: row; align-items: center; gap: 4px; padding-bottom: 2px; }
.after .savedchip { font-size: 1rem; }
.after .entr .undochip { margin: 0; min-height: 44px; padding: 0 10px; background: none; color: #BFD6C8; text-decoration: underline; font-size: .95rem; }
.aftercard { margin-top: 14px; background: #fff; border: 1px solid #E6E2D8; border-radius: 22px; overflow: hidden; box-shadow: none; }
.afhead { padding: 16px 18px 14px; }
.afhead .res { gap: 10px; flex-wrap: nowrap; }
.afhead .res-t { font-size: 1.45rem; font-weight: 800; letter-spacing: -.02em; }
.afhead .res-sub { margin: 4px 0 0 24px; font-size: 1rem; color: var(--sub); }
.afdot { display: inline-block; flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--faint); margin-right: 8px; }
.afhead .afdot { width: 14px; height: 14px; margin: 0; }
.afdot.a { background: var(--team-a); }
.afdot.b { background: var(--team-b); }
.afrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px; border-top: 1px solid #EFEBE1; }
.afrow b { display: block; font-size: 1.05rem; font-weight: 700; }
.afrow small { display: block; font-size: .8rem; color: var(--sub); }
.afst { text-align: right; }
.afst .b { display: inline-flex; align-items: center; font-size: 1.05rem; font-weight: 800; }
.afst .afnote { margin-top: 2px; font-weight: 700; color: var(--pine); }
.after .btn:not(.quiet) { margin-top: 14px; background: var(--action); color: var(--on-action); }
.after .btn:not(.quiet) small { color: var(--on-action); opacity: .8; }

/* ===== Contests: picker tags, arrival pop-up, "Who got it?" ===== */
.hs { position: relative; }
.hs-tag { position: absolute; top: -9px; right: -3px; height: 20px; padding: 0 8px; border-radius: 10px; background: var(--action); color: var(--on-action); font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; line-height: 1; letter-spacing: 0; }
.hs-tag.ok { background: #fff; color: var(--green); box-shadow: inset 0 0 0 1.5px var(--green); }
.hs-key .hs-tag { position: static; margin-right: 4px; }
.hs-key .hs-ki:has(.hs-tag) { gap: 0; }
.scrim.intro { align-items: center; padding: 20px; }
.introcard { width: 100%; max-width: 420px; border-radius: 32px; background: var(--pine); color: #fff; padding: 30px 24px 24px; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
.introflag { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: var(--action-inverse); color: var(--on-action-inverse); margin: 0 auto 18px; }
.introkind { font-size: .8rem; font-weight: 800; letter-spacing: .16em; color: var(--award); }
.introhole { font-size: 3.4rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; margin-top: 6px; font-variant-numeric: tabular-nums; }
.introrule { font-size: 1.15rem; line-height: 1.35; margin: 10px 0 0; color: #E6EFE9; }
.introboard { margin: 18px 0 0; border-radius: 18px; background: rgba(255,255,255,.1); padding: 12px 14px; font-size: 1rem; color: #E6EFE9; }
.introcard .btn { margin-top: 22px; background: var(--action-inverse); color: var(--on-action-inverse); }
.ask .askkind { margin: 18px 4px 0; font-size: .8rem; font-weight: 800; letter-spacing: .14em; color: var(--pine); }
.ask .askq { margin: 4px 4px 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
.ask .asksub { margin: 6px 4px 0; }
.askrows { margin: 14px 0 16px; border: 1px solid var(--line, #E6E2D8); border-radius: 22px; background: #fff; overflow: hidden; }
.askrow { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 60px; padding: 0 18px; border: 0; border-top: 1px solid #EFEBE1; background: #fff; font: inherit; font-size: 1.2rem; font-weight: 700; color: var(--text); text-align: left; }
.askrow:first-child { border-top: 0; }
.askrow.on { background: #EAF3EC; }
.askdot { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid #CFCABB; box-sizing: border-box; display: block; }
.askrow.on .askdot { background: var(--green); border-color: var(--green); box-shadow: inset 0 0 0 5px #EAF3EC; }
.ask .btn { background: var(--action); color: var(--on-action); }
.ask .btn:disabled { opacity: .4; }

/* ===== Finished round ===== */
.fin .fincard { margin: 8px 0 0; border-radius: 26px; background: var(--pine); color: #fff; padding: 18px 20px 20px; }
.fin .finrow { display: flex; justify-content: space-between; align-items: center; }
.fin .fink { font-size: .8rem; font-weight: 800; letter-spacing: .14em; color: var(--award); }
.fin .finfinal { font-size: .9rem; font-weight: 700; color: #CFE0D6; }
.fin .finwin { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; }
.fin .finwho { min-width: 0; }
.fin .finname { display: block; font-size: 2.2rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; overflow-wrap: anywhere; }
.fin .finsub { margin: 4px 0 0; font-size: .95rem; font-weight: 400; letter-spacing: 0; color: #CFE0D6; }
.fin .finpts { flex: none; font-size: 3.6rem; font-weight: 800; line-height: 1; color: var(--award); font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
.fin .finmore { justify-content: center; color: var(--green); font-weight: 700; }
.fin > .btn { background: var(--action); color: var(--on-action); margin-top: 20px; }
.fin .hero.s { padding-bottom: 0; }

/* ===== Calm pass: Home, round page, leaderboard, Ruling ===== */
/* One quiet row of tabs instead of big filled pills */
.seg.pills, .seg.pills.four { display: flex; flex-wrap: nowrap; gap: 2px; background: var(--press); padding: 3px; border-radius: 999px; margin: 14px 0 8px; }
.seg.pills button, .seg.pills.four button { flex: 1 1 0; min-width: 0; width: auto; min-height: 44px; padding: 0 4px; border-radius: 999px; background: none; box-shadow: none; color: var(--sub); font-size: .86rem; font-weight: 700; white-space: normal; line-height: 1.1; overflow-wrap: normal; }
.seg.pills button.on, .seg.pills.four button.on { background: #fff; color: var(--pine); font-weight: 800; box-shadow: 0 1px 3px rgba(20, 35, 27, .16); }
/* The big moment only: no decorative circles */
.hero.pine::after, .hero.home .now::after, .feat::after { display: none; }
/* One pine action on the round page */
.hero.s ~ .btn:not(.quiet) { background: var(--action); color: var(--on-action); }
/* Ruling: the mic is just the mic, and the situations share one calm tint */
.ah-mic { box-shadow: none; }
.sit:nth-child(n) .sit-i { background: #E3EFE6; }
/* Home: quiet rows */
.hero.home .greet { margin-bottom: 4px; }
/* The greeting sits beside the crest on one line: crest, greeting, then your initials (tap to change who you are).
   It replaces the date line and the wordmark. It wraps beside the crest when long or at large text sizes. */
.hero.home .brand { align-items: center; }
.hero.home .brand .greet { flex: 1; min-width: 0; margin: 0; font-size: 1.45rem; line-height: 1.2; font-weight: 600; color: var(--text); letter-spacing: -.01em; text-wrap: balance; overflow-wrap: anywhere; }
.hero.home .brand .greet.long { font-size: 1.2rem; }   /* a long greeting ("Marbella's nearly here, Bartholomew") keeps to two lines on most phones */
.hero.home .who-chip { align-self: center; flex: none; }
.hero.home .who-chip.only-av { width: 44px; padding: 0; justify-content: center; background: none; box-shadow: none; }
.hero.home .who-chip.only-av .who-av { width: 44px; height: 44px; font-size: .85rem; }
/* Organiser: one calm tint for the menu icons */
.row .ic { background: #E3EFE6 !important; color: var(--pine) !important; }

/* ===== Round page (coming up or live): this player's day in the pine card, then four tabs ===== */
.hero.pine.rp-card { padding: 18px 20px 20px; }
.rp-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.rp-kind { font-size: .8rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--award); }
.rp-fmt { font-size: .9rem; font-weight: 700; color: #CFE0D6; }
.rp-name { margin: 8px 0 -.08em; padding-bottom: .08em; font-size: clamp(1.15rem, calc(var(--t-display-fit) / var(--len, 1)), 2rem); font-weight: 800; letter-spacing: -.02em; line-height: 1.08; color: #fff; overflow-wrap: anywhere; }
.rp-line { margin: 6px 0 0; font-size: .9rem; color: #CFE0D6; }
.rp-you { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, .16); }
.rp-time { display: flex; flex-direction: column; }
.rp-time b { font-size: min(2.6rem, 44px); font-weight: 800; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: #fff; }
.rp-time span { font-size: .78rem; color: #9FC0AE; margin-top: 4px; }
.rp-you dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; font-size: .9rem; }
.rp-you dt { color: #9FC0AE; }
.rp-you dd { margin: 0; font-weight: 700; color: #fff; }
.rp-go { display: grid; margin-top: 18px; }
.rp-go .go { background: var(--action-inverse); color: var(--on-action-inverse); font-size: 1.15rem; font-weight: 800; border-radius: 28px; min-height: 56px; }
/* Tabs: separate pills in one row, the chosen one filled pine */
.seg.pills, .seg.pills.four { display: flex; flex-wrap: nowrap; gap: 6px; background: none; padding: 0; border-radius: 0; margin: 16px 0 12px; }
.seg.pills button, .seg.pills.four button { flex: 1 1 0; min-width: 0; min-height: 44px; padding: 0 2px; border-radius: 22px; background: #fff; box-shadow: inset 0 0 0 1px #E6E2D8; color: var(--text); font-size: .86rem; font-weight: 700; white-space: normal; overflow-wrap: normal; line-height: 1.1; }
.seg.pills button.on, .seg.pills.four button.on { background: var(--pine); color: #fff; box-shadow: none; font-weight: 800; }
/* Groups: one row per tee time, equal blue and red pills */
.rp-groups .rg { display: grid; grid-template-columns: 2.9rem minmax(0, 1fr) minmax(0, 1fr) 14px; gap: 8px; align-items: center; width: 100%; min-height: 56px; padding: 8px 12px; text-align: left; }
.rp-groups .rg + .rg, .rp-groups .rg-open + .rg { border-top: .5px solid var(--line); }
.rp-groups .rg.me { background: var(--action-tint); }
.rg-t { display: flex; flex-direction: column; font-variant-numeric: tabular-nums; min-width: 0; }
.rg-t b { font-size: .9rem; font-weight: 800; }
.rg-t small { font-size: .68rem; color: var(--sub); white-space: nowrap; }
.rg .chev svg { width: 14px; height: 14px; }
.rg-open { border-top: .5px solid var(--line); background: var(--bg); }
.pb, .pr, .pk { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 36px; padding: 3px 8px; border-radius: 18px; border: 2px solid; font-size: .82rem; font-weight: 600; line-height: 1.15; background: #fff; min-width: 0; color: var(--text); }
.pb { border-color: var(--team-a); }
.pr { border-color: var(--team-b); }
.pk { border-color: #C9D2CC; }
.pk.me { background: var(--action-tint); border-color: var(--action); }
.pk.wide { grid-column: span 2; }
.rg-team { grid-column: span 2; display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: .95rem; }
.rp-kbs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 12px; }
.rp-about { white-space: pre-line; line-height: 1.45; }

/* ===== Buggy Wars: the two pairs, three result rows, front and back open to their holes ===== */
.bw-vs { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 4px 0 12px; }
.bw-pair { display: inline-flex; gap: 4px; }
.bw-bd { width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: .7rem; font-weight: 800; letter-spacing: .02em; }
.bw-bd.a { background: var(--team-a); }
.bw-bd.b { background: var(--team-b); }
.bw-card .bw-row { display: grid; grid-template-columns: minmax(0, 1fr) min(10.5rem, 168px) 16px; gap: 10px; align-items: center; width: 100%; min-height: 56px; padding: 8px 16px; text-align: left; }
.bw-card .bw-row + .bw-row, .bw-card .bw-board + .bw-row { border-top: .5px solid var(--line); }
.bw-l { font-size: var(--t-body); font-weight: 600; }
.bw-res { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 34px; padding: 2px 10px; border-radius: 17px; color: #fff; font-size: .9rem; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
.bw-res.a { background: var(--team-a); }
.bw-res.b { background: var(--team-b); }
.bw-res.n { background: var(--press); color: var(--text); }
.bw-row .chev svg { width: 16px; height: 16px; }
.bw-board { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)) minmax(2.6rem, auto); gap: 3px; padding: 2px 12px 12px; }
.bw-col { display: flex; flex-direction: column; gap: 3px; align-items: stretch; min-width: 0; padding: 0; }
.bw-n { height: 18px; display: flex; align-items: center; justify-content: center; font-size: .66rem; font-weight: 700; color: var(--sub); font-variant-numeric: tabular-nums; border-radius: 5px; }
.bw-n.cur { background: var(--action-tint); color: var(--pine); box-shadow: inset 0 0 0 1.5px var(--action); }
.bw-c, .bw-t { height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.bw-c { background: #F1F3F1; color: var(--sub); }
.bw-c.wa { background: var(--team-a); color: #fff; font-weight: 800; }
.bw-c.wb { background: var(--team-b); color: #fff; font-weight: 800; }
.bw-c.e { background: none; box-shadow: inset 0 0 0 1px var(--line); }
.bw-t { background: #fff; font-weight: 800; font-size: .88rem; }
.bw-t.a { color: var(--team-a); box-shadow: inset 0 0 0 2px var(--team-a); }
.bw-t.b { color: var(--team-b); box-shadow: inset 0 0 0 2px var(--team-b); }
.bw-tot .bw-n { font-size: .62rem; }
/* Tabs size to their words, so "Buggy Wars" stays on one line; with very large text they move onto a second row */
.seg.pills, .seg.pills.four { flex-wrap: wrap; }
.seg.pills button, .seg.pills.four button { flex: 1 1 auto; white-space: nowrap; padding: 0 10px; }
/* Drop-down arrows point down when closed and up when open */
.bw-row .chev.dn, .rg .chev.dn { transform: rotate(90deg); transition: transform .2s; }
.bw-row[aria-expanded="true"] .chev.dn, .rg[aria-expanded="true"] .chev.dn { transform: rotate(-90deg); }
.seg.pills button, .seg.pills.four button { font-size: min(.86rem, 15px); padding: 0 8px; }
.bw-l { display: inline-flex; align-items: center; gap: 6px; }
/* The gold cup beside anything won */
.cupw { display: inline-flex; vertical-align: -3px; margin-left: 6px; flex: none; }
.bw-l .cupw { margin-left: 0; }
.ct-won { display: inline-flex; align-items: center; }
.fin .finname .cupw svg { width: 26px; height: 26px; }
.fin .finname .cupw { vertical-align: -2px; margin-left: 8px; }
/* The cup is drawn in yellow in 00-core.js. On ivory it is a pine line with a pale pine fill (gold never carries
   meaning on ivory); on the pine winner card it is champagne, an award on pine. */
.cupw .cup path[fill="#F0C63F"] { fill: var(--action-tint); }
.cupw .cup path[stroke="#8A6400"] { stroke: var(--pine); }
.fincard .cupw .cup path[fill="#F0C63F"], .hero.pine .cupw .cup path[fill="#F0C63F"] { fill: var(--award); }
.fincard .cupw .cup path[stroke="#8A6400"], .hero.pine .cupw .cup path[stroke="#8A6400"] { stroke: var(--award); }

/* ===== Stats tab: the round in numbers as medals ===== */
.sbadges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 6px; padding: 18px 8px; }
.sbd { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; min-width: 0; }
.sbm { width: 78px; height: 78px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 4px var(--ring), 0 2px 6px rgba(0, 0, 0, .08); display: flex; align-items: center; justify-content: center; margin-bottom: 6px; flex: none; }
.sbt { font-size: .62rem; font-weight: 800; letter-spacing: .1em; color: var(--sub); text-transform: uppercase; line-height: 1.2; }
.sbw { font-size: .9rem; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
.sbn { font-size: .68rem; color: var(--sub); line-height: 1.25; }

/* Score entry: the "scores to go" pill floats on glass, like the tab bar */
/* Nothing behind the pill, so the glass shows the scores through it */
#app .entry .savebar, #app:not(.no-tabs) .entry .savebar, .entry + .savebar { background: none !important; box-shadow: none !important; }
/* The same glass as the tab bar (Glass v6) */
.savebar .btn.quiet {
  background: linear-gradient(180deg, rgba(255, 255, 255, .26), rgba(255, 255, 255, .10) 55%, rgba(255, 255, 255, .20));
  -webkit-backdrop-filter: blur(5px) saturate(190%) brightness(1.06); backdrop-filter: blur(5px) saturate(190%) brightness(1.06);
  box-shadow:
    inset 0 1.5px 1px -.5px rgba(255, 255, 255, .95),
    inset 0 -1.5px 1px -.5px rgba(255, 255, 255, .55),
    inset 1.5px 0 1px -1px rgba(255, 255, 255, .6),
    inset -1.5px 0 1px -1px rgba(255, 255, 255, .6),
    inset 0 0 18px rgba(255, 255, 255, .22),
    0 0 0 .5px rgba(20, 35, 27, .16),
    0 10px 28px rgba(20, 35, 27, .16);
  color: #14231B; text-shadow: 0 0 6px rgba(255, 255, 255, .95), 0 0 2px rgba(255, 255, 255, .9);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .savebar .btn.quiet { background: rgba(255, 255, 255, .92); } }

/* Home round card: a row that says where tapping the round goes */
.now-link { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 48px; margin-top: 14px; padding: 0 14px; border-radius: 14px; background: rgba(255, 255, 255, .1); color: #fff; font-size: .9rem; font-weight: 600; text-align: left; position: relative; z-index: 1; }
.now-link .chev { color: #CFE0D6; }
.now-link:active { background: rgba(255, 255, 255, .18); }
.now-link + .now-acts { margin-top: 12px; }

/* Round page: Players tab */
.rp-players .pl-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) 3.2rem 3.4rem 14px; gap: 8px; align-items: center; width: 100%; min-height: 56px; padding: 6px 14px; text-align: left; font-variant-numeric: tabular-nums; }
.rp-players .pl-row + .pl-row { border-top: .5px solid var(--line); }
.rp-players.scr .pl-row { grid-template-columns: 34px minmax(0, 1fr) 14px; }
.rp-players .pl-row.cols { min-height: 30px; padding-top: 10px; padding-bottom: 0; }
.rp-players .pl-row.me { background: var(--action-tint); }
.rp-players .pl-n { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.rp-players .pl-row .r { text-align: right; }
.rp-players .pl-row .b.num { font-size: 1.15rem; font-weight: 800; }
.rp-players .av { width: 34px; height: 34px; font-size: .68rem; }
.rp-players .chev svg { width: 14px; height: 14px; }

/* Stats medals: pine with a champagne line icon (an award on pine; the same drawing style as the tab bar) */
.sbm { background: var(--pine) !important; color: var(--award); box-shadow: none !important; }
.sbt { word-break: keep-all; hyphens: none; }
/* At large text sizes the medals go two across, so every label fits */
.sbadges { grid-template-columns: repeat(auto-fill, minmax(max(30%, 6.2rem), 1fr)); }

/* Ruling: mic A, a chunky pine mic filling the ivory circle, with a soft ivory halo */
.ah-mic { width: 92px !important; height: 92px !important; background: var(--action-inverse); color: var(--on-action-inverse); box-shadow: 0 0 0 6px rgba(250, 248, 243, .18), 0 0 0 12px rgba(250, 248, 243, .08) !important; }
.ah-mic svg { width: 58px !important; height: 58px !important; }

/* Display type (owner, 21 October): one serif title at the top of each screen, and the words in the hole header
   ("HOLE", "Par 3", "Index 14 · 148 yds"), plus the subtitle under each title, Home's date line and section labels. The big hole number, player names (including a person's own page title,
   marked .is-name), scores, buttons and the tab bar stay in the system font. */
.hero.home .now-name, .rp-name { font-family: var(--font-display); font-variant-numeric: lining-nums; letter-spacing: -.01em; }
h1.title:not(.is-name), h1.big, .entl small, .entr > b, .entr > b + span { font-family: var(--font-display); }
/* A lighter sprinkling (owner, 21 October): the line under each title, the date line on Home and section labels.
   A subtitle that is a list of player names is marked .names and stays in the system font, like every name. */
header.hero:not(:has(.is-name)) > p.sub:not(.names), .greet, .sec-label > .sub { font-family: var(--font-display); font-variant-numeric: lining-nums tabular-nums; }
/* Ruling (owner, 21 October): the header matches the other screens. The serif goes on the eyebrow, the question and the
   line under it, the heavy black weight comes down to the title weight, and the "common ones" label becomes a
   sentence-case section label like the others. */
.ah-txt small, .ah-txt b, .ah-txt > span, .sitlab { font-family: var(--font-display); font-variant-numeric: lining-nums tabular-nums; }
.ah-txt b { font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.hero.pine.askhero { gap: 26px; }   /* the mic's 12px halo sits outside its box, so leave room for it */
.sitlab { text-transform: none; letter-spacing: 0; font-size: var(--t-sub); font-weight: 700; color: var(--pine); }
h1.title:not(.is-name), h1.big, .hrow2 h1.big { font-variant-numeric: lining-nums tabular-nums; }
.entl small, .entr > b, .entr > b + span { font-variant-numeric: lining-nums tabular-nums; }

/* Long names: a name wraps onto another line instead of being cut off or running into a score, icon or button.
   Text keeps its size and buttons keep their size. A single word too long for its space breaks inside the word. */
.lname > span, .lrow .ln .n { overflow: visible; text-overflow: clip; white-space: normal; }
.ln .n, .pl-n > span, .sn .n, .hrow .nm > span, .rg .pb, .rg .pr, .rg .pk, .rp-kbs .pk, .lc-n, .ct-r .b { overflow-wrap: anywhere; hyphens: auto; }
.row > .chev, .row > .c-g { flex: none; }
.lc-row { flex-wrap: wrap; }
.lc-n { min-width: 0; }
.lc-p { flex: none; margin-left: auto; white-space: nowrap; }
.crow .ct-l { flex-shrink: 0; max-width: 55%; }
.ct-r { min-width: 0; white-space: normal; text-align: right; }
.ct-r .pill { white-space: nowrap; }
/* Score entry: a name that fits keeps the one-line row. A name that does not fit (fitNames in 30-play.js marks the
   row "long") gets the full width, and Pick up, minus, score and plus move to the line below, in the same places. */
.entry .bugs .pr.ptile.long { grid-template-areas: "nm nm nm nm" "pu dn sc up"; row-gap: 2px; }
.entry .bugs .ptile.long .nmrow { white-space: normal; }
.entry .bugs .ptile.long .nmrow > span { min-width: 0; overflow-wrap: anywhere; hyphens: auto; }
.entry .bugs .ptile.long .nmrow > svg { flex: none; }
@container (min-width: 19.5em) {
  .entry .bugs .pr.ptile.long { grid-template-areas: "nm nm nm nm nm" ". pu dn sc up"; }
}


/* After saving a hole (owner, 22 October): a small Buggy Wars card. It has the pair badges, then "Hole 15" with the
   hole's result pill, then each match with the same pills as the results page. Notes under the labels are quiet grey
   text, not links. */
.after .afvs { margin: 14px 0 10px; }
.after .aftercard.bw-card { margin-top: 0; padding: 0; }
.after .bw-l.afl { flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; }
.after .bw-l.afl small { display: block; font-size: .85rem; font-weight: 500; color: var(--sub); line-height: 1.3; }
.after .afres { min-height: 64px; }
.after .afres-sub { grid-column: 1 / -1; margin-top: -4px; font-size: .9rem; color: var(--sub); line-height: 1.35; }
.after .afbw { margin: 18px 0 0; justify-content: center; }   /* the 'Buggy Wars' heading above the after-save card, in the section-label serif */
.after .afbw + .afvs { margin-top: 6px; }
.after .afbw .sub { font-size: 1.3rem; }

/* Loading screen: the crest, not a placeholder tile (owner, 22 October) */
.loading .loading-crest { width: 88px; height: 88px; border-radius: 50%; background: none; }
.loading .loading-crest svg { width: 100%; height: 100%; display: block; }

/* Serif titles at bold, not extra-bold (owner, 22 October: "Marbella" and "Leaderboard" looked chunky). The serif's
   heaviest weight reads as a blob on a phone, and 700 keeps it crisp. The selectors match the heaviest earlier rules. */
.hero.c:not(.pine) .hrow2 h1.big, .hrow2 h1.big, h1.big, .hero.s h1.title:not(.is-name), h1.title:not(.is-name), .hero.home .now-name, .rp-name { font-weight: 700; letter-spacing: -.01em; }
/* Leaderboard and trip totals: still the strongest thing in the row, but bold not black (owner, 22 October: "over chunky"). */
.lrow .r .b, .lrow.goy .b.r { font-weight: 750; font-size: 1.55rem; letter-spacing: -.02em; }

/* Home: "The season" list (owner chose option C, 22 October) */
.hs-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 14px; min-height: 66px; text-align: left; }
.hs-ic { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: rgba(11, 61, 46, .08); color: var(--pine); }
.hs-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hs-t { font-weight: 600; font-size: 1.02rem; color: var(--text); }
.hs-s { font-size: .86rem; color: var(--sub); line-height: 1.3; overflow-wrap: anywhere; }

/* ----- Design review, 22 October: one green ----- */
/* The old bright green (#167A41) still coloured buttons, links, bars, chips and some leader numbers, so the app looked
   as if it had two brands. Pine is now the only green; its soft tint replaces the mint. The grey for secondary text is
   a touch darker so it reads better outdoors. */
:root { --green: var(--pine); --green-soft: #E3EFE6; --sub: #4A564F; }
.lrow:first-child .b.r, .lrow.goy:first-child .b.r, .srow.top .sv { color: var(--text); }   /* the leader is shown by the row tint and badge, not a coloured number */
.chart .cbar { fill: var(--pine); fill-opacity: .55; }
.chart .cbar.top { fill-opacity: 1; }
.link, .back-icon { font-weight: 500; }
.bar i { background: var(--pine); }
.stile.tb { --tone: var(--team-a); --soft: var(--team-a-soft); }
/* Neutral status pills ("Demo", "In progress") on ivory: warm grey, not the old yellow. Warnings (.banner) keep amber. */
.pill.w { background: #EDE9DF; color: var(--text); }
@keyframes flash { 50% { background: var(--action-tint); } }

/* ----- Design review, 22 October: hole rows ----- */
/* Every row has the same shape: the name (with its shot dots) on top, Pick up on its own line below, and - score + on
   the right spanning both lines. Pick up no longer sits right beside the minus (mis-taps), long names like
   "Donnacha" don't push the controls onto a second line, and all four rows line up. Pick up is an outlined pill, so
   it reads as a button. Shot dots are pine, not black. The 3² points superscript stays (owner). */
@container (min-width: 19.5em) {
  .entry .bugs .pr.ptile { grid-template-columns: minmax(0, 1fr) 48px minmax(64px, max-content) 48px; grid-template-areas: "nm dn sc up" "pu dn sc up"; row-gap: 2px; }
  .entry .bugs .st { width: 48px; height: 48px; }
  .entry .bugs .pr-top .pu, .entry .bugs .pr-top .pu.on { justify-self: start; }
}
.entry .bugs .pr-top .pu { padding: 0 14px; height: 36px; min-height: 36px; margin: 4px 0; border: 1.5px solid #D9D4C8; border-radius: 18px; color: var(--sub); font-weight: 600; font-size: .85rem; }
.entry .bugs .pr-top .pu.on { border-color: var(--pine); background: var(--pine); color: #fff; padding: 0 14px; }
.entry .dots i, .entry .dots.s i { background: var(--pine); }
.entry .dots.s i { width: 8px; height: 8px; }

/* ----- Design review, 22 October: one rule for "leader" and "you" ----- */
/* Leader: warm tint, and the badge pine with champagne initials. You: soft pine tint with a pine bar on the left, and
   the badge pine with white initials. If you lead, both apply. KBs "lowest" uses the leader tint, not the "you" style. */
.lrow:has(.av.is-me) { background: var(--action-tint); box-shadow: inset 3px 0 0 var(--pine); }
.lrow:has(.av.is-lead) { background: var(--lead-tint); }
.lrow.low { background: var(--lead-tint); box-shadow: none; }
.rp-groups .rg.me, .rp-players .pl-row.me { box-shadow: inset 3px 0 0 var(--pine); }
/* Stats: tint the top row only when there is a single leader, so ties don't turn whole cards beige. */
.srow.top:has(+ .srow.top), .srow.top + .srow.top { background: none; }

/* ----- Design review: section labels as a proper level ----- */
.sec-label > .sub { font-size: 1.2rem; font-weight: 600; color: var(--text); letter-spacing: -.01em; }
.entry .sec-label > .sub { font-size: 1.1rem; }

/* ----- Design review: the hole header keeps its shape after saving ----- */
/* Par, index and yards stay on the right as before. "Saved" and Undo sit on their own line above the progress bar.
   Undo is a ghost pill, not underlined link text. */
.after .afsaved { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 10px 0 2px; }
.after .afsaved .savedchip { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 16px; background: var(--on-pine-label); color: var(--pine); font-weight: 700; font-size: .95rem; }
.after .afsaved .undochip { min-height: 44px; padding: 0 18px; border: 1.5px solid rgba(255, 255, 255, .45); border-radius: 22px; background: none; color: #fff; font: inherit; font-weight: 600; font-size: .95rem; text-decoration: none; }

/* ----- Design review: small leftovers ----- */
.leadcard::after { display: none; }   /* the one ornament in the app: a faint disc behind the leader's points */
/* Home card during a live round: "Continue · Hole 7" is the main button; Players · Groups · KBs a quieter link under it. */
.now-acts .go-link { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 44px; margin-top: 6px; background: none; border: 0; color: rgba(255, 255, 255, .85); font: inherit; font-weight: 600; font-size: var(--t-sub); }
.now-acts .go-link:active { color: #fff; }
.after .entr { flex-direction: column; align-items: flex-end; gap: 0; }   /* Par over Index, as on the hole screen */
/* Pick up keeps a 44px tap area; the visible outline is a 36px pill drawn behind the word. */
.entry .bugs .pr-top .pu, .entry .bugs .pr-top .pu.on { position: relative; z-index: 0; height: 44px; min-height: 44px; margin: 0; border: 0; background: none; }
.entry .bugs .pr-top .pu::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; bottom: 4px; z-index: -1; border: 1.5px solid #D9D4C8; border-radius: 18px; }
.entry .bugs .pr-top .pu.on { color: #fff; }
.entry .bugs .pr-top .pu.on::before { border-color: var(--pine); background: var(--pine); }
/* A name too long for its line gets the whole top line; Pick up and the controls share the line below (4 columns now). */
@container (min-width: 19.5em) { .entry .bugs .pr.ptile.long { grid-template-areas: "nm nm nm nm" "pu dn sc up"; } }
/* "Cathal has an extra shot on Buggy 1 on 16", above the next-hole button (owner's wording, 22 October) */
.after .afedge { --edge: var(--team-a); display: flex; align-items: center; gap: 14px; margin: 14px 0 12px; padding: 14px 16px; border-radius: 18px;
  background: color-mix(in srgb, var(--edge) 9%, #fff); border: 1.5px solid color-mix(in srgb, var(--edge) 35%, #fff); }
.after .afedge.b { --edge: var(--team-b); }
.after .afedge + .afedge { margin-top: 0; }
.after .afedge-bd { flex: none; display: flex; }
.after .afedge-bd .bw-pair { display: flex; gap: 0; }
.after .afedge-bd .bw-bd { width: 48px; height: 48px; font-size: 1.05rem; }
.after .afedge-bd .bw-bd:not(:only-child) { width: 42px; height: 42px; font-size: .95rem; }
.after .afedge-bd .bw-bd + .bw-bd { margin-left: -4px; box-shadow: 0 0 0 2px #fff; }
.after .afedge p { margin: 0; min-width: 0; line-height: 1.25; text-wrap: balance; }
.after .afedge b { display: block; font-weight: 700; font-size: 1.1rem; color: var(--text); }
.after .afedge p span { display: block; margin-top: 2px; font-weight: 600; color: var(--edge); }

/* Rule chips under a ruling (owner, 22 October): every rule cited can be tapped to see the rule itself. */
.rrefs { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 12px; }
.rref { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 8px 40px 8px 14px; position: relative; border-radius: 16px; background: var(--bg); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--pine) 22%, transparent); text-align: left; color: var(--text); }
.rref::after { content: "›"; position: absolute; right: 16px; top: 50%; transform: translateY(-52%); font-size: 1.5rem; line-height: 1; color: var(--pine); }
.rref:active { background: color-mix(in srgb, var(--pine) 8%, var(--bg)); }
.rref-n { flex: none; min-width: 4.6em; font-weight: 800; color: var(--pine); white-space: nowrap; font-variant-numeric: tabular-nums; }
.rref-t { flex: 1; min-width: 0; font-size: .9rem; line-height: 1.3; color: var(--sub); overflow-wrap: anywhere; }
@container (max-width: 17em) { .rref { flex-direction: column; align-items: flex-start; gap: 2px; } }
.rulesheet { border-radius: 24px 24px 0 0; padding: 8px 20px calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--card); box-shadow: 0 -10px 40px rgba(0, 0, 0, .25); animation: slideup .22s ease-out; max-height: 88vh; overflow-y: auto; overscroll-behavior: contain; }
.rulesheet .nav .b { font-weight: 800; color: var(--pine); font-variant-numeric: tabular-nums; }
.rulesheet .rs-title { font-family: var(--font-display); font-size: 1.45rem; font-weight: 600; line-height: 1.2; margin: 6px 0 14px; color: var(--text); text-wrap: balance; }
.rulesheet .rs-lab { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--sub); margin-bottom: 8px; }
.rulesheet .rs-quote { margin: 0; padding: 2px 0 2px 14px; border-left: 3px solid var(--pine); font-size: 1rem; line-height: 1.5; color: var(--text); overflow-wrap: anywhere; white-space: pre-line; }
.rulesheet .rs-none { margin: 0; font-size: 1rem; line-height: 1.45; color: var(--text); }
.rulesheet .rs-go { margin-top: 20px; text-decoration: none; }
.rulesheet .rs-cap { text-align: center; margin: 10px 0 0; }
/* Club / matchday Home. Scoped to Home so score controls and competition pages retain their layout. */
.hero.home .home-season-label { font-family: var(--font-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif); font-size: .7rem; line-height: 1.5; font-weight: 650; letter-spacing: .13em; text-transform: uppercase; color: var(--sub); margin: 0 0 12px; }
.home-year { display: flex; align-items: flex-end; gap: 22px; color: var(--pine); margin: 4px 0 22px; }
.home-year > span { font: 400 5.3rem/.95 var(--font-display); letter-spacing: -.065em; font-variant-numeric: lining-nums; }
.home-year > i { flex: 1; height: 3px; background: var(--pine); margin-bottom: 9px; }
.hero.home .home-quiet-title { font: 400 2.15rem/1.12 var(--font-display); letter-spacing: -.025em; color: var(--pine); margin: 0 0 18px; }
.home-season-intro { border-bottom: 2px solid var(--pine); padding: 10px 0 24px; }
.hero.home .home-season-intro > .sub { color: var(--sub); font-family: var(--font-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif); font-size: 1rem; line-height: 1.55; margin: 0; }
.hero.home.home-upcoming .home-season-label { margin-top: 4px; }
.home-announcement .now-main { position: relative; }
.home-announcement .home-date { display: flex; width: auto; min-width: 64px; align-self: flex-start; box-sizing: border-box; flex-direction: column; align-items: center; gap: 2px; border: 1px solid rgba(212,180,131,.55); border-radius: 13px; padding: 8px 12px; margin: 18px 0 10px; }
.home-date > small { color: var(--on-pine-label); font: 500 .7rem/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-transform: uppercase; letter-spacing: .08em; }
.home-date > b { color: var(--action-inverse); font: 650 2.35rem/1.1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
.hero.home .home-live-ticket .now-name { font-size: min(var(--t-display-fit) / var(--len, 20), 2rem); }
.home-live-ticket .now-main { padding-bottom: 10px; }
.home-live-board > .sec-label { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.home-live-board > .sec-label > .sub, .home-contests > .sec-label { color: var(--text); font: 650 1.05rem/1.4 var(--font-display); font-variant-numeric: lining-nums; }
.home-live-ticket .home-this-hole { font-size: .8rem; line-height: 1.5; color: var(--action-inverse); margin-top: 8px; }
.home-live-board .link { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; }
.home-live-board .mini { background: transparent; color: var(--text); border-radius: 0; padding: 0; margin: 0; }
.home-live-board .mini .mr { border-bottom: 1px solid var(--line); padding: 13px 10px; min-height: 51px; }
.home-live-board .mini .mr.me { background: var(--action-tint); border-radius: 0; }
.home-live-board .mini .mp { color: var(--sub); }
.home-live-board .mini .mn { color: var(--text); min-width: 0; overflow-wrap: anywhere; }
.home-live-board .mini .mt { color: var(--pine); font-size: 1.25rem; font-weight: 650; }
.home-contest-list { border-top: 1px solid var(--line); }
.home-contest { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); padding: 14px 0; }
.home-contest-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; overflow-wrap: anywhere; }
.home-contest-copy > .b { font-size: .9rem; }
.home-contest-copy > .sub { font-size: .85rem; }
.home-contest-state { color: var(--sub); font-size: .7rem; max-width: 7rem; text-align: right; }
.home-contests .hs-ic { color: var(--pine); background: var(--fill); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.hero.home ~ .sec .hs-row .hs-ic { color: var(--card); background: var(--pine); }

/* A player's page for a past season shows two tiles (no "To beat"). */

    return {
      index, slope: tee.slope, rating: tee.rating, par: tee.par, allowance,
      slopePart, ratingPart, courseHandicap, beforeRounding,
      playing: roundHandicap(beforeRounding)
    };
  }

  function playingHandicap(index, tee, allowance) {
    return handicapWorking(index, tee, allowance).playing;
  }

  /** Shots received on a hole. Negative means a plus handicapper gives shots back. */
  function shotsOnHole(ph, si) {
    if (ph >= 0) return Math.floor(ph / 18) + (si <= ph % 18 ? 1 : 0);
    const plus = -ph;
    const back = Math.floor(plus / 18) + (si > 18 - (plus % 18) ? 1 : 0);
    return back === 0 ? 0 : -back;
  }

  /* ---------- Scores ---------- */

  /** A hole score is a whole number of strokes, or 'P' for picked up. */
  function isEntered(v) {
    return v === 'P' || (Number.isInteger(v) && v >= 1);
  }

  function stablefordPoints(gross, par, shots) {
    if (!isEntered(gross)) return null;
    if (gross === 'P') return 0;
    return Math.max(0, par + shots - gross + 2);
  }

  /** The strokes that make a pick-up worth nothing: the first score that earns 0 points. Display only; a pick-up still scores 0. */
  function pickupStrokes(par, shots) { return par + shots + 2; }

  /** What golfers call the gross score: Par, Bogey, Double... */
  function scoreName(gross, par) {
    if (gross === 'P') return 'Picked up';
    if (!isEntered(gross)) return '';
    if (gross === 1) return 'Hole in one';
    const d = gross - par;
    const names = { '-3': 'Albatross', '-2': 'Eagle', '-1': 'Birdie', '0': 'Par', '1': 'Bogey', '2': 'Double', '3': 'Triple' };
    return names[String(d)] || (d > 0 ? '+' + d : String(d));
  }

  function metresToYards(m) {
    return Math.round(m * 1.0936133);
  }

  /** Physical hole numbers in the order a group plays them. */
  function playOrder(startHole) {
    const s = startHole || 1;
    return ALL.slice(s - 1).concat(ALL.slice(0, s - 1));
  }

  function teamLabels(team, nameOf) {
    return {
      long: team.map(nameOf).join(' & '),
      short: team.map(id => nameOf(id).charAt(0)).join('&')
    };
  }

  /* ---------- Buggy Wars (match play on best Stableford score) ---------- */

  /** results: 'A' | 'B' | 'H' | null for each hole of one match, in playing order. */
  function matchProgress(results) {
    let lead = 0, played = 0, closed = null;
    const total = results.length;
    const after = [];
    for (const r of results) {
      if (!r) { after.push(null); continue; }
      played += 1;
      if (r === 'A') lead += 1; else if (r === 'B') lead -= 1;
      const remaining = total - played;
      if (!closed && Math.abs(lead) > remaining) {
        closed = { leader: lead > 0 ? 'A' : 'B', up: Math.abs(lead), toPlay: remaining };
      }
      after.push(lead);
    }
    return { lead, played, total, remaining: total - played, closed, after };
  }

  function matchWinner(m) {
    return m.closed ? m.closed.leader : null;
  }

  /** Match status in golf language: "Pat & Dermot 2 up", "All square", "won 3 & 2". */
  function describeMatch(m, labels, useShort) {
    const nm = s => (useShort ? labels[s === 'A' ? 0 : 1].short : labels[s === 'A' ? 0 : 1].long);
    if (m.played === 0) return { text: 'Not started', leader: null, state: 'pending', toPlay: m.remaining };
    if (m.closed && m.closed.toPlay > 0) {
      return { text: `${nm(m.closed.leader)} won ${m.closed.up} & ${m.closed.toPlay}`, leader: m.closed.leader, state: 'won', toPlay: m.remaining };
    }
    if (m.remaining === 0) {
      if (m.lead === 0) return { text: 'Halved', leader: null, state: 'halved', toPlay: 0 };
      const L = m.lead > 0 ? 'A' : 'B';
      return { text: `${nm(L)} won ${Math.abs(m.lead)} up`, leader: L, state: 'won', toPlay: 0 };
    }
    if (m.lead === 0) return { text: 'All square', leader: null, state: 'live', toPlay: m.remaining };
    const L = m.lead > 0 ? 'A' : 'B';
    const dormie = Math.abs(m.lead) === m.remaining;
    return { text: `${nm(L)} ${Math.abs(m.lead)} up${dormie ? ' · dormie' : ''}`, leader: L, state: 'live', toPlay: m.remaining, dormie };
  }

  /* ---------- Rankings ---------- */

  /** Sort and label positions. Equal values share a position (T7). No countback is applied. */
  function rankRows(rows, key, dir) {
    const sign = dir === 'asc' ? 1 : -1;
    const label = r => String(r.name || r.label || '');
    const sorted = rows.slice().sort((a, b) => sign * (a[key] - b[key]) || label(a).localeCompare(label(b)));
    return sorted.map(r => {
      const better = sorted.filter(o => sign * (o[key] - r[key]) < 0).length;
      const same = sorted.filter(o => o[key] === r[key]).length;
      return Object.assign({}, r, { pos: better + 1, posLabel: (same > 1 ? 'T' : '') + (better + 1), tied: same > 1 });
    });
  }

  /* ---------- A whole round ---------- */

  /**
   * input: {
   *   groups: [{ id, n, teeTime, startHole, teams: [[pid, pid], [pid, pid]] }],
   *   holes: [{ n, par, si }], tee: { slope, rating, par }, allowance,
   *   players: { pid: { name, index } }, scores: { pid: { hole: strokes | 'P' } },
   *   phOverride: { pid: playingHandicap }   // handicaps frozen when a round is finalised
   * }
   */
  function computeRound(input) {
    const { groups, holes, tee, allowance, players, scores, phOverride } = input;
    const holeBy = {};
    holes.forEach(h => { holeBy[h.n] = h; });
    const nameOf = id => (players[id] ? players[id].name : id);
    const byPlayer = {};

    groups.forEach(grp => grp.teams.flat().forEach(pid => {
      const p = players[pid];
      const ph = phOverride && phOverride[pid] !== undefined ? phOverride[pid] : playingHandicap(p.index, tee, allowance);
      const card = (scores && scores[pid]) || {};
      const rows = {};
      let total = 0, thru = 0, gross = 0;
      const pickups = [];
      ALL.forEach(n => {
        const h = holeBy[n];
        const shots = shotsOnHole(ph, h.si);
        const g = card[n];
        const points = stablefordPoints(g, h.par, shots);
        rows[n] = { gross: isEntered(g) ? g : null, shots, points };
        if (points !== null) {
          total += points; thru += 1;
          if (g === 'P') pickups.push(n); else gross += g;
        }
      });
      byPlayer[pid] = { id: pid, name: nameOf(pid), ph, holes: rows, total, thru, gross, pickups, groupId: grp.id };
    }));

    const groupOut = groups.map(grp => {
      const labels = grp.teams.map(t => teamLabels(t, nameOf));
      const order = playOrder(grp.startHole);
      const hs = {};
      order.forEach(n => {
        const pts = grp.teams.map(t => t.map(pid => byPlayer[pid].holes[n].points));
        const complete = pts.flat().every(v => v !== null);
        const entry = { n, complete, pts, best: null, counting: null, result: null, segLead: null, overallLead: null };
        if (complete) {
          entry.best = pts.map(a => Math.max(...a));
          entry.counting = grp.teams.map((t, i) => t.filter((pid, j) => pts[i][j] === entry.best[i]));
          entry.result = entry.best[0] > entry.best[1] ? 'A' : entry.best[1] > entry.best[0] ? 'B' : 'H';
        }
        hs[n] = entry;
      });
      const matches = {};
      Object.keys(SEGMENTS).forEach(seg => {
        const segOrder = order.filter(n => SEGMENTS[seg].includes(n));
        const prog = matchProgress(segOrder.map(n => hs[n].result));
        segOrder.forEach((n, i) => {
          if (seg === 'overall') hs[n].overallLead = prog.after[i];
          else hs[n].segLead = prog.after[i];
        });
        matches[seg] = Object.assign(prog, {
          order: segOrder,
          status: describeMatch(prog, labels, false),
          short: describeMatch(prog, labels, true),
          winner: matchWinner(prog)
        });
      });
      const done = order.filter(n => hs[n].complete).length;
      return {
        id: grp.id, n: grp.n, teeTime: grp.teeTime, startHole: grp.startHole || 1,
        teams: grp.teams, labels, order, holes: hs, matches,
        nextHole: order.find(n => !hs[n].complete) || null,
        holesDone: done, complete: done === 18
      };
    });

    const leaderboard = rankRows(Object.values(byPlayer).map(p => ({ id: p.id, name: p.name, total: p.total, thru: p.thru })), 'total', 'desc');

    const pairs = [];
    groupOut.forEach(go => go.teams.forEach((t, i) => pairs.push({
      groupId: go.id, team: t, label: go.labels[i].long,
      total: t.reduce((s, pid) => s + byPlayer[pid].total, 0),
      thru: Math.min(...t.map(pid => byPlayer[pid].thru))
    })));
    const ranked = rankRows(pairs, 'total', 'desc');
    const lowest = Math.min(...pairs.map(p => p.total));
    ranked.forEach(p => { p.lowest = p.total === lowest; });

    return { players: byPlayer, groups: groupOut, leaderboard, pairs: ranked };
  }

  /** Trip totals across rounds. All rounds count. */
  function tripStandings(roundResults, playerList) {
    const rows = playerList.map(p => {
      const per = roundResults.map(rr => (rr && rr.players[p.id] ? rr.players[p.id].total : null));
      const thru = roundResults.reduce((s, rr) => s + (rr && rr.players[p.id] ? rr.players[p.id].thru : 0), 0);
      return { id: p.id, name: p.name, per, thru, total: per.reduce((s, v) => s + (v || 0), 0) };
    });
    return rankRows(rows, 'total', 'desc');
  }

  /* ---------- Pairings and the draw ---------- */

  const pairKey = (a, b) => [a, b].sort().join('+');

  /** roundsGroups: [{ rid, groups }]. Returns { 'pat+dermot': ['r1', 'r2'] }. */
  function partnerHistory(roundsGroups) {
    const map = {};
    roundsGroups.forEach(({ rid, groups }) => (groups || []).forEach(g => g.teams.forEach(t => {
      if (t.length !== 2) return;
      const k = pairKey(t[0], t[1]);
      (map[k] = map[k] || []).push(rid);
    })));
    return map;
  }

  function repeatedPartners(roundsGroups) {
    const map = partnerHistory(roundsGroups);
    return Object.keys(map).filter(k => map[k].length > 1).map(k => ({ pair: k.split('+'), rounds: map[k] }));
  }

  /* ---------- Scorecard photo check ---------- */

  const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z]/g, '');

  /** Normalise one cell of a card reading: strokes, 'P' for a pick-up, or null if unreadable. */
  function cardValue(cell) {
    const v = cell && typeof cell === 'object' ? cell.value : cell;
    if (v === null || v === undefined || v === '') return null;
    if (typeof v === 'string') {
      const t = v.trim().toUpperCase();
      if (['P', 'X', '-', '–', '/', 'NR', 'NS'].includes(t)) return 'P';
      const n = Number(t);
      return Number.isInteger(n) && n >= 1 ? n : null;
    }
    return Number.isInteger(v) && v >= 1 ? v : null;
  }

  /**
   * Work out which card row (A, B, C, D) belongs to which player.
   * First by the names written in the key (accents and short forms allowed: "Derm" is Dermot),
   * then by whichever assignment agrees with the most scores already in the app.
   * cardPlayers: [{ letter, name, scores: { hole: cell } }]; players: [{ id, name }]; app: { pid: { hole: v } }.
   */
  function matchCardRows(cardPlayers, players, app) {
    const map = {};
    const used = new Set();
    cardPlayers.forEach(cp => {
      const n = fold(cp.name);
      if (n.length < 2) return;
      const hits = players.filter(p => !used.has(p.id) && (fold(p.name).startsWith(n) || n.startsWith(fold(p.name))));
      if (hits.length === 1) { map[cp.letter] = hits[0].id; used.add(hits[0].id); }
    });
    const rest = cardPlayers.filter(cp => !map[cp.letter]);
    const free = players.filter(p => !used.has(p.id));
    if (rest.length && free.length) {
      const agree = (cp, pid) => Object.keys(cp.scores || {}).filter(h => {
        const c = cardValue(cp.scores[h]);
        return c !== null && app[pid] && app[pid][h] === c;
      }).length;
      let best = null;
      const permute = (i, chosen, score) => {
        if (i === rest.length) { if (!best || score > best.score) best = { score, chosen: chosen.slice() }; return; }
        free.forEach(p => {
          if (chosen.includes(p.id)) return;
          chosen.push(p.id);
          permute(i + 1, chosen, score + agree(rest[i], p.id));
          chosen.pop();
        });
        if (rest.length > free.length) permute(i + 1, chosen.concat([null]), score);
      };
      permute(0, [], 0);
      if (best) rest.forEach((cp, i) => { if (best.chosen[i]) map[cp.letter] = best.chosen[i]; });
    }
    return map;
  }

  /**
   * Compare a card reading with the app for one nine.
   * Only differences need a person: the app never changes a score on its own.
   * A reading counts as unclear when the reader said so, or when it would be an
   * implausible score for the hole (more than par + 4), so a misread 4-as-9 is
   * shown as "please check", never as a confident difference.
   * Returns { checked, matched, issues: [{ hole, pid, card, app, kind: 'differs'|'unclear'|'unreadable', note }], unmatchedRows }.
   */
  function compareCard(reading, players, app, holes, segHoles) {
    const parOf = {};
    holes.forEach(h => { parOf[h.n] = h.par; });
    const map = matchCardRows(reading.players || [], players, app);
    const issues = [];
    let checked = 0, matched = 0;
    (reading.players || []).forEach(cp => {
      const pid = map[cp.letter];
      if (!pid) return;
      segHoles.forEach(h => {
        const appV = app[pid] ? app[pid][h] : undefined;
        if (appV === undefined || appV === null) return;
        checked += 1;
        const cell = (cp.scores || {})[h];
        const c = cardValue(cell);
        const low = cell && typeof cell === 'object' && cell.confidence === 'low';
        const note = cell && typeof cell === 'object' ? (cell.note || '') : '';
        if (c === null) { issues.push({ hole: h, pid, card: null, app: appV, kind: 'unreadable', note }); return; }
        if (c === appV) { matched += 1; return; }
        const implausible = Number.isInteger(c) && c > parOf[h] + 4;
        issues.push({ hole: h, pid, card: c, app: appV, kind: low || implausible ? 'unclear' : 'differs', note });
      });
    });
    issues.sort((a, b) => a.hole - b.hole);
    const unmatchedRows = (reading.players || []).filter(cp => !map[cp.letter]).map(cp => cp.letter);
    return { checked, matched, issues, map, unmatchedRows };
  }

  /** Split four players into two buggies. Prefers 1st & 4th v 2nd & 3rd,
   *  but avoids pairs who already shared a buggy when another split can. */
  function bestSplit(ids, history) {
    if (ids.length === 4) {
      const splits = [[[0, 3], [1, 2]], [[0, 2], [1, 3]], [[0, 1], [2, 3]]]
        .map(s => s.map(t => t.map(i => ids[i])));
      const repeats = s => s.filter(t => history[pairKey(t[0], t[1])]).length;
      return splits.reduce((best, s) => (repeats(s) < repeats(best) ? s : best), splits[0]);
    }
    return teamsFor(ids);
  }

  /** Buggies for a group of any size: 4 is two pairs, 3 is a pair and a single. */
  function teamsFor(ids) {
    if (ids.length >= 4) return [ids.slice(0, 2), ids.slice(2, 4)];
    if (ids.length === 3) return [ids.slice(0, 2), ids.slice(2)];
    if (ids.length === 2) return [[ids[0]], [ids[1]]];
    return [ids.slice()];
  }

  /** Group sizes for n players: fours, with threes where it does not divide. */
  function groupSizes(n) {
    if (n <= 0) return [];
    if (n <= 4) return [n];
    const g = Math.ceil(n / 4);
    const sizes = Array(g).fill(Math.floor(n / g));
    for (let i = 0; i < n % g; i++) sizes[i] += 1;
    return sizes.sort((a, b) => b - a);
  }

  /** "10:00" plus minutes, as "10:08". */
  function addMinutes(hhmm, mins) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || ''));
    if (!m) return '';
    if (Number(m[1]) > 23 || Number(m[2]) > 59) return '';
    const step = Number.isFinite(mins) ? Math.round(mins) : 0;
    const t = (((Number(m[1]) * 60 + Number(m[2]) + step) % 1440) + 1440) % 1440;
    return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
  }

  function teeTimesFrom(first, interval, count) {
    const step = Number(interval) > 0 ? Number(interval) : 8;
    return Array.from({ length: count }, (_, i) => addMinutes(first, i * step));
  }

  function makeGroups(orderedIds, teeTimes, history) {
    const sizes = groupSizes(orderedIds.length);
    const groups = [];
    let k = 0;
    sizes.forEach((size, i) => {
      const ids = orderedIds.slice(k, k + size);
      k += size;
      groups.push({ id: 'g' + (i + 1), n: i + 1, teeTime: (teeTimes || [])[i] || '', startHole: 1, teams: history ? bestSplit(ids, history) : teamsFor(ids) });
    });
    return groups;
  }

  function flagRepeats(groups, priorRoundsGroups) {
    const history = partnerHistory(priorRoundsGroups);
    const repeats = [];
    groups.forEach(g => g.teams.forEach(t => {
      if (t.length === 2 && history[pairKey(t[0], t[1])]) repeats.push({ pair: t, rounds: history[pairKey(t[0], t[1])] });
    }));
    return repeats;
  }

  /** Reverse-standings draw: lowest scores off first, leaders last.
   *  Within a group, buggies avoid repeated partners where possible. Repeats left are flagged, not hidden. */
  function proposeDraw(standings, priorRoundsGroups, teeTimes) {
    const history = partnerHistory(priorRoundsGroups);
    const worstFirst = standings.slice().reverse().map(r => r.id);
    const sizes = groupSizes(worstFirst.length);
    const groups = [];
    let k = 0;
    sizes.forEach((size, i) => {
      const bestFirst = worstFirst.slice(k, k + size).reverse();
      k += size;
      groups.push({ id: 'g' + (i + 1), n: i + 1, teeTime: (teeTimes || [])[i] || '', startHole: 1, teams: bestSplit(bestFirst, history) });
    });
    return { groups, repeats: flagRepeats(groups, priorRoundsGroups) };
  }

  /** A seeded shuffle, so a draw can be repeated in tests. */
  function shuffle(list, seed) {
    const a = list.slice();
    let s = (seed >>> 0) || 1;
    const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  function randomDraw(ids, teeTimes, seed, priorRoundsGroups) {
    const history = partnerHistory(priorRoundsGroups || []);
    const groups = makeGroups(shuffle(ids, seed), teeTimes, history);
    return { groups, repeats: flagRepeats(groups, priorRoundsGroups || []) };
  }

  /** KB pairs: partners always in different groups, and (when it can be done) nobody paired with someone
   *  they have already been paired with. history: earlier KB pairs, [[a, b], ...]. Returns the draw with the
   *  fewest repeats found; repeats lists any pair that could not be avoided. */
  function kbPairsFor(groups, seed, history) {
    const groupOf = {};
    groups.forEach(g => g.teams.flat().forEach(pid => { groupOf[pid] = g.id; }));
    const ids = Object.keys(groupOf);
    const seen = new Set((history || []).filter(pr => pr && pr.length === 2).map(pr => pairKey(pr[0], pr[1])));
    let best = null;
    for (let attempt = 0; attempt < 400; attempt++) {
      const pool = shuffle(ids, (seed || 1) + attempt * 7919);
      const pairs = [];
      let ok = true;
      while (pool.length > 1 && ok) {
        const a = pool.shift();
        let j = pool.findIndex(b => groupOf[b] !== groupOf[a] && !seen.has(pairKey(a, b)));
        if (j < 0) j = pool.findIndex(b => groupOf[b] !== groupOf[a]);
        if (j < 0) { ok = false; break; }
        pairs.push([a, pool.splice(j, 1)[0]]);
      }
      if (!ok) continue;
      const repeats = pairs.filter(pr => seen.has(pairKey(pr[0], pr[1])));
      if (!best || repeats.length < best.repeats.length) best = { pairs, spare: pool, repeats };
      if (!repeats.length) break;
    }
    return best || { pairs: [], spare: ids, repeats: [] };
  }

  /** A KB list is only good if it matches the groups: pairs of two, in different groups, nobody twice, everyone paired bar one. */
  function kbValid(groups, kb) {
    if (!Array.isArray(kb) || !kb.length || !Array.isArray(groups) || groups.length < 2) return false;
    const groupOf = {};
    groups.forEach(g => g.teams.flat().forEach(pid => { groupOf[pid] = g.id; }));
    const n = Object.keys(groupOf).length, seen = new Set();
    for (const pr of kb) {
      if (!Array.isArray(pr) || pr.length !== 2) return false;
      const [a, b] = pr;
      if (!groupOf[a] || !groupOf[b] || groupOf[a] === groupOf[b] || seen.has(a) || seen.has(b)) return false;
      seen.add(a); seen.add(b);
    }
    return seen.size >= n - 1;
  }

  /** The KB pairs a round should have. Groups and KB pairs go together: if the saved pairs are missing or no longer fit the groups,
   *  work them out from the groups. The same groups and history always give the same answer, so every phone agrees. */
  /** The groups that take part in KBs. A group can be left out (noKb), for example after late drop-outs leave 3 groups of 3.
   *  The flag lives on the group itself, so nothing new is stored. All groups left out means no KBs in the round. */
  function kbGroups(round) {
    return round && round.groups ? round.groups.filter(g => !g.noKb) : [];
  }
  function kbOff(round) {
    return !!(round && round.groups && round.groups.length && round.groups.every(g => g.noKb));
  }

  function kbEffective(round, others) {
    if (!round || !round.groups || round.groups.length < 2) return round ? round.kb || null : null;
    const kg = kbGroups(round);
    if (kg.length < 2) return null;
    if (kbValid(kg, round.kb)) return round.kb;
    const history = (others || []).slice().sort((x, y) => String(x.id).localeCompare(String(y.id)))
      .flatMap(x => (x.kb && x.kb.length ? x.kb : ((x.results && x.results.kb) || []).map(k => [k[0], k[1]])));
    let h = 7;
    for (const ch of String(round.id)) h = (h * 31 + ch.charCodeAt(0)) % 99991;
    const res = kbPairsFor(kg, h + 1, history);
    return res.pairs.length ? res.pairs : null;
  }

  /* ---------- Countback and season tables ---------- */

  /** Countback as the society uses it: back 9, back 6, back 3, then the 18th, 17th and backwards.
   *  points: { hole: points | null } on physical hole numbers. */
  function countbackKey(points) {
    const p = n => (points && points[n]) || 0;
    const sum = (a, b) => { let s = 0; for (let n = a; n <= b; n++) s += p(n); return s; };
    const key = [sum(10, 18), sum(13, 18), sum(16, 18)];
    for (let n = 18; n >= 1; n--) key.push(p(n));
    return key;
  }

  function compareKeys(a, b) {
    for (let i = 0; i < Math.max(a.length, b.length); i++) {
      const x = a[i] === undefined ? -1 : a[i];
      const y = b[i] === undefined ? -1 : b[i];

<script>/* NCGS data service.

    };

    ops.checkPin = function (req) { var ok = pinOk(req.pin); return ok ? { ok: true } : { ok: false, locked: locked() }; };

    ops.setPin = function (req) {
      if (!pinOk(req.pin)) throw err('pin', 'That PIN did not match.');
      if (!/^\d{4,8}$/.test(String(req.newPin || ''))) throw err('bad', 'Use 4 to 8 digits.');
      return store.lock(function () {
        store.setPin(String(req.newPin));
        var v = bump();
        store.upsert('log', stamp('log', [logRow(v, 'Organiser', 'Organiser PIN changed', '')], v));
        commit(v);
        return { ok: true, ver: v };
      });
    };

    /* One hole for one group. A score that another phone changed since this phone last saw it
       is not overwritten: it comes back as a conflict for a person to decide. */
    ops.saveHole = function (req) {
      return store.lock(function () {
        var round = find('rounds', function (r) { return r.id === req.round; });
        if (!round) throw err('missing', 'That round no longer exists.');
        var org = pinOk(req.pin);
        var hole = Number(req.hole);
        if (req.hole === null || req.hole === '' || typeof req.hole === 'boolean' || !isFinite(hole) || Math.floor(hole) !== hole || hole < 1 || hole > 18) throw err('bad', 'That is not a hole on the course.');
        var grp = (round.groups || []).filter(function (g) { return g.id === req.grp; })[0];
        if (!grp) throw err('bad', 'That group is not in this round.');
        var inGroup = {};
        grp.teams.forEach(function (t) { t.forEach(function (pid) { inGroup[pid] = 1; }); });
        var sc = req.scores && typeof req.scores === 'object' ? req.scores : {};
        Object.keys(sc).forEach(function (pid) {
          if (!inGroup[pid]) throw err('bad', 'That player is not in this group.');
          var w = sc[pid] && sc[pid].v;
          if (w !== null && w !== 'P' && !(typeof w === 'number' && isFinite(w) && Math.floor(w) === w && w >= 1 && w <= 25)) throw err('bad', 'That is not a score.');
        });
        if (round.status === 'final') throw err('final', 'This round is final.');
        var starting = round.status === 'upcoming' && round.groups && round.groups.length;
        if (round.status !== 'live' && !starting) throw err('notlive', 'This round has not started.');
        var existing = {};
        store.read('scores').forEach(function (s) { if (s.round === req.round && s.hole === hole) existing[s.player] = s.strokes; });

        var rows = [];
        var clears = [];
        var changes = [];

          var base = req.scores[pid].base;
          var cur = existing[pid] === undefined ? null : existing[pid];
          if (cur === want) return;

            return;
          }
          if (cur !== null) changes.push({ player: pid, from: cur, to: want === null ? 'cleared' : want });
          if (want === null) clears.push(keyOf('scores', { round: req.round, player: pid, hole: hole }));
          else rows.push({ round: req.round, player: pid, hole: hole, strokes: want, by: req.by || '', at: now() });
        });
        var claimRows = [];
        var claimRemove = [];
        if (req.claim !== undefined) {
          var curClaim = find('claims', function (c) { return c.round === req.round && c.hole === hole && c.grp === req.grp; });
          var wantClaim = req.claim || null;
          if (wantClaim && wantClaim !== '_nobody' && !inGroup[wantClaim]) throw err('bad', 'That player is not in this group.');
          if ((curClaim ? curClaim.player : null) !== wantClaim) {
            if (wantClaim) claimRows.push({ round: req.round, hole: hole, grp: req.grp, player: wantClaim, at: now() });

        if (!rows.length && !clears.length && !claimRows.length && !claimRemove.length) {
          return { ok: true, ver: store.getVer(), conflicts: conflicts, changed: 0 };
        }
        var v = bump();
        if (starting) {
          round.status = 'live';
          store.upsert('rounds', stamp('rounds', [round], v));
          store.upsert('log', stamp('log', [logRow(v, req.by, 'Round started', 'First score saved')], v));
        }
        store.upsert('scores', stamp('scores', rows, v));
        if (clears.length) {
          store.remove('scores', clears);
          store.upsert('deleted', stamp('deleted', clears.map(function (k) { return { tbl: 'scores', k: k }; }), v));
        }
        if (claimRows.length) store.upsert('claims', stamp('claims', claimRows, v));
        if (claimRemove.length) {
          store.remove('claims', claimRemove);
          store.upsert('deleted', stamp('deleted', claimRemove.map(function (k) { return { tbl: 'claims', k: k }; }), v));
        }
        if (changes.length) {
          var names = req.names || {};
          var detail = (req.label || ('Hole ' + hole)) + ': ' + changes.map(function (c) {
            return (names[c.player] || c.player) + ' ' + (c.from === 'P' ? 'picked up' : c.from) + ' → ' + (c.to === 'P' ? 'picked up' : c.to);
          }).join(', ');
          store.upsert('log', stamp('log', [logRow(v, req.by, org ? 'Score corrected' : 'Score changed', detail)], v));
        }
        commit(v);
        return { ok: true, ver: v, conflicts: conflicts, changed: rows.length + clears.length };
      });
    };

    /* Organiser changes (and the few things players may write: card checks, submitted cards, log). */
    ops.put = function (req) {
      var t = req.table;
      if (!SCHEMA[t] || t === 'deleted') throw err('bad', 'Unknown table');
      var org = pinOk(req.pin);
      if (!PLAYER_TABLES[t] && !org) throw err('pin', 'Organiser PIN needed.');
      var rows = req.rows === undefined ? [] : req.rows;
      checkRows(t, rows);
      if (t === 'log' && !org) {
        // a phone may add to the log but never edit it, and never sign as the organiser
        var have = {};
        store.read('log').forEach(function (r) { have[r.id] = 1; });
        rows = rows.filter(function (r) { return !have[r.id]; }).map(function (r) { return Object.assign({}, r, { by: String(r.by) === 'Organiser' ? 'Player' : r.by }); });
        if (!rows.length) return { ok: true, ver: store.getVer() };
      }
      return store.lock(function () {
        var v = bump();
        store.upsert(t, stamp(t, rows, v));
        if (req.log) store.upsert('log', stamp('log', [logRow(v, req.log.by || 'Organiser', req.log.action, req.log.detail)], v));
        commit(v);
        return { ok: true, ver: v };
      });
    };

    ops.remove = function (req) {
      var t = req.table;
      if (!SCHEMA[t] || t === 'deleted' || t === 'log') throw err('bad', 'Unknown table');
      if (!pinOk(req.pin)) throw err('pin', 'Organiser PIN needed.');
      return store.lock(function () {
        var v = bump();
        var keys = (req.rows || []).map(function (r) { return keyOf(t, r); });
        store.remove(t, keys);
        store.upsert('deleted', stamp('deleted', keys.map(function (k) { return { tbl: t, k: k }; }), v));
        if (t === 'rounds') {
          // a deleted round takes its scores, claims, winners, checks and cards with it
          ['scores', 'claims', 'winners', 'checks', 'cards'].forEach(function (dt) {
            var gone = store.read(dt).filter(function (r) { return keys.indexOf(String(r.round)) >= 0; }).map(function (r) { return keyOf(dt, r); });
            if (gone.length) {
              store.remove(dt, gone);
              store.upsert('deleted', stamp('deleted', gone.map(function (k) { return { tbl: dt, k: k }; }), v));
            }
          });
        }
        if (req.log) store.upsert('log', stamp('log', [logRow(v, req.log.by || 'Organiser', req.log.action, req.log.detail)], v));
        commit(v);
        return { ok: true, ver: v };
      });
    };

    ops.photoPut = function (req) {
      if (!/^data:image\/(jpeg|png);base64,/.test(String(req.dataUrl || ''))) throw err('bad', 'Not a photo');
      if (String(req.dataUrl).length > 3000000) throw err('bad', 'Photo too large');
      return { id: store.putPhoto(req.dataUrl) };
    };
    ops.photoGet = function (req) { return { dataUrl: store.getPhoto(String(req.id)) }; };

    /* A copy of the whole sheet in Drive, on demand (a daily one can be switched on too). */
    ops.backupNow = function (req) {
      if (!pinOk(req.pin)) throw err('pin', 'Organiser PIN needed.');
      if (!store.backup) throw err('bad', 'Backups are not available here.');
      var b = store.backup();
      return store.lock(function () {
        var v = bump();
        store.upsert('log', stamp('log', [logRow(v, 'Organiser', 'Backup made', b.name)], v));
        commit(v);
        return { ok: true, ver: v, name: b.name, url: b.url };
      });
    };

    /* Put back what has gone missing, from an Export. A row that exists now is never overwritten, so a
       score entered since the backup can never be lost to an old copy. */
    ops.restore = function (req) {
      if (!pinOk(req.pin)) throw err('pin', 'Organiser PIN needed.');
      var tables = req.data && req.data.tables;
      if (!tables || typeof tables !== 'object') throw err('bad', 'That is not an export from this app.');
      var plan = {}, total = 0;
      TABLES.forEach(function (t) {
        if (t === 'deleted' || t === 'log' || !Array.isArray(tables[t])) return;
        var have = {};
        store.read(t).forEach(function (r) { have[keyOf(t, r)] = 1; });
        var rows = [];
        tables[t].forEach(function (r) {
          if (!r || typeof r !== 'object') return;
          if (SCHEMA[t].key.some(function (k) { return r[k] === undefined || r[k] === null || r[k] === ''; })) return;
          if (!have[keyOf(t, r)]) { have[keyOf(t, r)] = 1; rows.push(r); }
        });
        if (rows.length) { plan[t] = rows; total += rows.length; }
      });
      if (!total) return { ok: true, restored: 0, tables: {} };
      return store.lock(function () {
        var v = bump(), counts = {};
        Object.keys(plan).forEach(function (t) { store.upsert(t, stamp(t, plan[t], v)); counts[t] = plan[t].length; });
        store.upsert('log', stamp('log', [logRow(v, 'Organiser', 'Restored from a backup', Object.keys(counts).map(function (t) { return counts[t] + ' ' + t; }).join(', '))], v));
        commit(v);
        return { ok: true, ver: v, restored: total, tables: counts };
      });
    };

    /* Forecast for a course on a day, from Open-Meteo (free, no key). Cached for an hour. */
    ops.weather = function (req) {
      if (!store.fetchJson) return { days: null };
      var lat = Number(req.lat), lon = Number(req.lon);
      if (!isFinite(lat) || !isFinite(lon)) return { days: null };
      var ck = 'wx:' + lat.toFixed(3) + ',' + lon.toFixed(3);
      var hit = store.cacheGet(ck);
      if (hit) return JSON.parse(hit);
      var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
        '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max' +
        '&hourly=temperature_2m,weather_code,precipitation_probability,wind_speed_10m&wind_speed_unit=kmh&timezone=auto&forecast_days=10';
      var j = store.fetchJson(url);

    /* The checker answers with one JSON card ("ask" a question with tap answers, or a "ruling"). Anything else is passed on as plain text. */
    function cleanStr(x, n) { return typeof x === 'string' ? x.replace(/\s+/g, ' ').trim().slice(0, n) : ''; }
    function askCard(raw) {
      var a = raw.indexOf('{'), b = raw.lastIndexOf('}');
      if (a < 0 || b <= a) return null;
      var j; try { j = JSON.parse(raw.slice(a, b + 1)); } catch (e) { return null; }
      if (!j || typeof j !== 'object') return null;
      if (j.type === 'ask') {
        var opts = (Array.isArray(j.options) ? j.options : []).map(function (o) {
          var label = cleanStr(o && o.label, 60), c = { label: label };
          if (o && (o.tag === 'red' || o.tag === 'yellow')) c.tag = o.tag;

        return { type: 'ruling', topic: cleanStr(j.topic, 40), rule: cleanStr(j.rule, 30), verdict: verdict, intro: cleanStr(j.intro, 120),
          steps: (Array.isArray(j.steps) ? j.steps : []).map(function (x) { return cleanStr(x, 220); }).filter(Boolean).slice(0, 4), note: cleanStr(j.note, 300), quote: cleanStr(j.quote, 700) };
      }

    }

    /* Rules checker: a question for Claude about the Rules of Golf, checked live against the official R&A / USGA rules.
       The key lives in the script properties (ANTHROPIC_KEY), never in the app. A daily cap stops a runaway bill. */
    ops.ask = function (req) {
