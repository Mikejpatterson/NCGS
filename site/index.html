/* Selected tab: clean glass lens, no colour patch (so nothing looks hidden behind it) */
.tab.on {
  background: linear-gradient(180deg, rgba(255, 255, 255, .95), rgba(255, 255, 255, .7));
  -webkit-backdrop-filter: blur(8px) saturate(180%); backdrop-filter: blur(8px) saturate(180%);
  box-shadow: 0 0 0 1px rgba(20, 35, 27, .10), 0 3px 10px rgba(20, 35, 27, .16), inset 0 1.5px 0 #fff, inset 0 -1px 2px rgba(20, 35, 27, .08);
  color: var(--pine); font-weight: 800; text-shadow: none;
}
.tab.on svg { color: var(--pine); stroke-width: 2.4; filter: none; }

/* Results selector: tidy 2 x 2 grid */
.seg.pills.four { display: grid; grid-auto-flow: row; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; }
.seg.pills.four button { flex: none; width: 100%; min-height: 44px; font-size: .95rem; white-space: nowrap; }

/* The page scrolls inside #app, which starts below the clock, so iOS draws no fade over the top */
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body::before { display: none; }
#app { position: fixed; top: env(safe-area-inset-top, 0px); right: 0; bottom: 0; left: 0; max-width: none; margin: 0; min-height: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: none; scroll-padding-bottom: calc(var(--tabh, 90px) + 16px); padding-inline: max(16px, calc((100vw - 448px) / 2)); }
.entright { display: inline-flex; align-items: center; gap: 10px; }
.tee .entcard { margin-bottom: 4px; }

/* Glass v5: frosted, slightly cool bar so the lighter lens clearly stands out */
.tabs {
  background: linear-gradient(180deg, rgba(228, 233, 229, .62), rgba(214, 221, 216, .50));
  -webkit-backdrop-filter: blur(26px) saturate(200%) brightness(1.02); backdrop-filter: blur(26px) saturate(200%) brightness(1.02);
  box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .9), inset 0 -1px 0 rgba(255, 255, 255, .35), inset 0 0 0 1px rgba(255, 255, 255, .45), 0 14px 34px rgba(20, 35, 27, .22), 0 0 0 .5px rgba(20, 35, 27, .18);
}
.tabs::before { background: linear-gradient(180deg, rgba(255, 255, 255, .5), rgba(255, 255, 255, 0) 50%); }
.tab { text-shadow: none; color: #2B3630; }
.tab svg { filter: none; }
.tab.on {
  background: linear-gradient(180deg, rgba(255, 255, 255, .98), rgba(255, 255, 255, .78) 60%, rgba(255, 255, 255, .9));
  box-shadow: inset 0 2px 1px -1px #fff, inset 0 -3px 4px -2px rgba(20, 35, 27, .10), inset 0 0 0 1px rgba(255, 255, 255, .9), 0 0 0 1px rgba(20, 35, 27, .09), 0 6px 14px rgba(20, 35, 27, .22);
  color: var(--pine);
}
.entright .pill.w2 { background: #fff; color: var(--sub); box-shadow: inset 0 0 0 1.5px rgba(20, 35, 27, .22); }
.hero.s .tile .bignum, .hero.c:not(.pine) .tile .bignum { color: var(--text); }
.hero.s .tile .cap, .hero.c:not(.pine) .tile .cap { color: var(--sub); }
.hero.s .tile, .hero.c:not(.pine) .tile { background: #fff; box-shadow: var(--ring); }
.hero.s .tile.flag, .hero.c:not(.pine) .tile.flag { background: var(--flag); box-shadow: none; }
.hero.s .tile.flag .cap, .hero.s .tile.flag .bignum, .hero.c:not(.pine) .tile.flag .cap, .hero.c:not(.pine) .tile.flag .bignum { color: var(--pine); }
.lrow[style*="repeat("] .av { width: 28px; height: 28px; font-size: .6rem; flex: none; }
.lrow[style*="repeat("] .lname { gap: 8px; }
.lrow[style*="repeat("] { column-gap: 6px; padding-inline: 12px; }

/* After saving a hole */
.entr .savedchip { display: inline-flex; align-items: center; gap: 4px; font-size: .95rem; font-weight: 700; color: #fff; justify-content: flex-end; }
.entr .undochip { display: inline-block; margin-top: 8px; min-height: 36px; padding: 0 16px; border: 0; border-radius: 999px; background: rgba(255, 255, 255, .16); color: #fff; font: inherit; font-size: .9rem; font-weight: 700; }
.hero.pine.entcard + .rescard { margin-top: 14px; }
.rescard { background: #fff; border-radius: 24px; box-shadow: var(--ring); padding: 16px 18px; }
.rescard .res { gap: 8px 10px; }
.rescard .res-t { font-size: 1.3rem; font-weight: 800; letter-spacing: -.02em; }
.rescard .res-sub { margin-top: 6px; }
.pill.big { font-size: .95rem; padding: 6px 14px; }
.row.chg .pill { font-size: .85rem; padding: 4px 12px; min-height: 0; }
.row.chg .stat .cap.was { text-transform: none; letter-spacing: 0; font-size: .8rem; }
.row.chg .stat { gap: 4px; }
.pill.big { height: 32px; font-size: .95rem; padding: 0 14px; }
.row.chg .pill { height: 26px; font-size: .85rem; padding: 0 12px; }

/* Results selector: real pills, one row, no grey tray */
.seg.pills, .seg.pills.four { display: flex; flex-wrap: nowrap; gap: 6px; background: none; padding: 0; border-radius: 0; margin: 14px 0 6px; }
.seg.pills button, .seg.pills.four button { flex: 1 1 auto; width: auto; min-height: 44px; padding: 0 10px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 1.5px rgba(20, 35, 27, .14); color: var(--text); font-size: .85rem; font-weight: 700; white-space: nowrap; overflow-wrap: normal; text-align: center; }
.seg.pills button.on, .seg.pills.four button.on { background: var(--pine); color: #fff; box-shadow: none; font-weight: 800; }
.entr .savedchip { display: flex; }
.entr { display: flex; flex-direction: column; align-items: flex-end; }
.seg.pills, .seg.pills.four { flex-wrap: wrap; }

/* Results selector: equal-sized pills (four across, or two by two when text is large) */
.seg.pills, .seg.pills.four { display: grid; grid-auto-flow: row; grid-template-columns: repeat(auto-fit, minmax(4.6rem, 1fr)); gap: 6px; }
.seg.pills button, .seg.pills.four button { flex: none; width: 100%; min-width: 0; padding: 0 4px; font-size: .8rem; }
.seg.pills button, .seg.pills.four button { font-size: .74rem; letter-spacing: -.01em; }

/* Results selector: always 2 x 2 equal pills */
.seg.pills.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.seg.pills.four button { font-size: .95rem; letter-spacing: 0; min-height: 46px; }

/* =====================================================================
   DESIGN SYSTEM PASS
   One type scale, tabular figures, minimum sizes, 44px touch targets,
   one selector style, meaningful colour only.
   ===================================================================== */
:root {
  --fs-label: .74rem; --fs-cap: .82rem; --fs-sub: .9rem; --fs-body: 1rem; --fs-lead: 1.2rem;
  --r-card: 24px; --tap: 44px;
}
body { font-variant-numeric: tabular-nums; }

/* The page already starts below the clock, so headers need no extra gap there */
.hero.s, .hero.c:not(.pine) { padding-top: 12px; }

/* Nothing smaller than 12px except tiny caps labels (which are bold and spaced) */
.tab { font-size: .72rem; }
.dchip small { font-size: .7rem; }
.idx small { font-size: .68rem; }
.av.sm { font-size: .62rem; }
.entry .stv small { font-size: .74rem; }
.mr .mn small { font-size: .7rem; }
.sc thead th, .sc thead th.hn { font-size: .7rem; }
.chart text { font-size: 11px; }
.chart text.v { font-size: 12px; font-weight: 700; }

/* Figures in leaderboards keep room for three digits so 99 to 100 never shifts anything */
.lrow .b.r, .lrow .r.b, .lrow .tot { min-width: 3ch; text-align: right; }
.lrow.goy { grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.lrow.goy .tot { font-size: 1.7rem; font-weight: 900; letter-spacing: -.03em; min-width: 3.2ch; }
.lrow.goy .lname .cap { display: block; margin-top: 4px; }
.lrow.goy .chips { display: inline-flex; gap: 4px; }
.lrow.goy .chipn { min-width: 30px; height: 22px; padding: 0 6px; font-size: .78rem; border-radius: 11px; }
.lrow.goy .av { display: grid; width: 38px; height: 38px; font-size: .68rem; flex: none; }
@media (max-width: 360px) { .lrow.goy .av { display: grid; } }

/* Past rounds: date chip, course and winner, then the winner badge and score */
.prow .two { gap: 2px; }
.prow .two .b { font-size: 1.05rem; line-height: 1.2; overflow-wrap: anywhere; }
.prow .two .sub { font-size: var(--fs-cap); line-height: 1.25; white-space: normal; }
.prow .wn { gap: 8px; flex: none; }
.chipn.scorechip { min-width: 40px; height: 30px; font-size: 1rem; font-weight: 800; border-radius: 15px; padding: 0 10px; }

/* Scoring: every control is at least 44px tall */
.entry .stepper .pu, .entry .stepper .pu.on { height: 44px; min-height: 44px; padding: 0 16px; border-radius: 22px; font-size: .86rem; white-space: nowrap; overflow: visible; width: auto; margin-left: 8px; margin-top: 4px; }
.entry .pr-top .nm { min-height: 44px; }
.entry .pr { min-height: 100px; }
.entr .undochip { min-height: 44px; }
.askbar .mic, .askbar .send, .askbar .stop, .askbar .x { min-width: 44px; min-height: 44px; width: 44px; height: 44px; }

/* One selector style everywhere: round pills. Groups on the Buggy Wars tab use it too. */
.seg.pills.grp { margin: 12px 0 8px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.seg.pills.grp button { font-size: .95rem; }

/* Stats tiles: calm and consistent. Green for good things, plain grey for the rough ones. */
.stile.tf, .stile.tb { --tone: var(--green); --soft: var(--green-soft); }
.stile.tr { --tone: #55625A; --soft: #EEF0EA; }

/* Who are you / Players style rows */
.row .lname { gap: 12px; }
.row .lname .cap { display: block; }

/* Ruling suggestions read as tappable cards */
.idea { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 12px 16px; border-radius: 20px; box-shadow: var(--ring); }
.idea::after { content: ""; flex: none; width: 8px; height: 8px; border-top: 2px solid var(--faint); border-right: 2px solid var(--faint); transform: rotate(45deg); }
.ask-ideas { gap: 10px; }

/* Chart card breathes */
.chartcard { padding: 14px 14px 8px; }
.entry .pr { grid-template-columns: 40px minmax(0, 1fr) 48px 66px 48px; column-gap: 6px; padding-inline: 14px; }
.entry .stepper .pu, .entry .stepper .pu.on { padding: 0 14px; }
.entry .stepper .pu, .entry .stepper .pu.on { width: max-content; flex: none; }

/* Trip table: day scores quiet, total strong */
.lrow[style*="repeat("] .r.sub { font-weight: 600; color: var(--sub); }
.lrow[style*="repeat("] .r.b { font-weight: 900; font-size: 1.1rem; }

/* Stats summary tiles: three calm cards, number in pine */
.sumtiles > div { background: #fff !important; box-shadow: var(--ring); color: var(--text); }
.sumtiles b { color: var(--pine); }
.sumtiles .cap { color: var(--sub); }

/* Ruling: the lead line is a sentence, not a second title */
.ask-intro .b { font-size: var(--fs-lead); font-weight: 800; }

/* Home: one heavy green card (today's round). Golfer of the Year is a light card with a gold medal. */
.feat { background: #fff; color: var(--text); box-shadow: var(--ring); }
.feat::after { background: rgba(247, 197, 22, .20); }
.ft-k { color: #7A5200; }
.ft-k svg { color: #C98F00; }
.ft-p { color: var(--sub); }
.ft-p b { color: var(--pine); }
.ft-foot { color: var(--sub); }
.ft-foot .stack .av { box-shadow: 0 0 0 2px #fff; }
.ft-me { color: var(--pine); }
.hero.home { padding: 12px 0 0; }
.hero.s, .hero.c:not(.pine) { padding-inline: 0; }

/* Position column grows with the text size; captions under names may wrap rather than clip */
.lrow, .lrow.drop { grid-template-columns: minmax(2.4ch, auto) minmax(0, 1fr) auto; }
.lrow .ln, .lname > .ln { overflow: visible; }
.lname .ln .cap { white-space: normal; }
.grow .b.num { white-space: nowrap; min-width: 4.6ch; }

/* ===== Polish: feel ===== */
/* Screens ease in when you move between them (not on every refresh of the data) */
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#app.enter > * { animation: rise .24s ease-out both; }
#app.enter > *:nth-child(2) { animation-delay: .03s; }
#app.enter > *:nth-child(3) { animation-delay: .06s; }
#app.enter > *:nth-child(n+4) { animation-delay: .09s; }
/* Everything tappable answers the thumb */
.btn, .lnk, .feat, .row, .lrow, .idea, .seg button, .tile, .entback, .undochip { transition: transform .12s ease, background-color .15s ease, box-shadow .15s ease; }
.btn:active, .lnk:active, .feat:active, .idea:active { transform: scale(.985); }
.row:active, .lrow:active { background-color: var(--fill); }
@media (prefers-reduced-motion: reduce) { #app.enter > * { animation: none; } .btn:active, .lnk:active, .feat:active, .idea:active { transform: none; } }

/* Primary buttons are green everywhere. Yellow is only for the scoring save, on the hole screen. */
.savebar .btn:not(.quiet) { background: var(--green); color: #fff; }
.entry .savebar .btn:not(.quiet), .entry + .savebar .btn:not(.quiet) { background: var(--flag); color: #0B3D2C; }

/* Scorecard page header */
.cardlink { color: var(--pine); font-weight: 700; text-decoration: none; }
.hero.s .note { margin: 8px 0 0; }
.hero.s .note .pill.w { background: #fff; color: var(--sub); box-shadow: inset 0 0 0 1.5px rgba(20, 35, 27, .18); }
.hero.s .tiles { margin-top: 14px; }

/* Scorecard marks: colour as well as shape, rounded */
.mk { width: 30px; height: 30px; font-weight: 700; }
.mk.birdie { background: var(--green); color: #fff; border: 0; border-radius: 50%; outline: 0; }
.mk.eagle { background: var(--flag); color: var(--pine); border: 0; border-radius: 50%; outline: 2px solid var(--flag); outline-offset: 2px; font-weight: 800; }
.mk.bogey { background: #FBE9E7; color: #8F1D1D; border: 0; border-radius: 9px; outline: 0; }
.mk.double { background: #F3C9C4; color: #7A1410; border: 0; border-radius: 9px; outline: 0; }
.cardlink, .hero.s .link.inline.cardlink { text-decoration: none !important; }
.mk.bogey { background: #EEF0EA; color: var(--text); }
.mk.double { background: #DDE3DE; color: var(--text); }

/* Large text: long lines wrap instead of being cut; the two-nine scorecard scrolls sideways inside its card */
.logrow .sub { white-space: normal; overflow-wrap: anywhere; }
.hole-row.cols .cap { white-space: normal; overflow: visible; }
.hole-row { grid-template-columns: minmax(2.4ch, .6fr) 1fr 1fr 1fr; }
.sc-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.cardlink { display: inline-block; padding: 12px 0; margin: -12px 0; }

/* Home tiles: one yellow highlight (the trip), the rest calm white cards with a green icon chip */
.lnk.leaf { background: #fff; box-shadow: var(--ring); }
.lnk.leaf .lnk-ic { background: #E3EFE6; }
.feat::after { right: -38px; top: -52px; width: 140px; height: 140px; background: rgba(247, 197, 22, .16); }
.ft-p b { position: relative; z-index: 2; }

/* Glass v6: close to Apple's liquid glass. Almost clear, light blur so you can see through it,
   bright rim light on the edges, and a clear lens for the chosen tab. */
.tabs {
  background: linear-gradient(180deg, rgba(255, 255, 255, .26), rgba(255, 255, 255, .10) 55%, rgba(255, 255, 255, .20));
  -webkit-backdrop-filter: blur(5px) saturate(190%) brightness(1.06); backdrop-filter: blur(5px) saturate(190%) brightness(1.06);
  box-shadow:
    inset 0 1.5px 1px -.5px rgba(255, 255, 255, .95),
    inset 0 -1.5px 1px -.5px rgba(255, 255, 255, .55),
    inset 1.5px 0 1px -1px rgba(255, 255, 255, .6),
    inset -1.5px 0 1px -1px rgba(255, 255, 255, .6),
    inset 0 0 18px rgba(255, 255, 255, .22),
    0 0 0 .5px rgba(20, 35, 27, .16),
    0 10px 28px rgba(20, 35, 27, .16);
}
.tabs::before { background: linear-gradient(180deg, rgba(255, 255, 255, .28), rgba(255, 255, 255, 0) 45%); }
.tab { color: #14231B; font-weight: 700; text-shadow: 0 0 6px rgba(255, 255, 255, .95), 0 0 2px rgba(255, 255, 255, .9); }
.tab svg { filter: drop-shadow(0 0 3px rgba(255, 255, 255, .9)); }
.tab.on {
  background: linear-gradient(180deg, rgba(255, 255, 255, .34), rgba(255, 255, 255, .12) 60%, rgba(255, 255, 255, .26));
  -webkit-backdrop-filter: blur(1.5px) saturate(210%) brightness(1.1); backdrop-filter: blur(1.5px) saturate(210%) brightness(1.1);
  box-shadow:
    inset 0 2px 1px -1px #fff,
    inset 0 -2px 2px -1px rgba(255, 255, 255, .8),
    inset 2px 0 2px -1.5px rgba(255, 255, 255, .8),
    inset -2px 0 2px -1.5px rgba(255, 255, 255, .8),
    inset 0 0 14px rgba(255, 255, 255, .35),
    0 0 0 1px rgba(255, 255, 255, .5),
    0 3px 10px rgba(20, 35, 27, .16);
  color: var(--pine); font-weight: 800;
}
.tab.on svg { filter: drop-shadow(0 0 3px rgba(255, 255, 255, .9)); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .tabs { background: rgba(255, 255, 255, .92); } }

/* Fixes 3: no bounce between tabs; sheets sit above the glass bar; classic score shapes with a key */
#app.enter > * { animation: none !important; }
.tabs.under { visibility: hidden; }
.sc-wrap { overflow: hidden; }
.sc { width: 100%; table-layout: fixed; }
.sc th:nth-child(1), .sc td:nth-child(1), .sc th:nth-child(6), .sc td:nth-child(6) { width: 19%; white-space: nowrap; }
.sc th:nth-child(2), .sc td:nth-child(2), .sc th:nth-child(7), .sc td:nth-child(7) { width: 9%; text-align: center; }
.sc th:nth-child(3), .sc td:nth-child(3), .sc th:nth-child(8), .sc td:nth-child(8) { width: 12%; text-align: center; padding-inline: 0; }
.sc th:nth-child(4), .sc td:nth-child(4), .sc th:nth-child(9), .sc td:nth-child(9) { width: 9%; text-align: center; padding-inline: 0; font-variant-numeric: tabular-nums; }
.sc th.gap, .sc td.gap { width: 6px; padding: 0; }
.sc td:last-child, .sc th:last-child { padding-right: 4px; }
.sc td:first-child, .sc th:first-child { padding-left: 8px; }
.sc th:nth-child(6), .sc td:nth-child(6) { padding-left: 6px; }
.sc th:nth-child(3), .sc th:nth-child(7) { padding-inline: 0; }
.sc .sd { letter-spacing: 1px; margin-left: 2px; }
.mk { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; font-weight: 700; font-variant-numeric: tabular-nums; border: 1.5px solid transparent; box-sizing: border-box; background: none; outline: 0; box-shadow: none; color: var(--text); }
.mk.birdie { background: #E3EFE6; border: 1.5px solid var(--pine); border-radius: 50%; color: var(--pine); }
.mk.eagle { background: var(--flag); border: 1.5px solid var(--pine); border-radius: 50%; color: var(--pine); box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--pine); }
.mk.bogey { background: #EEF0EA; border: 1.5px solid var(--pine); border-radius: 5px; }
.mk.double { background: #DDE3DE; border: 1.5px solid var(--pine); border-radius: 5px; box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--pine); }
.sckey { display: flex; flex-wrap: wrap; gap: 12px 18px; margin: 14px 4px 4px; align-items: center; }
.ski { display: inline-flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--sub); }
.ski .mk { width: 24px; height: 24px; font-size: .8rem; margin: 3px; }
.ski .sd { color: var(--text); font-size: 10px; }
.sc thead th, .sc thead th.hn { text-transform: none; letter-spacing: 0; font-size: .75rem; padding-inline: 0; }
.sc thead th.hn { padding-left: 8px; }
.sc thead th:nth-child(6) { padding-left: 6px; }
.sc thead th, .sc thead th.hn { font-size: .66rem; }

/* Ruling: the "i" button and the official wording panel */
.rbtn.rinfo { flex: none; width: 56px; min-width: 56px; padding: 0; font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 1.4rem; background: #fff; box-shadow: inset 0 0 0 1.5px var(--pine); color: var(--pine); }
.rbtn.rinfo[aria-expanded="true"] { background: var(--pine); color: #fff; }
.rquote { margin: 12px 2px 4px; padding: 14px 16px; border-radius: 18px; background: #fff; box-shadow: var(--ring); }
.rqh { font-size: .75rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--sub); margin-bottom: 8px; }
.rquote blockquote { margin: 0; padding-left: 12px; border-left: 3px solid var(--flag); font-size: .95rem; line-height: 1.45; color: var(--text); overflow-wrap: anywhere; }
.rqn { margin: 10px 0 0; font-size: .85rem; color: var(--sub); line-height: 1.35; }
.rquote .srcs { margin-top: 10px; }

/* UX pass 1: Hole screen keeps one job (enter scores) in reach; no duplicate Home; no decoration blob */
.teenav { display: flex; align-items: center; justify-content: space-between; min-height: 48px; }
.pillbtn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 1.5px rgba(20, 35, 27, .22); color: var(--pine); font: inherit; font-size: .95rem; font-weight: 700; }
.hero.pine.entcard::after { display: none; }
.shotkey { margin: 10px 4px 0; display: flex; align-items: center; gap: 8px; }
.shotkey .sd { color: var(--text); font-size: 10px; letter-spacing: 2px; margin: 0; }
.tee > .btn[data-act="enter"] { position: sticky; bottom: calc(var(--tabh, 90px) + 10px); z-index: 5; box-shadow: 0 8px 22px rgba(20, 35, 27, .28); }
.tee { padding-bottom: 8px; }
.teenav .pill.w2 { background: #fff; color: var(--sub); box-shadow: inset 0 0 0 1.5px rgba(20, 35, 27, .22); }

/* Ruling: the empty screen is a pine "ask the referee" card with a big microphone, and tiles with icons for common situations */
.rulehd.empty { display: none; }
.hero.pine.askhero { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 8px 0 0; padding: 22px 18px 22px 20px; border-radius: 28px; }
.hero.pine.askhero::after { display: none; }
.ah-txt { min-width: 0; position: relative; z-index: 1; }
.ah-txt small { display: block; font-size: .75rem; font-weight: 800; letter-spacing: .1em; color: var(--flag); }
.ah-txt b { display: block; margin-top: 6px; font-size: 2rem; font-weight: 900; letter-spacing: -.03em; line-height: 1.05; color: #fff; }
.ah-txt span { display: block; margin-top: 10px; font-size: .95rem; line-height: 1.35; color: rgba(255, 255, 255, .82); }
.ah-mic { position: relative; z-index: 1; flex: none; width: 76px; height: 76px; border-radius: 50%; border: 0; background: var(--flag); color: var(--pine); display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 0 0 8px rgba(247, 197, 22, .22), 0 10px 22px rgba(0, 0, 0, .25); }

<script>/* Golf trip scoring engine.
 * Pure functions only: no screen code and no storage, so every rule can be tested on its own.
 * Used by the app in the browser and by the tests in Node. */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.Engine = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const ALL = Array.from({ length: 18 }, (_, i) => i + 1);
  const SEGMENTS = { front: ALL.slice(0, 9), back: ALL.slice(9), overall: ALL };

  /* ---------- Handicaps (WHS) ---------- */

  /** Nearest whole number, .5 rounded away from zero. */
  function roundHandicap(x) {
    const e = 1e-9;
    return (x >= 0 ? Math.floor(x + 0.5 + e) : -Math.floor(-x + 0.5 + e)) + 0;
  }

  /** Every step of the playing-handicap sum, so players can check it.
   *  WHS since April 2024: course handicap is kept unrounded, the allowance
   *  is applied, and the result is rounded once. */
  function handicapWorking(index, tee, allowance) {
    const slopePart = index * tee.slope / 113;
    const ratingPart = tee.rating - tee.par;
    const courseHandicap = slopePart + ratingPart;
    const beforeRounding = courseHandicap * allowance;
    return {
      index, slope: tee.slope, rating: tee.rating, par: tee.par, allowance,
      slopePart, ratingPart, courseHandicap, beforeRounding,
      playing: roundHandicap(beforeRounding)
    };
  }

  function playingHandicap(index, tee, allowance) {
    return handicapWorking(index, tee, allowance).playing;
  }

  /** Shots received on a hole. Negative means a plus handicapper gives shots back. */
  function shotsOnHole(ph, si) {
    if (ph >= 0) return Math.floor(ph / 18) + (si <= ph % 18 ? 1 : 0);
    const plus = -ph;
    const back = Math.floor(plus / 18) + (si > 18 - (plus % 18) ? 1 : 0);
    return back === 0 ? 0 : -back;
  }

  /* ---------- Scores ---------- */

  /** A hole score is a whole number of strokes, or 'P' for picked up. */
  function isEntered(v) {
    return v === 'P' || (Number.isInteger(v) && v >= 1);
  }

  function stablefordPoints(gross, par, shots) {
    if (!isEntered(gross)) return null;
    if (gross === 'P') return 0;
    return Math.max(0, par + shots - gross + 2);
  }

  /** The strokes that make a pick-up worth nothing: the first score that earns 0 points. Display only; a pick-up still scores 0. */
  function pickupStrokes(par, shots) { return par + shots + 2; }

  /** What golfers call the gross score: Par, Bogey, Double... */
  function scoreName(gross, par) {
    if (gross === 'P') return 'Picked up';
    if (!isEntered(gross)) return '';
    if (gross === 1) return 'Hole in one';
    const d = gross - par;
    const names = { '-3': 'Albatross', '-2': 'Eagle', '-1': 'Birdie', '0': 'Par', '1': 'Bogey', '2': 'Double', '3': 'Triple' };
    return names[String(d)] || (d > 0 ? '+' + d : String(d));
  }

  function metresToYards(m) {
    return Math.round(m * 1.0936133);
  }

  /** Physical hole numbers in the order a group plays them. */
  function playOrder(startHole) {
    const s = startHole || 1;
    return ALL.slice(s - 1).concat(ALL.slice(0, s - 1));
  }

  function teamLabels(team, nameOf) {
    return {
      long: team.map(nameOf).join(' & '),
      short: team.map(id => nameOf(id).charAt(0)).join('&')
    };
  }

  /* ---------- Buggy Wars (match play on best Stableford score) ---------- */

  /** results: 'A' | 'B' | 'H' | null for each hole of one match, in playing order. */
  function matchProgress(results) {
    let lead = 0, played = 0, closed = null;
    const total = results.length;
    const after = [];
    for (const r of results) {
      if (!r) { after.push(null); continue; }
      played += 1;
      if (r === 'A') lead += 1; else if (r === 'B') lead -= 1;
      const remaining = total - played;
      if (!closed && Math.abs(lead) > remaining) {
        closed = { leader: lead > 0 ? 'A' : 'B', up: Math.abs(lead), toPlay: remaining };
      }
      after.push(lead);
    }
    return { lead, played, total, remaining: total - played, closed, after };
  }

  function matchWinner(m) {
    return m.closed ? m.closed.leader : null;
  }

  /** Match status in golf language: "Pat & Dermot 2 up", "All square", "won 3 & 2". */
  function describeMatch(m, labels, useShort) {
    const nm = s => (useShort ? labels[s === 'A' ? 0 : 1].short : labels[s === 'A' ? 0 : 1].long);
    if (m.played === 0) return { text: 'Not started', leader: null, state: 'pending', toPlay: m.remaining };
    if (m.closed && m.closed.toPlay > 0) {
      return { text: `${nm(m.closed.leader)} won ${m.closed.up} & ${m.closed.toPlay}`, leader: m.closed.leader, state: 'won', toPlay: m.remaining };
    }
    if (m.remaining === 0) {
      if (m.lead === 0) return { text: 'Halved', leader: null, state: 'halved', toPlay: 0 };
      const L = m.lead > 0 ? 'A' : 'B';
      return { text: `${nm(L)} won ${Math.abs(m.lead)} up`, leader: L, state: 'won', toPlay: 0 };
    }
    if (m.lead === 0) return { text: 'All square', leader: null, state: 'live', toPlay: m.remaining };
    const L = m.lead > 0 ? 'A' : 'B';
    const dormie = Math.abs(m.lead) === m.remaining;
    return { text: `${nm(L)} ${Math.abs(m.lead)} up${dormie ? ' · dormie' : ''}`, leader: L, state: 'live', toPlay: m.remaining, dormie };
  }

  /* ---------- Rankings ---------- */

  /** Sort and label positions. Equal values share a position (T7). No countback is applied. */
  function rankRows(rows, key, dir) {
    const sign = dir === 'asc' ? 1 : -1;
    const label = r => String(r.name || r.label || '');
    const sorted = rows.slice().sort((a, b) => sign * (a[key] - b[key]) || label(a).localeCompare(label(b)));
    return sorted.map(r => {
      const better = sorted.filter(o => sign * (o[key] - r[key]) < 0).length;
      const same = sorted.filter(o => o[key] === r[key]).length;
      return Object.assign({}, r, { pos: better + 1, posLabel: (same > 1 ? 'T' : '') + (better + 1), tied: same > 1 });
    });
  }

  /* ---------- A whole round ---------- */

  /**
   * input: {
   *   groups: [{ id, n, teeTime, startHole, teams: [[pid, pid], [pid, pid]] }],
   *   holes: [{ n, par, si }], tee: { slope, rating, par }, allowance,
   *   players: { pid: { name, index } }, scores: { pid: { hole: strokes | 'P' } },
   *   phOverride: { pid: playingHandicap }   // handicaps frozen when a round is finalised
   * }
   */
  function computeRound(input) {
    const { groups, holes, tee, allowance, players, scores, phOverride } = input;
    const holeBy = {};
    holes.forEach(h => { holeBy[h.n] = h; });
    const nameOf = id => (players[id] ? players[id].name : id);
    const byPlayer = {};

    groups.forEach(grp => grp.teams.flat().forEach(pid => {
      const p = players[pid];
      const ph = phOverride && phOverride[pid] !== undefined ? phOverride[pid] : playingHandicap(p.index, tee, allowance);
      const card = (scores && scores[pid]) || {};
      const rows = {};
      let total = 0, thru = 0, gross = 0;
      const pickups = [];
      ALL.forEach(n => {
        const h = holeBy[n];
        const shots = shotsOnHole(ph, h.si);
        const g = card[n];
        const points = stablefordPoints(g, h.par, shots);
        rows[n] = { gross: isEntered(g) ? g : null, shots, points };
        if (points !== null) {
          total += points; thru += 1;
          if (g === 'P') pickups.push(n); else gross += g;
        }
      });
      byPlayer[pid] = { id: pid, name: nameOf(pid), ph, holes: rows, total, thru, gross, pickups, groupId: grp.id };
    }));

    const groupOut = groups.map(grp => {
      const labels = grp.teams.map(t => teamLabels(t, nameOf));
      const order = playOrder(grp.startHole);
      const hs = {};
      order.forEach(n => {
        const pts = grp.teams.map(t => t.map(pid => byPlayer[pid].holes[n].points));
        const complete = pts.flat().every(v => v !== null);
        const entry = { n, complete, pts, best: null, counting: null, result: null, segLead: null, overallLead: null };
        if (complete) {
          entry.best = pts.map(a => Math.max(...a));
          entry.counting = grp.teams.map((t, i) => t.filter((pid, j) => pts[i][j] === entry.best[i]));
          entry.result = entry.best[0] > entry.best[1] ? 'A' : entry.best[1] > entry.best[0] ? 'B' : 'H';
        }
        hs[n] = entry;
      });
      const matches = {};
      Object.keys(SEGMENTS).forEach(seg => {
        const segOrder = order.filter(n => SEGMENTS[seg].includes(n));
        const prog = matchProgress(segOrder.map(n => hs[n].result));
        segOrder.forEach((n, i) => {
          if (seg === 'overall') hs[n].overallLead = prog.after[i];
          else hs[n].segLead = prog.after[i];
        });
        matches[seg] = Object.assign(prog, {
          order: segOrder,
          status: describeMatch(prog, labels, false),
          short: describeMatch(prog, labels, true),
          winner: matchWinner(prog)
        });
      });
      const done = order.filter(n => hs[n].complete).length;
      return {
        id: grp.id, n: grp.n, teeTime: grp.teeTime, startHole: grp.startHole || 1,
        teams: grp.teams, labels, order, holes: hs, matches,
        nextHole: order.find(n => !hs[n].complete) || null,
        holesDone: done, complete: done === 18
      };
    });

    const leaderboard = rankRows(Object.values(byPlayer).map(p => ({ id: p.id, name: p.name, total: p.total, thru: p.thru })), 'total', 'desc');

    const pairs = [];
    groupOut.forEach(go => go.teams.forEach((t, i) => pairs.push({
      groupId: go.id, team: t, label: go.labels[i].long,
      total: t.reduce((s, pid) => s + byPlayer[pid].total, 0),
      thru: Math.min(...t.map(pid => byPlayer[pid].thru))
    })));
    const ranked = rankRows(pairs, 'total', 'desc');
    const lowest = Math.min(...pairs.map(p => p.total));
    ranked.forEach(p => { p.lowest = p.total === lowest; });

    return { players: byPlayer, groups: groupOut, leaderboard, pairs: ranked };
  }

  /** Trip totals across rounds. All rounds count. */
  function tripStandings(roundResults, playerList) {
    const rows = playerList.map(p => {
      const per = roundResults.map(rr => (rr && rr.players[p.id] ? rr.players[p.id].total : null));
      const thru = roundResults.reduce((s, rr) => s + (rr && rr.players[p.id] ? rr.players[p.id].thru : 0), 0);
      return { id: p.id, name: p.name, per, thru, total: per.reduce((s, v) => s + (v || 0), 0) };
    });
    return rankRows(rows, 'total', 'desc');
  }

  /* ---------- Pairings and the draw ---------- */

  const pairKey = (a, b) => [a, b].sort().join('+');

  /** roundsGroups: [{ rid, groups }]. Returns { 'pat+dermot': ['r1', 'r2'] }. */
  function partnerHistory(roundsGroups) {
    const map = {};
    roundsGroups.forEach(({ rid, groups }) => (groups || []).forEach(g => g.teams.forEach(t => {
      if (t.length !== 2) return;
      const k = pairKey(t[0], t[1]);
      (map[k] = map[k] || []).push(rid);
    })));
    return map;
  }

  function repeatedPartners(roundsGroups) {
    const map = partnerHistory(roundsGroups);
    return Object.keys(map).filter(k => map[k].length > 1).map(k => ({ pair: k.split('+'), rounds: map[k] }));
  }

  /* ---------- Scorecard photo check ---------- */

  const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z]/g, '');

  /** Normalise one cell of a card reading: strokes, 'P' for a pick-up, or null if unreadable. */
  function cardValue(cell) {
    const v = cell && typeof cell === 'object' ? cell.value : cell;
    if (v === null || v === undefined || v === '') return null;
    if (typeof v === 'string') {
      const t = v.trim().toUpperCase();
      if (['P', 'X', '-', '–', '/', 'NR', 'NS'].includes(t)) return 'P';
      const n = Number(t);
      return Number.isInteger(n) && n >= 1 ? n : null;
    }
    return Number.isInteger(v) && v >= 1 ? v : null;
  }

  /**
   * Work out which card row (A, B, C, D) belongs to which player.
   * First by the names written in the key (accents and short forms allowed: "Derm" is Dermot),
   * then by whichever assignment agrees with the most scores already in the app.
   * cardPlayers: [{ letter, name, scores: { hole: cell } }]; players: [{ id, name }]; app: { pid: { hole: v } }.
   */
  function matchCardRows(cardPlayers, players, app) {
    const map = {};
    const used = new Set();
    cardPlayers.forEach(cp => {
      const n = fold(cp.name);
      if (n.length < 2) return;
      const hits = players.filter(p => !used.has(p.id) && (fold(p.name).startsWith(n) || n.startsWith(fold(p.name))));
      if (hits.length === 1) { map[cp.letter] = hits[0].id; used.add(hits[0].id); }
    });
    const rest = cardPlayers.filter(cp => !map[cp.letter]);
    const free = players.filter(p => !used.has(p.id));
    if (rest.length && free.length) {
      const agree = (cp, pid) => Object.keys(cp.scores || {}).filter(h => {
        const c = cardValue(cp.scores[h]);
        return c !== null && app[pid] && app[pid][h] === c;
      }).length;
      let best = null;
      const permute = (i, chosen, score) => {
        if (i === rest.length) { if (!best || score > best.score) best = { score, chosen: chosen.slice() }; return; }
        free.forEach(p => {
          if (chosen.includes(p.id)) return;
          chosen.push(p.id);
          permute(i + 1, chosen, score + agree(rest[i], p.id));
          chosen.pop();
        });
        if (rest.length > free.length) permute(i + 1, chosen.concat([null]), score);
      };
      permute(0, [], 0);
      if (best) rest.forEach((cp, i) => { if (best.chosen[i]) map[cp.letter] = best.chosen[i]; });
    }
    return map;
  }

  /**
   * Compare a card reading with the app for one nine.
   * Only differences need a person: the app never changes a score on its own.
   * A reading counts as unclear when the reader said so, or when it would be an
   * implausible score for the hole (more than par + 4), so a misread 4-as-9 is
   * shown as "please check", never as a confident difference.
   * Returns { checked, matched, issues: [{ hole, pid, card, app, kind: 'differs'|'unclear'|'unreadable', note }], unmatchedRows }.
   */
  function compareCard(reading, players, app, holes, segHoles) {
    const parOf = {};
    holes.forEach(h => { parOf[h.n] = h.par; });
    const map = matchCardRows(reading.players || [], players, app);
    const issues = [];
    let checked = 0, matched = 0;
    (reading.players || []).forEach(cp => {
      const pid = map[cp.letter];
      if (!pid) return;
      segHoles.forEach(h => {
        const appV = app[pid] ? app[pid][h] : undefined;
        if (appV === undefined || appV === null) return;
        checked += 1;
        const cell = (cp.scores || {})[h];
        const c = cardValue(cell);
        const low = cell && typeof cell === 'object' && cell.confidence === 'low';
        const note = cell && typeof cell === 'object' ? (cell.note || '') : '';
        if (c === null) { issues.push({ hole: h, pid, card: null, app: appV, kind: 'unreadable', note }); return; }
        if (c === appV) { matched += 1; return; }
        const implausible = Number.isInteger(c) && c > parOf[h] + 4;
        issues.push({ hole: h, pid, card: c, app: appV, kind: low || implausible ? 'unclear' : 'differs', note });
      });
    });
    issues.sort((a, b) => a.hole - b.hole);
    const unmatchedRows = (reading.players || []).filter(cp => !map[cp.letter]).map(cp => cp.letter);
    return { checked, matched, issues, map, unmatchedRows };
  }

  /** Split four players into two buggies. Prefers 1st & 4th v 2nd & 3rd,
   *  but avoids pairs who already shared a buggy when another split can. */
  function bestSplit(ids, history) {
    if (ids.length === 4) {
      const splits = [[[0, 3], [1, 2]], [[0, 2], [1, 3]], [[0, 1], [2, 3]]]
        .map(s => s.map(t => t.map(i => ids[i])));
      const repeats = s => s.filter(t => history[pairKey(t[0], t[1])]).length;
      return splits.reduce((best, s) => (repeats(s) < repeats(best) ? s : best), splits[0]);
    }
    return teamsFor(ids);
  }

  /** Buggies for a group of any size: 4 is two pairs, 3 is a pair and a single. */
  function teamsFor(ids) {
    if (ids.length >= 4) return [ids.slice(0, 2), ids.slice(2, 4)];
    if (ids.length === 3) return [ids.slice(0, 2), ids.slice(2)];
    if (ids.length === 2) return [[ids[0]], [ids[1]]];
    return [ids.slice()];
  }

  /** Group sizes for n players: fours, with threes where it does not divide. */
  function groupSizes(n) {
    if (n <= 0) return [];
    if (n <= 4) return [n];
    const g = Math.ceil(n / 4);
    const sizes = Array(g).fill(Math.floor(n / g));
    for (let i = 0; i < n % g; i++) sizes[i] += 1;
    return sizes.sort((a, b) => b - a);
  }

  /** "10:00" plus minutes, as "10:08". */
  function addMinutes(hhmm, mins) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || ''));
    if (!m) return '';
    if (Number(m[1]) > 23 || Number(m[2]) > 59) return '';
    const step = Number.isFinite(mins) ? Math.round(mins) : 0;
    const t = (((Number(m[1]) * 60 + Number(m[2]) + step) % 1440) + 1440) % 1440;
    return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
  }

  function teeTimesFrom(first, interval, count) {
    const step = Number(interval) > 0 ? Number(interval) : 8;
    return Array.from({ length: count }, (_, i) => addMinutes(first, i * step));
  }

  function makeGroups(orderedIds, teeTimes, history) {
    const sizes = groupSizes(orderedIds.length);
    const groups = [];
    let k = 0;
    sizes.forEach((size, i) => {
      const ids = orderedIds.slice(k, k + size);
      k += size;
      groups.push({ id: 'g' + (i + 1), n: i + 1, teeTime: (teeTimes || [])[i] || '', startHole: 1, teams: history ? bestSplit(ids, history) : teamsFor(ids) });
    });
    return groups;
  }

  function flagRepeats(groups, priorRoundsGroups) {
    const history = partnerHistory(priorRoundsGroups);
    const repeats = [];
    groups.forEach(g => g.teams.forEach(t => {
      if (t.length === 2 && history[pairKey(t[0], t[1])]) repeats.push({ pair: t, rounds: history[pairKey(t[0], t[1])] });
    }));
    return repeats;
  }

  /** Reverse-standings draw: lowest scores off first, leaders last.
   *  Within a group, buggies avoid repeated partners where possible. Repeats left are flagged, not hidden. */
  function proposeDraw(standings, priorRoundsGroups, teeTimes) {
    const history = partnerHistory(priorRoundsGroups);
    const worstFirst = standings.slice().reverse().map(r => r.id);
    const sizes = groupSizes(worstFirst.length);
    const groups = [];
    let k = 0;
    sizes.forEach((size, i) => {
      const bestFirst = worstFirst.slice(k, k + size).reverse();
      k += size;
      groups.push({ id: 'g' + (i + 1), n: i + 1, teeTime: (teeTimes || [])[i] || '', startHole: 1, teams: bestSplit(bestFirst, history) });
    });
    return { groups, repeats: flagRepeats(groups, priorRoundsGroups) };
  }

  /** A seeded shuffle, so a draw can be repeated in tests. */
  function shuffle(list, seed) {
    const a = list.slice();
    let s = (seed >>> 0) || 1;
    const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  function randomDraw(ids, teeTimes, seed, priorRoundsGroups) {
    const history = partnerHistory(priorRoundsGroups || []);
    const groups = makeGroups(shuffle(ids, seed), teeTimes, history);
    return { groups, repeats: flagRepeats(groups, priorRoundsGroups || []) };
  }

  /** KB pairs: partners always in different groups. */
  function kbPairsFor(groups, seed) {
    const groupOf = {};
    groups.forEach(g => g.teams.flat().forEach(pid => { groupOf[pid] = g.id; }));
    const ids = Object.keys(groupOf);
    for (let attempt = 0; attempt < 200; attempt++) {

    if (d === -1) return 'birdie';
    if (d === 0) return 'par';
    if (d === 1) return 'bogey';

    const by = (key, dir) => rows => rows.slice().sort((a, b) => dir * (b[key] - a[key]) || a.name.localeCompare(b.name));
    const top = (rows, key) => rows.length && rows[0][key] > 0 ? rows.filter(r => r[key] === rows[0][key]) : [];

    const hole = {};

      const cards = ps.filter(p => p.holes[n].points !== null);
      if (cards.length >= 2) hole[n] = { n, par: par[n], cards: cards.length, avgPts: cards.reduce((s, p) => s + p.holes[n].points, 0) / cards.length };

    const hardest = lo !== null && hi > lo ? hl.filter(h => h.avgPts === lo) : [];
    const easiest = lo !== null && hi > lo ? hl.filter(h => h.avgPts === hi) : [];

    const counts = (marks) => by('count', 1)(ps.map(p => ({ id: p.id, name: p.name, count: entered(p).filter(n => marks.includes(scoreMark(p.holes[n].gross, par[n]))).length })));

    const swings = nines.filter(x => x.seg === 'back' && x.other !== null).map(x => ({ id: x.id, name: x.name, swing: x.pts - x.other, front: x.other, back: x.pts }));
    const up = swings.length ? Math.max(...swings.map(x => x.swing)) : 0;
    const comeback = up >= 5 ? swings.filter(x => x.swing === up) : [];
    const down = swings.length ? Math.min(...swings.map(x => x.swing)) : 0;
    const fade = down <= -5 ? swings.filter(x => x.swing === down) : [];
    const level = swings.length > 1 ? Math.min(...swings.map(x => Math.abs(x.swing))) : null;
    const steady = level !== null && level <= 1 ? swings.filter(x => Math.abs(x.swing) === level) : [];

    const worst = [];
    ps.forEach(p => entered(p).forEach(n => { const g = p.holes[n].gross; if (g !== 'P') worst.push({ id: p.id, name: p.name, n, over: g - par[n], gross: g }); }));

    const blowup = wo >= 3 ? worst.filter(x => x.over === wo) : [];

  }

  /**
   * One golfer's numbers across rounds. entries: [{ total, pos, kb, holes }], where holes is
   * [{ par, gross, points }] for rounds scored hole by hole and null for imported totals.

  function playerSummary(entries) {

      rounds: entries.length,
      average: totals.length ? totals.reduce((a, b) => a + b, 0) / totals.length : null,
      best: totals.length ? Math.max(...totals) : null,
      worst: totals.length ? Math.min(...totals) : null,
      wins: entries.filter(e => e.pos === 1).length,
      kbs: entries.filter(e => e.kb).length,
      scored: 0, eagles: 0, birdies: 0, pars: 0, bogeys: 0, doubles: 0, scratches: 0,
      byPar: { 3: null, 4: null, 5: null }

      if (!e.holes) return;

      e.holes.forEach(h => {
        if (h.gross === null || h.gross === undefined) return;
        const m = scoreMark(h.gross, h.par);

  }

  function kbLowest(rows) {
    if (!rows || rows.length < 2) return [];
    const last = rows[rows.length - 1];
    return last.pos !== undefined ? rows.filter(r => r.pos === last.pos) : [last];
  }

  return {
    SEGMENTS, roundStats, playerSummary, kbLowest, roundHandicap, handicapWorking, playingHandicap, shotsOnHole,

});

<script>/* NCGS data service.

    'You are a golf rules referee. You answer questions about the Rules of Golf as published by the R&A and the USGA, and nothing else. If asked about anything that is not a golf rule, say you only cover the Rules of Golf.',
    'The people asking are experienced club golfers standing on a course, speaking into a phone. Their question comes from voice dictation, so it may be rambling, loosely worded or slightly garbled. Work out the exact situation and answer that, not a generic version of it. If one fact would change the answer (for example whether the ball was putted or chipped onto the green, in play, or in a bunker), do not give both answers: ask the person that one thing first (Kind 1 below), then give one clear ruling.',
    'Before you answer, use the web search tool to read the current official Rules of Golf on randa.org or usga.org, so that you are not relying on memory. Check the exact rule, its wording and any penalty. Check whether the stroke play or match play version matters. Society days are stroke play or Stableford, which the Rules treat as stroke play (Rule 21.1), unless the person says it was match play.',
    'How to answer: reply with ONE JSON object and nothing else (no text before or after it, no code fences). It is one of two kinds.',
    'Kind 1, a question, whenever one missing fact the person has not told you would change the ruling (for example "Did you putt the ball onto the green, or chip it on?" with options "Putted", "Chipped", "Not sure"): {"type":"ask","question":"Is the ball inside red or yellow stakes?","options":[{"label":"Red stakes or line","tag":"red"},{"label":"Yellow stakes or line","tag":"yellow"},{"label":"No stakes, just bushes"},{"label":"Not sure"}]}. 2 to 5 options, each a few words, the last one "Not sure" when that makes sense. "tag" is optional and only "red" or "yellow". Ask at most one question, never when the situation is already clear, and never again once the person has answered one: then give the ruling.',
    'Kind 2, the ruling: {"type":"ruling","topic":"Unplayable ball","rule":"Rule 19","verdict":"1 penalty shot","intro":"Mick picks one of these:","steps":["Drop within **2 club-lengths**, no nearer the hole","Go **back on a line** from the flag through the ball, as far as he likes","Play again from **where he last hit**"],"note":"Count the penalty in Mick\'s score for the hole."}. "verdict" is the answer in a few plain words that can be read out, for example "No penalty" or "1 penalty shot" or "Play it as it lies". "topic" is two or three words. "rule" is the rule number, for example "Rule 11.1". "intro" is one short line leading into the steps and may be left out. "steps" are the things the player does or may choose between, 0 to 4 of them, each one short sentence, with the key words in **bold**; leave "steps" out when the verdict says it all. "note" is one or two short sentences with the reason, the match play difference, or the one thing that would change the answer; it may be left out. Use the player\'s name if they gave one. Mention a Local Rule or Committee decision only if it could change the answer. Keep the whole thing under about 120 words. "quote" is the official wording of that rule, copied word for word from the page you read, at most 600 characters and only the part that decides this case; leave "quote" out unless you copied it exactly from the official page, and never write it from memory.',
    'Never guess. If the rules do not clearly cover it, or you could not find the rule, say so plainly. Never invent a rule number. Treat the search result for the current edition as the authority over anything you remember.'
  ].join('\n');

  /* ---------- The service ---------- */
  function createServer(store, opts) {
    opts = opts || {};
    var now = opts.now || function () { return new Date().toISOString(); };

    function err(code, message) { var e = new Error(message || code); e.code = code; return e; }
    // The new version is only published (commit) after its rows are written, so a poll never skips them.
    function bump() { return store.getVer() + 1; }
    function commit(v) { store.setVer(v); return v; }
    /* The organiser PIN. Ten wrong guesses in ten minutes lock the PIN for everyone until the window passes;
       scoring from a phone never needs the PIN, so a round carries on. */
    var LOCK_AFTER = 10;
    function wrongCount() { return Number(store.cacheGet('pinfail') || 0); }
    function locked() { return wrongCount() >= LOCK_AFTER; }
    function pinOk(pin) {
      if (pin === undefined || pin === null) return false;
      if (locked()) return false;
      if (String(pin) === String(store.getPin())) { if (wrongCount()) store.cachePut('pinfail', '0', 600); return true; }
      store.cachePut('pinfail', String(wrongCount() + 1), 600);
      return false;
    }
    var MAX_CELL = 40000, MAX_ROWS = 400;
    /* Refuses rows that would not fit a sheet cell, are missing their key, or come in huge batches. */
    function checkRows(t, rows) {
      if (!Array.isArray(rows)) throw err('bad', 'Rows expected');
      if (rows.length > MAX_ROWS) throw err('bad', 'Too many rows in one go');
      rows.forEach(function (r) {
        if (!r || typeof r !== 'object' || Array.isArray(r)) throw err('bad', 'Unreadable row');
        SCHEMA[t].key.forEach(function (k) { if (r[k] === undefined || r[k] === null || r[k] === '') throw err('bad', 'A row is missing its ' + k); });
        Object.keys(SCHEMA[t].cols).forEach(function (c) {
          var v = r[c];
          if (v !== undefined && v !== null && toCell(SCHEMA[t].cols[c], v).length > MAX_CELL) throw err('bad', 'That is too long to store');
        });
      });
    }
    function stamp(t, rows, v) { return rows.map(function (r) { var c = clean(t, r); c.ver = v; return c; }); }
    function logRow(v, by, action, detail) {
      return { id: 'L' + v + '-' + Math.random().toString(36).slice(2, 7), at: now(), by: by || '', action: action, detail: detail || '' };
    }
    function find(t, pred) { var rows = store.read(t); for (var i = 0; i < rows.length; i++) if (pred(rows[i])) return rows[i]; return null; }

    var ops = {};

    ops.load = function () {
      var tables = {};
      TABLES.forEach(function (t) { tables[t] = store.read(t); });
      return { ver: store.getVer(), build: BUILD, tables: tables };
    };

    ops.since = function (req) {
      var v = Number(req.v || 0);
      var cached = store.cacheGet('VER');
      var cur = cached !== null && cached !== undefined ? Number(cached) : store.getVer();
      if (v >= cur) return { ver: cur, same: true, build: BUILD };
      var tables = {};
      TABLES.forEach(function (t) {
        var rows = store.read(t).filter(function (r) { return (r.ver || 0) > v; });
        if (rows.length) tables[t] = rows;
      });
      return { ver: cur, build: BUILD, tables: tables };
    };

    ops.checkPin = function (req) { var ok = pinOk(req.pin); return ok ? { ok: true } : { ok: false, locked: locked() }; };

    ops.setPin = function (req) {
      if (!pinOk(req.pin)) throw err('pin', 'That PIN did not match.');
      if (!/^\d{4,8}$/.test(String(req.newPin || ''))) throw err('bad', 'Use 4 to 8 digits.');
      return store.lock(function () {
        store.setPin(String(req.newPin));
        var v = bump();
        store.upsert('log', stamp('log', [logRow(v, 'Organiser', 'Organiser PIN changed', '')], v));
        commit(v);
        return { ok: true, ver: v };
      });
    };

    /* One hole for one group. A score that another phone changed since this phone last saw it
       is not overwritten: it comes back as a conflict for a person to decide. */
    ops.saveHole = function (req) {
      return store.lock(function () {
        var round = find('rounds', function (r) { return r.id === req.round; });
        if (!round) throw err('missing', 'That round no longer exists.');
        var org = pinOk(req.pin);
        var hole = Number(req.hole);
        if (req.hole === null || req.hole === '' || typeof req.hole === 'boolean' || !isFinite(hole) || Math.floor(hole) !== hole || hole < 1 || hole > 18) throw err('bad', 'That is not a hole on the course.');
        var grp = (round.groups || []).filter(function (g) { return g.id === req.grp; })[0];
        if (!grp) throw err('bad', 'That group is not in this round.');
        var inGroup = {};
        grp.teams.forEach(function (t) { t.forEach(function (pid) { inGroup[pid] = 1; }); });
        var sc = req.scores && typeof req.scores === 'object' ? req.scores : {};
        Object.keys(sc).forEach(function (pid) {
          if (!inGroup[pid]) throw err('bad', 'That player is not in this group.');
          var w = sc[pid] && sc[pid].v;
          if (w !== null && w !== 'P' && !(typeof w === 'number' && isFinite(w) && Math.floor(w) === w && w >= 1 && w <= 25)) throw err('bad', 'That is not a score.');
        });
        if (round.status === 'final') throw err('final', 'This round is final.');
        var starting = round.status === 'upcoming' && round.groups && round.groups.length;
        if (round.status !== 'live' && !starting) throw err('notlive', 'This round has not started.');
        var existing = {};
        store.read('scores').forEach(function (s) { if (s.round === req.round && s.hole === hole) existing[s.player] = s.strokes; });
        var conflicts = [];
        var rows = [];
        var clears = [];
        var changes = [];
        Object.keys(req.scores || {}).forEach(function (pid) {
          var want = req.scores[pid].v;
          var base = req.scores[pid].base;
          var cur = existing[pid] === undefined ? null : existing[pid];
          if (cur === want) return;
          if (base !== undefined && cur !== (base === undefined ? null : base) && !(req.force && org)) {
            conflicts.push({ player: pid, server: cur, mine: want });
            return;
          }
          if (cur !== null) changes.push({ player: pid, from: cur, to: want === null ? 'cleared' : want });
          if (want === null) clears.push(keyOf('scores', { round: req.round, player: pid, hole: hole }));
          else rows.push({ round: req.round, player: pid, hole: hole, strokes: want, by: req.by || '', at: now() });
        });
        var claimRows = [];
        var claimRemove = [];
        if (req.claim !== undefined) {
          var curClaim = find('claims', function (c) { return c.round === req.round && c.hole === hole && c.grp === req.grp; });
          var wantClaim = req.claim || null;
          if (wantClaim && !inGroup[wantClaim]) throw err('bad', 'That player is not in this group.');
          if ((curClaim ? curClaim.player : null) !== wantClaim) {
            if (wantClaim) claimRows.push({ round: req.round, hole: hole, grp: req.grp, player: wantClaim, at: now() });
            else if (curClaim) claimRemove.push(keyOf('claims', curClaim));
          }
        }
        if (!rows.length && !clears.length && !claimRows.length && !claimRemove.length) {
          return { ok: true, ver: store.getVer(), conflicts: conflicts, changed: 0 };
        }
        var v = bump();
        if (starting) {
          round.status = 'live';
          store.upsert('rounds', stamp('rounds', [round], v));
          store.upsert('log', stamp('log', [logRow(v, req.by, 'Round started', 'First score saved')], v));
        }
        store.upsert('scores', stamp('scores', rows, v));
        if (clears.length) {
          store.remove('scores', clears);
          store.upsert('deleted', stamp('deleted', clears.map(function (k) { return { tbl: 'scores', k: k }; }), v));
        }
        if (claimRows.length) store.upsert('claims', stamp('claims', claimRows, v));
        if (claimRemove.length) {
          store.remove('claims', claimRemove);
          store.upsert('deleted', stamp('deleted', claimRemove.map(function (k) { return { tbl: 'claims', k: k }; }), v));
        }
        if (changes.length) {
          var names = req.names || {};
          var detail = (req.label || ('Hole ' + hole)) + ': ' + changes.map(function (c) {
            return (names[c.player] || c.player) + ' ' + (c.from === 'P' ? 'picked up' : c.from) + ' → ' + (c.to === 'P' ? 'picked up' : c.to);
          }).join(', ');
          store.upsert('log', stamp('log', [logRow(v, req.by, org ? 'Score corrected' : 'Score changed', detail)], v));
        }
        commit(v);
        return { ok: true, ver: v, conflicts: conflicts, changed: rows.length + clears.length };
      });
    };

    /* Organiser changes (and the few things players may write: card checks, submitted cards, log). */
    ops.put = function (req) {
      var t = req.table;
      if (!SCHEMA[t] || t === 'deleted') throw err('bad', 'Unknown table');
      var org = pinOk(req.pin);
      if (!PLAYER_TABLES[t] && !org) throw err('pin', 'Organiser PIN needed.');
      var rows = req.rows === undefined ? [] : req.rows;
      checkRows(t, rows);
      if (t === 'log' && !org) {
        // a phone may add to the log but never edit it, and never sign as the organiser
        var have = {};
        store.read('log').forEach(function (r) { have[r.id] = 1; });
        rows = rows.filter(function (r) { return !have[r.id]; }).map(function (r) { return Object.assign({}, r, { by: String(r.by) === 'Organiser' ? 'Player' : r.by }); });
        if (!rows.length) return { ok: true, ver: store.getVer() };
      }
      return store.lock(function () {
        var v = bump();
        store.upsert(t, stamp(t, rows, v));
        if (req.log) store.upsert('log', stamp('log', [logRow(v, req.log.by || 'Organiser', req.log.action, req.log.detail)], v));
        commit(v);
        return { ok: true, ver: v };
      });
    };

    ops.remove = function (req) {
      var t = req.table;
      if (!SCHEMA[t] || t === 'deleted' || t === 'log') throw err('bad', 'Unknown table');
      if (!pinOk(req.pin)) throw err('pin', 'Organiser PIN needed.');
      return store.lock(function () {
        var v = bump();
        var keys = (req.rows || []).map(function (r) { return keyOf(t, r); });
        store.remove(t, keys);
        store.upsert('deleted', stamp('deleted', keys.map(function (k) { return { tbl: t, k: k }; }), v));
        if (t === 'rounds') {
          // a deleted round takes its scores, claims, winners, checks and cards with it
          ['scores', 'claims', 'winners', 'checks', 'cards'].forEach(function (dt) {
            var gone = store.read(dt).filter(function (r) { return keys.indexOf(String(r.round)) >= 0; }).map(function (r) { return keyOf(dt, r); });
            if (gone.length) {
              store.remove(dt, gone);
              store.upsert('deleted', stamp('deleted', gone.map(function (k) { return { tbl: dt, k: k }; }), v));
            }
          });
        }
        if (req.log) store.upsert('log', stamp('log', [logRow(v, req.log.by || 'Organiser', req.log.action, req.log.detail)], v));
        commit(v);
        return { ok: true, ver: v };
      });
    };

    ops.photoPut = function (req) {
      if (!/^data:image\/(jpeg|png);base64,/.test(String(req.dataUrl || ''))) throw err('bad', 'Not a photo');
      if (String(req.dataUrl).length > 3000000) throw err('bad', 'Photo too large');
      return { id: store.putPhoto(req.dataUrl) };
    };
    ops.photoGet = function (req) { return { dataUrl: store.getPhoto(String(req.id)) }; };

    /* A copy of the whole sheet in Drive, on demand (a daily one can be switched on too). */
    ops.backupNow = function (req) {
      if (!pinOk(req.pin)) throw err('pin', 'Organiser PIN needed.');
      if (!store.backup) throw err('bad', 'Backups are not available here.');
      var b = store.backup();
      return store.lock(function () {
        var v = bump();
        store.upsert('log', stamp('log', [logRow(v, 'Organiser', 'Backup made', b.name)], v));
        commit(v);
        return { ok: true, ver: v, name: b.name, url: b.url };
      });
    };

    /* Put back what has gone missing, from an Export. A row that exists now is never overwritten, so a
       score entered since the backup can never be lost to an old copy. */
    ops.restore = function (req) {
      if (!pinOk(req.pin)) throw err('pin', 'Organiser PIN needed.');
      var tables = req.data && req.data.tables;
      if (!tables || typeof tables !== 'object') throw err('bad', 'That is not an export from this app.');
      var plan = {}, total = 0;
      TABLES.forEach(function (t) {
        if (t === 'deleted' || t === 'log' || !Array.isArray(tables[t])) return;
        var have = {};
        store.read(t).forEach(function (r) { have[keyOf(t, r)] = 1; });
        var rows = [];
        tables[t].forEach(function (r) {
          if (!r || typeof r !== 'object') return;
          if (SCHEMA[t].key.some(function (k) { return r[k] === undefined || r[k] === null || r[k] === ''; })) return;
          if (!have[keyOf(t, r)]) { have[keyOf(t, r)] = 1; rows.push(r); }
        });
        if (rows.length) { plan[t] = rows; total += rows.length; }
      });
      if (!total) return { ok: true, restored: 0, tables: {} };
      return store.lock(function () {
        var v = bump(), counts = {};
        Object.keys(plan).forEach(function (t) { store.upsert(t, stamp(t, plan[t], v)); counts[t] = plan[t].length; });
        store.upsert('log', stamp('log', [logRow(v, 'Organiser', 'Restored from a backup', Object.keys(counts).map(function (t) { return counts[t] + ' ' + t; }).join(', '))], v));
        commit(v);
        return { ok: true, ver: v, restored: total, tables: counts };
      });
    };

    /* Forecast for a course on a day, from Open-Meteo (free, no key). Cached for an hour. */
    ops.weather = function (req) {
      if (!store.fetchJson) return { days: null };
      var lat = Number(req.lat), lon = Number(req.lon);
      if (!isFinite(lat) || !isFinite(lon)) return { days: null };
      var ck = 'wx:' + lat.toFixed(3) + ',' + lon.toFixed(3);
      var hit = store.cacheGet(ck);
      if (hit) return JSON.parse(hit);
      var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
        '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max' +
        '&hourly=temperature_2m,weather_code,precipitation_probability,wind_speed_10m&wind_speed_unit=kmh&timezone=auto&forecast_days=10';
      var j = store.fetchJson(url);
      var out = { days: j && j.daily ? j.daily : null, hours: j && j.hourly ? j.hourly : null, at: now() };
      store.cachePut(ck, JSON.stringify(out), 3600);
      return out;
    };


    /* The checker answers with one JSON card ("ask" a question with tap answers, or a "ruling"). Anything else is passed on as plain text. */
    function cleanStr(x, n) { return typeof x === 'string' ? x.replace(/\s+/g, ' ').trim().slice(0, n) : ''; }
    function askCard(raw) {
      var a = raw.indexOf('{'), b = raw.lastIndexOf('}');
      if (a < 0 || b <= a) return null;
      var j; try { j = JSON.parse(raw.slice(a, b + 1)); } catch (e) { return null; }
      if (!j || typeof j !== 'object') return null;
      if (j.type === 'ask') {
        var opts = (Array.isArray(j.options) ? j.options : []).map(function (o) {
          var label = cleanStr(o && o.label, 60), c = { label: label };
          if (o && (o.tag === 'red' || o.tag === 'yellow')) c.tag = o.tag;
          return label ? c : null;
        }).filter(Boolean).slice(0, 5);
        var question = cleanStr(j.question, 200);
        return question && opts.length >= 2 ? { type: 'ask', question: question, options: opts } : null;
      }
      if (j.type === 'ruling') {
        var verdict = cleanStr(j.verdict, 120);
        if (!verdict) return null;
        return { type: 'ruling', topic: cleanStr(j.topic, 40), rule: cleanStr(j.rule, 30), verdict: verdict, intro: cleanStr(j.intro, 120),
          steps: (Array.isArray(j.steps) ? j.steps : []).map(function (x) { return cleanStr(x, 220); }).filter(Boolean).slice(0, 4), note: cleanStr(j.note, 300), quote: cleanStr(j.quote, 700) };
      }
      return null;
    }

    /* Rules checker: a question for Claude about the Rules of Golf, checked live against the official R&A / USGA rules.
       The key lives in the script properties (ANTHROPIC_KEY), never in the app. A daily cap stops a runaway bill. */
    ops.ask = function (req) {
      var q = String(req.question || '').trim();
      if (!q) throw err('bad', 'Ask a question first');
      if (q.length > 600) throw err('bad', 'That question is too long. Keep it to a couple of sentences.');
      if (!store.postJson || !store.getSecret) throw err('nokey', 'The rules checker is not switched on yet');
      var key = store.getSecret('ANTHROPIC_KEY');
      if (!key) throw err('nokey', 'The rules checker is not switched on yet');
      var day = now().slice(0, 10), ck = 'ask:' + day;
      var used = Number(store.cacheGet(ck) || 0), cap = Number(store.getSecret('ASK_DAILY_CAP') || 200);
      if (used >= cap) throw err('limit', 'The rules checker has had its fill for today. Try again tomorrow, or ask the organiser.');
      var messages = [];
      (Array.isArray(req.history) ? req.history.slice(-6) : []).forEach(function (m) {
        if (m && (m.role === 'user' || m.role === 'assistant') && typeof m.text === 'string' && m.text) messages.push({ role: m.role, content: m.text.slice(0, 2500) });
      });
      while (messages.length && messages[0].role !== 'user') messages.shift();
      messages = messages.filter(function (m, i) { return i === 0 || m.role !== messages[i - 1].role; });
      if (messages.length && messages[messages.length - 1].role === 'user') messages.pop();
      messages.push({ role: 'user', content: q });
      store.cachePut(ck, String(used + 1), 21600);
      var r = store.postJson('https://api.anthropic.com/v1/messages', { 'x-api-key': key, 'anthropic-version': '2023-06-01' },
        { model: store.getSecret('ASK_MODEL') || 'claude-sonnet-5-5', max_tokens: 1500, system: ASK_SYSTEM, messages: messages,
          tools: [{ type: 'web_search_20250305', name: 'web_search', max_uses: 4, allowed_domains: ['randa.org', 'usga.org'] }] });
      var blocks = (r && r.json && r.json.content) || [], text = '', sources = [], seen = {}, card = null, last = '';
      blocks.forEach(function (b) {
        if (!b || b.type !== 'text' || !b.text) return;
        text += b.text;
        if (askCard(b.text)) last = b.text;
        (b.citations || []).forEach(function (c) {
          if (c && c.url && !seen[c.url] && /^https:\/\/([a-z0-9-]+\.)*(randa|usga)\.org(\/|$)/i.test(c.url)) { seen[c.url] = 1; sources.push({ url: c.url, title: String(c.title || c.url).slice(0, 120) }); }
        });
      });
      text = text.trim();
      if (!r || r.status !== 200 || !text) throw err('upstream', 'The rules checker could not answer just now. Try again in a minute.');
      card = askCard(last || text);
      return { answer: card ? JSON.stringify(card) : text, card: card, sources: sources.slice(0, 4) };
    };

    /* Fill an empty store with the society's starting data. */
    ops.seed = function (req) {
      return store.lock(function () {
        var empty = store.read('members').length === 0 && store.read('rounds').length === 0;
        if (!empty && !req.force) return { ok: false, reason: 'not empty' };
        var v = bump();
        TABLES.forEach(function (t) {
          var rows = (req.data && req.data[t]) || [];
          if (rows.length) store.upsert(t, stamp(t, rows, v));
        });
        store.upsert('log', stamp('log', [logRow(v, 'Setup', 'Data loaded', req.note || 'Starting data')], v));
        commit(v);
        return { ok: true, ver: v };
      });
    };

    function api(req) {
      var fn = ops[req && req.op];
      if (!fn) return { error: 'bad', message: 'Unknown request' };
      try { return fn(req); } catch (e) { return { error: e.code || 'server', message: String(e.message || e) }; }
    }
    return { api: api, ops: ops };
  }

  /* ---------- Google Apps Script entry ---------- */
  function appsScript(seed) {
    var props = PropertiesService.getScriptProperties();
    function folder() {
      var id = props.getProperty('PHOTOS');
      if (id) { try { return DriveApp.getFolderById(id); } catch (e) { /* recreate below */ } }
      var f = DriveApp.createFolder('NCGS card photos');
      props.setProperty('PHOTOS', f.getId());
      return f;
    }
    function spreadsheet() {
      var id = props.getProperty('SHEET');
      if (id) return SpreadsheetApp.openById(id);
      var ss = SpreadsheetApp.create('NCGS data');
      props.setProperty('SHEET', ss.getId());
      return ss;
    }
    function server() {
      var ss = spreadsheet();
      return createServer(sheetStore(ss, props, CacheService.getScriptCache(), LockService, folder));
    }
    function json(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
    function ensureReady() {
      if (!seed || props.getProperty('READY')) return;
      var lock = LockService.getScriptLock();
      lock.waitLock(30000);
      try {
        if (!props.getProperty('READY')) { api.setup(); props.setProperty('READY', '1'); }
      } finally { lock.releaseLock(); }
    }
    var api = {
      http: function (e) {
        ensureReady();

const isDemo = r => r && r.source === 'demo';

  const c = courseOf(r);

  const t = Object.assign({}, c.tees[r.tee]);

}

const canScore = r => !!(r && holesOf(r) && teeOf(r) && r.groups && r.groups.length);

const roundName = r => r.name || (courseOf(r) || {}).name || 'Round';

function roundWhenShort(r) {

}
function computeR(rid) {

}

/* Results for any finished round. Imported rounds keep the order they came with. */
function resultsOf(rid) {
  return memo('res:' + rid, () => {
    const r = D.round(rid);
    if (!r) return null;
    if (r.source === 'imported' && r.results) {
      const order = r.results.order || [];
      let rows;
      if (r.results.ordered) rows = order.map(([id, total], i) => ({ id, name: D.nameOf(id), total, pos: i + 1, posLabel: String(i + 1) }));
      else rows = E.rankRows(order.map(([id, total]) => ({ id, name: D.nameOf(id), total })), 'total', 'desc');
      const kb = (r.results.kb || []).map(([a, b, total], i) => ({ pair: [a, b], name: `${D.nameOf(a)} & ${D.nameOf(b)}`, total, posLabel: String(i + 1) }));
      const c = r.results.contests || {};

      if (c.ld !== undefined) contests.push({ type: 'ld', hole: null, winner: c.ld });
      return { rows, kb, contests, source: r.results.ordered ? 'recorded' : 'sheet' };
    }
    const comp = computeR(rid);

    const final = r.status === 'final';

    const kb = r.kb && r.kb.length ? E.kbStandings(comp, r.kb) : [];
    const wins = D.winners(rid);
