    ? `<div class="stv none" data-pid="${pid}" data-n="" aria-live="polite">Par ${par}</div>`
    : `<button class="stv${scratch ? ' out' : ''}" data-act="clear" data-pid="${pid}" data-n="${base}" aria-label="${name}: ${base} strokes. Tap to clear and start again from par"><b${base > 99 ? ' class="wide"' : ''}>${base}<sup>${pts}</sup></b><small>${word}</small></button>`;
  const drop = dopen && dpl ? `<div class="dropcard in"><p class="cap dropwho">${name}</p>${cardParts(D.round(rid), dpl, D.round(rid).status === 'live' && !!myGroup(rid) && myGroup(rid).teams.flat().includes(pid), pid).table}<p class="cap sc-note">Tap a score to change it</p></div>` : '';
  const tile = `<div class="pr ptile${flash}">
    <div class="pr-top"><button class="nm drop${dopen ? ' open' : ''}" data-act="toggle" data-key="${dkey}" aria-expanded="${dopen}"><span class="nmrow"><span>${name}</span>${dpl ? dropChev : ''}</span><span class="pr-dots" role="img" aria-label="${shots} ${shots === 1 ? 'shot' : 'shots'}">${dots(shots, true)}</span></button>
      <button class="pu ${scratch ? 'on' : ''}" data-act="set" data-pid="${pid}" data-v="P" aria-pressed="${scratch}">Pick up</button></div>
    <div class="stepper" role="group" aria-label="Strokes for ${name}">
      ${mid}
      <button class="st" data-act="set" data-dir="down" data-pid="${pid}" data-v="${down}" aria-label="One fewer stroke for ${name}"${atOne ? ' disabled' : ''}>\u2212</button>
      <button class="st" data-act="set" data-dir="up" data-pid="${pid}" data-v="${up}" aria-label="One more stroke for ${name}"${scratch ? ' disabled' : ''}>+</button>
    </div></div>`;
  return { tile, drop };
}

/* A name that does not fit beside Pick up and the buttons gets a line of its own, with the buttons below it.
   Every row is first laid out the usual way, then only the ones whose name or arrow would reach a button beside it
   are marked "long". */
function fitNames() {
  const tiles = [...document.querySelectorAll('.entry .bugs .ptile')];
  if (!tiles.length) return;
  tiles.forEach(t => t.classList.remove('long'));
  const runsOver = t => {
    const nm = t.querySelector('.nm'); if (!nm) return false;
    const box = nm.getBoundingClientRect();
    const end = Math.max(...[...nm.querySelectorAll('.nmrow > *')].map(e => e.getBoundingClientRect().right));
    return [...t.querySelectorAll('.pu, .st, .stv')].some(c => { const r = c.getBoundingClientRect(); return r.left > box.left && r.top < box.bottom && r.bottom > box.top && end > r.left; });
  };
  tiles.filter(runsOver).forEach(t => t.classList.add('long'));
}
window.addEventListener('resize', fitNames);
/* A text size change does not always send "resize" (docs/NAME-RESIZE.md), so an invisible 1rem × 1em box is watched
   instead: when it changes size, the text size changed, and the rows are measured again at once. fitNames() never
   changes this box, so it cannot loop. */
if (window.ResizeObserver) {
  const probe = document.createElement('span');
  probe.setAttribute('aria-hidden', 'true');
  probe.style.cssText = 'position:fixed;top:0;left:0;width:1rem;height:1em;visibility:hidden;pointer-events:none;';
  document.body.appendChild(probe);
  let last = '';
  new ResizeObserver(() => {
    const size = probe.offsetWidth + 'x' + probe.offsetHeight;
    if (size !== last) { const first = !last; last = size; if (!first) fitNames(); }
  }).observe(probe);
}

VIEWS.entry = () => {
  const ctx = entryCtx();
  if (isScramble(D.round(ctx.rid))) return VIEWS.scramble();
  const comp = computeR(ctx.rid);
  const gc = comp.groups.find(x => x.id === ctx.gid);
  const h = holeOf(ctx.rid, ctx.n);
  const d = ensureDraft(ctx);
  const pids = gc.teams.flat();
  // A withdrawn player picks up (scratch) on every hole from their withdrawal: filled in here, saved with the group.
  const wdHere = pids.filter(pid => { const w = wdOf(ctx.rid, pid); return w && ctx.n >= w; });
  wdHere.forEach(pid => { if (d[pid] !== 'P') { d[pid] = 'P'; savePrefs(); } });
  if (ctx.mode === 'player' && !ctx.edit) { const ask = askPending(ctx.rid, gc, ctx.gid); if (ask) return VIEWS.ask(ctx.rid, gc, ask); }
  const missing = pids.filter(pid => !E.isEntered(d[pid]));
  const final = D.round(ctx.rid).status === 'final';
  const buggies = gc.teams.length === 2;
  let html = '<div class="entry">';
  if (ctx.mode === 'org') html += `<p class="cap">Correcting group ${gc.n}</p>`;
  const tt = ((D.round(ctx.rid).groups || []).find(x => x.id === ctx.gid) || {}).teeTime;
  if (ctx.mode === 'org') html += `<div class="entnav"><button class="entback" data-act="entry-back" aria-label="Back">${ICON.back}<span>Back</span></button>${tt ? `<span class="entgrp">${esc(tt)} group</span>` : ''}</div>`;
  html += `<header class="hero c pine entcard"><div class="entrow"><div class="entl"><small>HOLE</small>${ctx.mode === 'org' ? `<b class="entn">${ctx.n}</b>` : `<button class="holebtn" data-act="holes" aria-label="Go to a hole. Now on hole ${ctx.n}"><b class="entn">${ctx.n}</b><span class="hdown">${ICON.down}</span></button>`}</div><div class="entr"><b>Par ${h.par}</b><span>Index ${h.si}${h.yards ? ` · ${h.yards} yds` : ''}</span></div></div><div class="prog" role="img" aria-label="Hole ${ctx.n} of 18">${Array.from({ length: 18 }, (_, i) => i + 1).map(n => `<i class="${n === ctx.n ? 'cur' : n < ctx.n ? 'done' : ''}"></i>`).join('')}</div></header>`;
  if (final) html += `<div class="banner" style="margin-top:12px">This round is final.</div>${ctx.mode === 'org' ? '<button class="btn quiet" data-act="reopen">Reopen round</button>' : ''}`;
  const clash = DB.conflicts.filter(c => c.round === ctx.rid && c.grp === ctx.gid && c.hole === ctx.n);
  if (clash.length) html += `<div class="banner" style="margin-top:12px">Another phone saved ${clash.map(c => `${esc(D.nameOf(c.player))} ${fmtGross(c.server)}`).join(', ')}</div>`;
  html += gc.teams.map((t, i) => {
    const rows = t.map(pid => wdHere.includes(pid)
      ? { tile: `<div class="pr wdrow"><b class="wd-n">${esc(D.nameOf(pid))}</b><span class="wd-s">Withdrawn · pick-ups from hole ${wdOf(ctx.rid, pid)}</span></div>`, drop: '' }
      : entryRow(pid, d[pid], comp.players[pid].holes[ctx.n].shots, h.par, ctx.rid));
    return `<div class="bugs ${buggies ? 'b' + (i + 1) : 'b0'}"${buggies ? ` role="group" aria-label="Buggy ${i + 1}"` : ''}>${rows.map(r => r.tile + r.drop).join('')}</div>`;
  }).join('');
  if (ctx.mode === 'player' && !ctx.edit) html += needsAttention(ctx.rid, gc, ctx.gid);
  const who = missing.length && missing.length <= 2 ? ' · ' + missing.map(D.nameOf).join(', ') : '';
  const lbl = missing.length ? `${plural(missing.length, 'score')} to go${esc(who)}` : ctx.mode === 'org' ? 'Save correction' : ctx.edit ? 'Save changes' : `Save hole ${ctx.n}`;
  html += `<div class="savebar"><button class="btn ${missing.length ? 'quiet' : ''}" data-act="save">${lbl}</button></div></div>`;
  if (ctx.mode === 'player') html += holesSheet(ctx.rid, gc, ctx.n);
  if (ctx.mode === 'player' && !ctx.edit && !UI.holeSheet && !gc.holes[ctx.n].complete && D.round(ctx.rid).status === 'live') html += contestIntro(ctx.rid, gc, ctx.n);
  return ctx.mode === 'player' ? { html, tabs: 'hole' } : { html };
};

function setScore(pid, v) {
  const ctx = entryCtx();
  if (D.round(ctx.rid).status === 'final') { toast('This round is final. Reopen it to change scores.'); return; }
  const d = ensureDraft(ctx);
  const val = v === 'P' ? 'P' : Number(v);
  if (d[pid] === val) delete d[pid]; else d[pid] = val;
  savePrefs();
  render();
}

// Tap the big number to wipe an entry and go back to "Par n".
function clearScore(pid) {
  const ctx = entryCtx();
  if (D.round(ctx.rid).status === 'final') return;
  delete ensureDraft(ctx)[pid];
  savePrefs();
  render();
}

function saveHole() {
  const ctx = entryCtx();
  const r = D.round(ctx.rid);
  const comp = computeR(ctx.rid);
  const gc = comp.groups.find(x => x.id === ctx.gid);
  const d = ensureDraft(ctx);
  const pids = gc.teams.flat();
  const missing = pids.filter(pid => !E.isEntered(d[pid]));
  if (missing.length) { UI.flash = true; render(); setTimeout(() => { UI.flash = false; }, 1300); return; }
  if (r.status === 'final') { toast('This round is final. Reopen it to change scores.'); return; }
  const before = {};
  ['front', 'back', 'overall'].forEach(s => { before[s] = { text: gc.matches[s].status.text, leader: gc.matches[s].status.leader }; });
  const prev = {};
  const scores = {};
  pids.forEach(pid => {
    const cur = (D.scores(ctx.rid)[pid] || {})[ctx.n];
    prev[pid] = cur === undefined ? null : cur;
    const clash = DB.conflicts.find(c => c.round === ctx.rid && c.grp === ctx.gid && c.hole === ctx.n && c.player === pid);
    const seen = d._base && pid in d._base ? d._base[pid] : prev[pid];
    scores[pid] = { v: d[pid], base: clash ? clash.server : seen };
  });
  const req = {
    op: 'saveHole', round: ctx.rid, grp: ctx.gid, hole: ctx.n, scores, by: ctx.mode === 'org' ? 'Organiser' : byMe(),
    names: Object.fromEntries(pids.map(pid => [pid, D.nameOf(pid)])), label: `${roundName(r)} · Group ${gc.n} · Hole ${ctx.n}`
  };
  if (ctx.mode === 'org') req.pin = ORGPIN.pin;
  DB.conflicts = DB.conflicts.filter(c => !(c.round === ctx.rid && c.grp === ctx.gid && c.hole === ctx.n));
  const draftCopy = clone(d);
  clearDraft(ctx);
  savePrefs();
  send(req);
  tick();
  if (ctx.mode === 'org') { back(); toast(`Hole ${ctx.n} saved`); return; }
  if (ctx.edit) {
    // A past hole was corrected: straight back to the hole being played.
    UI.edit = false; UI.after = null;
    replaceTop('tee', { rid: ctx.rid });
    toast(`Hole ${ctx.n} changed`);
    return;
  }
  UI.after = { rid: ctx.rid, gid: ctx.gid, n: ctx.n, before, prev, draft: draftCopy, wasEdit: ctx.edit };
  UI.edit = false;
  replaceTop('after', { rid: ctx.rid });
}

function undoSave() {
  const a = UI.after;
  if (!a) return;
  const scores = {};
  Object.keys(a.prev).forEach(pid => { scores[pid] = { v: a.prev[pid], base: a.draft[pid] }; });
  const req = { op: 'saveHole', round: a.rid, grp: a.gid, hole: a.n, scores, by: byMe(), names: Object.fromEntries(Object.keys(a.prev).map(pid => [pid, D.nameOf(pid)])), label: `Undo · Hole ${a.n}` };
  send(req);
  const byRound = DB.prefs.drafts[a.rid] || (DB.prefs.drafts[a.rid] = {});
  (byRound[a.gid] || (byRound[a.gid] = {}))[a.n] = a.draft;
  savePrefs();
  UI.hole = a.n;
  UI.edit = a.wasEdit;
  UI.after = null;
  replaceTop('entry', { rid: a.rid });
}

/* One Buggy Wars result pill: the leader's colour, golf wording, "3 up, 4 to play" while it is being played,
   "Dormie 2" when the lead equals the holes left (owner, 22 October).
   Shared by the Buggy Wars results and the screen after saving a hole, so the two look the same. */
function bwPill(gc, m) {
  const st = m.status;
  let txt;
  if (st.state === 'pending') txt = 'Not started';
  else if (st.state === 'halved') txt = 'Halved';
  else if (st.state === 'won') txt = m.closed && m.closed.toPlay > 0 ? `Won ${m.closed.up}&${m.closed.toPlay}` : `Won ${Math.abs(m.lead)} up`;
  else if (st.dormie) txt = `Dormie ${st.toPlay}`;
  else txt = `${m.lead === 0 ? 'AS' : Math.abs(m.lead) + ' up'}, ${st.toPlay} to play`;
  const cls = st.leader === 'A' ? 'a' : st.leader === 'B' ? 'b' : 'n';
  const who = st.leader ? `${gc.labels[st.leader === 'A' ? 0 : 1].long} ` : '';
  return `<span class="bw-res ${cls}" aria-label="${esc(who + txt)}">${txt}</span>`;
}
/* Who has an extra shot on the other buggy on hole n, in the owner's words: "Mike has an extra shot on Buggy 2 on 16".
   teams: [[pid, pid], [pid, pid]] (Buggy 1, Buggy 2); shots(pid): that player's shots on hole n. A player counts only when
   they get more shots there than anyone in the other buggy. Returns [{ team, pids, who, where, text }]; empty when nobody
   has an edge. The card shows `who` large and `where` underneath; `text` is the whole sentence. */
function extraShotLines(teams, shots, n, nameOf) {
  const word = k => (k === 1 ? 'an extra shot' : k === 2 ? 'two extra shots' : `${k} extra shots`);
  const out = [];
  [0, 1].forEach(i => {
    const best = Math.max(...teams[1 - i].map(shots));
    const ahead = teams[i].filter(pid => shots(pid) > best);
    if (!ahead.length) return;
    const diffs = ahead.map(pid => shots(pid) - best);
    const who = diffs.every(d => d === diffs[0])
      ? `${ahead.map(nameOf).join(' and ')} ${ahead.length > 1 ? 'have' : 'has'} ${word(diffs[0])}`
      : ahead.map((pid, k) => `${nameOf(pid)} ${k ? '' : 'has '}${word(diffs[k])}`).join(' and ');
    const where = `on Buggy\u00a0${2 - i} on\u00a0${n}`;   // no-break spaces keep "Buggy 1" and "on 16" together
    out.push({ team: i, pids: ahead, who, where, text: `${who} ${where}` });
  });
  return out;
}

/* A nine's holes as a small grid: one column per hole, each buggy's best points, the hole winner's filled in their
   colour, then holes won. Shared by the Buggy Wars results and the card after saving a hole. */
function bwBoard(gc, seg, live, canEdit) {
  const order = gc.matches[seg].order;
  let wa = 0, wb = 0;
  const cols = order.map(n => {
    const hr = gc.holes[n];
    const isNow = n === gc.nextHole && live;
    let a = '<span class="bw-c e"></span>', b = '<span class="bw-c e"></span>';
    if (hr.complete) {
      const [pa, pb] = hr.best;
      if (hr.result === 'A') wa++; else if (hr.result === 'B') wb++;
      a = `<span class="bw-c${hr.result === 'A' ? ' wa' : ''}">${pa}</span>`;
      b = `<span class="bw-c${hr.result === 'B' ? ' wb' : ''}">${pb}</span>`;
    }
    const inner = `<span class="bw-n${isNow ? ' cur' : ''}">${n}</span>${a}${b}`;
    return canEdit && hr.complete ? `<button class="bw-col" data-act="edit-hole" data-n="${n}" aria-label="Change hole ${n}">${inner}</button>` : `<div class="bw-col">${inner}</div>`;
  }).join('');
  return `<div class="bw-board">${cols}<div class="bw-col bw-tot"><span class="bw-n">Holes</span><span class="bw-t a">${wa}</span><span class="bw-t b">${wb}</span></div></div>`;
}
/* The two pairs as initials badges, blue v red. */
const bwBadges = (t, i) => `<span class="bw-pair">${t.map(pid => `<span class="bw-bd ${i ? 'b' : 'a'}" aria-label="${esc(D.nameOf(pid))}">${esc(initialsOf(D.member(pid)) || D.nameOf(pid).slice(0, 2))}</span>`).join('')}</span>`;

VIEWS.after = () => {
  const a = UI.after;
  if (!a) return VIEWS[playHomeView(playRid())]({ rid: playRid() });
  const comp = computeR(a.rid);
  const gc = comp.groups.find(x => x.id === a.gid);
  const ask1 = askPending(a.rid, gc, a.gid);
  if (ask1) return VIEWS.ask(a.rid, gc, ask1);
  const hr = gc.holes[a.n];
  const ah = holeOf(a.rid, a.n);   // par, index and yards stay in the header after saving, so it keeps its shape
  const L = gc.labels;
  const who = list => list.map(D.nameOf).join(' and ');
  const buggies = gc.teams.length === 2;
  let head, sub = '';
  if (!buggies) head = `<span class="res-t">Hole ${a.n} saved</span>`;
  else if (hr.result === 'H') { head = `<span class="bw-res n">Halved</span>`; sub = `Both buggies scored ${plural(hr.best[0], 'point')}`; }
  else {
    const w = hr.result === 'A' ? 0 : 1;
    head = `<span class="bw-res ${w ? 'b' : 'a'}" aria-label="${esc(L[w].long)} won the hole">Buggy ${w + 1} won</span>`;
    sub = `${who(hr.counting[w])}'s ${plural(hr.best[w], 'point')} beat ${hr.best[1 - w]}`;
  }
  // One line per match, in the Buggy Wars style: the label on the left, the same result pill as the results page on the
  // right. A note under the label only when something changed hands: someone takes the lead, or it comes back to all square.
  const rows = buggies ? [a.n <= 9 ? 'front' : 'back', 'overall'].map(s => {
    const m = gc.matches[s];
    const was = a.before[s];
    const turned = was.text !== 'Not started' && was.leader !== m.status.leader;
    const note = !turned ? '' : m.status.leader ? `Buggy ${m.status.leader === 'A' ? 1 : 2} ${was.leader ? 'take the lead' : 'go ahead'}` : 'Back to all square';
    const label = `<span class="bw-l afl">${segName(s)}${note ? `<small class="afnote">${esc(note)}</small>` : ''}</span>${bwPill(gc, m)}`;
    if (s === 'overall') return `<div class="bw-row">${label}<span></span></div>`;
    // The nine opens to its holes, as on the results page. Closed to begin with, so the card stays short.
    const key = `bwa-${a.rid}-${a.gid}-${s}`, open = !!UI.open[key];
    return `<button class="bw-row" data-act="bwseg" data-key="${key}" data-open="${open ? 1 : 0}" aria-expanded="${open}">${label}<span class="chev dn${open ? ' up' : ''}">${chev}</span></button>${open ? bwBoard(gc, s, D.round(a.rid).status === 'live', false) : ''}`;
  }).join('') : gc.teams.flat().map(pid => `<div class="afrow"><span><b>${esc(D.nameOf(pid))}</b></span><span class="afst"><span class="b num">${comp.players[pid].total}</span></span></div>`).join('');
  /* Before the next hole: who has an extra shot on the other buggy there, in the owner's words ("Mike has an extra shot on
     Buggy 2 on 16"). Only when a player gets more shots on that hole than anyone in the other buggy; otherwise nothing. */
  const edge = buggies && gc.nextHole ? extraShotLines(gc.teams, pid => (comp.players[pid] && comp.players[pid].holes[gc.nextHole] ? comp.players[pid].holes[gc.nextHole].shots || 0 : 0), gc.nextHole, D.nameOf)
    .map(x => `<div class="afedge ${x.team ? 'b' : 'a'}" role="note"><span class="afedge-bd">${bwBadges(x.pids, x.team)}</span><p><b>${esc(x.who)}</b><span>${esc(x.where)}</span></p></div>`).join('') : '';
  let next;
  const nine = a.n <= 9 ? 'front' : 'back';
  if (D.round(a.rid).status === 'live' && nineComplete(gc, nine) && !D.check(a.rid, a.gid, nine)) {
    next = `${photoBtn(nine, true)}<button class="btn quiet" style="margin-top:8px" data-act="${gc.nextHole ? 'next' : 'to-finish'}">Later</button>${testCardLink(nine)}`;
  } else if (gc.nextHole) {
    const nh = holeOf(a.rid, gc.nextHole);
    next = `<button class="btn" data-act="next">Hole ${gc.nextHole}<small>Par ${nh.par} · Index ${nh.si}${nh.yards ? ` · ${nh.yards} yds` : ''}</small></button>`;
  } else next = `<button class="btn" data-act="to-finish">See the card</button>`;
  return {
    tabs: 'hole',
    html: `<div class="after"><header class="hero c pine entcard"><div class="entrow"><div class="entl"><small>HOLE</small><b class="entn">${a.n}</b></div><div class="entr"><b>Par ${ah.par}</b><span>Index ${ah.si}${ah.yards ? ` · ${ah.yards} yds` : ''}</span></div></div><div class="afsaved"><span class="savedchip">${sized(ICON.check, 18)} ${DB.outbox.some(i => i.req && i.req.op === 'saveHole' && i.req.round === a.rid && Number(i.req.hole) === a.n) ? (DB.online ? 'Sending…' : 'On this phone') : 'Saved'}</span><button class="undochip" data-act="undo">Undo</button></div><div class="prog" role="img" aria-label="Hole ${a.n} of 18">${Array.from({ length: 18 }, (_, i) => i + 1).map(k => `<i class="${k === a.n ? 'cur' : k < a.n ? 'done' : ''}"></i>`).join('')}</div></header>
      ${buggies ? `<div class="sec-label afbw"><span class="sub">Buggy Wars</span></div><div class="bw-vs afvs">${bwBadges(gc.teams[0], 0)}<span class="sub">v</span>${bwBadges(gc.teams[1], 1)}</div>
      <div class="card bw-card aftercard"><div class="bw-row afres"><span class="bw-l afl">Hole ${a.n}</span>${head}<span></span>${sub ? `<small class="afres-sub">${esc(sub)}</small>` : ''}</div>${rows}</div>` : `<div class="aftercard"><div class="afhead"><div class="res">${head}</div>${sub ? `<p class="sub res-sub">${esc(sub)}</p>` : ''}</div>${rows}</div>`}
      ${edge}${next}${saveWarning()}</div>`
  };
};

/* ----- Scorecard photo check ----- */
const nineName = seg => (seg === 'front' ? 'front nine' : 'back nine');
const showV = v => (v === 'P' ? 'Picked up' : v === null || v === undefined ? '?' : String(v));
function putCheck(rid, gid, seg, data, photo) {
  const cur = view().checks.find(x => x.round === rid && x.grp === gid && x.nine === seg);
  put('checks', [{ round: rid, grp: gid, nine: seg, data, photo: photo !== undefined ? photo : (cur ? cur.photo : null) }]);
}
function nineComplete(gc, seg) { return E.SEGMENTS[seg].every(n => gc.holes[n].complete); }
function openIssues(chk) {
  if (!chk || chk.status !== 'done' || chk.resolved) return 0;
  return chk.result.issues.filter(i => !chk.decisions[`${i.hole}:${i.pid}`]).length;
}
function photoBtn(seg, primary) {
  return `<label class="btn ${primary ? '' : 'quiet'}" for="photo-${seg}">${sized(ICON.camera, 20)}<span style="margin-left:8px">Photo of the ${nineName(seg)}</span></label>
    <input class="vh" type="file" accept="image/*" capture="environment" id="photo-${seg}" data-photo="${seg}">`;
}
function testCardLink(seg) {
  if (BOOT.mode === 'live') return '';
  const any = Object.values(FIX.cards).some(c => c.nine === seg);
  return any ? `<div style="text-align:center"><button class="link sm" data-act="test-card" data-seg="${seg}">Use a test card</button></div>` : '';
}
function checkRow(seg, chk) {
  let right;
  if (!chk) right = '<span class="sub">Add photo</span>';
  else if (chk.status === 'reading') right = '<span class="pill n">Reading</span>';
  else if (chk.status === 'failed') right = '<span class="pill w">Try again</span>';
  else if (chk.status === 'manual' && !chk.resolved) right = '<span class="pill w">Check by eye</span>';
  else if (chk.status === 'done' && !chk.resolved) right = `<span class="pill w">${openIssues(chk) || 'All'} to check</span>`;
  else right = `<span class="c-g" style="display:inline-flex">${sized(ICON.check, 18)}</span>`;
  return `<button class="row" data-act="open-check" data-seg="${seg}"><span>${segName(seg)} card</span><span class="right">${right}${chev}</span></button>`;
}
function photoSrc(chk) {
  if (!chk || !chk.photo) return null;
  if (String(chk.photo).startsWith('data:')) return chk.photo;
  if (UI.photos[chk.photo]) return UI.photos[chk.photo];
  const local = (DB.prefs.photos || {})[chk.photo];
  if (local) return local;
  if (!UI.photos['loading:' + chk.photo]) {
    UI.photos['loading:' + chk.photo] = true;
    call({ op: 'photoGet', id: chk.photo }).then(r => { if (r.dataUrl) { UI.photos[chk.photo] = r.dataUrl; render(); } }).catch(() => { delete UI.photos['loading:' + chk.photo]; });
  }
  return null;
}

async function prepImage(blob) {
  const url = URL.createObjectURL(blob);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const draw = max => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k);
      c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return c;
    };
    const sendBlob = await new Promise(r => draw(1600).toBlob(r, 'image/jpeg', 0.85));
    const small = draw(1200).toDataURL('image/jpeg', 0.72);
    return { send: sendBlob, small };
  } finally { URL.revokeObjectURL(url); }
}
function dataUrlToBlob(d) {
  const [head, b64] = d.split(',');
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: (head.match(/data:([^;]+)/) || [])[1] || 'image/jpeg' });
}

function readerPrompt(rid, gc, seg) {
  const comp = computeR(rid);
  const hs = E.SEGMENTS[seg];
  const who = gc.teams.flat().map(pid => `${D.nameOf(pid)} (handicap index ${fmtIndex((D.member(pid) || {}).index)}, plays off ${comp.players[pid].ph})`).join('; ');
  return [
    'You are reading a photo of a handwritten golf scorecard for a scoring app. Transcribe it exactly. Never guess.',
    `It should show holes ${hs[0]} to ${hs[hs.length - 1]} for one group of four: ${who}.`,
    'Cards are filled in by hand, usually in pencil. Players are named in a key at the top (Player A/B/C/D or Jugador A/B/C/D, with a handicap); the score grid uses only the letters A B C D. Holes may run down the card or across it. Read the printed hole numbers and report scores by physical hole number.',
    '- Report gross STROKES per hole. If strokes have points written small beside or below them (a big 4 with a small 2), report only the big number.',
    '- A pick-up or no score is often written as X, a dash, a slash, P or NR: report "P".',
    '- If a number was rubbed out or crossed out and another written, report the final number and say so in note.',
    "- Ignore printed numbers (metres, yards, par, stroke index) and empty columns such as marker's score or W/L/H.",
    '- If you cannot read a cell confidently (glare, blur, or a digit that could be another, such as 4/9, 1/7, 3/8, 5/6), give your best reading with confidence "low" and say why in note. If you cannot read it at all, use value null.',
    `Reply with only a JSON object: {"holes":[${hs.join(',')}],"players":[{"letter":"A","name":"...","handicap":12,"scores":{"${hs[0]}":{"value":4,"confidence":"high","note":""}}}],"problems":["..."]}`
  ].join('\n');
}

async function startCheck(seg, source) {
  const rid = playRid();
  const g = myGroup(rid);
  if (!g) return;
  UI.testSheet = null;
  let blob = source.file || null;
  try {
    if (source.fixture) blob = await (await fetch('cards/' + source.fixture)).blob();
    const { send: sendBlob, small } = await prepImage(blob);
    const localId = 'local-' + Date.now();
    DB.prefs.photos = DB.prefs.photos || {};
    DB.prefs.photos[localId] = small;
    savePrefs();
    putCheck(rid, g.id, seg, { status: 'reading', fixture: source.fixture || null, at: new Date().toISOString(), decisions: {} }, localId);
    UI.checkSeg = seg;
    go('check', { rid });
    call({ op: 'photoPut', dataUrl: small }).then(res => {
      if (!res.id) return;
      DB.prefs.photos[res.id] = small;
      delete DB.prefs.photos[localId];
      savePrefs();
      const c = view().checks.find(x => x.round === rid && x.grp === g.id && x.nine === seg);
      if (c) putCheck(rid, g.id, seg, c.data, res.id);
    }).catch(() => { /* photo stays on this phone */ });
    runReader(rid, g.id, seg, sendBlob, source.fixture || null);
  } catch (e) {
    toast('That photo could not be opened. Try another.');
  }
}

const PERMANENT = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'images_unavailable'];
async function runReader(rid, gid, seg, sendBlob, fixtureKey) {
  const finish = patch => {
    const c = D.check(rid, gid, seg);
    if (!c) return;
    const data = Object.assign({}, c);
    delete data.photo;
    Object.assign(data, patch);
    putCheck(rid, gid, seg, data);
    const here = !UI.org && cur().v === 'check' && UI.checkSeg === seg;
    if (patch.status === 'done' && patch.resolved) toast(`${segName(seg)} card matches`);
    else if (patch.status === 'done') { tick(); if (!here) toast(`${segName(seg)} card: ${plural(patch.result.issues.length, 'score')} to check`); }
    render();
  };
  let reading = null;
  let src = 'live';
  try {
    if (sampleFn && canReadImages) {
      const gc = computeR(rid).groups.find(x => x.id === gid);
      reading = await sampleFn.json(readerPrompt(rid, gc, seg), { images: [sendBlob], cache: false });
    } else if (fixtureKey) {
      await new Promise(r => setTimeout(r, 900));
      reading = FIX.cards[fixtureKey].reading;
      src = 'recorded';
    } else { finish({ status: 'manual', reason: 'unavailable' }); return; }
  } catch (e) {
    const code = e && e.code;
    if (fixtureKey && PERMANENT.includes(code)) { reading = FIX.cards[fixtureKey].reading; src = 'recorded'; }
    else { finish({ status: PERMANENT.includes(code) ? 'manual' : 'failed', reason: code || 'error' }); return; }
  }
  if (!reading || !Array.isArray(reading.players)) { finish({ status: 'failed', reason: 'invalid' }); return; }
  const gc = computeR(rid).groups.find(x => x.id === gid);
  const pls = gc.teams.flat().map(pid => ({ id: pid, name: D.nameOf(pid) }));
  const r = E.compareCard(reading, pls, D.scores(rid), holesOf(D.round(rid)), E.SEGMENTS[seg]);
  if (!r.checked) { finish({ status: 'failed', reason: 'nomatch' }); return; }
  finish({ status: 'done', source: src, result: { checked: r.checked, matched: r.matched, issues: r.issues, problems: reading.problems || [] }, decisions: {}, resolved: r.issues.length === 0 });
}

VIEWS.check = () => {

  } else if (chk.status === 'manual') {

    const rows = E.SEGMENTS[seg].map(n => `<button class="orow" data-act="edit-hole" data-n="${n}" aria-label="Change hole ${n}"><span class="b">${n}</span>${pids.map(pid => { const v = comp.players[pid].holes[n].gross; return `<span>${v === null ? '–' : v === 'P' ? 'P' : v}</span>`; }).join('')}</button>`).join('');

      ${sec('', cardOf(`<div class="orow"><span class="cap">Hole</span>${pids.map((pid, i) => `<span class="cap b ${i < 2 ? 'c-a' : 'c-b'}">${esc(D.nameOf(pid))}</span>`).join('')}</div>${rows}`), true)}
      ${chk.resolved ? `<p class="sub c-g" style="text-align:center;margin-top:24px">Checked</p>` : `<button class="btn" data-act="manual-ok" data-seg="${seg}">All correct</button>`}`;
  } else {
    const r = chk.result;
    const issues = r.issues;
    if (!issues.length) {
      html += `<p class="sub head-sub">${r.matched} of ${r.checked} scores match</p>${thumb}
        ${sec('', cardOf(`<div class="row tall"><span class="b c-g" style="display:inline-flex;align-items:center;gap:8px">${sized(ICON.check, 22)} The card matches the app</span></div>`))}
        <button class="btn" data-act="back">Done</button>`;
    } else {
      const comp = computeR(rid);
      const live = (pid, n) => comp.players[pid].holes[n].gross;
      let changes = 0;
      const blocks = issues.map(i => {
        const k = `${i.hole}:${i.pid}`;
        const d = chk.decisions[k];
        if (d === 'card' && i.card !== null) changes += 1;
        const appNow = live(i.pid, i.hole);

        const body = i.card === null
          ? `<div class="choices"><button class="choice ${d === 'app' ? 'on' : ''}" data-act="decide" data-k="${k}" data-v="app">App: ${showV(appNow)} is right</button><button class="choice" data-act="edit-hole" data-n="${i.hole}">Change it</button></div>`
          : `<div class="choices"><button class="choice ${d === 'card' ? 'on' : ''}" data-act="decide" data-k="${k}" data-v="card" aria-pressed="${d === 'card'}">Card: ${showV(i.card)}</button><button class="choice ${d === 'app' ? 'on' : ''}" data-act="decide" data-k="${k}" data-v="app" aria-pressed="${d === 'app'}">App: ${showV(appNow)}</button></div>`;

        ${chk.resolved ? `<p class="sub c-g" style="text-align:center;margin-top:24px">Checked${chk.changes ? ` · ${plural(chk.changes, 'score')} changed` : ''}</p>`
          : `<div class="savebar" style="margin-top:24px"><button class="btn ${left ? 'quiet' : ''}" data-act="check-done" data-seg="${seg}">${left ? `${left} to decide` : changes ? `Done · ${plural(changes, 'score')} changed` : 'Done'}</button></div>`}`;
    }
  }
  return { tabs: 'hole', html };
};

function updateCheck(seg, fn) {
  const rid = playRid();
  const g = myGroup(rid);
  const c = D.check(rid, g.id, seg);
  if (!c) return null;
  const data = Object.assign({}, c);
  delete data.photo;
  fn(data);
  putCheck(rid, g.id, seg, data);
  return data;
}
function applyCheck(seg) {
  const rid = playRid();
  const g = myGroup(rid);
  const chk = D.check(rid, g.id, seg);
  if (!chk || chk.status !== 'done') return;
  if (openIssues(chk)) { toast(`Pick card or app for ${plural(openIssues(chk), 'score')}`); return; }
  if (D.round(rid).status === 'final') { toast('This round is final. Reopen it to change scores.'); return; }
  const changedList = [];
  const byHole = {};
  chk.result.issues.forEach(i => {
    if (chk.decisions[`${i.hole}:${i.pid}`] !== 'card' || i.card === null) return;
    const was = (D.scores(rid)[i.pid] || {})[i.hole];
    (byHole[i.hole] = byHole[i.hole] || {})[i.pid] = { v: i.card, base: was === undefined ? null : was };
    changedList.push(`${D.nameOf(i.pid)} hole ${i.hole} ${fmtGross(was)} → ${fmtGross(i.card)}`);
  });
  Object.keys(byHole).forEach(n => send({ op: 'saveHole', round: rid, grp: g.id, hole: Number(n), scores: byHole[n], by: byMe(), names: Object.fromEntries(Object.keys(byHole[n]).map(pid => [pid, D.nameOf(pid)])), label: `Card check · Hole ${n}` }));
  updateCheck(seg, d => { d.resolved = true; d.changes = changedList.length; });
  logEntry('Card check', `${roundName(D.round(rid))} · group ${g.n} · ${nineName(seg)}: ${changedList.length ? 'changed from the card photo: ' + changedList.join(', ') : 'checked, no changes'}`);
  tick();
  render();
  toast(changedList.length ? `${plural(changedList.length, 'score')} changed. Results updated.` : `${segName(seg)} card checked`);
}

function buggyView(rid) {
  const r = D.round(rid);
  if (isScramble(r)) return { html: '' };   // no Buggy Wars in a scramble
  const comp = computeR(rid);
  if (!comp) return { html: `${sec('', cardOf('<div class="row sub">Groups to be drawn</div>'))}` };
  const groups = comp.groups.filter(g => g.teams.length === 2);
  if (!groups.length) return { html: `${sec('', cardOf('<div class="row sub">No buggy matches today</div>'))}` };
  const mine = myGroup(rid);
  const inMatch = !!(mine && groups.find(g => g.id === mine.id));
  const gid = inMatch ? mine.id : (UI.matchGroup && groups.find(g => g.id === UI.matchGroup) ? UI.matchGroup : groups[0].id);
  const gc = comp.groups.find(g => g.id === gid);
  const canEdit = mine && mine.id === gid && r.status === 'live';
  const live = r.status === 'live';
  const badges = bwBadges;
  const pillOf = m => bwPill(gc, m);
  /* A nine's holes: each hole is one column, the winner's best points filled in their colour, then holes won. */
  const board = seg => bwBoard(gc, seg, live, canEdit);
  /* Front and back open to their holes. The nine being played starts open. */
  const segOf = n => (gc.matches.front.order.includes(n) ? 'front' : 'back');
  const openDefault = live && gc.nextHole ? segOf(gc.nextHole) : null;
  const row = seg => {
    const m = gc.matches[seg];
    /* A trophy beside a match once it is won. */
    const name = `${segName(seg)}${m.status.state === 'won' ? CUP : ''}`;
    if (seg === 'overall') return `<div class="bw-row"><span class="bw-l">${name}</span>${pillOf(m)}<span></span></div>`;
    const key = `bw-${rid}-${gid}-${seg}`;
    const open = UI.open[key] === undefined ? openDefault === seg : !!UI.open[key];
    return `<button class="bw-row" data-act="bwseg" data-key="${key}" data-open="${open ? 1 : 0}" aria-expanded="${open}"><span class="bw-l">${name}</span>${pillOf(m)}<span class="chev dn${open ? ' up' : ''}">${chev}</span></button>${open ? board(seg) : ''}`;
  };
  return {
    html: `      ${!inMatch && groups.length > 1 ? `<div class="seg pills grp">${groups.map(g => `<button class="${g.id === gid ? 'on' : ''}" data-act="mgroup" data-gid="${g.id}" aria-pressed="${g.id === gid}">Group ${g.n}</button>`).join('')}</div>` : ''}
      <div class="bw-vs">${badges(gc.teams[0], 0)}<span class="sub">v</span>${badges(gc.teams[1], 1)}</div>
      <div class="card bw-card">${['front', 'back', 'overall'].map(row).join('')}</div>`
  };
}

function statsView(s) {
  /* Each player once, even when they qualify twice (two blow-up holes, say). */
  const uniq = a => a.filter((x, i) => a.findIndex(y => y.id === x.id) === i);
  const names = a => { const u = uniq(a); return u.length > 3 ? `${u.length} players tied` : u.map(x => esc(x.name)).join(' & '); };
  const holesTxt = a => `${a.length > 1 ? 'Holes' : 'Hole'} ${a.map(h => h.n).join(', ')}`;
  const pts1 = v => (Math.round(v * 10) / 10).toLocaleString('en-IE');
  const badge = (key, title, who, note) => `<div class="sbd">${BADGE(STAT_BADGE[key])}<span class="sbt">${title}</span><b class="sbw">${who}</b>${note ? `<span class="sbn">${note}</span>` : ''}</div>`;
  const t = [];
  if (s.birdies.length) t.push(badge('birdie', 'Most birdies', names(s.birdies), plural(s.birdies[0].count, 'birdie')));
  if (s.streak) t.push(badge('streak', 'Hot streak', esc(s.streak.name), `${s.streak.len} in a row, holes ${s.streak.from} to ${s.streak.to}`));
  if (s.bestNine.length) { const b = s.bestNine[0]; t.push(badge('nine', 'Best nine', names(s.bestNine), `${b.pts} points on the ${b.seg}`)); }
  if (s.comeback.length) { const c = s.comeback[0]; t.push(badge('comeback', 'Comeback', names(s.comeback), `${c.front} out, ${c.back} back`)); }
  if (s.steady.length) { const c = s.steady[0]; t.push(badge('steady', 'Steady', names(s.steady), `${c.front} out, ${c.back} back`)); }
  if (s.fade.length) { const c = s.fade[0]; t.push(badge('fade', 'Ran out of steam', names(s.fade), `${c.front} out, ${c.back} back`)); }
  if (s.blowup.length) { const w = s.blowup[0]; t.push(badge('big', 'Blow\u2011up hole', names(s.blowup), `${w.gross} on the ${ordinal(w.n)}, a par ${w.gross - w.over}`)); }
  if (s.scratches.length) t.push(badge('scratch', 'Most pick\u2011ups', names(s.scratches), `${plural(s.scratches[0].count, 'hole')} picked up`));
  if (s.hardest.length) t.push(badge('tough', 'Toughest hole', holesTxt(s.hardest), `${pts1(s.hardest[0].avgPts)} points a player`));
  if (s.easiest.length) t.push(badge('easy', 'Friendliest', holesTxt(s.easiest), `${pts1(s.easiest[0].avgPts)} points a player`));
  return sec(label('The round in numbers'), `<div class="card sbadges">${t.join('')}</div>`, true);
}

/* The trip's golfers ranked on total points across its rounds (also used for the trip line on Home). */
function tripRows(list) {
  const ids = new Set();
  list.forEach(r => (r.groups || []).forEach(g => g.teams.flat().forEach(pid => ids.add(pid))));
  const pts = list.map(r => (r.status === 'upcoming' ? {} : pointsOf(r.id)));
  return E.rankRows([...ids].map(pid => {
    const per = pts.map(p => (p[pid] === undefined ? null : p[pid]));
    return { id: pid, name: D.nameOf(pid), per, total: per.reduce((s, v) => s + (v || 0), 0) };
  }), 'total', 'desc');
}
function tripTable(list) {
  const rows = tripRows(list);
  const allFinal = list.every(r => r.status === 'final');
  /* One row per golfer, like the round leaderboard: place, initials and name, total on the right. Each day's points sit
     on a small line under the name ("D1 26 · D2 41 · D3 39"), so names never get squeezed by a column per day
     (owner, 22 October). A trip is at most three rounds. */
  const dayLine = row => row.per.map((v, i) => `D${list[i].trip_day || list[i].seq} ${v === null ? '–' : v}`).join(' \u00b7 ');
  return sec(`${label(`All ${list.length} rounds count`)}${allFinal ? '<span class="pill g">Final</span>' : '<span class="pill w">In progress</span>'}`,
    cardOf(rows.map(row => `<button class="lrow trip2" data-act="player" data-pid="${row.id}"><span class="sub">${row.posLabel}</span>${avName(row, dayLine(row), row.pos === 1)}<span class="r"><span class="b">${row.total}</span></span></button>`).join('')), true);
}

function loadScript(src) {

async function shareCard(rid) {
  try {

    const name = `${D.society()}-${roundName(D.round(rid))}-results.png`.replace(/\s+/g, '-').toLowerCase();

/* ---- 32-scramble.js ---- */
/* ----- Scramble (Westport day two, owner brief §6) -----
   One team score per hole, saved in the row of the player whose drive was used (see scrambleOf in 10-data.js).
   Each save sends every team member: the driver gets the team's strokes, everyone else is cleared, each with the value
   this phone last saw. The server checks each row on its own, so if two phones disagree both rows can survive: the hole
   then shows "two drives saved" and counts for nothing until someone picks one. Nothing is ever chosen silently. */

const scrDriveWord = k => (k === 1 ? '1 drive' : `${k} drives`);
const scrNames = g => g.team.map(D.nameOf).join(', ');

// What the team score and driver are on this hole now, from the stored rows.
function scrStored(rid, gc, n) {
  const sc = D.scores(rid);
  const filled = gc.team.filter(pid => E.isEntered((sc[pid] || {})[n]));
  return { filled, values: Object.fromEntries(gc.team.map(pid => { const v = (sc[pid] || {})[n]; return [pid, v === undefined ? null : v]; })) };
}
function scrDraft(ctx, gc) {
  const byGroup = draftsFor(ctx);
  if (!byGroup[ctx.n]) {
    const st = scrStored(ctx.rid, gc, ctx.n);
    const d = { _base: st.values };
    if (st.filled.length === 1) { d.driver = st.filled[0]; d.score = st.values[st.filled[0]]; }
    byGroup[ctx.n] = d;
  }
  return byGroup[ctx.n];
}

/* A player's drives as dots that fill in (owner, 25 October: visible for every team, few words). Red empty dots when
   the team is running out of holes for them. */
function scrDots(k, min, warn) {
  return `<span class="scr-dots${warn ? ' warn' : ''}" aria-hidden="true">${Array.from({ length: min }, (_, i) => `<i class="${i < k ? 'on' : ''}"></i>`).join('')}</span>`;
}
function scrDriveChips(t) {
  const tight = t.atRisk || t.impossible || t.failed;
  return `<span class="scr-chips">${t.team.map(pid => {
    const k = t.drives[pid] || 0;
    return `<span class="scr-pd" aria-label="${esc(D.nameOf(pid))}: ${plural(k, 'drive')}"><b>${esc(D.nameOf(pid))}</b>${scrDots(k, t.minDrives, tight && k < t.minDrives)}</span>`;
  }).join('')}</span>`;
}
const scrOwed = t => t.team.reduce((s, pid) => s + Math.max(0, t.minDrives - (t.drives[pid] || 0)), 0);

/* The team results, best first. The KBs are marked; there is no winners' presentation (owner: avoiding last place is
   the drama). Drives under the minimum and holes with two drives saved are shown plainly. */
function scrambleTable(r, res) {
  const teams = res.teams || [];
  if (!teams.length) return sec(label('Teams'), cardOf('<div class="row"><span class="sub">Teams are not drawn yet</span></div>'));
  const rows = teams.map(t => {
    const thru = t.complete ? 'finished' : t.played ? `thru ${t.played}` : '';

VIEWS.scramble = () => {

  html += `<header class="hero c pine entcard"><div class="entrow"><div class="entl"><small>HOLE</small>${ctx.mode === 'org' ? `<b class="entn">${n}</b>` : `<button class="holebtn" data-act="holes" aria-label="Go to a hole. Now on hole ${n}"><b class="entn">${n}</b><span class="hdown">${ICON.down}</span></button>`}</div><div class="entr"><b>Par ${h.par}</b><span>Index ${h.si}${h.yards ? ` · ${h.yards} yds` : ''}</span></div></div><div class="prog" role="img" aria-label="Hole ${n} of 18">${Array.from({ length: 18 }, (_, i) => i + 1).map(k => `<i class="${k === n ? 'cur' : gc.holes[k].complete ? 'done' : ''}"></i>`).join('')}</div></header>`;
  if (final) html += `<div class="banner" style="margin-top:12px">This round is final.</div>${ctx.mode === 'org' ? '<button class="btn quiet" data-act="reopen">Reopen round</button>' : ''}`;
  if (st.filled.length > 1) html += `<div class="banner warn" style="margin-top:12px"><b>Two drives saved:</b> ${st.filled.map(pid => `${esc(D.nameOf(pid))} ${fmtGross(st.values[pid])}`).join(' · ')}. Pick one and save.</div>`;
  const clash = DB.conflicts.filter(c => c.round === rid && c.grp === gc.id && c.hole === n);
  if (clash.length && st.filled.length <= 1) html += `<div class="banner" style="margin-top:12px">Another phone saved ${clash.map(c => `${esc(D.nameOf(c.player))} ${fmtGross(c.server)}`).join(', ')}</div>`;

  /* In the order it happens (owner, 25 October): whose drive is picked walking off the tee, the score added on holing out.
     The drive choice is kept on this phone (it survives closing the app) until the score is saved with it. */
  const left = gc.left, tight = gc.atRisk || gc.impossible;
  html += sec(label('Drive'), `<div class="scr-drives" role="radiogroup" aria-label="Whose drive was used">${gc.team.map(pid => {
    const on = d.driver === pid, k = gc.drives[pid] || 0;
    return `<button class="scr-drv${on ? ' on' : ''}" role="radio" aria-checked="${on}" data-act="scr-driver" data-pid="${pid}" aria-label="${esc(D.nameOf(pid))}, ${plural(k, 'drive')}"><span class="scr-dn">${esc(D.nameOf(pid))}</span>${scrDots(k, gc.minDrives, tight && k < gc.minDrives)}</button>`;
  }).join('')}</div>`);

  if (tight) {

    const and = a => a.length > 1 ? a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1] : a[0];
    const who = Object.keys(by).sort((a, b) => b - a).map(k => `${esc(and(by[k]))} ${by[k].length > 1 ? 'need' : 'needs'} ${plural(Number(k), 'more drive')}${by[k].length > 1 ? ' each' : ''}`).join('; ');
    html += gc.impossible
      ? `<p class="scr-warn bad">Not enough holes left for ${gc.minDrives} drives each: the team will be KBs.</p>`

  const ready = E.isEntered(d.score) && d.driver;

  html += `<div class="savebar"><button class="btn ${ready ? '' : 'quiet'}" data-act="scr-save">${lbl}</button>${saveWarning()}</div></div>`;

  return ctx.mode === 'player' ? { html, tabs: 'hole' } : { html };
};

function scrCtx() {
  const ctx = entryCtx(), s = scrambleOf(ctx.rid), gc = s && s.groups.find(g => g.id === ctx.gid);
  return gc ? { ctx, gc, d: scrDraft(ctx, gc), h: holeOf(ctx.rid, ctx.n) } : null;
}
function scrEdit(fn) {
  const x = scrCtx();
  if (!x) return;
  if (D.round(x.ctx.rid).status === 'final') { toast('This round is final. Reopen it to change scores.'); return; }
  fn(x);
  savePrefs();
  render();
}
const scrScore = dir => scrEdit(({ d, h }) => {
  if (!E.isEntered(d.score) || d.score === 'P') { d.score = h.par; return; }
  d.score = Math.max(1, Math.min(15, d.score + (dir === 'up' ? 1 : -1)));
});
const scrPickup = () => scrEdit(({ d }) => { d.score = d.score === 'P' ? undefined : 'P'; });
const scrClear = () => scrEdit(({ d }) => { delete d.score; });
const scrDriver = pid => scrEdit(({ d }) => { d.driver = d.driver === pid ? undefined : pid; });

function scrSave() {
  const x = scrCtx();
  if (!x) return;
  const { ctx, gc, d } = x;
  const r = D.round(ctx.rid);
  if (!E.isEntered(d.score) || !d.driver) { toast(E.isEntered(d.score) ? 'Pick whose drive was used' : 'Set the team score first'); return; }
  if (r.status === 'final') { toast('This round is final. Reopen it to change scores.'); return; }
  const st = scrStored(ctx.rid, gc, ctx.n);
  const scores = {};
  gc.team.forEach(pid => {
    const clash = DB.conflicts.find(c => c.round === ctx.rid && c.grp === gc.id && c.hole === ctx.n && c.player === pid);
    const seen = d._base && pid in d._base ? d._base[pid] : st.values[pid];
    scores[pid] = { v: pid === d.driver ? d.score : null, base: clash ? clash.server : seen };
  });
  const req = { op: 'saveHole', round: ctx.rid, grp: gc.id, hole: ctx.n, scores, by: ctx.mode === 'org' ? 'Organiser' : byMe(),
    names: Object.fromEntries(gc.team.map(pid => [pid, D.nameOf(pid)])), label: `${roundName(r)} · ${gc.name} · Hole ${ctx.n} (drive: ${D.nameOf(d.driver)})` };
  if (ctx.mode === 'org') req.pin = ORGPIN.pin;
  DB.conflicts = DB.conflicts.filter(c => !(c.round === ctx.rid && c.grp === gc.id && c.hole === ctx.n));
  clearDraft(ctx);
  savePrefs();
  send(req);
  tick();
  if (ctx.mode === 'org') { back(); toast(`Hole ${ctx.n} saved`); return; }
  UI.edit = false; UI.after = null; UI.teeHole = null;
  replaceTop('tee', { rid: ctx.rid });
  toast(`Hole ${ctx.n} saved · ${D.nameOf(d.driver)}'s drive`);
}

/* ----- Rules checker: ask about the Rules of Golf, checked live against the official rules ----- */
const SPEECH = window.SpeechRecognition || window.webkitSpeechRecognition;
const SIT_SVG = d => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ASK_IDEAS = [
  { q: 'My ball hit another ball on the green. What now?', t: 'Ball hit a ball', s: 'On the green', i: SIT_SVG('<circle cx="8" cy="13" r="4.5"/><circle cx="17.5" cy="11" r="3.5"/><path d="M3 20h18"/>') },
  { q: 'Ball moved after I addressed it', t: 'Ball moved', s: 'After you set up', i: SIT_SVG('<circle cx="8.5" cy="14" r="4.5"/><path d="M15 8h6m0 0-2.5-2.5M21 8l-2.5 2.5"/>') },
  { q: 'Ball in a bunker footprint or plugged lie', t: 'Bunker trouble', s: 'Footprint or plugged', i: SIT_SVG('<path d="M2 19h20"/><path d="M4 19c1.5-6 5-9.5 9-9.5 3.2 0 5.3 2.4 7 9.5"/>') },

// Plain text from the answer: paragraphs, "- " bullets and **bold**, nothing else.
function askText(t) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  return String(t).trim().split(/\n{2,}/).map(par => `<div class="ap">${par.split('\n').map(l => /^\s*[-•*]\s+/.test(l) ? `<div class="ab">${inline(l.replace(/^\s*[-•*]\s+/, ''))}</div>` : `<div>${inline(l)}</div>`).join('')}</div>`).join('');
}

/* ----- Rule chips: every rule a ruling cites can be tapped to see the rule itself ----- */
// The 25 Rules of Golf by name (titles only; the wording itself is read on the R&A site or quoted from it).
const RULE_TITLES = ['', 'The Game, Player Conduct and the Rules', 'The Course', 'The Competition', "The Player's Equipment",
  'Playing the Round', 'Playing a Hole', 'Ball Search: Finding and Identifying Ball', 'Course Played as It Is Found',
  'Ball Played as It Lies; Ball at Rest Lifted or Moved', 'Preparing for and Making a Stroke; Advice and Help; Caddies',
  'Ball in Motion Accidentally Hits Person, Animal or Object; Deliberate Actions to Affect Ball in Motion', 'Bunkers',
  'Putting Greens', 'Procedures for Ball: Marking, Lifting and Cleaning; Replacing on Spot; Dropping in Relief Area; Playing from Wrong Place',
  'Relief from Loose Impediments and Movable Obstructions', 'Relief from Abnormal Course Conditions, Dangerous Animal Condition, Embedded Ball',
  'Penalty Areas', 'Stroke-and-Distance Relief, Ball Lost or Out of Bounds, Provisional Ball', 'Unplayable Ball',
  'Resolving Rules Issues During Round; Rulings by Referee and Committee', 'Other Forms of Individual Stroke Play and Match Play',
  'Foursomes', 'Four-Ball', 'Team Competitions', 'Modifications for Players with Disabilities'];
// Shorter names for the chips; the pop-up shows the full name.
const RULE_SHORT = { 9: 'Ball Played as It Lies', 10: 'Making a Stroke; Advice; Caddies', 11: 'Ball in Motion Hits Person or Object',
  14: 'Procedures for Ball', 15: 'Loose Impediments, Movable Obstructions', 16: 'Abnormal Course Conditions, Embedded Ball',
  18: 'Stroke and Distance, Lost, Out of Bounds', 20: 'Resolving Rules Issues', 21: 'Other Forms of Play' };
const ruleShort = r => RULE_SHORT[ruleMain(r)] || RULE_TITLES[ruleMain(r)];
const RULE_RE = /Rules?\s+(\d{1,2}(?:\.\d+)?[a-z]?(?:\(\d+\))?)/g;
// "Rule 19", "Rule 14.7a" and so on, in the order they first appear, real rule numbers only.
function ruleRefs(texts) {
  const out = [];
  texts.filter(Boolean).forEach(t => { for (const m of String(t).matchAll(RULE_RE)) { const n = parseInt(m[1], 10); if (n >= 1 && n <= 25 && !out.includes(m[1])) out.push(m[1]); } });
  return out;
}
const ruleMain = r => parseInt(r, 10);
const ruleUrl = r => `https://www.randa.org/en/rog/the-rules-of-golf/rule-${ruleMain(r)}`;
function ruleChips(refs, i) {
  if (!refs.length) return '';
  return `<div class="rrefs">${refs.map(r => `<button class="rref" data-act="rule-open" data-rule="${esc(r)}" data-i="${i}" aria-label="Show Rule ${esc(r)}, ${esc(RULE_TITLES[ruleMain(r)])}"><span class="rref-n">Rule ${esc(r)}</span><span class="rref-t">${esc(ruleShort(r))}</span></button>`).join('')}</div>`;
}
// The pop-up for one rule: its name, the official wording when this answer copied it from the R&A site, and the official page.
function ruleSheetHtml(r, i) {
  const m = UI.chat[i], c = m && m.card;

  return `<div class="scrim rule-scrim" data-act="rule-close"><div class="sheet rulesheet" role="dialog" aria-label="Rule ${esc(r)}">
    <div class="nav"><span class="b">Rule ${esc(r)}</span><button class="link" data-act="rule-close">Done</button></div>
    <h2 class="rs-title">${esc(RULE_TITLES[main])}</h2>
    ${quote ? `<div class="rs-lab">Official wording${c.rule && c.rule !== 'Rule ' + r ? ` · ${esc(c.rule)}` : ''}</div><blockquote class="rs-quote">${esc(quote)}</blockquote>`

    <a class="btn rs-go" href="${ruleUrl(r)}" target="_blank" rel="noopener">Read Rule ${main} on the R&amp;A site</a>
    <p class="cap rs-cap">The official Rules of Golf, from The R&amp;A. It is the official rule that counts.</p></div></div>`;

function ruleOpen(r, i) {

// A ruling: the first sentence is the verdict, shown big enough to read out; the rule numbers become chips.
function askRuling(t, i) {
  const text = String(t).trim();

}

/* ----- Speaking a question: words fill the box as you speak, a waveform shows your voice, Stop / X / Send ----- */
const EQ_BARS = 48;
const eqHtml = () => Array.from({ length: EQ_BARS }, () => '<i></i>').join('');
let listening = null, meter = null;

// The waveform fills from the left, one bar every moment, and scrolls once full. Quiet shows as a dot.
function stopMeter() {
  if (!meter) return;
  clearInterval(meter.timer);
  try { meter.stream && meter.stream.getTracks().forEach(t => t.stop()); } catch (e) { /* already stopped */ }
  try { meter.ctx && meter.ctx.close(); } catch (e) { /* already closed */ }
  meter = null;
  document.querySelectorAll('.eq i').forEach(i => { i.style.height = ''; });
}
function drawMeter() {
  const bars = document.querySelectorAll('.eq i');
  bars.forEach((el, i) => { const v = meter.levels[i]; el.style.height = v == null ? '' : Math.max(3, Math.round(v * 30)) + 'px'; });
}
function startMeter() {
  stopMeter();
  meter = { levels: [], smooth: 0, timer: 0, an: null, buf: null, stream: null, ctx: null, lastWords: 0 };
  const m = meter;
  m.timer = setInterval(() => {
    let v;
    if (m.an) { m.an.getByteTimeDomainData(m.buf); let sum = 0; for (let k = 0; k < m.buf.length; k++) { const d = (m.buf[k] - 128) / 128; sum += d * d; } v = Math.min(1, Math.sqrt(sum / m.buf.length) * 5); }
    else v = Date.now() - UI.askWordsAt < 700 ? 0.25 + Math.random() * 0.6 : 0.03;   // no microphone access for the meter: move while words arrive
    m.smooth += (v - m.smooth) * (v > m.smooth ? 0.7 : 0.35);   // quick to rise, easy to fall
    m.levels.push(m.smooth); if (m.levels.length > EQ_BARS) m.levels.shift();
    drawMeter();
  }, 55);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    if (meter !== m) { stream.getTracks().forEach(t => t.stop()); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();
    const an = ctx.createAnalyser(); an.fftSize = 512;
    ctx.createMediaStreamSource(stream).connect(an);
    m.stream = stream; m.ctx = ctx; m.an = an; m.buf = new Uint8Array(an.fftSize);
  }).catch(() => { /* keep the fallback */ });
}

function showLive(on) {
  document.body.classList.toggle('hearing', on);
  sizeAsk();
}
// The box grows with the words; the thread keeps clear of it.
function sizeAsk() {
  const bar = document.querySelector('.askbar');
  const box = document.getElementById('askin');
  if (bar && box) bar.classList.toggle('empty', !box.value.trim());
  document.documentElement.style.setProperty('--askh', (bar ? bar.offsetHeight : 76) + 'px');
}

function askListen() {
  // A tap on the microphone while the app thinks it is already listening means a previous go got stuck: reset it.
  if (listening) { const old = listening; listening = null; old.cancel = null; try { old.abort(); } catch (e) { /* already stopped */ } stopMeter(); showLive(false); }
  if (!SPEECH) return askKeyboard('Tap the microphone on your keyboard to speak.');
  const box = document.getElementById('askin');
  const base = (box ? box.value : UI.askDraft).trim();
  let r;
  try { r = new SPEECH(); } catch (e) { return askKeyboard("Dictation isn't available here. Tap the microphone on your keyboard instead."); }
  r.lang = 'en-IE'; r.interimResults = true; r.maxAlternatives = 1; r.continuous = true;
  UI.askWordsAt = 0;
  let cancelled = false, began = false, dog = 0;
  const giveUp = msg => { clearTimeout(dog); cancelled = true; if (listening === r) listening = null; try { r.abort(); } catch (e) { /* not running */ } stopMeter(); showLive(false); askKeyboard(msg); };
  listening = r;
  r.cancel = () => { cancelled = true; try { r.abort(); } catch (e) { /* not running */ } };
  showLive(true);   // answer the tap straight away, even while the phone is still getting the microphone ready
  dog = setTimeout(() => { if (!began) giveUp("The microphone didn't start. Tap it again, or use the microphone on your keyboard."); }, 3500);
  r.onstart = () => { began = true; clearTimeout(dog); startMeter(); };
  r.onresult = ev => {
    began = true; clearTimeout(dog);
    UI.askWordsAt = Date.now();
    const said = Array.from(ev.results).map(x => x[0].transcript).join(' ').replace(/\s+/g, ' ').trim();
    UI.askDraft = (base ? base + ' ' : '') + said;
    const input = document.getElementById('askin');
    if (input) { input.value = UI.askDraft; growAsk(input); }
  };
  r.onerror = ev => {
    clearTimeout(dog);
    if (ev.error === 'aborted') return;
    if (ev.error === 'no-speech') { toast("Didn't catch anything. Tap the microphone and try again."); return; }
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') { askKeyboard('Microphone or speech access is off for this app. Turn it on in Settings, or use the microphone on your keyboard.'); return; }
    askKeyboard("Dictation isn't working here (" + ev.error + "). Tap the microphone on your keyboard instead.");
  };
  r.onend = () => {
    clearTimeout(dog);
    if (listening === r) listening = null;
    stopMeter();
    showLive(false);
    if (cancelled) {
      UI.askDraft = base;
      const input = document.getElementById('askin');
      if (input) { input.value = base; growAsk(input); }
    }
  };
  try { r.start(); } catch (e) { giveUp('Tap the microphone on your keyboard to speak.'); }
}
function askStop() { if (listening) { try { listening.stop(); } catch (e) { /* already stopped */ } } }
function askCancel() { if (listening && listening.cancel) listening.cancel(); }
// The box grows with a hidden twin of itself (a real textarea, so the words wrap exactly the same way), so its height can be animated (a textarea cannot animate from "auto").
let askMirror = null;
function growAsk(el) {
  const card = el.closest('.card');
  if (!card) return;
  if (!askMirror || askMirror.parentNode !== card) { askMirror = document.createElement('textarea'); askMirror.className = 'mirror'; askMirror.setAttribute('aria-hidden', 'true'); askMirror.tabIndex = -1; askMirror.readOnly = true; askMirror.rows = 1; card.appendChild(askMirror); }
  askMirror.value = el.value;
  const full = askMirror.scrollHeight, MAX = 168, need = Math.min(full, MAX);
  if (el.dataset.h !== String(need)) { el.style.height = need + 'px'; el.dataset.h = String(need); }
  el.classList.toggle('over', full > MAX);
  if (full > MAX) el.scrollTop = full - MAX;   // glide to the newest words (the box has smooth scrolling)
  sizeAsk();
  // keep the page clear of the box while it is growing
  const t0 = performance.now();
  (function follow() { sizeAsk(); if (performance.now() - t0 < 260) requestAnimationFrame(follow); })();
}
function askKeyboard(msg) { const i = document.getElementById('askin'); if (i) i.focus(); if (msg) toast(msg); }

        <div class="arow">
          <button class="x" type="button" data-act="ask-cancel" aria-label="Cancel">${ICON.x}</button>
          <div class="eq" aria-hidden="true">${eqHtml()}</div>

          <button class="mic" type="button" data-act="ask-mic" aria-label="Speak your question">${ICON.mic}</button>

function refreshThread(mode) {
  const el = document.getElementById('thread');
  if (!el) return;
  el.innerHTML = askThread();
  const hd = document.querySelector('.rulehd'); if (hd) hd.classList.toggle('empty', !UI.chat.length && !UI.chatBusy);
  const bar = document.querySelector('.hero .hrow2');
  if (bar && !bar.querySelector('[data-act="ask-clear"]') && UI.chat.length) bar.insertAdjacentHTML('beforeend', '<button class="link" data-act="ask-clear">New question</button>');
  if (bar && !UI.chat.length) { const b = bar.querySelector('[data-act="ask-clear"]'); if (b) b.remove(); }
  const s = scroller();
  if (mode === 'keep') return;
  if (mode === 'answer') {
    // Start at the top of the answer so it reads from the first line
    const msgs = el.querySelectorAll('.msg.ai'), last = msgs[msgs.length - 1];
    if (last) { s.scrollTop += last.getBoundingClientRect().top - s.getBoundingClientRect().top - 12; return; }
  }
  s.scrollTop = s.scrollHeight;
}
function askInfo(i) { UI.chatInfo = UI.chatInfo || {}; UI.chatInfo[i] = !UI.chatInfo[i]; refreshThread('keep'); }

function askQuestion(q) {
  q = String(q || '').trim();
  if (!q || UI.chatBusy) return;
  if (listening) { const l = listening; l.cancel = null; try { l.abort(); } catch (e) { /* not running */ } }
  UI.chat.push({ role: 'user', text: q });
  UI.askDraft = '';
  const input = document.getElementById('askin');
  if (input) { input.value = ''; input.style.height = ''; sizeAsk(); }
  if (!navigator.onLine) {
    UI.chat.push({ role: 'ai', text: 'No signal right now. Try again when you have some.', error: true });
    refreshThread("answer");
    return;
  }
  UI.chatBusy = true;
  refreshThread();
  const history = UI.chat.slice(0, -1).filter(m => !m.error).map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', text: m.text }));
  call({ op: 'ask', question: q, history }, 70000).then(res => {
    UI.chatBusy = false;
    if (res && res.answer) UI.chat.push({ role: 'ai', text: res.answer, card: res.card || null, sources: res.sources || [] });
    else UI.chat.push({ role: 'ai', text: (res && res.error === 'bad' && /Unknown request/.test(res.message || '')) ? 'The rules checker is not switched on yet. The organiser needs to finish setting it up.' : ((res && res.message) || 'The rules checker could not answer just now.'), error: true });
    refreshThread("answer");
  }).catch(e => {
    UI.chatBusy = false;
    const slow = e && e.name === 'AbortError';
    UI.chat.push({ role: 'ai', text: !navigator.onLine ? 'No signal right now. Try again when you have some.' : slow ? 'The rules checker took too long to answer. Tap New question and try again.' : 'The rules checker did not answer just now' + (e && e.message ? ' (' + e.message + ')' : '') + '. Try again in a moment.', error: true });
    refreshThread("answer");
  });
}

function roundSummary(r) {
  const bits = [r.date ? fmtDate(r.date, true) : '', r.first_tee || ''].filter(Boolean).join(' · ');
  const st = isDemo(r) ? '<span class="pill w">Demo</span>' : r.status === 'live' ? '<span class="pill w">Live</span>' : r.status === 'final' ? '' : '<span class="pill n">Not started</span>';
  return `<button class="row tall" data-act="org-go" data-v="round" data-rid="${r.id}"><span class="two"><span>${esc(roundName(r))}</span><span class="sub">${esc(bits || roundWhenShort(r) || ' ')}</span></span><span class="right">${st}${chev}</span></button>`;
}


/* What still needs doing before the next round: each line opens the screen where it is done. */
function nextChecklist(r) {
  if (!r || r.status === 'final' || r.source === 'imported') return '';
  const tee = teeOf(r), c = courseOf(r);
  const items = [
    { ok: !!r.date, t: r.date ? 'Date' : 'Date: members see the round once it has one', go: ['details', r.id], need: true },
    { ok: !!(c && c.holes && tee), t: 'Course and tees', go: ['details', r.id], need: true },
    // A scramble's teams come from the breakfast draw, and it has no KB pairs to set up (UX review F01).
    isScramble(r)
      ? { ok: !!(r.groups && r.groups.length), t: !hasPots(r.id) ? 'Breakfast draw: set the pots' : r.groups && r.groups.length ? 'Teams drawn' : 'Breakfast draw', go: ['drawhome', r.id], need: true }
      : { ok: !!(r.groups && r.groups.length), t: 'Players and groups', go: ['groups', r.id], need: true },
    { ok: !!r.first_tee, t: 'First tee time', go: ['details', r.id], need: true },
    { ok: !!(r.contests && r.contests.length), t: 'Contests', go: ['details', r.id], need: false }
  ].concat(isScramble(r) ? [] : [{ ok: !!(E.kbOff(r) || (r.kb && r.kb.length)), t: 'KBs', go: ['kb', r.id], need: false }]);
  const left = items.filter(i => i.need && !i.ok).length;
  const head = `<span class="two"><span>${esc(roundName(r))}</span><span class="sub">${left ? `${plural(left, 'thing')} to do` : 'Ready to go'}</span></span>`;
  return sec(label('Next up'), cardOf(`<div class="row tall">${head}<span class="pill ${left ? 'w' : 'g'}">${left ? 'To do' : 'Ready'}</span></div>` +
    items.map(i => `<button class="row" data-act="org-go" data-v="${i.go[0]}" data-rid="${i.go[1]}"><span style="display:flex;align-items:center;gap:10px"><span class="chk${i.ok ? ' on' : ''}" aria-hidden="true">${i.ok ? sized(ICON.check, 16) : ''}</span>${i.t}${i.need ? '' : ' <span class="sub">optional</span>'}</span>${chev}</button>`).join('')), true);
}

function finaliseBlockers(r) {
  const comp = progressOf(r.id);
  if (!comp) return ['no scores'];
  const open = comp.groups.filter(g => !g.complete).length;
  const claims = D.claims(r.id);
  const wins = D.winners(r.id);
  const toConfirm = (r.contests || []).filter(c => (claims[c.hole] || []).length && !wins[c.hole]).length;
  const reasons = [];
  if (open) reasons.push(`${plural(open, isScramble(r) ? 'team' : 'group')} still playing`);
  if (toConfirm) reasons.push(`${plural(toConfirm, 'contest')} to confirm`);
  return reasons;
}

ORG.round = p => {
  const r = D.round(p.rid);
  if (!r) return { html: `${navBack('Organiser')}<p class="sub">Round deleted</p>` };
  const c = courseOf(r);
  const tee = teeOf(r);
  let html = `<header class="hero s">${navBack('Organiser')}<div class="head"><h1 class="title">${esc(roundName(r))}</h1>${statusPill(r)}</div>${roundWhen(r) ? `<p class="sub">${esc(roundWhen(r))}</p>` : ''}</header>`;
  if (r.source === 'imported') {
    html += sec('', cardOf(`<div class="row tall"><span class="sub">${esc(r.note || 'Imported results')}</span></div>`), true);
    return { html };
  }
  const nPlayers = (r.groups || []).reduce((s, g) => s + g.teams.flat().length, 0);
  const details = [c ? c.name : 'No course', tee ? tee.name : '', r.date ? fmtDate(r.date, true) : '', r.first_tee || ''].filter(Boolean).join(' · ');
  const locked = r.status !== 'upcoming';
  // The breakfast draw sits just above Groups: it is how a scramble's groups get made.

  const drawRow = r.status === 'upcoming' && (isScramble(r) || hasPots(r.id)) ? `<button class="row tall" data-act="org-go" data-v="drawhome" data-rid="${r.id}"><span class="two"><span>Breakfast draw</span><span class="sub">${!hasPots(r.id) ? 'Set the pots, then draw the teams' : drawMade(r) ? 'Done' : drawOf(r.id).st.started ? 'Under way' : 'Pots set'}</span></span>${chev}</button>` : '';
  html += sec('', cardOf(`
    <button class="row tall" data-act="org-go" data-v="details" data-rid="${r.id}"><span class="two"><span>Details</span><span class="sub">${esc(details)}</span></span>${chev}</button>
    ${drawRow}<button class="row tall" data-act="org-go" data-v="${r.status === 'final' ? 'groupsview' : 'groups'}" data-rid="${r.id}"><span class="two"><span>Groups</span><span class="sub">${r.groups && r.groups.length ? `${plural(nPlayers, 'player')} · ${plural(r.groups.length, isScramble(r) ? 'team' : 'group')}${locked && r.status !== 'final' ? isScramble(r) ? ' · teams fixed' : ' · withdraw only now' : ''}` : isScramble(r) || hasPots(r.id) ? 'Teams not drawn yet' : 'Not drawn'}</span></span>${chev}</button>
    <button class="row tall" data-act="org-format" data-rid="${r.id}"><span class="two"><span>Format</span><span class="sub">${isScramble(r) ? 'Scramble: one team score per group, drives recorded' : 'Individual Stableford'}</span></span><span class="pill ${isScramble(r) ? 'g' : 'n'}">${isScramble(r) ? 'Scramble' : 'Stableford'}</span></button>
    ${isScramble(r) ? `<button class="row tall" data-act="org-go" data-v="teamshots" data-rid="${r.id}"><span class="two"><span>Team shots</span><span class="sub">${(r.groups || []).map(g => `Team ${g.n}: ${teamShotsOf(r)[g.id] || 0}`).join(' · ') || 'Draw the teams first'}</span></span>${chev}</button>` : ''}
    ${r.trip ? `<button class="row tall" data-act="org-tripboard" data-rid="${r.id}"><span class="two"><span>Trip leaderboard</span><span class="sub">${tripBoardOn(r) ? `${esc(r.trip)} adds up the days` : `No combined board for ${esc(r.trip)}: each day has its own results`}</span></span><span class="pill ${tripBoardOn(r) ? 'g' : 'n'}">${tripBoardOn(r) ? 'On' : 'Off'}</span></button>` : ''}
    ${isScramble(r) ? '' : `<button class="row tall" data-act="org-go" data-v="kb" data-rid="${r.id}"><span class="two"><span>KBs</span><span class="sub">${E.kbOff(r) ? 'Off' : r.kb && r.kb.length ? plural(r.kb.length, 'pair') : 'None'}</span></span>${chev}</button>`}`), true);
  // Scores a phone sent after this round was final (or otherwise refused): they never reached the scores (review H1).

  if (refused.length) html += `<div class="banner warn"><b>${plural(refused.length, 'score')} sent by a phone ${refused.length === 1 ? 'was' : 'were'} not saved.</b>${refused.map(l => `<br>${esc(l.by)}: ${esc(l.detail)}`).join('')}<br>Correct the card here if they should count.</div>`;

      return `<button class="row" data-act="org-go" data-v="group" data-rid="${r.id}" data-gid="${gc.id}"><span>${isScramble(r) ? 'Team' : 'Group'} ${gc.n}</span><span class="right sub nowrap"><span class="bar"><i style="width:${Math.round(gc.holesDone / 18 * 100)}%"></i></span>${prog}${chev}</span></button>`;
    }).join('')));
    const contests = r.contests || [];
    if (contests.length) {
      const claims = D.claims(r.id);
      const wins = D.winners(r.id);
      html += sec(label('Contests'), cardOf(contests.map(ct => {
        const cl = claims[ct.hole] || [];
        const win = wins[ct.hole];
        const right = win ? `<span class="b">${esc(D.nameOf(win))}</span>` : cl.length ? '<span class="pill w">Confirm</span>' : '<span class="sub">–</span>';
        return `<button class="row" data-act="org-go" data-v="contest" data-rid="${r.id}" data-n="${ct.hole}"><span>${CONTEST[ct.type]} <span class="sub">${ct.hole}</span></span><span class="right">${right}${chev}</span></button>`;
      }).join('')));
    }
  }
  if (r.status === 'live') {
    const reasons = finaliseBlockers(r);
    html += reasons.length ? `<div class="fin-wait"><p class="b">Before you can finalise</p><ul>${reasons.map(x => `<li>${esc(x.charAt(0).toUpperCase() + x.slice(1))}</li>`).join('')}</ul></div><button class="btn quiet" data-act="finalise" data-rid="${r.id}" aria-disabled="true">Finalise</button>`
      : `<button class="btn" data-act="finalise" data-rid="${r.id}">Finalise</button>`;
  } else if (r.status === 'final') {
    html += `<button class="btn quiet" data-act="reopen" data-rid="${r.id}">Reopen round</button>`;
  } else if (canScore(r)) {
    html += `<p class="cap" style="text-align:center">Goes live with the first score</p>`;   // the server starts it (server.js saveHole)
  }
  if (r.status === 'upcoming' || isDemo(r) || D.testing()) {
    const sc = Object.values(D.scores(r.id)).reduce((n, byHole) => n + Object.keys(byHole).length, 0);
    const warn = sc ? ` and its ${plural(sc, 'score')}` : '';
    html += `<div style="text-align:center;margin-top:8px"><button class="link c-b" data-act="delete-round" data-rid="${r.id}">${UI.confirm === 'del-' + r.id ? `Tap again to delete the round${warn}` : 'Delete round'}</button></div>`;
  }
  return { html };
};

/* ----- Who is playing, and the draw ----- */
function draftFor(r) {
  if (!UI.draft || UI.draft.rid !== r.id) {
    UI.draft = { rid: r.id, ids: [] };
  }
  return UI.draft;
}
function priorTripGroups(r) {
  if (!r.trip) return [];
  return D.rounds().filter(x => x.trip === r.trip && x.season === r.season && x.id !== r.id && x.groups && (x.trip_day || 0) < (r.trip_day || 99)).map(x => ({ rid: x.id, groups: x.groups }));
}
ORG.playing = p => {
  // Nobody drawn yet: tick who's playing, then draw. The draw saves at once and this becomes the Groups screen.
  const r = D.round(p.rid);
  const d = draftFor(r);
  let html = `<header class="hero s">${navBack(roundName(r))}<div class="head"><h1 class="title">Groups</h1></div><p class="sub">Tick who's playing, then draw</p></header>`;
  html += sec(label(`Playing · ${d.ids.length}`), cardOf(D.active().map(m => {
    const on = d.ids.includes(m.id);
    return `<button class="row" data-act="org-toggle-player" data-pid="${m.id}" aria-pressed="${on}"><span>${esc(m.name)}${isGuest(m) ? ' <span class="pill n">Guest</span>' : ''}</span>${on ? `<span class="c-g">${sized(ICON.check, 20)}</span>` : ''}</button>`;
  }).join('') + `<button class="row" data-act="org-go" data-v="guest" data-rid="${r.id}"><span class="c-g" style="display:inline-flex;align-items:center;gap:8px">${sized(ICON.plus, 20)}Add a guest</span></button>`), true);
  if (d.ids.length >= 2) {
    html += `<button class="btn" data-act="org-draw" data-kind="random">Draw ${isScramble(r) ? 'teams' : 'groups'}</button>`;
    if (priorFinalDays(r).length) html += `<button class="btn quiet" style="margin-top:8px" data-act="org-draw" data-kind="standings">Leaders out last</button>`;
  }
  return { html };
};
function priorFinalDays(r) {
  return r.trip ? D.rounds().filter(x => x.trip === r.trip && x.season === r.season && x.id !== r.id && x.status === 'final' && (x.trip_day || 0) < (r.trip_day || 99)) : [];
}
/* Save a fresh draw as the round's groups, with tee times and KB pairs, in one write. */
function saveDraw(r, drawn, said) {
  const times = E.teeTimesFrom(r.first_tee || '', r.interval || 8, drawn.length);
  const allOff = E.kbOff(r);   // KBs switched off for the whole round stays off if the groups are redrawn
  const groups = drawn.map((g, i) => Object.assign({ id: 'g' + (i + 1), n: i + 1, teeTime: times[i] || '', startHole: 1, teams: g.teams }, allOff ? { noKb: true } : {}));
  let kb = null;
  const kg = E.kbGroups(Object.assign({}, r, { groups }));
  if (kg.length > 1 && !isScramble(r)) { const res = E.kbPairsFor(kg, (Date.now() % 100000) + 3, priorKbPairs(r.id)); kb = res.pairs.length ? res.pairs : null; }   // every drawn round gets KB pairs, no repeat partners
  put('rounds', [Object.assign({}, r, { groups, kb })], { action: said, detail: `${roundName(r)}: ${groups.map(g => `${g.teeTime} ${g.teams.map(t => t.map(D.nameOf).join(' & ')).join(' v ')}`).join('; ')}` });
}
ORG.groupsview = p => {
  const r = D.round(p.rid);
  return { html: `<header class="hero s">${navBack(roundName(r))}<div class="head"><h1 class="title">Groups</h1></div></header>${groupsBlock(r, false)}` };
};

/* Every KB pair from the other rounds (rounds scored in the app, and imported ones), so a new draw can avoid repeat partners */
function priorKbPairs(rid) {
  return D.rounds().filter(x => x.id !== rid).flatMap(x => (x.kb && x.kb.length ? x.kb : ((x.results && x.results.kb) || []).map(k => [k[0], k[1]])));
}
ORG.kb = p => {
  const r = D.round(p.rid);
  const d = UI.kbDraft && UI.kbDraft.rid === r.id ? UI.kbDraft : (UI.kbDraft = { rid: r.id, pairs: r.kb ? clone(r.kb) : [], sel: null });
  let html = `<header class="hero s">${navBack(roundName(r))}<div class="head"><h1 class="title">KBs</h1></div></header>`;
  if (!r.groups || !r.groups.length) return { html: html + sec('', cardOf('<div class="row sub">Draw the groups first</div>'), true) };
  if (E.kbOff(r)) return { html: html + sec('', cardOf('<div class="row"><span class="sub">KBs are off for this round. No pairs, no KBs on the results.</span></div>'), true) + `<button class="btn" data-act="org-kb-on">Turn KBs back on</button>` };
    const kg = E.kbGroups(r);
  if (r.groups.length > 1) html += sec('Groups in the KBs', cardOf(r.groups.map(g => `<button class="row tall" data-act="org-kb-group" data-gid="${g.id}"><span class="two"><span>Group ${g.n}</span><span class="sub">${esc(g.teams.flat().map(D.nameOf).join(', '))}</span></span><span class="b">${g.noKb ? 'Left out' : 'In'}</span></button>`).join('')), true);
  if (kg.length < 2) return { html: html + sec('', cardOf('<div class="row"><span class="sub">KBs need two groups or more. Put another group back in.</span></div>'), true) + `<div class="foot"><button class="link c-b" data-act="org-kb-clear">Turn KBs off for the round</button></div>` };
  if (!d.pairs.length && !r.kb) { const res = E.kbPairsFor(kg, (Date.now() % 100000) + 3, priorKbPairs(r.id)); d.pairs = res.pairs; }   // start from a fresh draw: just check it and save
  if (!d.pairs.length) return { html: html + `<button class="btn" data-act="org-kb-make">Make KB pairs</button>` };
  const seenKb = new Set(priorKbPairs(r.id).map(pr => [pr[0], pr[1]].sort().join('+')));
  const again = d.pairs.filter(pr => seenKb.has([pr[0], pr[1]].sort().join('+')));
  if (again.length) html += `<p class="cap note">${again.map(pr => esc(pr.map(D.nameOf).join(' & '))).join(', ')} ${again.length === 1 ? 'have' : 'have'} been KB partners before.</p>`;
  else html += '<p class="cap note">No repeat partners.</p>';
  html += sec('', cardOf(d.pairs.map(pr => `<div class="row">${pr.map(pid => `<button class="chip${d.sel === pid ? ' on' : ''}" data-act="org-kb-swap" data-pid="${pid}">${esc(D.nameOf(pid))}</button>`).join('<span class="sub">&</span>')}</div>`).join('')), true);
  html += `<button class="btn" data-act="org-kb-save">Save KBs</button><div class="foot"><button class="link" data-act="org-kb-make">Shuffle</button><button class="link c-b" data-act="org-kb-clear">Turn KBs off for the round</button></div>`;
  return { html };
};

  }).join('');
  return {
    html: `<header class="hero s">${navBack(roundName(D.round(p.rid)))}<div class="head"><h1 class="title">Group ${gc.n}</h1></div><p class="sub names">${esc(gc.labels.map(l => l.long).join(' v '))}</p></header>
    ${sec(label('Card check'), cardOf(checks), true)}

  };
};

/* ----- A change of player after the groups are saved ----- */
function scoresFor(rid, pid) { const sc = D.scores(rid)[pid]; return sc ? Object.keys(sc).length : 0; }
/* A scramble's team scores sit in the rows of whoever drove, so once any team has a score the teams are fixed for the
   whole round: swapping or removing anyone, even a teammate with no rows, could hide a team's hole and its drive
   (Codex review of #41). Before the first score, teams can change as usual. */
const rosterLocked = r => isScramble(r) && Object.values(D.scores(r.id)).some(h => Object.values(h || {}).some(v => v !== null && v !== undefined));
ORG.late = p => {
  const r = D.round(p.rid);
